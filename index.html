<style>
/* 시험지(문제) | OMR 답안지. 과목 색은 한 가지 남색 계열, 정답 초록, 오답 빨강 */
:root{
  --bg:#f2f4f6; --panel:#fff; --ink:#18222c; --muted:#5f6b77; --line:#d7dce1;
  --accent:#1d4f7a; --accent-ink:#fff; --accent-soft:#e1ebf4;
  --ok:#21794a; --ok-soft:#dff2e6; --bad:#b63a2f; --bad-soft:#f9e2df; --warn:#a96a10; --warn-soft:#fbf0db; --none:#eceff2;
  --f:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --fn:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11161b; --panel:#1a2129; --ink:#e3e9ef; --muted:#98a4af; --line:#2d3741;
  --accent:#6aa6dc; --accent-ink:#0b1520; --accent-soft:#1e3247;
  --ok:#53c387; --ok-soft:#163324; --bad:#ef7468; --bad-soft:#3b1f1c; --warn:#e2ad55; --warn-soft:#3a2d17; --none:#232c35; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.num{font-family:var(--fn);font-variant-numeric:tabular-nums}
.wrap{max-width:1000px;margin:0 auto;padding:calc(18px + var(--safe-t)) max(16px,env(safe-area-inset-right,0px)) calc(40px + var(--safe-b)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
h1{font-size:24px;margin:0} h2{font-size:17px;margin:0} h3{font-size:15px;margin:0}
.sub{color:var(--muted);margin:0} .hint{font-size:13px;color:var(--muted)}
.label{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;font-weight:600;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;min-height:34px;font-size:13px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--none);color:var(--muted);white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-bad{background:var(--bad-soft);color:var(--bad)} .c-warn{background:var(--warn-soft);color:var(--warn)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.dday{font-family:var(--fn);font-weight:700;color:var(--accent)}
.rounds .card{gap:10px}
.rounds .big{font-size:22px;font-weight:800}
.pill{border:1px solid var(--line);border-radius:99px;padding:6px 12px;background:var(--panel);font-size:14px;font-weight:600}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:center}
th{font-size:12px;color:var(--muted)} td.l,th.l{text-align:left}
.tw{overflow-x:auto}
/* 시험 */
#exam{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.bar{display:flex;align-items:center;gap:10px;padding:calc(8px + var(--safe-t)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar .ttl{font-weight:800;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer{font-family:var(--fn);font-weight:700;font-size:18px;border:1px solid var(--line);border-radius:8px;padding:2px 10px}
.timer.over{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.qwatch{font-family:var(--fn);font-size:13px;color:var(--muted)}
.qwatch.over{color:var(--bad)}
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px}
.paper{overflow:auto;-webkit-overflow-scrolling:touch;padding:16px max(16px,env(safe-area-inset-left,0px)) 24px}
.qbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:820px;margin:0 auto 14px}
.qhead{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.qno{font-weight:800;font-size:17px}
.passage{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;margin:0 0 12px;white-space:pre-wrap;font-size:14px;overflow-x:auto}
.passage .pl{font-weight:700;font-size:13px;color:var(--muted);white-space:normal;margin-bottom:4px}
.qtext{white-space:pre-wrap;margin-bottom:12px;overflow-wrap:anywhere}
.qtext u,.passage u{text-decoration-thickness:2px;text-underline-offset:3px}
.qtext table,.passage table{margin:6px 0;font-size:13px;white-space:normal}
.qtext td,.passage td{border:1px solid var(--line);padding:4px 6px}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;width:100%;font-weight:400;white-space:pre-wrap;overflow-wrap:anywhere}
.ch .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:13px;font-weight:700}
.ch.sel{border-color:var(--accent);background:var(--accent-soft)} .ch.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ch.right{border-color:var(--ok);background:var(--ok-soft)} .ch.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.wrong{border-color:var(--bad);background:var(--bad-soft)} .ch.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.expl{margin-top:12px;border-radius:10px;padding:12px;background:var(--bg);border:1px solid var(--line)}
.expl .v{font-weight:800;margin-bottom:4px}
.nav{display:flex;gap:8px;justify-content:space-between;max-width:820px;margin:0 auto}
.omr{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.omr-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.omr-b{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 8px}
.omr-s{font-size:12px;font-weight:800;color:var(--accent);margin:10px 4px 4px}
.orow{display:grid;grid-template-columns:30px repeat(4,1fr) 18px;gap:4px;align-items:center;padding:3px 4px;border-radius:6px}
.orow.cur{background:var(--accent-soft)}
.orow .n{font-family:var(--fn);font-size:12px;color:var(--muted);border:none;background:none;padding:0;text-align:left}
.ob{height:28px;border-radius:6px;border:1.5px solid var(--line);background:var(--panel);font-size:12px;font-weight:700;padding:0}
.ob.sel{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.ob.r{background:var(--ok);border-color:var(--ok);color:#fff} .ob.x{background:var(--bad);border-color:var(--bad);color:#fff}
.fl{border:none;background:none;color:var(--line);padding:0;font-size:14px} .fl.on{color:var(--warn)}
.omr-f{padding:10px 12px calc(10px + var(--safe-b));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#omrToggle{display:none}
@media (max-width:820px){
  .body{grid-template-columns:1fr}
  .omr{position:fixed;right:0;top:0;bottom:0;width:min(330px,88vw);z-index:20;box-shadow:-8px 0 24px rgba(0,0,0,.2);padding-top:var(--safe-t);transform:translateX(105%);transition:transform .2s}
  .omr.open{transform:none}
  #omrToggle{display:inline-block}
}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,24,.55);display:grid;place-items:center;padding:16px}
.modal .card{max-width:420px;width:100%}
/* 결과 */
.score{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.score>div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.score b{display:block;font-size:24px;font-family:var(--fn)}
.banner{border-radius:12px;padding:14px 16px;font-weight:800;font-size:18px}
.weak{border-left:4px solid var(--bad);padding:10px 12px;background:var(--panel);border-radius:0 10px 10px 0}
.weak p{margin:4px 0 0;font-size:14px}
.rv{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.rv summary{padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap;list-style:none}
.rv summary::-webkit-details-marker{display:none}
.rv .in{padding:0 12px 12px}
.bar-mini{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- 홈 -->
<div id="home" class="wrap">
  <header class="row" style="justify-content:space-between;align-items:flex-end">
    <div><h1>국제무역사 1급 기출 CBT</h1><p class="sub">63~66회 기출 480문항, 과목당 30문항 4지선다</p></div>
    <div class="hint" id="dday"></div>
  </header>

  <section class="card">
    <h2>회차별로 풀기</h2>
    <div class="row">
      <span class="label">방식</span>
      <button class="pill on" data-mode="exam">시험 모드</button>
      <button class="pill" data-mode="study">공부 모드</button>
      <span class="label" style="margin-left:10px">보기</span>
      <button class="pill on" data-view="one">한 문제씩</button>
      <button class="pill" data-view="all">전체 보기</button>
    </div>
    <p class="hint" id="modeHint" style="margin:0"></p>
    <div class="grid rounds" id="rounds"></div>
  </section>

  <section class="card">
    <h2>유형별 랜덤 풀기</h2>
    <div class="row" id="rSubj"></div>
    <div class="tags" id="rTags"></div>
    <div class="row">
      <span class="label">문항 수</span>
      <select id="rCount"><option>10</option><option selected>20</option><option>30</option><option value="999">전부</option></select>
      <label class="row" style="gap:6px"><input type="checkbox" id="rWrong"> 틀린 적 있는 문제만</label>
      <button class="btn primary" id="rStart">시작</button>
      <span class="hint" id="rInfo"></span>
    </div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between"><h2>누적 분석과 기록</h2><button class="btn sm" id="histAll">누적 분석 보기</button></div>
    <div id="histList"></div>
  </section>
</div>

<!-- 시험 -->
<div id="exam" hidden>
  <div class="bar">
    <button class="btn sm" id="exitBtn">나가기</button>
    <span class="ttl" id="eTitle"></span>
    <span class="qwatch" id="qwatch"></span>
    <span class="timer" id="timer">00:00</span>
    <button class="btn sm" id="viewBtn">전체 보기</button>
    <button class="btn sm" id="omrToggle">답안지</button>
  </div>
  <div class="body">
    <div class="paper" id="paper"></div>
    <aside class="omr" id="omr">
      <div class="omr-h"><h3>OMR 답안지</h3><span class="hint" id="omrCnt"></span></div>
      <div class="omr-b" id="omrB"></div>
      <div class="omr-f"><button class="btn primary" id="submitBtn">답안 제출</button></div>
    </aside>
  </div>
</div>

<!-- 결과 -->
<div id="result" class="wrap" hidden></div>

<script id="data" type="application/json">[{"id":"63-1-1","r":63,"s":"무역규범","n":1,"q":"대외무역법령상 규정하고 있는 ‘물품 등’의 정의에 관한 설명으로 잘못된 것은?","c":["물품 등에는 무역거래에서 사용되는 신용장, 우편환, 대통령령으로 정하는 환어음등이 포함된다.","물품 등에는 출판업과 영상·오디오 기록물 제작 및 배급업이 포함된다.","물품 등에는 국내의 법령 또는 대한민국이 당사자인 조약에 따라 보호되는 특허권·상표권·프로그램저작권 등이 포함된다.","물품 등에는 부호·문자·음성·음향·이미지·영상 등을 디지털 방식으로 제작하거나 처리한 자료 또는 정보 등이 포함된다."],"a":1,"t":"대외무역법: 정의, 수출입 실적","e":"신용장, 우편환, 환어음 같은 지급수단은 외국환거래법이 다루는 대상이라 대외무역법상 '물품'에서 빠집니다. 특허권 같은 권리, 디지털 형태의 무체물, 정해진 용역은 '물품 등'에 들어가요."},{"id":"63-1-2","r":63,"s":"무역규범","n":2,"q":"우리나라의 대외무역법령에서 수출입승인사항의 변경신고 대상에 해당하지 않는 것은?","c":["원산지","승인 조건","도착항(수출입의 경우 모두 해당)","수출입 물품 등의 용도(수출입승인 용도가 지정된 경우에만 해당)"],"a":3,"t":"대외무역법: 원산지","e":"수출입승인 변경신고 대상은 원산지, 도착항(수출의 경우에만), 규격, 승인 조건, 용도(용도가 지정된 경우) 같은 사항이에요. 도착항은 수출에만 해당하므로 '수출입 모두 해당'이라고 한 ③이 틀렸습니다."},{"id":"63-1-3","r":63,"s":"무역규범","n":3,"q":"우리나라의 대외무역법령에서 규정하고 있는 특정거래형태의 수출입에 관한 설명이다.\n\n 다음 각 괄호 (     )에 들어갈 용어로 올바른 것은?\n\nA. 위탁판매수출이란 물품 등을 ( A )으로 수출하여 해당 물품이 판매된 범위 안에서 대금을 결제하는 계약에 의한 수출을 말한다.\nB. 위탁가공무역이란 ( B )을 지급하는 조건으로 외국에서 가공할 원료의 전부 또는일부를 거래 상대방에게 수출하거나 외국에서 조달하여 이를 가공한 후 가공물품 등을 수입하거나 외국으로 인도하는 수출입을 말한다.\nC. 임대수출이란 임대 계약에 의하여 물품 등을 수출하여 일정 기간 후 다시 수입하거나 그 기간이 만료 전 또는 만료 후 해당 물품 등의 ( C )을 이전하는 수출을 말한다.\nD. 외국인수수입이란 수입대금은 국내에서 지급되지만, 수입물품 등은 ( D )에서 인수하거나 제공받는 수입을 말한다.\n\n( A )          ( B )         ( C )   ( D )","c":["유환 / 가득액 / 사용권 / 외국","유환 / 가공임 / 소유권 / 국내","무환 / 가득액 / 사용권 / 국내","무환 / 가공임 / 소유권 / 외국"],"a":4,"t":"대외무역법: 정의, 수출입 실적","e":"위탁판매수출은 무환으로 수출해 팔린 만큼 대금을 받고, 위탁가공무역은 가공임을 주는 조건이며, 임대수출은 만료 전후 소유권을 이전할 수 있고, 외국인수수입은 대금은 국내에서 주고 물품은 외국에서 받는 수입이에요."},{"id":"63-1-4","r":63,"s":"무역규범","n":4,"q":"대외무역법령상 외화획득용 원료ㆍ기재의 수입 등에 대한 설명 중 올바른 것은?","c":["외화획득용 원료의 수량은 외화획득을 위한 물품 등의 1단위를 생산하기 위하여 제공되는 외화획득용 원료의 표준 소요량을 말한다.","외화획득용 원료를 수입한 자가 직접 외화획득의 이행을 하는 경우, 외화획득 이행기간은 수입통관일 또는 공급일로부터 1년이다.","외화획득 이행의무자의 책임이 없는 사유로 외화획득의 이행을 할 수 없게 된 경우에는 외화획득용 원료ㆍ기재의 사후관리를 하지 아니할 수 있다.","외화가득율이 30% 이상인 군납용 물품 등을 생산하는 데 소요되는 원료는 외화획득용원료로 인정된다."],"a":4,"t":"대외무역법: 외화획득, 구매확인서","e":"외화가득률이 30% 이상인 군납용 물품의 생산 원료는 외화획득용 원료로 인정됩니다. 직접 외화획득을 이행하는 경우의 이행기간은 수입통관일부터 2년이 원칙이라 ②가 틀렸고, 이행의무자 책임이 없는 사유라도 사후관리 자체를 하지 않는 건 아니에요."},{"id":"63-1-5","r":63,"s":"무역규범","n":5,"q":"다음 중 대외무역법령에서 규정하고 있는 전략물자의 수출 허가 등의 제한이 필요한 기술에 해당하는 것은?","c":["해외 원자력시설에서의 검사 등을 통한 기술","일반에 공개된 기술","기초과학연구에 관한 기술","특허 출원에 필요한 최소한의 기술"],"a":1,"t":"대외무역법: 전략물자","e":"일반에 공개된 기술, 기초과학연구 기술, 특허 출원에 필요한 최소한의 기술은 전략기술 수출허가 대상에서 빠집니다. 해외 원자력시설 검사 등을 통한 기술 이전은 허가가 필요한 경우에 해당해요."},{"id":"63-1-6","r":63,"s":"무역규범","n":6,"q":"대외무역법령에서 규정하는 전략물자의 수출입에 대한 설명으로 잘못된 것은?","c":["산업통상자원부 장관은 상황허가 신청을 받은 경우에 조건부로 허가할 수 있다.","「방위사업법」에 따라 허가를 받은 방위산업물자 및 국방과학기술이 전략물자에 해당하는 경우에도 대외무역법상 수출허가를 받아야 한다.","산업통상자원부장관이 정하여 고시하는 기술을 수출하려는 경우에는 허가의 유효기간을 달리 정할 수 있다.","전략물자 해당 여부를 확인하고자 하는 자는 해당 물품 등에 대하여 전문기관에 판정을 신청할 수 있다."],"a":2,"t":"대외무역법: 전략물자","e":"방위사업법에 따라 수출허가를 받은 방산물자와 국방과학기술은 대외무역법상 전략물자 수출허가를 받은 것으로 보기 때문에 다시 허가받을 필요가 없어요."},{"id":"63-1-7","r":63,"s":"무역규범","n":7,"q":"대외무역법령에서 규정하는 정부 간 수출계약에 대한 설명으로 잘못된 것은?","c":["정부 간 수출계약과 관련하여 정부는 어떠한 경우에도 경제적 이익을 갖지 아니하고, 경제적 책임 및 손실을 부담하지 아니한다.","정부 간 수출계약 전담기관은 대한무역투자진흥공사이며, 전담기관은 정부 간 수출계약과 관련하여 당사자의 역할을 수행한다.","국내 기업은 정부 간 수출계약이 체결된 경우 그 계약 내용을 성실히 이행하여야 하며, 국내 기업은 보증ㆍ보험의 제공 등 계약 이행 보증 조치를 취하여야 한다.","정부 간 수출계약이란 외국 정부의 요청이 있는 경우에 전담기관이 국내 기업을 대신하거나 함께 당사자가 되어 방위산업 물품 등을 유상으로 수출하기 위하여 외국 정부와 체결하는 수출계약을 말한다."],"a":4,"t":"대외무역법: 무역구제, 특별조치","e":"정답 키 기준으로 ④가 틀린 설명이에요. 정부 간 수출계약의 대상은 대통령령으로 정하는 물품 등으로, 방위산업 물품으로만 한정되지 않습니다. 정부가 경제적 이익이나 책임을 지지 않는다는 ①, 전담기관이 KOTRA라는 ②는 맞아요."},{"id":"63-1-8","r":63,"s":"무역규범","n":8,"q":"우리나라의 대외무역법령에서 규정하고 있는 원산지판정기준에 관한 설명 중 올바른 것은?","c":["공구는 기계 등과 함께 수입되어 동시에 판매되더라도 해당 기계와 별개로 구분하여원산지를 판정해야 한다.","포장용품과 내용품을 각각 별개로 구분하여 수입신고 하도록 규정된 경우에는 포장용품의 원산지는 내용품의 원산지와 구분하여 결정한다.","촬영된 영화용 필름은 그 영화가 촬영된 나라를 원산지로 한다.","전자적 형태의 무체물은 그것을 제작하거나 처리한 나라를 원산지로 본다."],"a":2,"t":"대외무역법: 원산지","e":"포장용품과 내용품을 따로 수입신고하도록 정해진 경우에는 포장용품의 원산지를 따로 판정합니다. 기계와 함께 수입, 판매되는 공구는 기계의 원산지를 따르고, 영화 필름은 제작자가 속한 나라가 원산지예요."},{"id":"63-1-9","r":63,"s":"무역규범","n":9,"q":"대외무역법령상 수출입의 질서 유지에 관한 설명으로 올바른 것은?","c":["무역거래자는 환차익을 목적으로 물품 등의 수출 또는 수입가격을 조작하여서는 아니 된다.","산업통상자원부장관은 수출입과 관련하여 분쟁이 발생한 경우 관련된 진술 또는 서류의 제출을 요구할 수는 있으나 분쟁을 조정할 수는 없다.","산업통상자원부장관은 우리나라 또는 교역상대국의 관련 법령에 위반되는 경우, 물품 등의 가격, 수량, 품질 등에 관하여 필요한 조정을 명할 수 있다.","선적 전 검사와 관련하여 수출자와 선적 전 검사기관 간에 분쟁이 발생하였을 경우분쟁의 중재를 담당할 기관으로 대한상공회의소를 지정할 수 있다."],"a":3,"t":"대외무역법: 무역구제, 특별조치","e":"산업통상자원부장관은 우리나라나 교역상대국 법령 위반 등의 경우 가격, 수량, 품질 등에 관한 조정을 명할 수 있어요. 분쟁 조정도 할 수 있고, 선적 전 검사 분쟁의 중재기관은 대한상사중재원입니다."},{"id":"63-1-10","r":63,"s":"무역규범","n":10,"q":"대외무역법령에서 규정하는 내국신용장과 구매확인서에 관한 설명으로 올바른 것은?","c":["외국환은행의 장 또는 전자무역 기반 사업자는 외화획득용원료·기재 구매확인서를전자무역 문서로 발급하고 신청한 자에게 발급 사실을 알릴 때 승인번호, 개설 및 통지일자, 발신기관 전자서명 등 최소한의 사항만 알릴 수 있다.","구매확인서를 발급받으려는 자가 전산 설비를 갖추지 못하였거나 기타 부득이한 사유로 전자문서를 작성하지 못하는 때에는 외국환은행의 장에게 위탁하여 신청할 수 있\n다.","내국신용장이란 기획재정부장관이 정하는 바에 따라 지정거래 외국환은행의 장이 발급하여 국내에서 통용되는 신용장을 말한다.","한국무역협회 또는 전자무역 기반 사업자는 발급된 구매확인서에 의하여 2차 구매확인서를 발급할 수 있으며, 외화획득용 원료·기재의 제조·가공·유통(완제품 유통 제외)과정이 여러 단계인 경우에는 각 단계별로 순차로 발급할 수 있다."],"a":1,"t":"대외무역법: 외화획득, 구매확인서","e":"전자무역문서로 구매확인서를 발급하면 승인번호, 발급일자, 발신기관 전자서명 같은 최소한의 사항만 알릴 수 있어요. 2차 구매확인서 발급 주체는 외국환은행의 장 또는 전자무역기반사업자이고, 내국신용장 기준은 한국은행 총재가 정합니다."},{"id":"63-1-11","r":63,"s":"무역규범","n":11,"q":"다음 내용 중 잘못된 것은?\n\n∙ 품목번호 : 3304.99.1000 / 기초화장용 제품류 (Skin care cosmetics)\n∙ 원산지    : 원산지표시대상(Y)\n∙ 관세     : 기본관세(A) : 8% / WTO협정관세(C) : 6.5%\n∙ FTA협정 : EU(FEU1) 0% / 중국(FCN1) 0% / 미국(FUS1) 0%\n∙ 감면·환급 : 간이정액환급액(10원)","c":["HS Code는 6자리까지 국제적으로 표준화되어 있다. 대한민국은 10자리를 사용하고 있으며, 8자리 또는 9자리를 사용하는 국가도 있다.","기초화장용 제품류는 33류, 3304호, 3304.99 소호에 분류되고 있다.","HS Code는 원산지 표시부터 관세율, FTA 협정, 감면 및 환급, 내국세 정보 등 다양한정보를 가지고 있다. 정확한 HS Code 확인을 위해 관세청에 심사를 요청하는 제도를품목분류 사전심사제도라고 한다.","HS Code의 법적 구속력을 갖는 3대 구성요소는 첫째 통칙, 둘째 주(note), 셋째 부 (section)와 류(chapter)의 표제 용어이다."],"a":4,"t":"관세법: 품목분류","e":"HS의 법적 구속력이 있는 것은 부와 류, 호의 용어, 부와 류의 주(註), 그리고 해석에 관한 통칙이에요. '부와 류의 표제'는 참조용일 뿐 법적 구속력이 없어서 ④가 틀렸습니다."},{"id":"63-1-12","r":63,"s":"무역규범","n":12,"q":"다음은 관세법상 용어의 정의이다. 괄호 안에 들어갈 단어로 맞게 짝지어진 것은?\n\n가. 외국물품을 우리나라에서 소비 또는 사용하는 것은 (         )이다.\n나. 국내에 도착한 외국물품이 수입통관 절차를 거치지 아니하고 다시 외국으로 반출되\n  는 것을 (        )이라고 한다.\n다. 우리나라의 선박 등이 공해에서 채집하거나 포획한 수산물은 (           )물품이다.\n라. 인천항에 페리로 입항한 물품이 부산항으로 운송되어 컨테이너선으로 옮겨 실어 출\n  항하는 것은 (        )이다.\n\n가              나       다             라","c":["수입 / 수출 / 외국 / 환적","사용신고 / 반송 / 외국 / 복합환적","사용신고 / 수출 / 내국 / 환적","수입 / 반송 / 내국 / 복합환적"],"a":4,"t":"관세법: 통관, 보세","e":"외국물품을 우리나라에서 소비하거나 사용하는 것은 수입, 수입통관 없이 다시 외국으로 나가는 것은 반송이에요. 우리 선박이 공해에서 채집한 수산물은 내국물품이고, 다른 세관 관할로 옮겨 다른 운송수단에 싣는 것은 복합환적입니다."},{"id":"63-1-13","r":63,"s":"무역규범","n":13,"q":"관세법상 기간과 기한에 대한 설명으로 잘못된 것은?","c":["관세법에 따른 기간을 계산할 때 수입신고 수리 전 반출승인을 받은 경우에는 반출일을 수입신고의 수리일로 본다.","관세법에 따른 기한이 공휴일인 경우에는 그 다음 날을 기한으로 한다.","세관장은 천재지변으로 인해 관세법에 따른 청구를 정해진 기한까지 할 수 없다고 인정되는 경우, 1년을 넘지 않는 범위에서 기한을 연장할 수 있다.","납부고지를 한 경우, 관세의 납부기한은 납부고지를 받은 날부터 15일 이내이다."],"a":1,"t":"관세법: 납세의무, 세액","e":"수입신고 수리 전 반출승인을 받으면 '반출일'이 아니라 '승인일'을 수입신고 수리일로 봐요. 그래서 ①이 틀렸습니다."},{"id":"63-1-14","r":63,"s":"무역규범","n":14,"q":"다음 예시에서 ㈜KITA의 수입 시 과세물건 수량 및 관세율로 옳은 것은?\n\n- 24.11.03. : ㈜KITA는 독일업체와 자동차부품(A) 100,000개 수입 계약 체결\n- 24.12.05. : 독일업체가 계약 물품 선적\n- 25.01.01. : 법령 개정 및 시행 (자동차부품(A)의 관세율이 기존 8%에서 10%로 인상)\n- 25.01.04. : 부산항 창고 물품 반입, 일부 부품(100개) 미선적 확인\n- 25.01.08. : ㈜KITA 수입신고","c":["과세물건 : 100,000개 / 관세율 : 10%","과세물건 : 100,000개 / 관세율 : 8%","과세물건 : 99,900개 / 관세율 : 10%","과세물건 : 99,900개 / 관세율 : 8%"],"a":3,"t":"관세법: 관세율","e":"과세물건은 수입신고 당시의 성질과 수량으로 확정하므로 실제 들어온 99,900개가 대상이고, 세율도 수입신고 당시 법령을 적용하므로 인상된 10%가 맞아요."},{"id":"63-1-15","r":63,"s":"무역규범","n":15,"q":"다음 각각의 경우에 납세의무자가 올바르게 짝지어진 것은?\n\n가. ㈜KITA는 국내 A사로부터 수입 대행을 위탁받아 수입신고를 하였다.\n나. ㈜KITA는 베트남에서 수입한 물품을 수입신고 3일 전에 국내 B사에 B/L 양수도거래를 통해서 양도하였다.\n다. ㈜KITA는 한국의 운송사 C사를 통해, 영국에서 출발하여 싱가포르를 거쳐 대한민국에 도착한 물품을 수입신고 하였다.\n\n가                나             다","c":["㈜KITA / ㈜KITA / ㈜KITA","A사 / B사 / ㈜KITA","㈜KITA / ㈜KITA / C사","A사 / B사 / C사"],"a":2,"t":"관세법: 납세의무, 세액","e":"수입 대행은 위탁자(A사), 수입신고 전에 양도된 물품은 양수인(B사)이 납세의무자예요. 운송사는 화주가 아니므로 직접 신고한 ㈜KITA가 납세의무자입니다."},{"id":"63-1-16","r":63,"s":"무역규범","n":16,"q":"다음 중 납세의무의 소멸 등과 관련하여 올바른 것을 모두 고른 것은?\n\nA. 관세를 부과할 수 있는 기간에 관세가 부과되지 아니하고 그 기간이 만료된 때에는납세의무가 소멸한다.\nB. 부정한 방법으로 관세를 포탈하였거나 환급 또는 감면받은 경우에는 관세를 부과할수 있는 날부터 10년이 지나면 부과할 수 없다.\nC. 납세자가 잘못 납부하거나 초과하여 납부한 금액, 또는 그 밖의 관세 환급청구권은그 권리를 행사할 수 있는 날부터 5년 이내에 행사하지 않으면 소멸시효가 완성된\n다.\nD. 관세징수권의 소멸시효는 납부고지, 부과취소, 관세충당, 통고처분, 교부청구의사유로 중단된다.","c":["A, B, C","A, B, D","A, C, D","B, C, D"],"a":1,"t":"관세법: 납세의무, 세액","e":"제척기간 만료, 부정행위 시 10년 제척기간, 환급청구권 5년 소멸시효는 모두 맞아요. 관세징수권 소멸시효의 '중단' 사유에 부과취소는 들어가지 않아서 D가 틀렸습니다."},{"id":"63-1-17","r":63,"s":"무역규범","n":17,"q":"다음 수입물품의 과세가격을 합리적인 기준에 따라 결정하는데 기초로 사용할 수없는 가격은 어느 것인가?","c":["임차수입물품 : 동일 또는 유사물품의 국내 수출 시 공개된 가격자료에 따른 가격","중고물품 : 관련 법령에 따른 감정기관의 감정가격","여행자휴대품 : 외국에서 통상적으로 거래되는 가격으로서 객관적으로 조사된 가격","수입신고 전 변질된 물품 : 제3국으로 수출하는 가격에서 보험 보상액을 뺀 가격"],"a":4,"t":"관세법: 과세가격","e":"합리적 기준으로 과세가격을 정할 때 우리나라 외의 나라로 수출하는 가격은 기초로 쓸 수 없어요. 제3국 수출가격을 쓰는 ④가 정답입니다."},{"id":"63-1-18","r":63,"s":"무역규범","n":18,"q":"관세법령상 세액의 확정 및 정정에 대한 설명으로 올바른 것은?","c":["세관장은 납세신고를 받으면 수입신고서에 기재된 사항과 관세법상 확인사항 등을 심사하고, 신고한 세액에 대하여 관세 채권 확보가 곤란한 경우에는 수입신고 수리한 후즉시 세액심사를 한다.","관세를 체납하고 있는 자가 신고하는 물품이라도, 체납액이 10만 원 미만인 경우에는수입신고 수리 전에 세액심사를 하지 아니한다.","세관장은 경정 청구를 받은 날부터 30일 이내에 세액을 경정하거나, 경정할 이유가 없다는 뜻을 청구인에게 통지하여야 한다.","납세의무자는 신고한 세액을 납부하기 전에 과부족이 있음을 알게 된 경우, 그 세액을보정할 수 있다. 이 경우 보정 신청 다음 날까지 관세를 납부하여야 한다."],"a":2,"t":"관세법: 납세의무, 세액","e":"체납액이 10만 원 미만이면 수리 전 세액심사 대상에서 빠집니다. 관세채권 확보가 어려운 경우는 수리 '전'에 심사하고, 경정청구는 2개월 이내 통지, 보정은 보정신청한 날의 다음 날까지 납부해요."},{"id":"63-1-19","r":63,"s":"무역규범","n":19,"q":"관세법에서 규정하는 관세율의 종류에 대한 설명으로 잘못된 것은?","c":["긴급관세는 해당 국내 산업의 보호 필요성, 국제통상관계 등을 검토하여 부과 여부와그 내용을 결정하고, 부과한 경우 기획재정부장관은 긴급관세부과의 부정적 효과에 대한 무역보상방법에 관하여 협의를 할 수 있다.","수입가격이 급등한 물품 또는 이를 원재료로 한 제품의 국내가격을 안정시키기 위하여 필요한 경우에는 조정관세를 부과할 수 있다.","관세 양허율이 국내외 가격 차보다 낮은 농림축산물의 수입이 급증한 경우, 해당 농림축산물에 대해 특별긴급관세를 부과할 수 있다.","관세 또는 무역에 관한 국제협정이나 양자 간의 협정 등에 규정된 우리나라의 권익을부인하거나 제한하는 경우에는 보복관세를 부과할 수 있다."],"a":2,"t":"관세법: 관세율","e":"수입가격이 급등한 물품의 국내가격 안정을 위해 쓰는 것은 할당관세예요. 조정관세는 산업 보호, 국민 보건 등 다른 목적에 씁니다."},{"id":"63-1-20","r":63,"s":"무역규범","n":20,"q":"국내 수입자 B는 중국의 수출자 A로부터 공작기계 1대를 CIF 조건으로 수입하면서, 물품 대금으로 USD 1,000을 지급하였다. A는 운송인과 운송 및 보험계약을 체결하고 해상운임 및 보험료로 USD 100을 지급하였다. B가 수입통관 시 납부할 관세는?\n\n(단, 관세율 8%, 부가세 10%, 과세환율 1,000원/USD, 그 외의 사항은 고려하지 않는다.)","c":["80,000원","188,000원","88,000원","169,200원"],"a":1,"t":"관세법: 과세가격","e":"CIF 조건이라 수입자가 낸 물품대금 USD 1,000 안에 운임과 보험료가 이미 들어 있어요. 매도인이 운송사와 보험사에 낸 USD 100을 따로 더하지 않으므로 과세가격은 1,000,000원, 관세는 8%인 80,000원입니다."},{"id":"63-1-21","r":63,"s":"무역규범","n":21,"q":"다음 중 관세법령상 용도세율의 적용에 대한 설명이 잘못된 것은?","c":["용도에 따라 세율을 다르게 정하는 물품을 세율이 낮은 용도에 사용하여 해당 물품에그 낮은 세율의 적용을 받으려는 자는 세관장에게 신청하여야 한다.","미리 세관장으로부터 해당 용도로만 사용할 것을 승인받은 경우에는 용도세율 적용의신청을 생략할 수 있다.","용도세율이 적용된 물품은 그 수입신고의 수리일부터 3년의 범위에서 해당 용도 외의다른 용도에 사용하거나 양도할 수 없다. 다만, 미리 세관장의 승인을 받은 경우에는그러하지 아니하다.","용도세율이 적용된 물품을 해당 용도 외의 다른 용도에 사용하려는 자에게 양도한 경우에는 그 양수인으로부터 즉시 관세를 징수한다."],"a":4,"t":"관세법: 관세율","e":"용도세율을 적용받은 물품을 다른 용도에 쓰려는 자에게 양도하면 양도인에게서 관세를 징수하고, 양도인에게서 걷을 수 없을 때 양수인에게서 즉시 징수합니다."},{"id":"63-1-22","r":63,"s":"무역규범","n":22,"q":"수입신고가 수리된 물품이 계약 내용과 다르고, 신고 당시의 성질이나 형태가 변경되지 아니한 경우에 관세를 환급할 수 있는 것을 모두 고르시오.\n\nA. 보세구역에 외국으로부터 수입된 해당 물품을 수입신고 수리일부터 1년 이내에 반입하였다가 다시 수출한 경우\nB. 자유무역지역 중 관세청장이 수출물품을 일정기간 보관하기 위하여 필요하다고 인정하여 고시하는 장소에 외국으로부터 수입된 해당 물품을 수입신고 수리일부터 1년이내에 반입하였다가 다시 수출한 경우\nC. 통관우체국에 외국으로부터 수입된 해당 물품을 수입신고 수리일부터 1년 이내에 반입하였다가 다시 수출한 경우\nD. 보세공장에서 생산된 물품을 수입신고 수리일부터 1년 이내에 보세공장에 해당 물품을 다시 반입한 경우","c":["A, B, C, D","A, B","A, B, C","A, B, D"],"a":1,"t":"관세법: 감면, 환급","e":"위약물품 환급은 수입신고 수리일부터 1년 이내에 보세구역, 관세청장이 고시하는 자유무역지역 장소, 통관우체국에 반입했다가 수출하는 경우와 보세공장 재반입 경우가 모두 해당돼요."},{"id":"63-1-23","r":63,"s":"무역규범","n":23,"q":"관세법상 보세화물의 관리와 관련하여 올바른 것을 모두 고른 것은?\n\nA. 국제무역선에서 물품을 하역하기 전까지는 세관장의 승인 없이 외국 물품의 일부를 견본품으로 반출할 수 있다.\nB. 보세구역에 장치된 물품의 원형을 변경하거나 해체ㆍ절단 등의 작업을 하려는 자는 세관장의 허가를 받아 해당 작업을 할 수 있다.\nC. 수입될 물품의 보수작업의 재료로 외국물품도 사용할 수 있다.\nD. 세관공무원은 보세구역에 반입된 물품 또는 국제무역선에 적재된 물품에 대하여검사상 필요하면 그 물품의 일부를 견본품으로 채취할 수 있다.\nE. 지정장치장에 반입한 물품은 화주 또는 반입자가 그 보관의 책임을 진다.","c":["A, B, C","A, D, E","B, C, D","B, D, E"],"a":4,"t":"관세법: 통관, 보세","e":"하역 전에 견본품을 반출하려면 세관장 허가가 필요하고, 보수작업 재료로 외국물품은 쓸 수 없어요. 해체, 절단 작업 허가, 세관공무원의 견본 채취, 지정장치장 보관 책임은 맞는 설명입니다."},{"id":"63-1-24","r":63,"s":"무역규범","n":24,"q":"관세법상 수입신고의 처리에 관한 설명으로 잘못된 것은?","c":["세관장은 수입신고가 적법하게 이루어졌을 때에는 이를 지체없이 수리하고 신고인에게 신고필증을 발급하여야 한다.","수입신고 물품은 원칙적으로 신고가 수리되기 전에는 운송수단, 관세통로, 하역통로로부터 반출하여서는 아니 된다.","세관장은 수입신고서의 기재사항 중 일부가 경미하게 미비되고, 신고 수리 후 보완이 가능하다고 인정되는 경우에는 수리 후 이를 보완하게 할 수 있다.","수입신고 물품이 관세법에 규정된 장치 장소에서 반출된 경우, 정당한 이유가 있는때에 한하여 이를 취하할 수 있다."],"a":4,"t":"관세법: 통관, 보세","e":"수입신고를 취하할 때는 정당한 이유가 있어야 하고 세관장 승인을 받아야 해요. 또 운송수단, 관세통로, 하역통로나 장치장소에서 물품을 반출한 뒤에는 취하할 수 없어서 ④가 틀렸습니다."},{"id":"63-1-25","r":63,"s":"무역규범","n":25,"q":"관세법상 수입신고에 대한 내용으로 잘못된 것은?","c":["수입하는 물품을 보세창고에 반입한 자는 반입일로부터 30일 이내에 수입신고를 하여야 한다.","관세법 제241조에 따른 수입신고는 화주 또는 관세사 등의 명의로 하여야 한다.","외국통화로 표시된 가격을 내국통화로 환산하는 경우에 관세법 제17조에 따른 날이속하는 주의 전주의 외국환매도율을 평균하여 관세청장이 과세환율을 정한다.","수입하려는 물품의 신속한 통관이 필요할 때에는 대통령령으로 정하는 바에 따라해당 물품을 적재한 선박 또는 항공기가 입항하기 전에 수입신고를 할 수 있다."],"a":3,"t":"관세법: 납세의무, 세액","e":"과세환율은 과세물건 확정 시기가 속하는 주의 전주 '기준환율 또는 재정환율'을 평균해서 관세청장이 정해요. '외국환매도율'이라고 한 ③이 틀렸습니다."},{"id":"63-1-26","r":63,"s":"무역규범","n":26,"q":"다음 ( ) 안에 들어갈 용어로 올바른 것은?\n\nA. 관세청장은 단일 수출용원재료에 의하여 둘 이상의 제품이 동시에 생산되는 등 생산공정이 특수한 수출물품과 중소기업 수출물품에 대한 관세 등의 환급 절차를 간소화하기 위하여 필요하다고 인정하는 경우에는 대통령령으로 정하는 바에 따라 수출용원재료에 대한 관세 등의 평균 환급액 또는 평균 납부세액 등을 기초로 수출물\n   품별로 (       )를 정하여 고시할 수 있다.\nB. (       )에 정하여진 금액은 해당 물품을 생산하는 데 드는 수출용원재료를 수입\n한 때에 납부하는 관세 등으로 보아 환급한다.\nC. (       )를 적용받을 수 있는 자는 대통령령으로 정하는 바에 따라 관세청장에게\n   (       )를 정하여 고시할 것을 요청할 수 있다.","c":["정액환급률표","환급세액표","소요량기준표","평균납부세액표"],"a":1,"t":"환급특례법","e":"관세청장이 수출물품별 평균 환급액을 기초로 정해 고시하는 표는 간이정액환급률표, 줄여서 정액환급률표예요."},{"id":"63-1-27","r":63,"s":"무역규범","n":27,"q":"수출용원재료에 대한 관세 등 환급에 관한 특례법령상 수출용원재료에 대한 관세등의 환급업무에 관한 설명으로 올바른 것은?","c":["평균세액증명서는 수출용 원재료를 구매하는 자의 신청에 의하여 그가 매월 수입한수출용 원재료의 품목별 물량과 단위당 평균세액을 증명하는 서류를 말한다.","기초원재료납세증명서는 구매확인서에 의해 거래된 경우에 한해 수입된 상태 그대로 거래된 수출용원재료에 대한 납부세액을 증명하는 서류를 말한다.","평균세액증명서는 세관장과 관세청장이 정하는 기준에 해당되는 수출용 원재료를구매한 자 또는 해당 구매자로부터 위임받은 관세사가 발행할 수 있다.","수입세액분할증명서는 세관장과 관세청장이 정하는 기준에 해당되는 내국신용장 등에 의하여 물품을 공급한 자 또는 해당 공급한 자의 위임받은 관세사가 발행할 수있다."],"a":4,"t":"환급특례법","e":"수입세액분할증명서는 내국신용장 등으로 물품을 공급한 자나 그로부터 위임받은 관세사가 발행할 수 있어요. 평균세액증명서는 수입한 자의 신청으로 세관장이 발급하는 서류입니다."},{"id":"63-1-28","r":63,"s":"무역규범","n":28,"q":"다음 중 자유무역협정(FTA)관세법령상 협정관세 사후 적용신청에 관한 설명으로 잘못된 것은?\n\n∙ ㈜KITA는 2025년 2월 5일 베트남에서 제조된 화장품을 수입 신고하였으며, 관세를납부한 후 해당 물품은 2025년 2월 7일에 수입신고가 수리되었다.\n∙ 그러나 회사는 수입신고 시 FTA 협정관세 적용신청을 하지 않았고, 이후 해당 사실을인지하여 2025년 5월 30일에 세관에 협정관세 사후 적용을 신청하였다.\n∙ ㈜KITA는 해당 물품이 한-베트남 FTA 적용 대상에 해당한다는 점과 원산지 정보가전자적으로 교환되었음을 근거로 하여 원산지증명서 원본 제출을 생략하려 하였다.","c":["㈜KITA는 2025년 2월 5일 수입 신고일로부터 1년 이내에 사후 적용을 신청하였으므로신청 요건을 충족한다.","전자적 정보 교환 대상국이라 하더라도 세관장이 요청하는 경우에는 원산지증명서의제출을 요구할 수 있다.","협정관세 적용을 신청한 ㈜KITA는 이미 납부한 세액의 경정 청구를 할 수 있다.","경정 청구를 받은 경우 세관장은 그 청구를 받은 날부터 2개월 이내에 협정관세의적용 및 세액의 경정 여부를 ㈜KITA에게 통지하여야 한다."],"a":1,"t":"FTA관세법","e":"협정관세 사후적용 신청 기한은 수입신고 '수리일'부터 1년 이내예요. 수입신고일 기준이라고 한 ①이 틀렸습니다."},{"id":"63-1-29","r":63,"s":"무역규범","n":29,"q":"다음 중 자유무역협정(FTA)관세법령에서 규정하고 있는 FTA 원산지결정기준에 관한설명으로 올바른 것을 모두 고른 것은?\n\nA. 완전생산기준은 해당 물품이 2개국 이상에 걸쳐 생산된 경우 최종 생산·가공을 수행한 국가를 원산지로 인정하는 기준이다.\nB. 세번변경기준은 해당 물품의 품목번호와 그 생산에 사용된 원산지 재료의 품목번호가 일정 단위 이상 다른 경우, 해당 물품을 최종적으로 생산한 국가를 원산지로 인정하는 기준이다. 이 기준은 둘 이상의 국가에서 생산된 경우에 적용될 수 있다.\nC. 부가가치기준은 일정 수준 이상의 부가가치를 창출한 국가를 원산지로 인정하는것으로 이는 둘 이상의 국가에서 생산된 경우에 적용될 수 있다.\nD. 해당 물품이 원산지국에서 생산되었더라도 원산지가 아닌 국가를 경유하여 운송되거나 원산지가 아닌 국가에서 선적된 경우에는 원산지로 인정받을 수 없다. 단, 보세구역에서 일시적으로 보관된 경우는 예외이다.","c":["A, B","A, C","B, D","C, D"],"a":4,"t":"FTA관세법","e":"부가가치기준과 직접운송 원칙(제3국 경유 시 원칙적으로 불인정, 일시 보관 등 예외)은 맞아요. 완전생산기준은 한 나라에서 전부 생산된 경우에 쓰고, 세번변경기준은 비원산지 재료와 비교하는 기준이라 A, B가 틀렸습니다."},{"id":"63-1-30","r":63,"s":"무역규범","n":30,"q":"자유무역협정(FTA)관세법령상 원산지증명서의 유효기간이 다른 것은?","c":["칠레와의 협정","캐나다와의 협정","뉴질랜드와의 협정","이스라엘과의 협정"],"a":4,"t":"FTA관세법","e":"원산지증명서 유효기간은 대부분 발급일부터 1년이지만 칠레, 캐나다, 뉴질랜드 등은 2년이에요. 정답 키 기준으로 이스라엘 협정이 다른 기간을 둡니다."},{"id":"63-2-1","r":63,"s":"무역결제","n":1,"q":"외국환거래법과 관련된 설명 중에서 잘못된 것은?","c":["외국환거래법은 외국환에 대한 거래행위인 지급과 영수 등에 관한 법이다.","거주성의 판단은 국적과 관련하여 한국인은 거주자, 외국인은 비거주자이다.","국내에 있는 외국 정부의 공관에 근무하는 외국인은 비거주자이다.","외국환거래의 관리는 Negative system(원칙적 자유-예외적 규제) 방식으로 한다."],"a":2,"t":"외국환거래법","e":"거주자와 비거주자는 국적이 아니라 주된 사무소나 생활 근거가 어디 있는지로 판단해요. 한국인이라도 해외에 오래 살면 비거주자가 될 수 있어서 ②가 틀렸습니다."},{"id":"63-2-2","r":63,"s":"무역결제","n":2,"q":"다음 중 O/A 결제방식에 대한 설명으로 올바른 것을 모두 고른 것은?\n\nA. 수출자는 자신이 발행한 환어음에 ‘AVAL’을 표기하여 대금 회수의 위험을 회피할 수있다.\nB. 수출자는 O/A NEGO를 활용하여 외상매출채권을 매각하여 조기에 현금화할 수 있다.\nC. 수출자가 물품의 선적을 완료한 시점에 수출채권이 발생한다.\nD. 수입자는 물품을 인도받고 품질을 확인한 후에 대금을 결제할 수도 있다.\nE. 수입자는 만기일에 매입은행으로 물품 대금을 송금하여야 한다.","c":["A, B, C","A, C, D","B, D, E","C, D, E"],"a":3,"t":"송금, 기타 결제","e":"O/A는 수출자가 물품과 서류를 수입자에게 직접 보내고 약정한 날에 송금받는 외상거래예요. O/A NEGO로 채권을 조기 현금화할 수 있고, 수입자는 물품을 확인한 뒤 만기에 매입은행으로 송금합니다. AVAL은 포페이팅에서 쓰는 어음 보증이라 A가 틀렸어요."},{"id":"63-2-3","r":63,"s":"무역결제","n":3,"q":"다음 중 송금결제방식의 특징에 대한 설명으로 올바른 것은?","c":["환어음을 사용하기 때문에 어음법이 적용된다.","한국의 결제통계에서 가장 많이 사용되는 방식으로 관련한 국제규칙이 있다.","신용장방식에 비해서 수출자의 대금 미회수 위험이 낮으므로 은행수수료도 낮다.","송금방식은 주로 전신송금을 사용하기 때문에 T/T라고 줄여 부르기도 한다."],"a":4,"t":"송금, 기타 결제","e":"송금방식은 대부분 전신송금(Telegraphic Transfer)이라 T/T라고 불러요. 환어음을 쓰지 않고, 별도 국제규칙이 없으며, 신용장보다 수출자 위험은 높고 수수료는 낮습니다."},{"id":"63-2-4","r":63,"s":"무역결제","n":4,"q":"다음 중 송금결제방식의 종류와 지급 시기에 대한 설명으로 잘못된 것은?","c":["CAD, COD, D/P, Sight L/C는 물품 또는 서류의 상환으로 대금이 지급되는 면에서 동시 결제방식으로 분류할 수 있다.","Open Account는 수출자가 선적을 이행하고 물품이 수입국에 도착한 이후에 대금을 청구하기 때문에 「물품 도착 조건부 사후송금 결제방식」의 형태이다.","CAD, COD 방식은 동시지급방식으로 분류할 수 있지만, 선적 후 결제가 이루어진다는측면에서 사후지급방식의 의미도 지닌다.","CAD, COD 방식은 선적서류나 물품이 수입자 또는 수입자의 대리인에게 인도된 후 대금결제가 이루어진다."],"a":2,"t":"송금, 기타 결제","e":"Open Account는 선적하고 서류를 보내면 바로 채권이 생기고 약정 기간 뒤 송금받는 방식이에요. 물품 도착을 조건으로 하는 방식이 아니라서 ②가 틀렸습니다."},{"id":"63-2-5","r":63,"s":"무역결제","n":5,"q":"다음 중 추심거래에 관련된 은행에 대한 설명으로 올바른 것을 모두 고르시오.\n\nA. 환어음의 지급인은 결제은행 또는 지급은행이 되어야 한다.\nB. 추심은행은 제시된 서류가 추심지시서와 외관상 일치하는지를 확인하여야 한다.\nC. 추심은행은 추심된 자금을 수취한 후 5영업일 이내에 추심의뢰은행에게 지급하여야한다.\nD. 추심의뢰은행은 수출자가 제시한 선적서류를 심사하지 않아도 된다.\nE. 수출자는 추심지시서를 작성하여 추심은행에게 직접 제시하여야 한다.","c":["A, E","B, D","B, C, D","A, C"],"a":2,"t":"추심(URC)","e":"추심은행은 받은 서류가 추심지시서에 적힌 서류와 외관상 맞는지 확인하고, 은행은 서류 내용을 심사할 의무가 없어요. 환어음 지급인은 수입자이고, 추심대금은 지체 없이 송금하며, 수출자는 추심의뢰은행에 지시서를 제출합니다."},{"id":"63-2-6","r":63,"s":"무역결제","n":6,"q":"다음 중 환어음에 대한 설명으로 잘못된 것은?","c":["환어음은 요식증권으로서 일정한 형식을 갖추어야 유효하다.","환어음의 본질은 제3자에 대한 금전의 지급 위탁증권이다.","환어음은 주로 국제거래에서 사용되지만, 국내 거래에서 사용될 수도 있다.","환어음의 발행인과 지급인은 L/C의 경우에는 모두 개설은행, D/P의 경우에는 모두 수입상이다."],"a":4,"t":"추심(URC)","e":"환어음 발행인은 L/C와 D/P 모두 수출자(수익자)예요. 지급인은 L/C는 개설은행이나 지정은행, D/P는 수입자입니다."},{"id":"63-2-7","r":63,"s":"무역결제","n":7,"q":"신용장에 대한 설명 중 올바른 것은?","c":["신용장에 그 기초가 되는 계약에 대한 명시적 언급이 있다면 개설은행은 그 계약 내용에 구속된다.","화환신용장 거래에서 매입은행은 서류 심사와 함께 그 서류와 관련된 물품에 대한 심사를 동시에 할 의무가 있다.","구매자 위주의 시장에서는 일반적으로 신용장 방식보다는 송금방식이 선호된다.","수입자는 화환신용장 거래에서 원하는 품질의 물품이 도착하지 않는다면 대금을 거절할 권한을 갖고 있다."],"a":3,"t":"신용장 일반","e":"수입자가 유리한 구매자 시장에서는 수입자 부담이 적은 송금(외상) 방식이 선호돼요. 신용장은 기초계약과 독립적이고(①), 은행은 서류만 심사하며(②), 서류가 일치하면 물품 품질과 상관없이 지급됩니다(④)."},{"id":"63-2-8","r":63,"s":"무역결제","n":8,"q":"신용장의 종류와 관련된 설명으로 잘못된 것은?","c":["연지급신용장에서는 환어음이 요구되지 않는다.","인수신용장에서 개설은행은 개설의뢰인을 지급인으로 하는 환어음이 사용되도록 개설해서는 안 된다.","지급신용장은 일람출급으로 사용되고, 기한부로는 사용되지 않는다.","클린신용장은 화환신용장에 비해 부당 청구의 가능성이 훨씬 낮다."],"a":4,"t":"신용장 일반","e":"클린신용장은 선적서류 없이 환어음이나 간단한 청구서만으로 대금을 청구할 수 있어서, 화환신용장보다 부당 청구 위험이 오히려 높아요."},{"id":"63-2-9","r":63,"s":"무역결제","n":9,"q":"SWIFT 신용장의 41A(available with... by... )에 명시되어야 하는 신용장 유형을 모두 고르시오.\n\nA. negotiation                       E. deferred payment\nB. transferable                      F. irrevocable\nC. confirm                           G. reimburse\nD. acceptance                        H. payment","c":["A, D, E, H","B, C, F, G","A, C, D, H","A, B, D, H"],"a":1,"t":"신용장 일반","e":"SWIFT 41A/41D(Available With... By...)에는 이용 방법인 payment, deferred payment, acceptance, negotiation(또는 mixed payment)을 적어요. 양도 가능, 확인, 취소불능, 상환은 다른 필드에 표시합니다."},{"id":"63-2-10","r":63,"s":"무역결제","n":10,"q":"기한부 신용장인 Shipper’s Usance L/C와 Banker’s Usance L/C에 대한 설명이 잘못된 것은?","c":["외상기간 이자 부담 – Shipper’s Usance: 수출상 / Banker’s Usance: 수입상","환어음 지급인 – Shipper’s Usance: 개설은행 / Banker’s Usance: 개설은행 또는 해외 인수은행","환어음 만기 표시 – Shipper’s Usance: 기한부 / Banker’s Usance: 기한부","환가료 산출 기간 – Shipper’s Usance: 기한부 기간 / Banker’s Usance: 기한부 기간"],"a":4,"t":"신용장 일반","e":"Banker’s Usance는 인수은행이 외상기간 신용을 주기 때문에 수출자는 일람불처럼 바로 대금을 받아요. 그래서 수출자의 환가료는 기한부 기간이 아니라 우편일수 정도만 계산되므로 ④가 틀렸습니다."},{"id":"63-2-11","r":63,"s":"무역결제","n":11,"q":"신용장 실무와 관련된 설명으로 잘못된 것을 모두 고른 것은?\n\nA. 확인은행은 조건변경서를 통지한 시점부터 그에 대한 취소 불가능한 결제 (honour) 또는 매입 의무를 부담한다.\nB. 수입신용장 개설을 신청할 때 국내의 수입업체는 거래은행과 외국환거래약정을체결하고, 보험증권도 반드시 제출해야 한다.\nC. 수익자 입장에서 ‘Inspection Certificate issued and signed by applicant’라는 신용장 조건은 독소조항에 해당하므로, 해당 조건의 삭제를 요구하는 것이 바람직하다.","c":["A, B","B, C","C, A","A, B, C"],"a":1,"t":"UCP600","e":"확인은행은 조건변경에까지 확인을 넓힐지 선택할 수 있고, 넓히기로 하고 통지한 때부터 의무를 져요(A가 틀림). 수입신용장 개설 때 보험증권은 거래조건에 따라 필요 없을 수도 있어요(B가 틀림). 개설의뢰인이 서명하는 검사증명서 요구는 대표적인 독소조항이라 C는 맞습니다."},{"id":"63-2-12","r":63,"s":"무역결제","n":12,"q":"SWIFT로 국내 통지은행을 통해 수익자에게 통지된 다음 수출신용장 조건에 대한 설명으로 올바른 것은?\n\n31D (DATE AND PLACE OF EXPIRY) : 251030 AT OUR COUNTER\n41D (AVAILABLE WITH...BY) : ISSUING BANK BY PAYMENT\n43P (PARTIAL SHIPMENTS) : NOT ALLOWED\n43T (TRANSSHIPMENT) : ALLOWED\n44C (LATEST DATE OF SHIPMENT) : 251020\n48 (PERIOD FOR PRESENTATION) : ALL DOCUMENT(S) MUST BE PRESENTED WITHIN 10 DAYS AFTER DATE OF SHIPMENT BUT WITHIN CREDIT VALIDITY","c":["이 신용장 조건에서는 유효기일인 2025년 10월 30일까지 수출국 은행에 서류가 제시되어야 한다.","이 신용장 조건에서는 매입(negotiation)이 허용되지 않는다.","이 신용장 조건에서는 환적이 허용되지 않는다.","이 신용장에서는 최종선적일을 2025년 10월 30일로 정하고 있다."],"a":2,"t":"신용장 일반","e":"41D가 개설은행에서 지급(payment)으로 사용하게 되어 있어서 매입은 허용되지 않아요. 유효장소는 개설은행 창구(AT OUR COUNTER)라 수출국 은행 제시 기준이 아니고, 환적은 허용, 최종선적일은 10월 20일입니다."},{"id":"63-2-13","r":63,"s":"무역결제","n":13,"q":"화환신용장을 발행한 개설은행의 의무에 관한 설명 중 잘못된 것은?","c":["개설은행은 신용장 조건에 일치하는 서류제시에 대해 결제 또는 매입하고, 서류를송부한 지정은행에 신용장 대금을 상환할 의무를 부담한다.","신용장에 의한 개설은행의 결제의무는 통지은행이 신용장을 수익자에 통지하는 시점부터 발생한다.","개설은행의 의무는 수익자의 동의 없이는 취소 또는 변경될 수 없다.","개설은행의 지정은행에 대한 상환약정은 개설은행의 수익자에 대한 약정으로부터독립적이다."],"a":2,"t":"UCP600","e":"개설은행은 신용장을 발행한 시점부터 취소불능의 결제 의무를 져요(UCP600 제7조). 통지 시점이 아니라서 ②가 틀렸습니다."},{"id":"63-2-14","r":63,"s":"무역결제","n":14,"q":"한국의 중계상 A는 베트남에 신용장을 양도하여 자동차 부품을 조달해 미국에 수출할계획이다. 중계상 A가 은행에 신용장 양도를 요청하고 베트남 공급자는 양도된 신용장조건에 따라 요구서류를 양도은행에 제출하였다. 제2 수익자인 베트남 공급처가 양도은행에 제시한 서류 중에서 제1 수익자인 중계상이 교체하여 개설은행에 제출할 수 있는 서류는 무엇인가?","c":["송장과 환어음","송장과 선하증권","송장과 포장명세서","송장과 원산지증명서"],"a":1,"t":"UCP600","e":"양도신용장에서 제1수익자는 자기 송장과 환어음으로 제2수익자의 것을 대체할 수 있어요(UCP600 제38조). 선하증권 같은 운송서류는 바꿀 수 없습니다."},{"id":"63-2-15","r":63,"s":"무역결제","n":15,"q":"화환신용장에서 요구한 다음의 서류 중 발행자의 서명이 없어도 되는 서류는?","c":["Commercial Invoice","Bill of Lading","Insurance Policy","Inspection Certificate"],"a":1,"t":"UCP600","e":"UCP600 제18조에 따라 상업송장은 서명할 필요가 없어요. 운송서류, 보험서류, 검사증명서 같은 서류는 서명이 필요합니다."},{"id":"63-2-16","r":63,"s":"무역결제","n":16,"q":"화환신용장의 조건은 다음과 같다. 화환신용장에서 요구한 원산지증명서에 대한 설명 중 잘못된 것은?\n\nForm of Documentary Credit: IRREVOCABLE\nDocuments Required:\n+ COMMERCIAL INVOICE\n+ OCEAN BILL OF LADING MADE OUT TO ORDER OF ISSUING BANK\n+ PACKING LIST\n+ CERTIFICATE OF ORIGIN","c":["원산지증명서는 서명되어야 한다.","원산지증명서의 수하인을 개설의뢰인으로 기재해도 된다.","상공회의소에서 발행한 원산지증명서만 수리된다.","원산지증명서는 수출업자나 송하인이 수익자가 아닌 경우 복수의 서류에서 상이한송장번호, 송장일자 및 선적경로로 표기될 수 있다."],"a":3,"t":"ISBP, eUCP","e":"신용장에 원산지증명서 발행자가 정해져 있지 않으면 수익자를 포함한 누구든 발행할 수 있어요(ISBP). 상공회의소 발행본만 받는다고 한 ③이 틀렸습니다."},{"id":"63-2-17","r":63,"s":"무역결제","n":17,"q":"보증신용장(Standby L/C)과 은행보증서(Demand Guarantee)에 대한 설명으로 잘못된 것은?","c":["양자는 기본계약과는 별개인 독립성의 원칙이 적용되어 독립된 지급 의무를 진다.","보증신용장은 외형상 신용장 형식을 따르며, 관련 국제규칙으로 ISP 98과 UCP 600이적용된다.","은행보증서는 보증서 형식으로 발행되며, 관련 국제규칙으로 URDG 758이 적용된다.","실무에서 보증신용장은 주로 호주계 은행이 발행하고, 은행보증서는 주로 아시아계 은행이 선호한다."],"a":4,"t":"보증(ISP98, URDG)","e":"보증신용장은 은행 보증서 발행이 제한됐던 미국계 은행이 주로 쓰고, 은행보증서(Demand Guarantee)는 유럽계 은행이 많이 써요. ④의 지역 설명이 틀렸습니다."},{"id":"63-2-18","r":63,"s":"무역결제","n":18,"q":"수출팩토링에 대한 설명으로 적절하지 않은 것은?","c":["수출팩토링은 수출팩터의 신용을 바탕으로 이루어지는 신용장거래로서, 수출팩터가 수입상의 신용에 따라 수출채권 매입 여부를 결정한다.","한국에서 상환청구권 없는(without recourse) 팩토링을 취급하는 실적은 한국수출입은행이 가장 많다.","수출팩토링은 수출자가 수출채권을 금융기관에 매각하여 자금을 조기에 회수하는 방식이다.","팩토링 수수료는 수출자가 부담하고, 수출자는 수수료를 수출 원가에 반영한다."],"a":1,"t":"무역금융, 팩토링","e":"팩토링은 신용장 없이 외상으로 수출한 채권을 팩터에게 파는 방식이에요. 신용장 거래가 아니고, 수입팩터가 수입자 신용을 보고 지급을 보증하는 구조라 ①이 틀렸습니다."},{"id":"63-2-19","r":63,"s":"무역결제","n":19,"q":"결제의 위험도 차원에서 일반적으로 결제방식과 시기가 수입자에게 유리한 순으로 나열된 것은?\n\nA. COD(Cash on Delivery)\nB. Payment in advance by T/T\nC. D/A(Documents against Acceptance)\nD. O/A(Open Account)\nE. At sight L/C","c":["B → D → A → C → E","E → C → D → A → B","D → A → C → E → B","A → B → E → C → D"],"a":3,"t":"송금, 기타 결제","e":"수입자에게는 대금을 늦게, 물품을 확인한 뒤 낼수록 유리해요. 외상인 O/A가 가장 유리하고, 물품 인도 때 내는 COD, 인수만 하고 만기에 내는 D/A, 일람불 신용장, 선지급 순서입니다."},{"id":"63-2-20","r":63,"s":"무역결제","n":20,"q":"다음 각 상황에서 위험관리에 활용할 수 있는 수단의 연결이 가장 부적절한 것은?","c":["수입자의 상품 입수 관련 위험관리 → 선적전 검사(Pre-shipment Inspection)","수출자의 선적불이행 관련 위험관리 → Performance Bond","수입자의 선지급 관련 위험관리 → Revolving credit","수출자의 외상 수출(O/A 30 days) 대금회수 관련 위험관리 → 무역보험"],"a":3,"t":"보증(ISP98, URDG)","e":"수입자가 선지급한 돈을 지키는 수단은 선수금환급보증(Advance Payment Bond)이에요. Revolving credit은 일정 금액이 자동으로 다시 쓸 수 있게 되는 회전신용장이라 맞지 않아요."},{"id":"63-2-21","r":63,"s":"무역결제","n":21,"q":"다음 상황에 대한 해설로 가장 적절한 것은?\n\nA. ㈜한국무역은 라오스에 소재하는 제조기업과 임가공을 위한 계약을 체결하였다.\nB. 임가공에 필요한 핵심 부품을 국내에서 구매하여 원상태로 라오스로 수출했다.\nC. 임가공에 필요한 원자재를 중국에서 구매하여 라오스에서 납품받았다.\nD. 가공된 완성품을 라오스에서 미국에 소재하는 기업에 판매하였다.","c":["B – 국내 구매를 위해 내국신용장을 이용하면 부가세 영세율을 적용받을 수 있다.","C – 원자재 수입용 신용장의 수익자와 요구서류인 송장의 화주가 다르면 하자 서류가 된다.","D - 완성품을 라오스에서 미국으로 직접 운송하면 수출실적을 인정받을 수 없다.","D – 미국기업과의 거래에 신용장을 사용한다면, 신용장에 “stale B/L acceptable”이라는 조건을 포함시켜야 한다."],"a":1,"t":"무역금융, 팩토링","e":"수출용 물품을 국내에서 살 때 내국신용장이나 구매확인서를 쓰면 부가가치세 영세율을 적용받을 수 있어요."},{"id":"63-2-22","r":63,"s":"무역결제","n":22,"q":"각 보기 중 밑줄 친 당사자가 수출입거래의 위험을 회피하기 위해 취한 방안으로 가장 부적절한 것은?","c":["선지급 조건을 피하는 수입자에게 수출자는 선급금 환수용 보증서 제공을 조건으로선지급 조건을 수용하도록 협상한다.","COD조건 대신에 신용장 결제를 요구하는 수출자에게 수입자는 수출자가 발행한 선적전 검사증명서를 신용장 조건에 포함하여 수출자의 사기 가능성을 억제한다.","기계류 수입 거래에서 수출자에게 수입자는 하자담보를 위해 ISP 98이 적용되는 warranty standby L/C를 요구한다.","CAD조건을 요구하는 수출자에게 수입자는 COD 30days 조건으로 변경을 요구한다."],"a":2,"t":"송금, 기타 결제","e":"수출자 스스로 발행한 검사증명서는 수출자 사기를 막는 장치가 되지 못해요. 사기를 막으려면 수입자가 지정한 제3의 검사기관이 발행한 증명서를 요구해야 합니다."},{"id":"63-2-23","r":63,"s":"무역결제","n":23,"q":"외국환은행 대고객 매매율에서 당발송금, 타발추심, 수입신용장 결제 등의 거래에 적용되는 환율은?","c":["T/T selling rate","Cash selling rate","T/T buying rate","T/C buying rate"],"a":1,"t":"외환, 환율","e":"당발송금, 수입결제처럼 은행이 고객에게 외화를 파는 거래에는 전신환매도율(T/T selling rate)을 적용해요."},{"id":"63-2-24","r":63,"s":"무역결제","n":24,"q":"다음 중 통화선물(Currency Futures)거래에 대한 설명으로 잘못된 것은?","c":["헤지 목적의 거래보다는 차익을 노리는 투기 목적의 거래가 훨씬 많다.","특정한 거래소 장내에서 다수 대 다수의 거래가 이루어진다.","납부해야 할 증거금은 참가자의 신용도에 따라 차등 적용된다.","원활한 거래 체결을 위하여 거래단위(계약) 규모와 결제일이 표준화되어 있다."],"a":3,"t":"외환, 환율","e":"통화선물 증거금은 거래소가 정한 기준으로 참가자 신용도와 관계없이 똑같이 적용돼요. 신용도에 따라 차등한다는 ③이 틀렸습니다."},{"id":"63-2-25","r":63,"s":"무역결제","n":25,"q":"다음은 현재 외환시장의 상황을 나타낸 것이다. 이때 USD/KRW 통화옵션의 프리미엄에 대한 설명으로 옳지 않은 것은? (환율 표시에서 앞의 통화가 기준통화)\n\nUSD/KRW 현물환율: 1,350원\n만기 3개월 선물환율: 1,349원\n만기 3개월 옵션 내재 변동성: 15%\n만기 3개월 행사가 1,345원 달러 풋옵션 프리미엄: 달러당 10원","c":["행사가 1,345원인 달러 풋옵션은 외가격(Out-of-the-money) 옵션이다.","행사가 1,345원인 달러 풋옵션의 시간가치는 4원이다.","USD/KRW 현물환율이 1,340원으로 하락하면, 행사가 1,345원인 달러 풋옵션의 프리미엄은 증가한다.","만기 3개월 옵션의 내재변동성이 20%로 상승하면 행사가 1,345원인 달러 풋옵션의프리미엄은 증가한다."],"a":2,"t":"외환, 환율","e":"행사가 1,345원 풋옵션은 현재 환율(1,350원)보다 행사가가 낮아 외가격이고 내재가치가 0이에요. 그래서 프리미엄 10원 전부가 시간가치이고, 4원이라고 한 ②가 틀렸습니다."},{"id":"63-2-26","r":63,"s":"무역결제","n":26,"q":"다음과 같은 언론 뉴스가 전해졌을 때, 외환시장에 미치는 영향과 가장 거리가 먼 것은? (환율표시에서 앞의 통화가 기준통화)\n\n∙ 미국의 중앙은행(FRB)은 금리 인하를 예상하던 시장의 기대와는 정반대로 기존 2.5%였던 달러의 기준 금리를 1.0% 포인트나 인상하기로 하여 금융시장에 큰 충격을 안겼다.\n∙ 반면, 한국은행은 원화 기준 금리를 5% 수준으로 유지하기로 하였고, 일본도 엔화 기준 금리는 변동이 없다고 발표했다.","c":["USD/KRW 현물환율이 상승한다.","우리나라에 투자되었던 달러 자금이 미국으로 유출된다.","USD/KRW 선물환율에서 스왑 포인트가 증가한다.","미 달러에 대한 일본 엔화의 가치가 평가절하된다."],"a":3,"t":"외환, 환율","e":"스왑포인트는 두 통화의 금리 차이로 정해져요. 원화 금리가 달러보다 높은 상황에서 달러 금리가 오르면 금리 차이가 줄어 USD/KRW 스왑포인트는 오히려 작아지므로 ③이 거리가 멉니다."},{"id":"63-2-27","r":63,"s":"무역결제","n":27,"q":"수출상품을 선적할 당시(회계상 거래 인식 시점)의 환율이 1,400원/달러였고, 이후 수출대금을 수취하여 원화로 환전할 당시의 환율이 1,360원/달러였다. 이 경우 발생하는 환리스크는 어떤 것인가?","c":["환리스크가 없다.","환산 환리스크가 있다.","영업 환리스크가 있다.","거래 환리스크가 있다."],"a":4,"t":"외환, 환율","e":"이미 계약해서 거래가 인식된 외화 채권을 나중에 원화로 바꿀 때 환율이 달라져 생기는 손익은 거래 환리스크예요."},{"id":"63-2-28","r":63,"s":"무역결제","n":28,"q":"B기업은 금일 외화예금 잔고는 5백만 달러이고, 내일 2백만 달러 수입결제가 예정되어있다. 이 경우에 B기업의 환리스크 크기는 얼마인가?","c":["환리스크 없음","2백만 달러 숏 포지션","3백만 달러 롱 포지션","5백만 달러 롱 포지션"],"a":3,"t":"외환, 환율","e":"외화 자산 500만 달러에서 내일 나갈 200만 달러를 빼면 300만 달러가 남아요. 외화 자산이 부채보다 많으니 300만 달러 롱 포지션입니다."},{"id":"63-2-29","r":63,"s":"무역결제","n":29,"q":"선물환거래와 한국거래소에서 거래되는 미국달러 선물의 상품명세 및 그 활용 등에 대한 다음 설명 중 잘못된 것은?","c":["두 거래를 활용하는 기업은 거래하는 방법 등에서는 차이가 있지만 거의 같은 헤지결과를 달성할 수 있다.","한국거래소에서 거래되는 미국달러 선물의 거래단위는 USD 100,000이다.","미국달러 선물을 활용하는 경우 증거금을 적립해야 하므로 신용도가 우수한 기업들은주로 선물환거래를 많이 활용한다.","은행이 대고객 선물환거래를 하기 이전에 그 거래가 실수요와 관련됨을 확인하여야한다."],"a":2,"t":"외환, 환율","e":"한국거래소 미국달러선물의 거래단위는 USD 10,000이에요. USD 100,000이라고 한 ②가 틀렸습니다."},{"id":"63-2-30","r":63,"s":"무역결제","n":30,"q":"숏 포지션이 있는 A기업이 헤지 목적으로 향후 달러/원 환율이 큰 폭으로 상승할 것으로 예상하면서 비용은 옵션 프리미엄 수준으로 제한하려고 할 때, 선물환거래의 대안이될 수 있는 옵션 전략은 무엇인가?","c":["콜옵션 매입","콜옵션 매도","풋옵션 매입","풋옵션 매도"],"a":1,"t":"외환, 환율","e":"숏 포지션은 앞으로 달러를 내야 하는 상태라 환율 상승이 위험이에요. 달러 콜옵션을 사면 환율이 올라도 행사가로 살 수 있고, 손실은 프리미엄으로 한정됩니다."},{"id":"63-3-1","r":63,"s":"무역계약","n":1,"q":"무역계약에 대한 설명으로 잘못된 것은?","c":["무역계약은 국제물품매매계약으로서 매도인 관점에서는 수출계약이다.","무역계약은 당사자가 서로 다른 국가에 영업소를 두고 체결하는 국제계약이다.","무역계약은 클레임 예방을 고려해 매도인과 매수인이 서면으로 체결해야만 유효하다.","무역계약의 특수성은 매매계약 이행을 위해 제3자와의 종속계약이 수반된다는 점이다."],"a":3,"t":"무역계약 일반","e":"무역계약은 형식에 구애받지 않는 불요식계약이에요. CISG 제11조도 계약이 서면으로 체결될 필요가 없다고 정하고 있어서 ③이 틀렸습니다."},{"id":"63-3-2","r":63,"s":"무역계약","n":2,"q":"무역계약의 해석 순서와 관련하여 (A)와 (B)에 들어갈 내용으로 올바른 것은?\n\n∙ 국제무역계약 체결에서 거래조건을 모두 명시하는 것은 현실적으로 불가능하다.\n∙ 계약서에서 약정한 조건 외에도 공백이 존재할 수 있으므로, 이를 보완하기 위해 국제적으로 인정된 ( A )이 적용된다.\n∙ 그러나 ( A )으로도 계약의 모든 공백을 메우는 것은 불가능하기 때문에 명시적 또는 묵시적으로 정해지지 않은 부분의 해석을 위해 당사자 간에 합의한 ( B )을 기준으로 해석하는 것이 일반적이다.","c":["(A) 정형거래조건 / (B) 중재조항","(A) 중재조항 / (B) 거래관습","(A) 거래관습 / (B) 정형거래조건 조항","(A) 거래관습 / (B) 준거법"],"a":4,"t":"무역계약 일반","e":"계약서에 없는 부분은 먼저 국제적으로 인정된 거래관습으로 채우고, 그래도 남는 부분은 당사자가 합의한 준거법(Governing Law)으로 해석해요."},{"id":"63-3-3","r":63,"s":"무역계약","n":3,"q":"다음 조건으로 체결되는 무역계약의 법적 특성을 모두 고른 것은?\n\n1. 물품: 3D 프린터용 소프트웨어\n2. 수량: 1EA\n3. 가격: USD 100,000.00\n4. 결제: T/T WITHIN 30 DAYS AFTER THE DATE OF PROFORMA INVOICE\n5. 인도: - 방식: 매수인의 이메일주소로 파일(소프트웨어)을 첨부하여 전송\n   - 기한: 2025년 이내, 정확한 기한은 추후 구두 합의\n6. 별도의 계약서 없이 상기 조건이 기재된 매도인의 ‘PROFORMA INVOICE’를 계약서로 대체하기로 구두 합의\n\nA. 유상계약   B. 편무계약   C. 낙성계약\nD. 요물계약   E. 불요식계약   F. 쌍무계약","c":["A, C","B, D, E","A, C, E, F","B, C, D, E, F"],"a":3,"t":"거래조건(품질, 수량, 선적)","e":"대가를 주고받으니 유상계약, 양쪽이 서로 의무를 지니 쌍무계약, 합의만으로 성립하니 낙성계약, 구두 합의로도 되니 불요식계약이에요. 편무계약과 요물계약은 해당하지 않습니다."},{"id":"63-3-4","r":63,"s":"무역계약","n":4,"q":"Incoterms 2020의 조건들을 기준에 따라 분류한 것이 옳은 것만으로 짝지어진 것은?\n\nA. 해상 및 내수로 운송 방식에만 사용되는 조건 : FAS, FOB, CFR, CIF\nB. 매도인이 주운임(main freight)을 부담하는 조건 : EXW, FCA, FAS, DAP, DPU, DDP\nC. 위험의 분기점과 비용의 분기점이 다른 조건 : CFR, CIF, CPT, CIP\nD. 적출지(수출지)의 지명이 표기되어야 하는 조건 : EXW, FCA, FAS, FOB\nE. 매도인이 도착지에서 물품을 양하(unloading)할 의무가 있는 조건 : DAP, DDP","c":["A, B, C","A, C, D","B, D, E","C, D, E"],"a":2,"t":"인코텀즈","e":"주운임을 매도인이 내는 건 C와 D 조건이라 EXW, FCA, FAS가 들어간 B가 틀렸고, 도착지 양하 의무는 DPU에만 있어서 E도 틀렸어요. A, C, D는 맞습니다."},{"id":"63-3-5","r":63,"s":"무역계약","n":5,"q":"컨테이너운송의 경우에 Incoterms 2020 사용 등에 관한 설명으로 잘못된 것은?","c":["컨테이너를 이용한 운송의 경우에는 절대 FOB 조건을 사용할 수 없다.","컨테이너를 이용한 운송의 경우에는 매도인이 물품을 본선에 인도하는 것이 곤란하므로, CY 또는 CFS에서 운송인에게 인도하는 것이 편리하다.","컨테이너를 이용한 운송의 경우에는 FCA, CPT, CIP 조건 사용을 권장한다.","매도인의 위험 이전은 FCA 조건이 FOB 조건보다 먼저 발생한다."],"a":1,"t":"인코텀즈","e":"컨테이너 운송에는 FOB 대신 FCA를 쓰라고 '권고'할 뿐 사용을 금지하지는 않아요. '절대 사용할 수 없다'고 한 ①이 틀렸습니다."},{"id":"63-3-6","r":63,"s":"무역계약","n":6,"q":"다음 중 Incoterms 2020의 조건 중에서 보험계약을 체결하는 자와 사고 발생 시 보험금을 받는 자가 다른 조건만으로 연결된 것은?","c":["FOB – CFR","FCA – CPT","CIF - CIP","EXW – DDP"],"a":3,"t":"인코텀즈","e":"CIF와 CIP는 매도인이 보험계약을 맺지만, 위험이 선적지에서 매수인에게 넘어가므로 운송 중 사고의 보험금은 매수인이 받아요."},{"id":"63-3-7","r":63,"s":"무역계약","n":7,"q":"Incoterms 2020과 CISG의 관계에 관한 설명으로 잘못된 것은?","c":["Incoterms 2020은 매매계약 당사자의 권리와 의무에 중점을 두고, CISG는 매매계약 당사자의 계약위반에 대한 권리구제에 중점을 두고 있으므로 상호 독립적 관계에 있다.","Incoterms 2020은 법률이 아닌 관습이지만, 유엔협약인 CISG보다 우선할 수 있다.","계약의 성립에 관해서는 CISG가 Incoterms 2020에 우선한다.","Incoterms 2020이 물품의 인도에 관하여 CISG보다 구체적 규정을 두고 있다."],"a":1,"t":"인코텀즈","e":"인코텀즈는 인도, 위험, 비용을 정하고 CISG는 계약 성립과 위반 구제 등을 정해서 서로 보완하는 관계예요. '상호 독립적'이라고 한 ①이 틀렸습니다. 당사자가 인코텀즈를 채택하면 그 부분에서는 CISG보다 우선해요."},{"id":"63-3-8","r":63,"s":"무역계약","n":8,"q":"계약의 성립 시기에 대해 CISG와 UNIDROIT 국제상사계약원칙을 가장 잘 설명한 것은?","c":["CISG는 승낙이 도달한 시점, UNIDROIT는 발송한 시점을 기준으로 계약이 성립한다.","CISG는 승낙이 발송한 시점, UNIDROIT는 도달한 시점을 기준으로 계약이 성립한다.","CISG와 UNIDROIT는 모두 승낙이 도달한 시점을 기준으로 계약이 성립한다.","CISG와 UNIDROIT는 모두 승낙이 발송한 시점을 기준으로 계약이 성립한다."],"a":3,"t":"CISG","e":"CISG(제18조 2항)와 UNIDROIT 원칙 모두 승낙이 청약자에게 도달한 때 계약이 성립하는 도달주의를 따라요."},{"id":"63-3-9","r":63,"s":"무역계약","n":9,"q":"계약에 적용되는 규칙으로서 UNIDROIT 국제상사계약원칙에 관한 설명으로 잘못된 것은?","c":["계약에서 지정된 법의 일반원칙이나 상인법 등을 구현하는 규범으로서 UNIDROIT의적용이 가능하다.","당사자에 의한 준거법의 선택이 없는 경우에 UNIDROIT의 적용이 가능하다.","국내법을 해석하고 보충하는 수단으로는 UNIDROIT를 적용할 수 없다.","국제적 통일법 문서를 해석하고 보충하는 수단으로서 UNIDROIT의 적용이 가능하다."],"a":3,"t":"CISG","e":"UNIDROIT 원칙은 국제 통일법뿐 아니라 국내법을 해석하고 보충하는 데에도 쓸 수 있다고 서문에서 밝히고 있어요. 그래서 ③이 틀렸습니다."},{"id":"63-3-10","r":63,"s":"무역계약","n":10,"q":"국제 상거래 계약에서 일반적으로 인정되는 계약의 기본원칙 중에서 잘못된 것은?","c":["계약자유의 원칙(Freedom of Contract): 당사자는 서로 합의하여 계약의 형식, 내용 등을 자유롭게 정할 수 있다.","계약 준수의 원칙(Pacta sunt servanda): 체결된 계약은 반드시 이행되어야 한다.","신의성실의 원칙(Principle of Good Faith): 계약의 해석과 이행에서 상대방의 이익을합리적으로 고려하면서 성실하게 행동해야 한다.","작성자 유리의 원칙(Contra Proferentem Rule): 계약서나 문서의 내용이 모호할 경우에는 문서 작성자 입장을 고려하여 유리하게 해석한다."],"a":4,"t":"무역계약 일반","e":"Contra Proferentem은 '작성자 불이익 원칙'이에요. 문서가 모호하면 작성한 쪽에 불리하게 해석합니다."},{"id":"63-3-11","r":63,"s":"무역계약","n":11,"q":"다음 ( )안에 들어갈 조건부 청약으로 올바르게 짝지어진 것은?\n\n∙ ( A )은 매수 희망자의 승낙이 도착했을 때 물품이 판매되지 않고 재고가 있는경우에만 계약이 성립된다는 것을 조건으로 하는 청약이다.\n∙ ( B )은 오퍼와 함께 현품을 보내서 상대방이 사용해 보아 만족할 것을 조건으로하는 청약이다.\n∙ ( C )은 발행되어도 구속력이 없어 상대방이 승낙하더라도 계약이 성립되지 않고, 다시 청약자의 최종 수락이 있어야만 계약이 성립되는 청약이다.\n\n(A)           (B)             (C)","c":["최종확인조건부청약 / 승인조건부청약 / 선착순판매조건부청약","최종확인조건부청약 / 선착순판매조건부청약 / 승인조건부청약","선착순판매조건부청약 / 최종확인조건부청약 / 승인조건부청약","선착순판매조건부청약 / 승인조건부청약 / 최종확인조건부청약"],"a":4,"t":"청약과 승낙","e":"재고가 남아 있을 때만 성립하는 건 선착순판매조건부청약, 현품을 써보고 만족하면 성립하는 건 승인조건부청약(Sale on Approval), 청약자의 최종 확인이 있어야 성립하는 건 최종확인조건부청약이에요."},{"id":"63-3-12","r":63,"s":"무역계약","n":12,"q":"BWT(보세구역 인도조건)에 관한 다음 설명 중 잘못된 것은?","c":["수출자는 자신의 책임하에 수입국 내의 관리인을 지정하고 물품을 수입국 내 보세창고에 반입시킨다.","물품은 수출국에서 유환(有換)으로 반출된 후, 수입국 현지에서 물품 구매 계약이 체결되어 판매된다.","거래선을 발굴하여 매매계약이 성립되기 전까지는 수입자가 정해지지 않은 상태에서거래가 진행된다.","보세구역 내에서 판매되지 않은 물품은 반송이 가능하다."],"a":2,"t":"특수거래 형태","e":"BWT는 수출자가 대금을 받지 않은 채 무환으로 물품을 수입국 보세창고에 보내 두고 현지에서 판매하는 방식이에요. '유환으로 반출'한 ②가 틀렸습니다."},{"id":"63-3-13","r":63,"s":"무역계약","n":13,"q":"국제비즈니스 계약으로서 대리점계약과 판매점계약에 대한 설명으로 잘못된 것은?","c":["기업은 해외 진출을 위한 수출의 한 형태로 국제판매점계약과 국제대리점계약을 고려할 수 있다.","국제판매점은 본인으로부터 수수료를 취하고, 국제대리점은 매매차익을 취하는 방식이라는 점에서 차이가 존재한다.","국제대리점은 외국의 본인(수출상) 명의로 계약을 체결하면서 대리인 역할을 한다.","국제판매점은 외국의 본인(수출상)으로부터 물품을 구매하여 자신의 이름으로 제3자에게 판매한다."],"a":2,"t":"특수거래 형태","e":"판매점(Distributor)은 물품을 사서 자기 이름으로 되팔아 매매차익을 얻고, 대리점(Agent)은 본인 이름으로 계약을 중개하고 수수료를 받아요. ②는 두 개념을 바꿔 썼습니다."},{"id":"63-3-14","r":63,"s":"무역계약","n":14,"q":"다음 ( )안에 들어갈 품질조건이 올바르게 짝지어진 것은?\n\n∙ ( A ): 주로 농수산물의 선물매매에 이용되는 조건으로, 선적 시 선적 장소에서당해 계절의 상품들의 ( A ) 품질로 간주된다.\n∙ ( B ): 목재, 냉동 어류 등의 거래에 이용되는 조건으로, 견본 이용이 곤란하거나외관상 제품 내부의 품질을 알 수 없는 물품에 주로 사용된다.\n∙ ( C ): 주로 원사 거래에 이용되는 조건으로, 공인검사기관 또는 공인표준기준에의하여 ( C ) 품질을 표준품으로 결정하는 조건이다.\n\n(A)            (B)              (C)","c":["판매적격품질조건 / 평균중등품질조건 / 보통품질조건","판매적격품질조건 / 보통품질조건 / 평균중등품질조건","평균중등품질조건 / 판매적격품질조건 / 보통품질조건","평균중등품질조건 / 보통품질조건 / 판매적격품질조건"],"a":3,"t":"거래조건(품질, 수량, 선적)","e":"농산물 선물매매는 평균중등품질(FAQ), 목재나 냉동어류처럼 내부를 볼 수 없는 물품은 판매적격품질(GMQ), 원사처럼 공인기준으로 정하는 건 보통품질(USQ)이에요."},{"id":"63-3-15","r":63,"s":"무역계약","n":15,"q":"무역계약의 수량조건 및 선적조건에 관한 다음 설명 중 잘못된 것은?","c":["신용장방식에서 살물(bulk cargo)은 명시적인 과부족용인약관이 없더라도 5%의 과부족이 허용된다.","송금, 추심방식은 과부족이 발생할 수 있는 물품에 대해 수출자가 계약서에 과부족용인 조항을 명시하지 않고 과부족이 발생하는 경우 계약위반이 될 수 있다.","컨테이너 복합운송의 경우에는 일반적으로 Berth Term이 적용되므로 화주가 선적·양하의 비용을 모두 부담해야 한다.","신용장방식에서 선적일의 증명은 운송서류에 발행일만 있는 경우는 발행일, 선적일이별도로 있는 경우는 선적일을 기준으로 한다."],"a":3,"t":"거래조건(품질, 수량, 선적)","e":"Berth Term(Liner Term)은 선적과 양하 비용을 선주(운송인)가 운임에 포함해 부담하는 조건이에요. 화주가 모두 부담한다고 한 ③이 틀렸습니다."},{"id":"63-3-16","r":63,"s":"무역계약","n":16,"q":"무역계약에서 포장조건(Terms of Packing)을 정할 때 고려해야 할 요소가 아닌 것은?","c":["포장비용 부담의 주체","수출입 국가의 운송 및 포장재에 대한 규제사항","FCL 또는 LCL cargo에 따른 화인의 표시 방법","물품 가격 등 수입자의 관세와 내국세 신고에 필요한 사항"],"a":4,"t":"거래조건(품질, 수량, 선적)","e":"포장조건은 포장 방법, 비용 부담, 화인, 포장재 규제처럼 물품을 안전하게 운송하는 데 필요한 사항을 정해요. 수입자의 관세, 내국세 신고 사항은 포장조건과 관계가 없습니다."},{"id":"63-3-17","r":63,"s":"무역계약","n":17,"q":"무역계약의 선적조건(Terms of Shipment)에 관한 설명으로 올바른 것은?","c":["신용장 거래에서 선적이 시급하면 immediate shipment, prompt shipment, as soon as possible shipment 등 즉시선적조건을 약정하는 것이 좋다.","신용장에 환적을 금지하는 규정이 있다면, 환적 예정 선하증권은 물품이 선하증권에의해 트레일러 또는 컨테이너선에 선적되었음이 증명되는 경우라도 절대 수리될 수없다.","선적지연의 원인이 매도인이 통제할 수 없는 불가항력이라면 매도인이 면책된다. 그러나 매매계약에서 불가항력 사유, 면책사항이 포함한 불가항력조항을 설정하여 두는것이 권장된다.","신용장에서 선적 기간을 정할 때 사용되는 to, until, from, between 등의 전치사는 언급된 일자 및 일자들을 제외한다."],"a":3,"t":"거래조건(품질, 수량, 선적)","e":"불가항력으로 선적이 늦어지면 매도인은 면책되지만, 분쟁을 막으려면 계약서에 불가항력 조항을 두는 게 좋아요. UCP600은 immediately, prompt 같은 표현을 무시하고(①), 환적 금지라도 컨테이너 선적이 증명되면 환적 예정 B/L을 수리하며(②), to, until, from, between은 해당 일자를 포함합니다(④)."},{"id":"63-3-18","r":63,"s":"무역계약","n":18,"q":"개별 계약서의 이면사항이나 포괄계약서의 한 조항으로 약정하는 「Hardship Clause」에 대하여 잘 설명하고 있는 것은?","c":["이 조항은 제조되고 판매된 물품이 소비자나 제3자의 신체 또는 재산에 손상과 손해를 끼쳤을 경우 제조자, 무역업자, 유통업자, 원자재 생산자 등에게 배상책임을 물을수 있는 책임에 대하여 매도인과 매수인이 약정하는 내용이다.","이 조항에 단순히 “Act of God”만을 기재한다면, 홍수나 지진과 같은 자연재해는 포함되지만, 파업이나 원자재의 부족 등은 포함되지 않는 것으로 해석될 수 있다.","이 조항은 계약체결 시에 예상치 못했던 경제적 또는 기타 사정의 변경으로 인해 계약대로의 이행이 심히 곤란해져 계약의 본질적 변경이 불가피해진 경우를 대비하는것이다.","이 조항은 본 계약서가 당사자의 합의를 전부 표시하고 있는 유일한 합의서이며, 그이외의 내용은 인정할 수 없다는 내용이다."],"a":3,"t":"계약 조항","e":"Hardship Clause(사정변경 조항)는 계약 당시 예상하지 못한 경제적 사정 변화로 이행이 몹시 어려워질 때 재협상 등을 정해 두는 조항이에요. ①은 제조물책임, ②는 불가항력, ④는 완전합의 조항 설명입니다."},{"id":"63-3-19","r":63,"s":"무역계약","n":19,"q":"매도인의 계약위반에 따른 매수인의 구제 수단에 관한 설명으로 잘못된 것은?","c":["계약해제권은 매도인이 계약을 근본적이고 본질적으로 위반한 경우에 행사할 수 있\n다.","하자보완청구권은 물품에 계약과 일치하지 않는 하자가 있는 경우, 그 보완을 매수인이 청구할 수 있는 권리이다.","대체품인도청구권은 부적합 물품의 하자 통지와 함께 합리적인 기간 내에 대체품의인도를 청구할 수 있는 권리이다.","물품명세확정권은 물품이 계약과 일치하지 않는 경우, 매수인이 물품의 명세를 스스로 확정할 수 있는 권리이다."],"a":4,"t":"CISG","e":"물품명세확정권은 매수인이 정해야 할 물품 명세(형태, 크기 등)를 정하지 않을 때 '매도인'이 스스로 명세를 정할 수 있는 권리예요(CISG 제65조). 매수인의 구제수단이 아니라서 ④가 틀렸습니다."},{"id":"63-3-20","r":63,"s":"무역계약","n":20,"q":"다음 중 소송과 중재에 대한 설명으로 올바른 것은?","c":["소송은 당사자가 처분할 수 있는 사법의 분쟁만을 대상으로 한다.","소송은 중재에 비해 비용이 상대적으로 저렴하고 강제집행면에서 유리하다.","중재는 복잡한 절차와 삼심제도를 특징으로 하므로 소송에 비해 오래 걸린다.","중재는 비공개주의를 원칙으로 하므로, 기업 또는 개인의 비밀이 보장되어 소송에비해 대외신용도의 침해 우려가 적다."],"a":4,"t":"클레임, 중재","e":"중재는 비공개가 원칙이라 영업비밀과 대외 신용을 지키기 좋아요. 당사자가 처분할 수 있는 사법상 분쟁을 대상으로 하는 건 중재이고, 중재는 단심제라 소송보다 빠르고 비용도 적게 듭니다."},{"id":"63-3-21","r":63,"s":"무역계약","n":21,"q":"무역계약에 관한 설명으로 올바른 것은?","c":["계약의 주요 내용을 포함하고 있는 견적송장(Proforma Invoice)은 청약의 유인이기때문에 이에 대한 승낙만으로는 절대 계약이 성립되지 않는다.","수입자 입장에서는 무역계약의 선적일은 무조건 빠를수록 유리하다.","클레임 제기기간은 당사자 간에 약정이 있으면 해당 기간 안에 제기하면 되지만, CISG에서는 약정이 없는 경우에도 제척기간 2년을 넘길 수 없다.","중재판정은 법원의 확정판결과 동일한 효력을 지니며, 뉴욕협약을 통해 모든 국가에서 외국중재판정의 승인 및 집행을 보장받는다."],"a":3,"t":"CISG","e":"CISG 제39조 2항에 따라 매수인이 물품을 실제로 인도받은 날부터 2년 안에 불일치를 통지하지 않으면 권리를 잃어요. 견적송장도 확정적이면 청약이 될 수 있고(①), 뉴욕협약은 가입국 사이에서만 집행을 보장합니다(④)."},{"id":"63-3-22","r":63,"s":"무역계약","n":22,"q":"다음이 설명하는 국제 민간 무역기관은?\n\nA. Incoterms, UCP 등 다양한 국제무역규칙을 제정ㆍ개정한다.\nB. 국제중재법원을 운영하고, 국제중재규칙을 통해 상거래 분쟁을 해결한다.\nC. 무역에 사용하는 분야별 국제표준계약서를 제공한다.\nD. 국제기업 행동강령 등을 통해 지속 가능한 무역환경을 조성한다.\nE. 무역실무 관련 교육과 자료를 출판ㆍ보급한다.","c":["국제무역센터 (ITC: International Trade Centre)","세계무역기구 (WTO: World Trade Organization)","국제상업회의소 (ICC: International Chamber of Commerce)","국제무역법위원회 (UNCITRAL: UN Commission on International Trade Law)"],"a":3,"t":"클레임, 중재","e":"인코텀즈와 UCP를 만들고 국제중재법원을 운영하는 민간기관은 국제상업회의소(ICC)예요."},{"id":"63-3-23","r":63,"s":"무역계약","n":23,"q":"무역계약에서 주계약과 종속계약에 관한 설명으로 잘못된 것은?","c":["CIP 조건은 수출자가 반드시 적하보험을 부보해야 하므로, 제시되는 가격에는 보험료가 포함되어야 한다.","대표적인 종속계약인 운송계약, 보험계약, 결제계약을 체결하는 당사자는 반드시 Incoterms 조건에 따라 결정된다.","무역계약의 이행을 위한 종속계약으로서, 운송계약과 보험계약은 물품인도를 위해, 결제계약은 대금지급을 위해 체결된다.","수출자가 운임 또는 보험료를 할인 등으로 저렴하게 이용할 수 있는 경우, Incoterms의 F-조건보다는 C-조건을 활용하는 것이 가격 경쟁력 차원에서 유리할수 있다."],"a":2,"t":"인코텀즈","e":"인코텀즈는 운송계약과 보험계약을 누가 맺는지는 정하지만 결제(대금지급) 방법이나 그 당사자는 다루지 않아요. 그래서 '결제계약 당사자도 인코텀즈로 정해진다'고 한 ②가 틀렸습니다."},{"id":"63-3-24","r":63,"s":"무역계약","n":24,"q":"다음 지문에서 설명하는 복합운송의 경로는 무엇인가?\n\n아시아 국가의 항만에서 파나마운하를 경유하여 북미 동해안 항구(예: 뉴욕항)까지 해상운송하고, 그곳에서 철도로 환적하여 내륙의 주요 지점까지 운송하는 방식이다.","c":["MLB(Mini-Land Bridge)","IPI(Interior Point Intermodal)","OCP(Overland Common Point)","RIPI(Reversed Interior Point Intermodal)"],"a":4,"t":"해상운송","e":"파나마운하를 지나 북미 동해안 항구까지 바다로 간 뒤 철도로 내륙까지 가는 경로는 RIPI(역내륙지점복합운송)예요. IPI는 서해안 항구에서 내륙으로 가는 경로입니다."},{"id":"63-3-25","r":63,"s":"무역계약","n":25,"q":"다음 중 정기선 컨테이너 화물의 부대비용에 관한 설명으로 잘못된 것은?","c":["Demurrage : 항해용선계약에서 허용된 정박기간을 초과한 일수에 대해 용선자가 선주에게 지불하기로 약정한 금액","Terminal Handling Charge : 수출화물은 컨테이너가 CY에 입고된 순간부터 본선의 선측까지, 수입화물은 본선의 선측에서 CY 게이트를 통과하기까지 화물의 이동에 수반되는 비용","Detention Charge : 화주가 컨테이너 또는 트레일러를 대여받은 후 정해진 시간(free time) 내에 반환하지 못할 경우 운송인에게 지불해야 하는 벌금 성격의 비용","CFS Charge : CFS에서 LCL화물의 혼재, 적입, 적출, 분류작업에 수반되는 비용"],"a":1,"t":"해상운송","e":"정기선 컨테이너 화물에서 Demurrage는 CY에서 무료 장치기간(free time)을 넘겨 컨테이너를 반출하지 않을 때 내는 비용이에요. ①은 항해용선계약의 체선료 설명이라 이 문항 기준으로 틀렸습니다."},{"id":"63-3-26","r":63,"s":"무역계약","n":26,"q":"무역운송 인프라 설명 중 잘못된 내용인 것은?","c":["컨테이너선은 초창기에 정기항로에 취항할 일반화물선을 전용선으로 했으므로 선형에의한 분류, 하역 장비 장착에 의한 분류, 하역방식에 의한 분류 등으로 구분한다.","항만은 해륙 운송의 중계지로 육상 운송된 화물의 원활한 선적과 양하를 위한 시설을갖추고 산업활동이 이루어지고 있는 장소를 의미한다.","내륙컨테이너기지는 항만 또는 공항이 아닌 내륙기지로서 컨테이너 집화, 통관, 컨테이너 수리, 화물주선, 재고관리, 포장, 내륙운송 등의 업무를 처리할 수 있다.","공항은 항공기 운항의 중심지로서 여객과 화물의 기지로 운영되고 있으며, 항공화물터미널의 하역 장비에는 Gantry Crane, Transporter, Dolly, Rich Stacker, Straddle Carrier 등이 있다."],"a":4,"t":"해상운송","e":"Gantry Crane, Straddle Carrier, Reach Stacker, Transporter는 항만 컨테이너 터미널의 하역 장비예요. 항공화물터미널 장비로 든 ④가 틀렸습니다. Dolly는 항공화물 장비입니다."},{"id":"63-3-27","r":63,"s":"무역계약","n":27,"q":"피보험자의 의무 내용에 대한 설명 중에서 올바른 내용들로 짝지어진 것은?\n\nA. 고지의무는 보험계약을 체결하기 위한 교섭 중 또는 계약 성립 이전에 이행되어야한다.\nB. 고지의무의 이행은 보험계약자가 관련 서류를 보험자에게 직접 제출하는 형태로만이루어진다.\nC. 보험사고의 위험을 감소시키는 사항은 고지하지 않아도 고지의무 위반이 되지 않는\n다.\nD. 워런티를 위반하면, 보험자는 그 시점부터 보상책임을 면하게 된다.\nE. 보험증권 원본을 갖고 있으면 보험료를 지불한 것으로 인정되어 무조건 보상을 받을 수 있다.","c":["A, B, D","A, D. E","A, B, C","A, C, D"],"a":4,"t":"해상보험","e":"고지의무는 계약 성립 전에 이행하고, 위험을 줄이는 사항은 고지하지 않아도 되며, 워런티 위반 시 보험자는 그때부터 책임을 면해요. 고지는 서류 제출 방식으로만 하는 게 아니고(B), 증권이 있다고 무조건 보상받는 것도 아닙니다(E)."},{"id":"63-3-28","r":63,"s":"무역계약","n":28,"q":"보험 클레임의 처리에 관한 내용 중에서 올바르지 않은 것은?","c":["화물에 손해가 발생하였을 때는 지체 없이 손상 화물의 양하지 또는 그 인접 지역의보험사 본지점 또는 대리점에 통지하여 손해 사정 절차를 받는 것이 필요하다.","피보험자는 현실적으로 발생한 혹은 발생할 화물의 손해를 방지, 경감할 의무가 있다.","피보험자가 취해야 할 조치 중에 사고에 대한 책임이 있는 당사자에게 손해배상청구권의 보전 및 행사가 있다.","손해통지의무와 손해방지의무, 구상권 보전의무는 공동해손이 발생한 경우에만 행하는피보험자의 보험클레임 처리 행위이다."],"a":4,"t":"해상보험","e":"손해통지, 손해방지, 구상권 보전 의무는 공동해손뿐 아니라 보험사고로 손해가 생기면 언제나 피보험자가 이행해야 해요."},{"id":"63-3-29","r":63,"s":"무역계약","n":29,"q":"2009년 협회적하약관(ICC 2009) 운송약관 상 보험자의 책임이 개시되는 시점으로 올바른 것은?","c":["보험목적물이 운송의 개시를 위해 보험증권 상 명시된 장소의 창고 혹은 보관장소를떠날 때","보험목적물이 운송의 개시를 위해 보험증권 상 명시된 장소의 창고 혹은 보관장소에서 운송수단에 적재된 때","보험목적물이 운송의 개시를 위해 운송차량 혹은 운송용구에 적재할 목적으로 보험증권 상 명시된 장소의 창고 혹은 보관장소에서 처음 이동할 때","보험목적물이 선박에 적재된 때"],"a":3,"t":"해상보험","e":"ICC 2009 운송약관은 보험목적물이 운송 개시를 위해 운송수단에 바로 싣기 위한 목적으로 창고나 보관장소에서 처음 움직일 때 보험이 시작된다고 정해요. 1982년 약관의 '창고를 떠날 때'보다 앞당겨졌습니다."},{"id":"63-3-30","r":63,"s":"무역계약","n":30,"q":"다음 중 해상손해의 보상에 관한 설명으로 올바른 것은?","c":["구조료(salvage charge)는 구조계약과 관계없이 임의로 구조한 자에게 구조의 성공 여부와 관계없이 지급된다.","손해방지비용은 물적손해 등에 대한 보상액과 손해방지 비용의 합계가 보험금액을 초과하는 경우에도 보상한다.","특별비용은 단독해손에 포함된다.","추정전손이 있는 경우 현실전손과 같이 전손에 해당하는 보험금을 청구하기 위해서는보험목적물을 보험자에게 대위하여야 한다."],"a":2,"t":"해상보험","e":"손해방지비용은 다른 손해 보상액과 합쳐 보험금액을 넘더라도 보상해요. 구조료는 구조가 성공해야 지급하고(①), 특별비용은 단독해손과 구별되며(③), 추정전손으로 전손 보험금을 받으려면 '위부'를 해야 합니다(④)."},{"id":"63-4-1","r":63,"s":"무역영어","n":1,"q":"다음은 어떤 청약(offer)에 해당하는가?\n\nRegarding your e-mail of June 20, 2025, please be informed that we are not in a position to accept your offer of silk handkerchiefs under the terms you proposed. It is likely that we will be able to procure the same product at a significantly lower price through another channel. We would appreciate it if you could consider revising your quotation, as we are keen to continue doing business with you.","c":["Firm offer","Original offer","Free offer","Counter offer"],"a":4,"t":"서신 내용 파악","e":"제시된 조건으로는 받아들일 수 없으니 견적을 다시 내 달라는 내용이라, 원청약을 거절하고 조건을 바꿔 제안하는 반대청약(Counter offer)이에요."},{"id":"63-4-2","r":63,"s":"무역영어","n":2,"q":"서신의 내용상 밑줄 친 (A)에 들어갈 적절한 문장은?","c":["This article is no longer manufactured because it has become outdated.","We will make every effort to fill your order so that the goods will be shipped in time.","As our factory is at present fully occupied with orders, we regret to decline your order.","We are sorry that we have not been able to serve you this time, but as soon as conditions return to normal, we will contact you."],"a":1,"t":"빈칸, 표현 바꾸기","e":"C59 대신 새로 나온 C60을 권하는 흐름이니, C59가 구형이라 더 이상 생산되지 않는다는 ①이 자연스러워요.","p":{"range":"2~3","text":"Dear James,\n  Thank you for your order of September 1 for 20 units of Portable Radio Set\nA102, 10 units of Cassette Tape Recorder B84, and 10 units of Microphone C59.\n  We have Portable Radio Set A102 and Cassette Tape Recorder B84 in stock,\nunfortunately Microphone C59 is out of stock.        (A)                         .\n  Our new model C60 has recently been launched, and we are seeing wide\npopularity. We would like you to consider this model instead of C59.\n  The other two items will be shipped to you as soon as possible.\n  Your prompt reply by email regarding C60 would be appreciated.\nYours very truly,"}},{"id":"63-4-3","r":63,"s":"무역영어","n":3,"q":"위 서신의 표제로 적절하지 않은 것은?","c":["Response to Order","Recommendation of a Substitute","Decline of Order","Confirmation of Contract"],"a":4,"t":"서신 내용 파악","e":"주문에 대한 답장, 대체품 추천, 일부 주문 거절 내용은 있지만 계약을 확정하는 내용은 없어요.","p":{"range":"2~3","text":"Dear James,\n  Thank you for your order of September 1 for 20 units of Portable Radio Set\nA102, 10 units of Cassette Tape Recorder B84, and 10 units of Microphone C59.\n  We have Portable Radio Set A102 and Cassette Tape Recorder B84 in stock,\nunfortunately Microphone C59 is out of stock.        (A)                         .\n  Our new model C60 has recently been launched, and we are seeing wide\npopularity. We would like you to consider this model instead of C59.\n  The other two items will be shipped to you as soon as possible.\n  Your prompt reply by email regarding C60 would be appreciated.\nYours very truly,"}},{"id":"63-4-4","r":63,"s":"무역영어","n":4,"q":"위 서신의 밑줄 친 부분을 대체하기에 가장 적절한 것은?","c":["we would like to make an offer subject to the availability of stock when the order is made","we are pleased to offer you the goods below, subject to market fluctuation","it is our pleasure to make an offer that is valid","we are making an offer on sale or return"],"a":3,"t":"빈칸, 표현 바꾸기","e":"7월 말까지 회신이 오는 조건으로 하는 청약은 유효기간을 정한 확정청약(Firm offer)이에요. 그래서 '유효한 청약'이라는 ③이 가장 가까워요. ①은 재고 조건부, ②는 시황 변동 조건부, ④는 반품 허용 조건부 청약입니다.","p":{"range":"4~5","text":"Dear Sirs,\nWe thank you for your inquiry of April 12, 2025, and we take much pleasure in\noffering you the following, subject to your reply received at the end of July 2025.\n ∙ Commodity : Blueberry Powder\n ∙ Quantity    : 10,000 KG\n ∙ Price       : USD 25.00/kg CIP New York, USA\n ∙ Shipment    : Within 30 days after receipt of your L/C\n ∙ Payment     : Confirmed L/C at sight in our favor\nWe look forwarding to furthering our partnership.\nVery truly yours,"},"u":["subject to your reply received at the end of July 2025"]},{"id":"63-4-5","r":63,"s":"무역영어","n":5,"q":"다음 중 위 서신의 내용에 대한 설명으로 잘못된 것은?","c":["USD 25.00/kg includes costs for transportation and insurance to New York, USA.","A sight draft will be drawn to the issuing bank for payment under the L/C.","This is a firm offer proposing terms and conditions, which are effective until July 31, 2025.","The shipment will be made within 30 days after payment is made under the L/C."],"a":4,"t":"서신 내용 파악","e":"선적은 신용장을 받은 뒤 30일 이내(within 30 days after receipt of your L/C)예요. 대금 지급 후 30일이라고 한 ④가 틀렸습니다.","p":{"range":"4~5","text":"Dear Sirs,\nWe thank you for your inquiry of April 12, 2025, and we take much pleasure in\noffering you the following, subject to your reply received at the end of July 2025.\n ∙ Commodity : Blueberry Powder\n ∙ Quantity    : 10,000 KG\n ∙ Price       : USD 25.00/kg CIP New York, USA\n ∙ Shipment    : Within 30 days after receipt of your L/C\n ∙ Payment     : Confirmed L/C at sight in our favor\nWe look forwarding to furthering our partnership.\nVery truly yours,"}},{"id":"63-4-6","r":63,"s":"무역영어","n":6,"q":"국제물품매매계약에 관한 UN 협약(CISG 1980)상 아래 예시의 밑줄 친 (A)에 들어갈 청약의 효력 소멸 사유는?\n\nOn May 1, Seller delivered to Buyer an offer that stated: “I will hold this offer open until June 1.” On May 7, Buyer delivered to Seller the following: “I cannot accept your offer since the price is too high,” but on May 10, Buyer delivered to Seller the following: “I hereby accept your offer of May 1.” Seller immediately informed Buyer that this “acceptance” was not effective because of the earlier ( A ). Buyer replied that this was not true because Seller has promised to hold the offer open until June 1.","c":["Withdrawal","Validity","Rejection","Revocation"],"a":3,"t":"인코텀즈, CISG 영문","e":"CISG 제17조에 따라 청약은 취소불능 청약이라도 거절 통지가 청약자에게 도달하면 효력을 잃어요. 5월 7일의 거절(Rejection)로 청약이 소멸했습니다."},{"id":"63-4-7","r":63,"s":"무역영어","n":7,"q":"다음은 국제물품매매계약에 관한 UN 협약(CISG 1980)의 일부이다. 공란 (A), (B), (C)에 들어가기에 가장 적절한 내용으로 짝지어진 것은?\n\nThe Convention governs only the ( A ) of the contract of sale and the rights and obligations of the seller and the buyer arising from such a contract. In particular, except as otherwise expressly provided in this Convention, it is not concerned with:\n(i) the ( B ) of the contract or of any of its provisions or of any usage;\n(ii) the ( C ) which the contract may have on the property in the goods sold.","c":["effect / application / validity","validity / formation / effect","conclusion / formation / validity","formation / validity / effect"],"a":4,"t":"인코텀즈, CISG 영문","e":"CISG 제4조는 계약의 성립(formation)과 당사자의 권리의무만 다루고, 계약의 유효성(validity)과 소유권에 미치는 효과(effect)는 다루지 않는다고 정해요."},{"id":"63-4-8","r":63,"s":"무역영어","n":8,"q":"Incoterms 2020의 DPU 규칙에서 매도인의 의무가 아닌 것은?","c":["The seller must enter into relevant contracts of carriage with the various carriers up to the named place.","The seller must pay for unloading charges at the place of destination.","The seller must bear import duty and taxes.","The seller must bear the cost of delivery up to the agreed destination."],"a":3,"t":"인코텀즈, CISG 영문","e":"DPU에서 매도인은 목적지까지 운송계약, 비용, 양하까지 부담하지만 수입관세와 세금은 매수인이 내요. 수입통관까지 매도인이 하는 건 DDP뿐입니다."},{"id":"63-4-9","r":63,"s":"무역영어","n":9,"q":"다음 서신의 내용으로 유추할 수 있는 매매계약 내용으로 잘못된 것은?\n\nDear Sirs, On behalf of our customer, we would like to request a freight quotation for collection from Yangsan ICD, Korea and delivery to Auckland port, the arriving port. Our goods are: ∙ 20 dressing table assembly kits, packed in wooden boxes ∙ 20 stool chairs, W31xD31xH46 (cm) The dressing table assembly kits and stool chairs are protected against knocks by wooden boxes and the invoice value of the goods is USD 5,000. The freight will be paid by our customer once the goods are delivered at the arriving port.\n\nVery truly yours,","c":["FCA term may be used in a contract between the seller and the buyer.","The seller fulfills his/her delivery obligation when the goods are handed over to the carrier at Yangsan ICD.","The seller will procure an insurance to Auckland port.","The costs for transportation to Yangsan ICD are included in USD 5,000."],"a":3,"t":"인코텀즈, CISG 영문","e":"양산 ICD에서 운송인에게 넘기고 운임은 도착 후 고객(매수인)이 내니 FCA가 맞아요. FCA에서 매도인은 보험을 들 의무가 없어서 ③이 틀렸습니다."},{"id":"63-4-10","r":63,"s":"무역영어","n":10,"q":"다음은 계약서 내용의 일부이다. 어떤 조항의 내용인가?\n\nShould the opening of the letter of credit be delayed due to reasons for which the Buyer is responsible, the Buyer shall pay to the Seller an amount equivalent to three-tenths of one percent (0.3%) of the contract value.","c":["Liquidated damage clause","Entire agreement clause","Non-waiver clause","Frustration clause"],"a":1,"t":"계약, 클레임 영문","e":"매수인 책임으로 신용장 개설이 늦어지면 계약금액의 0.3%를 내도록 미리 정한 건 손해배상액 예정 조항(Liquidated damage clause)이에요."},{"id":"63-4-11","r":63,"s":"무역영어","n":11,"q":"다음은 무역계약서 내용의 일부이다. 조건에 대한 일반적인 설명으로 잘못된 것은?\n\n∙ Description: Duster (Model No.ASE-23)\n∙ Quantity    : 2,000 pieces\n∙ Price       : USD 12.00/pcs CIP New York (subject to Incoterms 2020)\n∙ Shipment : within 30 days after an order\n∙ Payment     : By an irrevocable L/C at sight (subject to UCP 600)","c":["A negotiable bill of lading marked freight prepaid should be issued.","A usance bill of exchange should be drawn on the buyer.","The seller has a contractual obligation to procure insurance with maximum coverage to New York.","The risk of the goods will be transferred when the goods are handed over to the first carrier."],"a":2,"t":"신용장, UCP 영문","e":"일람불 신용장(L/C at sight)이므로 환어음은 기한부가 아닌 일람불로, 매수인이 아닌 개설은행을 지급인으로 발행해요. 그래서 ②가 틀렸습니다. CIP는 ICC(A) 수준이라 ③은 맞아요."},{"id":"63-4-12","r":63,"s":"무역영어","n":12,"q":"다음은 무역계약서의 일부이다. 계약서의 내용으로 틀린 것은?\n\nThis Agreement shall become effective on the date it is signed by both parties and shall remain in force for a period of three (3) years. No later than six (6) months prior to the expiration of this term, the parties shall engage in discussions regarding the renewal of the Agreement. If both parties mutually agree to renew, the Agreement shall be extended for an additional three (3) years, either under the same terms and conditions or as amended by mutual consent. If no agreement on renewal is reached, this Agreement shall automatically terminate upon the conclusion of the initial three (3) year period.","c":["This contract becomes effective from when both parties sign the contract.","This contract may be extended if both parties agree to do so six months before the contract terminates.","The terms and conditions of this contract may be revised upon its renewal for an additional three-year period.","In the absence of an agreement to the contrary, this contract will be renewed for another three years."],"a":4,"t":"계약, 클레임 영문","e":"갱신에 합의하지 못하면 최초 3년이 끝날 때 자동으로 종료된다고 했어요. 합의가 없으면 3년 연장된다는 ④가 틀렸습니다."},{"id":"63-4-13","r":63,"s":"무역영어","n":13,"q":"위 신용장에 대한 설명으로 잘못된 것은?","c":["This is an irrevocable and negotiable letter of credit and allows partial shipments.","The seller may choose a shipping port in Korea.","The seller could not invoice for USD 4,000,000 under this L/C.","The seller is responsible for arranging the vessel and paying the freight."],"a":3,"t":"신용장, UCP 영문","e":"39A 과부족 허용률이 10/10이라 USD 3,800,000의 110%인 4,180,000까지 청구할 수 있어요. 그래서 4,000,000을 청구할 수 없다는 ③이 틀렸습니다.","p":{"range":"13~14","text":"40A: FORM OF DOCUMENTARY CREDIT:              IRREVOCABLE\n31D: DATE AND PLACE OF EXPIRY: 15 SEP 2025 KOREA\n50: APPLICANT: SIAM TINPLATE CO., LTD.\n59: BENEFICIARY: POSCO INTERNATIONAL CO., LTD.\n32B: CURRENCY CODE, AMOUNT: USD 3,800,000\n39A: PERCENTAGE CREDIT AMOUNT TOLERANCE: 10/10\n41A: AVAILABLE WITH...BY...: ANY BANK BY NEGOTIATION\n43P: PARTIAL SHIPMENTS: ALLOWED\n44A: PLACE OF TAKING IN CHARGE / RECEIPT：ANY PORT OF KOREA\n44B: PLACE OF FINAL DESTINATION: LAEM CHABANG , THAILAND\n44C: LATEST DATE OF SHIPMENT: 30 AUG 2025\n45B: DESCRIPTION OF GOODS AND/OR SERVICES\n     BLACK PLATE FOR TIN PLATE\n     CFR LAEM CHABANG, THAILAND.\n46A: DOCUMENTS REQUIRED\n    +SIGNED COMMERCIAL INVOICE IN 3 COPIES\n    +FULL SET (3/3) ORIGINAL CLEAN ON BOARD OCEAN BILLS OF LADING\n     MADE OUT TO ORDER OF KITA BANK, MARKED 'FREIGHT PREPAID'\n     AND NOTIFY APPLICANT\n    +PACKING LIST IN 3 COPIES\n    +CERTIFICATE OF ORIGIN ISSUED BY CHAMBER OF COMMERCE"}},{"id":"63-4-14","r":63,"s":"무역영어","n":14,"q":"위 신용장 조건에 따라 수익자가 제시한 서류 중 수리 가능한 서류제시에 해당하는 것은?","c":["Commercial invoices and certificate of origin, both issued by the seller","A Bill of Lading stating that the freight is prepaid to Laem Chabang, Thailand","A Bill of Lading stating the consignee is Siam Tinplate Co., Ltd., and the consignor is POSCO INTERNATIONAL CO., LTD","A Bill of Lading issued on September 12th, 2025, at Busan, Korea"],"a":2,"t":"신용장, UCP 영문","e":"CFR 조건과 FREIGHT PREPAID 요구에 맞는 ②만 수리됩니다. 원산지증명서는 상공회의소 발행이어야 하고(①), B/L은 KITA BANK 지시식이어야 하며(③), 최종선적일 8월 30일이 지난 9월 12일 B/L은 안 돼요(④).","p":{"range":"13~14","text":"40A: FORM OF DOCUMENTARY CREDIT:              IRREVOCABLE\n31D: DATE AND PLACE OF EXPIRY: 15 SEP 2025 KOREA\n50: APPLICANT: SIAM TINPLATE CO., LTD.\n59: BENEFICIARY: POSCO INTERNATIONAL CO., LTD.\n32B: CURRENCY CODE, AMOUNT: USD 3,800,000\n39A: PERCENTAGE CREDIT AMOUNT TOLERANCE: 10/10\n41A: AVAILABLE WITH...BY...: ANY BANK BY NEGOTIATION\n43P: PARTIAL SHIPMENTS: ALLOWED\n44A: PLACE OF TAKING IN CHARGE / RECEIPT：ANY PORT OF KOREA\n44B: PLACE OF FINAL DESTINATION: LAEM CHABANG , THAILAND\n44C: LATEST DATE OF SHIPMENT: 30 AUG 2025\n45B: DESCRIPTION OF GOODS AND/OR SERVICES\n     BLACK PLATE FOR TIN PLATE\n     CFR LAEM CHABANG, THAILAND.\n46A: DOCUMENTS REQUIRED\n    +SIGNED COMMERCIAL INVOICE IN 3 COPIES\n    +FULL SET (3/3) ORIGINAL CLEAN ON BOARD OCEAN BILLS OF LADING\n     MADE OUT TO ORDER OF KITA BANK, MARKED 'FREIGHT PREPAID'\n     AND NOTIFY APPLICANT\n    +PACKING LIST IN 3 COPIES\n    +CERTIFICATE OF ORIGIN ISSUED BY CHAMBER OF COMMERCE"}},{"id":"63-4-15","r":63,"s":"무역영어","n":15,"q":"다음은 어떤 신용장에 대한 설명인가?\n\nThis credit refers to a credit instrument, that is issued or drawn without requiring any supporting documents other than the financial document itself, like bill of exchange. Therefore, under this credit, no shipping documents are attached because it is not conditioned upon the presentation of any documents proving shipment or delivery.","c":["Back-to-back credit","Red clause credit","Revolving credit","Clean credit"],"a":4,"t":"신용장, UCP 영문","e":"환어음 같은 금융서류만으로 청구하고 선적서류를 요구하지 않는 신용장은 무화환신용장(Clean credit)이에요."},{"id":"63-4-16","r":63,"s":"무역영어","n":16,"q":"매입신용장 하에서 발행이 되는 환어음의 밑줄 친 부분(A~D)에 해당하는 당사자가 올바르게 짝지어진 것은?\n\nAT XXXXX SIGHT OF THE FIRST BILL OF EXCHANGE (SECOND OF THE SAME\nTENOR AND DATE BEING UNPAID) PAY TO (A)                       OR ORDER THE SUM\nOF US DOLLARS FIFTY EIGHT THOUSAND SEVEN HUNDREDS ONLY VALUE\nRECEIVED AND CHARGE THE SAME TO ACCOUNT OF (B)                    DRAWN UNDER\nBANK OF AMERICA, SEATTLE, U.S. L/C NO.: LC-8935-23-100 DATED 2025.04.03. TO: (C)\n\n(D)\nG.D.HONG, President\n\n(A)              (B)                  (C)              (D)","c":["issuing bank / buyer / negotiating bank / seller","confirming bank / seller / issuing bank / buyer","negotiating bank / buyer / issuing bank / seller","paying bank / seller / negotiating bank / buyer"],"a":3,"t":"신용장, UCP 영문","e":"매입신용장의 환어음은 매입은행에 지급하라(PAY TO)고 쓰고, 개설의뢰인(매수인) 계정으로 처리하며, 지급인(TO)은 개설은행, 발행인(서명)은 수익자인 매도인이에요."},{"id":"63-4-17","r":63,"s":"무역영어","n":17,"q":"다음 서신의 내용상 계약 당사자 간에 합의한 결제방식은?\n\nWe are pleased to inform you that the order(No.ABZ-12) has been loaded onto the MV Arirang, which sails tomorrow and is due in Jakarta on 3 May, 2025. The shipping documents have been handed over to Seoul Bank with our draft drawn on you for USD 300,000.00 at 90 days after sight. Seoul Bank will forward the documents to HSBC, who may advise you for collection by next week. Also, we have sent the certificate of test that you asked for. However, we wonder if this is for reselling purposes. We should point out that your customers would only be covered by the warranty provided that the goods are not modified in any way.","c":["L/C (Letter of Credit)","D/P (Documents against Payment)","D/A (Documents against Acceptance)","T/T (Telegraphic Transfer)"],"a":3,"t":"서신 내용 파악","e":"서류를 은행에 넘기며 '일람 후 90일 출급' 환어음을 발행했고 추심(collection)으로 보낸다고 했으니, 인수하면 서류를 내주는 D/A예요."},{"id":"63-4-18","r":63,"s":"무역영어","n":18,"q":"다음 서신의 내용상 공란 (A)에 들어갈 가장 적절한 용어는?\n\nDear Mr. Smith,\n\nUpon receiving your letter dated on September 18, which enclosed Invoice No.W-562, I was surprised to find that you had included a draft for USD\n23,600.00 requesting my       (A)   to clear my account with you.\nIn all our previous transactions, I have consistently settled my accounts promptly via banker’s draft, and at no point have you raised any objections to this payment method. Therefore, I see no reason to change the system that has worked well for both of us. Unless there are specific reasons for this change, I regret to inform you that I cannot accept your draft. Accordingly, I am returning it with this letter. Unless I hear otherwise from you, I will assume that you agree to continue with our previous arrangement, and I will settle the outstanding amount punctually by banker’s draft when payment is due at the end of next month.\n\nSincerely,","c":["endorsement","collection","acceptance","acknowledgment"],"a":3,"t":"빈칸, 표현 바꾸기","e":"매도인이 기한부 환어음을 보내며 '인수(acceptance)'를 요청한 상황이에요. 매수인은 원래대로 은행수표로 내겠다며 어음을 돌려보냈습니다."},{"id":"63-4-19","r":63,"s":"무역영어","n":19,"q":"다음 공란 (A)와 (B)에 들어갈 적절한 서류끼리 연결된 것은?\n\nA ( A ) is a document which evidences a contract of carriage by sea and the taking over or loading of the goods by the carrier, and by which the carrier undertakes to deliver the goods against surrender of the documents. A ( B ) is a document commonly used in international trade to allow a carrier to release goods to the consignee who is not yet in possession of the original ( A ). A ( B ) assures the carrier that he/she will not suffer from any financial loss by having released the goods to a consignee in the absence of the ( A ).\n\nA                                      B","c":["Letter of Guarantee / Seaway Bill","Bill of Lading / Letter of Guarantee","Bill of Lading / Letter of Indemnity","Seaway Bill / Bill of Lading"],"a":2,"t":"운송 영문","e":"(A)는 운송계약을 증명하고 제시와 상환으로 물품을 내주는 선하증권(Bill of Lading), (B)는 원본 B/L 없이 물품을 받을 때 운송인 손실을 보증하는 수입화물선취보증서(Letter of Guarantee)예요."},{"id":"63-4-20","r":63,"s":"무역영어","n":20,"q":"다음의 컨테이너 운송 관련 비용에 대한 설명 중 옳은 내용만 고른 것은?\n\nA. Bunker Adjustment Factor is a surcharge to cover fluctuations in the price of currency.\nB. Heavy Lift Surcharge is a surcharge fee imposed for cargo that exceeds weight limitations.\nC. Wharfage is the fee charged for the use of the wharf facilities.\nD. CFS Charge is a fee for consolidation, deconsolidation, and other activities performed in a container freight station, and it is particularly charged for full container load shipments.\nE. Terminal Handling Charges are the fees charged for the storage and positioning of containers in the port area.\nF. Detention Charges are fees levied against shippers for holding onto a container for less than the agreed free time.","c":["A, B, C","A, B, D","B, C, E","C, E, F"],"a":3,"t":"운송 영문","e":"BAF는 환율이 아니라 유류비 변동 할증료(A 틀림), CFS Charge는 LCL 화물에 붙고(D 틀림), Detention은 free time을 '넘겨서' 컨테이너를 쓸 때 내요(F 틀림). B, C, E가 맞습니다."},{"id":"63-4-21","r":63,"s":"무역영어","n":21,"q":"다음은 영국해상보험법(MIA)의 보험계약 성립에 관한 내용의 일부이다. 공란 (A)에 들어갈 올바른 용어는?\n\nA contract of marine insurance is deemed to be concluded when the proposal of\nthe assured is accepted by the (      A   ), whether the policy be then issued or not;\nand, for the purpose of showing when the proposal was accepted, reference may be made to the slip or covering note or other customary of the contract.","c":["insurer","policy holder","insured","agent"],"a":1,"t":"보험 영문","e":"MIA 제21조: 해상보험계약은 피보험자의 청약을 보험자(insurer)가 승낙한 때 성립해요. 보험증권 발행 여부와는 관계없습니다."},{"id":"63-4-22","r":63,"s":"무역영어","n":22,"q":"위 서신의 목적으로 가장 적절한 것은 무엇인가?","c":["To acknowledge its carelessness and propose to dispatch substitute items","To apologize for improper packaging and offer a refund for damaged goods","To let the recipient know that he/she is responsible for the damaged shipment","To explain who is responsible for breakage in transit and what action will be taken"],"a":4,"t":"서신 내용 파악","e":"포장은 평소대로 했고 FOB 조건이라 운송 중 파손은 책임이 없다고 설명하면서, 대신 보험사와 협의하겠다는 내용이에요.","p":{"range":"22~23","text":"Dear Mark,\n We're very sorry to hear that one of the glassware cases from your invoice dated\nthe 10th of this month arrived broken.\n Since we packed the goods in our usual way, we believe the damage was\ncaused by rough handling from the shipping company. Also, because the goods\nwere sold on FOB Busan, we are not responsible for this breakage in transit.\n Nonetheless, we will immediately contact ABC Marine Insurance Co., Inc. to\nnegotiate a resolution on your behalf.\nYours truly,"}},{"id":"63-4-23","r":63,"s":"무역영어","n":23,"q":"위 서신 이전에 매수인이 송부한 서신의 내용으로 적절하지 않은 것은?","c":["As these goods are unusable, we are formally lodging a claim for this breakage.","We received the recent order for glassware today, and regret to inform you that upon inspection, we discovered significant breakage in one of the cases.","We regretfully inform you that the goods ordered on July 20 have not been delivered to us.","We have attached photographs of the damaged items and the packaging for your review."],"a":3,"t":"서신 내용 파악","e":"앞선 매수인 서신은 유리제품 파손을 알리고 클레임을 제기하는 내용이어야 해요. 물품이 아예 도착하지 않았다는 ③은 맞지 않습니다.","p":{"range":"22~23","text":"Dear Mark,\n We're very sorry to hear that one of the glassware cases from your invoice dated\nthe 10th of this month arrived broken.\n Since we packed the goods in our usual way, we believe the damage was\ncaused by rough handling from the shipping company. Also, because the goods\nwere sold on FOB Busan, we are not responsible for this breakage in transit.\n Nonetheless, we will immediately contact ABC Marine Insurance Co., Inc. to\nnegotiate a resolution on your behalf.\nYours truly,"}},{"id":"63-4-24","r":63,"s":"무역영어","n":24,"q":"위 서신에 대한 내용으로 잘못된 것은?","c":["The price list enclosed quotes prices on a CIF basis for any order of less than 3,000 sets.","It specifies that the selling prices include insurance to the port of arrival.","It is an introductory letter sent by a seller to a potential new client.","The seller become aware of the recipient's interest in Korean electronic goods through Mr. Kim Sung-Kon."],"a":1,"t":"서신 내용 파악","e":"가격표는 최소 3,000세트 주문 기준 CIF 가격이에요. 3,000세트 미만 주문 기준이라고 한 ①이 틀렸습니다.","p":{"range":"24~25","text":"Dear Andrew,\n We are very pleased to learn from our friend, Mr. Kim Sung-Kon, who recently\nreturned from your city, that you are highly interested in Korean electronic goods.\nAs Mr. Kim may have already informed you, we maintain strong business\nrelationships   with   several   leading    manufacturers       in     Korea    and     enjoy     a\nwell-established reputation for exporting our products to European markets.\n Our   enclosed    catalog   provides      an   overview   of    our       product    lines.    The\naccompanying price list quotes prices on a CIF European port basis for a\nminimum order of 3,000 sets. However,                                (A)                 .\nRegarding payment, our company policy require all transactions to be conducted\nvia an irrevocable Letter of Credit (L/C).\nYours truly,"}},{"id":"63-4-25","r":63,"s":"무역영어","n":25,"q":"위 서신의 밑줄 친 (A)에 들어갈 적절한 문장은?","c":["could you please send us one sample of model HD-0023?","we are prepared to offer an 8% discount on your initial trial order.","we would be grateful if you could offer special discounts for bulk orders or long-term partnerships.","we accept payment via direct bank transfer for your convenience."],"a":2,"t":"빈칸, 표현 바꾸기","e":"최소 주문량 조건 뒤에 However가 이어지니 첫 시험주문에 할인을 주겠다는 ②가 자연스러워요. ③은 매도인이 아니라 매수인이 할 말이고, ④는 신용장만 받는다는 뒤 문장과 충돌합니다.","p":{"ran
