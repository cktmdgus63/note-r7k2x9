is our intention to entrust you with the bulk of our\nbusiness, and we have decided to make a (         B    ) at USD 5.50 per piece.\n  We hope you will take advantage of this chance so that you will benefit from\nthe expanding market here. We look forward to your prompt reply.\nVery truly yours."}},{"id":"65-4-26","r":65,"s":"무역영어","n":26,"q":"다음 서신에서 밑줄 친 (A) ~ (D) 중 문맥상 어색한 것은?\n\nDear James,\n\nWe are writing to inquire about the invoice for the product provided.\n(A) Although we have double-checked our email records, we have not yet received an invoice from you. We are wondering if it might have been missed or not yet sent. (B) We would like to remind you that your payment is currently overdue and interest will be charged. (C) Please note that we will be away on holiday starting next week. Therefore, we would appreciate it if you could send us the invoice before next week so that we can process the payment. (D) We will arrange for immediate payment upon receipt of your invoice. Please kindly send the invoice as a PDF attachment to this email. We look forward to your prompt reply.\n\nSincerely,","c":["(A)","(B)","(C)","(D)"],"a":2,"t":"서신 흐름, 문장 배열","e":"송장을 아직 받지 못해서 보내 달라는 매수인의 서신인데, (B)는 '대금이 연체됐고 이자가 붙는다'는 매도인 쪽 독촉 문장이라 어색해요."},{"id":"65-4-27","r":65,"s":"무역영어","n":27,"q":"다음 서신의 내용을 논리 전개에 따라 가장 잘 나열한 것은?\n\nDear James,\n\n(A) However, upon checking the contents against our purchase order, we found that the shipment contained only 300 printers, whereas our original order called for 400 units.\n(B) We are confirming that the goods regarding our Order No. 225 have just been delivered. We were initially impressed by your speedy response and delivery.\n(C) Your prompt action to rectify this error would be highly appreciated. We would like to receive the balance of our order soon.\n(D) Therefore, I would be grateful if you could look into this matter immediately and arrange for the dispatch of the remaining 100 units without delay.","c":["(B)-(A)-(D)-(C)","(B)-(D)-(A)-(C)","(C)-(B)-(D)-(A)","(C)-(D)-(B)-(A)"],"a":1,"t":"서신 흐름, 문장 배열","e":"물품이 도착했다(B), 그런데 400대 중 300대만 왔다(A), 나머지 100대를 바로 보내 달라(D), 빠른 조치를 부탁한다(C) 순서예요."},{"id":"65-4-28","r":65,"s":"무역영어","n":28,"q":"다음 중 주어진 문장을 영작한 것 중 잘못된 것은?","c":["귀사의 주문품을 9월 10일자 ‘SS. Ocean’호에 선적했음을 알려드립니다. ⇒ We are pleased to advise you that your order has been shipped on board ‘SS. Ocean’ on September 10.","대금 결제는 송장일로부터 30일 이내에 전신환으로 송금해 주시기 바랍니다. ⇒ Please settle the payment by T/T remittance within 30 days from the invoice date.","운송서류가 분실되지 않도록 특급 우편으로 발송해 주십시오. ⇒ Please forward the shipping documents by courier service to avoid any loss during transit.","당사는 오늘 귀사를 지급인으로 하여 미화 10,000달러의 환어음을 발행했습니다. ⇒ We have drawn a draft in favor of you today for the amount of USD 10,000."],"a":4,"t":"영작","e":"'귀사를 지급인으로' 환어음을 발행했다면 drawn on you라고 써야 해요. in favor of you는 귀사를 '수취인'으로 한다는 뜻이라 의미가 달라집니다."},{"id":"65-4-29","r":65,"s":"무역영어","n":29,"q":"위 이 메일의 제목으로 가장 적절한 것은?","c":["Internal Department Transfer Notice","Appointment of New Executive Employee","Urgent Notice Regarding Employee Termination","Enforcement of New Marketing Policy"],"a":2,"t":"서신 내용 파악","e":"새 마케팅 이사(Marketing Director) 선임을 알리는 공지라 '신임 임원 선임'이 제목으로 맞아요.","p":{"range":"29~30","text":" I am pleased to announce the addition of Ms. Yeona Han to Air Products Korea\nin the position of Marketing Director effective 1 April. Ms. Han brings with her\nover     18   years   of    F&B     industry   experience,        including        6     years    in\nResearch/QC/Planning       with   Korea   Chemical   and     12     years     in       global    F&B\ncompanies, most recently as sales and marketing manager at Rohm and Hass\nKorea.\n Ms. Han’s extensive knowledge of the F&B industry will be very valuable in\nexpanding our future business. Ms. Han will be primarily responsible for strategic\nplanning, new product development, profitability, pricing and sales training. Ms. Han\nhas a chemical engineering degree from Daehan University, Korea."}},{"id":"65-4-30","r":65,"s":"무역영어","n":30,"q":"위 이 메일 내용에 대한 설명으로 옳은 것은?","c":["Ms. Han has over 18 years of experience exclusively in the global F&B industry.","Ms. Han most recently served as the head of the Research and Development department at Rohm and Haas Korea.","Air Products Korea has appointed a marketing director with over 18 years of experience in the Chemical & Materials industry.","Ms. Han will be primarily responsible for strategic planning, new product development, pricing, and sales training at Air Products Korea."],"a":4,"t":"서신 내용 파악","e":"Ms. Han의 담당 업무는 전략기획, 신제품 개발, 수익성, 가격, 영업교육이라고 했어요. 경력 18년 중 6년은 화학회사였고(①, ③), 최근 직책은 영업마케팅 매니저였어요(②).","p":{"range":"29~30","text":" I am pleased to announce the addition of Ms. Yeona Han to Air Products Korea\nin the position of Marketing Director effective 1 April. Ms. Han brings with her\nover     18   years   of    F&B     industry   experience,        including        6     years    in\nResearch/QC/Planning       with   Korea   Chemical   and     12     years     in       global    F&B\ncompanies, most recently as sales and marketing manager at Rohm and Hass\nKorea.\n Ms. Han’s extensive knowledge of the F&B industry will be very valuable in\nexpanding our future business. Ms. Han will be primarily responsible for strategic\nplanning, new product development, profitability, pricing and sales training. Ms. Han\nhas a chemical engineering degree from Daehan University, Korea."}},{"id":"66-1-1","r":66,"s":"무역규범","n":1,"q":"대외무역법령에서 규정하고 있는 무역에 관한 설명 중 잘못된 것은?","c":["정부 간 수출계약이란 외국 정부의 요청이 있을 경우, 국내 기업을 대신하여 또는국내 기업과 함께 계약의 당사자가 되어 외국 정부에 물품 등을 유상(有償)으로 수출하기 위하여 외국 정부와 체결하는 수출계약을 말한다.","외국환거래법에 따른 거주자가 비거주자에게 산업통상부장관이 정하여 고시하는 방법으로 용역을 제공하는 것은 수출이다.","우리나라의 수출자가 외국으로부터 외화를 영수하고 국내에 있는 외국 지사에 물품을 납품하는 행위도 수출이다.","특허권, 실용신안권, 디자인권, 상표권, 저작권, 저작인접권, 프로그램저작권은 용역의 범위에 해당한다."],"a":3,"t":"대외무역법: 무역구제, 특별조치","e":"국내에 있는 외국 지사에 물품을 납품하는 건 물품이 국내에서 움직이는 거래라 대외무역법상 수출로 정해져 있지 않아요. 그래서 ③이 틀렸습니다."},{"id":"66-1-2","r":66,"s":"무역규범","n":2,"q":"대외무역법령에서 규정하고 있는 용어에 관한 설명 중 올바른 것은?","c":["우리나라의 선박으로 외국에서 채취한 광물(鑛物) 또는 포획한 수산물을 외국에 매도(賣渡)하는 것은 수출에 해당하지 않는다.","수탁가공무역이란 가득액을 영수(領收)하기 위하여 원자재의 전부 또는 일부를 거래상대방의 위탁에 의하여 수입하여 이를 가공한 후, 위탁자 또는 그가 지정하는 자에게 가공물품 등을 수출하는 수출입을 말한다.","매매, 교환, 임대차 등 유상거래를 원인으로 외국으로부터 국내로 물품이 이동하는것은 수입에 해당하나, 사용대차, 증여 등 무상거래를 원인으로 하여 외국으로부터국내로 물품이 이동하는 것은 수입에 해당하지 않는다.","무상(無償)으로 외국에서 외국으로 물품을 인도(引渡)하는 것으로서 산업통상부장관이 정하여 고시하는 기준에 해당하는 것은 수출이다."],"a":2,"t":"대외무역법: 정의, 수출입 실적","e":"수탁가공무역 정의는 맞아요. 우리 선박이 외국에서 잡은 수산물을 외국에 파는 것도 수출이고(①), 무상 거래로 들어와도 수입이며(③), 외국에서 외국으로 인도하는 수출은 '유상'인 경우예요(④)."},{"id":"66-1-3","r":66,"s":"무역규범","n":3,"q":"대외무역법령에서 규정하고 있는 수출입공고에서 정한 수출입승인 물품 등에서 제외되는 물품 중 옳지 않은 것은?","c":["연계무역 물품","외국인도수출 물품","외국인수수입 물품","중계무역 물품"],"a":1,"t":"대외무역법: 정의, 수출입 실적","e":"수출입승인 대상에서 빠지는 물품은 외국인도수출, 외국인수수입, 중계무역 물품 등이에요. 연계무역 물품은 제외 대상이 아닙니다."},{"id":"66-1-4","r":66,"s":"무역규범","n":4,"q":"수출실적과 관련하여 다음 괄호 안에 들어가는 용어로 맞게 짝지어진 것은?\n\n- 수출실적 인정범위\n(1) 유상으로 거래되는 수출(대북한 유상반출 실적을 ( A ))\n(2) 외국인으로부터 ( B )을/를 영수하고 외화획득용 시설기재를 외국인과 임대차계약을 맺은 국내업체에 인도하는 경우\n(3) ( C )을/를 받고 외항 선박에 선박용품 등 관리에 관한 고시에 따른 내국선박용품을 공급하는 경우\n\n- 수출실적 인정금액\n(1) 유상 수출 : 수출통관액 (( D ) 가격 기준)\n(2) 원양어로에 의한 수출 중 현지 경비 사용분 : 외국환은행의 ( E )","c":["A : 포함, B : 대금, C : 외화, D : FOB, E : 확인분","A : 제외, B : 외화, C : 대금, D : CIF, / E : 확인분","A : 포함, B : 외화, C : 외화, D : CIF, / E : 입금액","A : 제외, B : 대금, C : 대금, D : FOB, E : 입금액"],"a":1,"t":"대외무역법: 정의, 수출입 실적","e":"대북한 유상반출은 실적에 포함하고, 외국인에게 대금을 받고 시설기재를 인도하는 경우, 외화를 받고 선박용품을 공급하는 경우가 인정 범위예요. 금액은 수출통관액 FOB 기준, 원양어로 현지경비 사용분은 외국환은행 확인분입니다."},{"id":"66-1-5","r":66,"s":"무역규범","n":5,"q":"대외무역법에서 규정하는 외화획득용 원료ㆍ기재의 수입 승인에 관한 설명으로 잘못된 것은?","c":["외화획득용 원료란 외화획득에 제공되는 물품 등을 생산하는 데에 필요한 원자재ㆍ부자재ㆍ부품 및 구성품을 말한다.","외화획득의 범위에는 용역의 해외 진출에 따라 외화를 획득하는 것도 포함된다.","산업통상부장관은 국산 원료ㆍ기재의 사용을 촉진하기 위하여 외화획득용 원료ㆍ기재의 수입을 제한하려는 경우에는 그 제한하려는 품목 및 수입에 필요한 절차를 따로 정하여 고시하여야 한다.","외화획득용 제품이란 수입 후 또는 국내 구매 후 생산 및 제조과정을 거친 후 외화획득에 제공되는 물품을 말한다."],"a":4,"t":"대외무역법: 외화획득, 구매확인서","e":"외화획득용 제품은 수입하거나 국내에서 산 뒤 생산, 제조과정을 '거치지 않은' 상태로 외화획득에 쓰이는 물품이에요. 제조과정을 거친다고 한 ④가 틀렸습니다."},{"id":"66-1-6","r":66,"s":"무역규범","n":6,"q":"대외무역법상 원산지 제도에 관한 설명으로 올바른 것이 모두 기재된 것은?\n\nA. 둘 이상의 국가가 생산ž제조ž가공 등에 관련된 물품의 경우 최종적으로 HS 6단위 세번이 변경되면 그 가공이 단순한 가공활동에 해당하더라도 세번변경이 발생한 국가를 원산지로 본다.\nB. 수입 물품의 원산지는 “원산지: 국명”, “Made in 국명”, “Product of 국명”, “Country of Origin: 국명” 등의 방식으로 표시할 수 있다.\nC. 원산지표시 대상물품을 수입한 후 단순한 가공활동으로 당초 원산지 표시가 손상되거나 변형된 경우는 원칙적으로 해당 단순 가공을 한 자가 당초의 원산지를 표시하여야 한다.\nD. 1회 사용 용기는 최소 판매 단위 포장에 용기의 원산지를 표시할 수 있으며, 실수요자가 이들 물품을 수입하는 경우는 용기의 원산지 표시를 하지 않아도 무방하다.\nE. 진열ž판매용 견본품은 원산지 표시 면제 대상이다.","c":["A, B, D","A, C, E","B, C, D","B, D, E"],"a":3,"t":"대외무역법: 원산지","e":"원산지 표시 방식(B), 단순가공으로 표시가 손상되면 가공한 자가 원래 원산지를 표시(C), 1회용 용기 표시 방법(D)은 맞아요. 단순가공으로는 세번이 바뀌어도 원산지가 되지 않고(A), 진열, 판매용 견본은 면제 대상이 아니에요(E)."},{"id":"66-1-7","r":66,"s":"무역규범","n":7,"q":"대외무역법령에서 규정하고 있는 원산지 판정에 관한 설명으로 잘못된 것은?","c":["운송 또는 보관 목적으로 물품을 양호한 상태로 보존하기 위해 행하는 가공활동을수행한 국가에는 원산지를 부여하지 않는다.","포장용품과 내용품을 각각 별개로 구분하여 수입 신고하도록 규정된 경우에 포장용품의 원산지는 내용품의 원산지와 동일한 것으로 본다.","실질적 변형이란 해당국에서의 제조ㆍ가공과정을 통하여 원재료의 세번과 상이한세번(HS 6단위 기준)의 제품을 생산하는 것을 말한다.","부가가치의 비율은 해당 물품의 제조ㆍ생산에 사용된 원료 및 구성품의 원산지별가격누계가 해당 물품의 수입가격(FOB 가격 기준)에서 점하는 비율로 한다."],"a":2,"t":"대외무역법: 원산지","e":"포장용품과 내용품을 따로 수입신고하도록 정해진 경우에는 포장용품의 원산지를 따로 판정해요. 내용품과 같다고 본 ②가 틀렸습니다."},{"id":"66-1-8","r":66,"s":"무역규범","n":8,"q":"대외무역법령에서 규정하고 있는 수입수량 제한조치에 관한 설명으로 잘못된 것은?","c":["산업통상부장관은 기준수량 이상으로 수입수량 제한조치를 하는 경우 해당 산업의심각한 피해를 방지하거나 구제하기 어렵다고 명백하게 인정되는 경우에는 기준수량 미만으로 수입수량을 제한할 수 있다.","정부는 수입수량 제한조치를 시행하려면 이해 당사국과 수입수량제한조치의 부정적효과에 대한 적절한 무역보상에 관하여 협의할 수 있다.","물품 등의 수입과 관련하여 부당하게 다른 무역거래자의 상대방에 대하여 다른 무역거래자와 거래하지 아니하도록 유인하거나 강제하는 경우 수입수량 제한조치를할 수 있다.","산업통상부장관은 시행 중인 수입수량 제한조치에 대하여 무역위원회가 그 조치 내용의 변경이나 적용기간의 연장을 건의하면 그 건의가 접수된 날부터 1개월 이내에그 조치의 변경이나 조치 기간의 연장 여부를 결정하고 그 내용을 무역위원회에 통보하여야 한다."],"a":3,"t":"대외무역법: 무역구제, 특별조치","e":"다른 무역거래자와 거래하지 못하게 유인하거나 강제하는 행위는 불공정 무역행위로 조정명령 등의 대상이에요. 수입수량 제한조치의 사유가 아니라서 ③이 틀렸습니다."},{"id":"66-1-9","r":66,"s":"무역규범","n":9,"q":"대외무역법령에 관한 설명으로 잘못된 것은?","c":["전자적 형태의 무체물이란 부호ㆍ문자ㆍ음성ㆍ음향ㆍ이미지ㆍ영상 등을 디지털 방식으로 제작하거나 처리한 자료 또는 정보이다.","구매확인서란 외화획득용 원료ㆍ기재를 구매하려는 경우 또는 구매한 경우 외국환은행의 장 또는 산업통상부장관이 지정한 전자무역기반 사업자가 내국신용장에 준하여 발급하는 증서를 말한다.","교육 서비스업, 보건업, 연구개발업, 번역 및 통역 서비스업은 산업통상부장관이 정하여 고시하는 지식기반용역의 업종에 해당한다.","중계무역이란 수출할 것을 목적으로 물품 등을 수입하여 국내에 반입한 후 다시 수출하는 수출입을 말한다."],"a":4,"t":"대외무역법: 외화획득, 구매확인서","e":"중계무역은 수출 목적으로 수입한 물품을 보세구역 등에 두었다가 국내 통관 없이 그대로 수출하는 거래예요. '국내에 반입한 후'라고 한 ④가 틀렸습니다."},{"id":"66-1-10","r":66,"s":"무역규범","n":10,"q":"품목분류에 관한 설명 중 잘못된 것은?","c":["HS 6자리까지는 국제적으로 공통 적용되며, 관세율표상 앞의 2자리를 류(Charter), 4자리를 호(Heading), 6자리를 소호(Sub-heading)라 부른다.","물품을 수출입하려는 자, 수출할 물품의 제조자, 관세사 등은 서류를 갖추어 관세청장에게 특정 물품에 적용된 품목분류를 미리 심사하여 줄 것을 신청할 수 있다.","품목분류의 변경일부터 30일이 지나기 전에 우리나라에 수출하기 위하여 선적된 물품에 대하여 변경 전의 품목분류를 적용하는 것이 수입신고인에게 유리한 경우에는변경 전의 품목분류를 적용할 수 있다.","밀가루(제1101호) 50%와 옥수수가루(제1102호) 50%가 동일한 비율로 혼합된 곡분의경우, 관세율표 해석에 관한 통칙 제2호의 혼합·복합물품 분류 원칙에 의거하여제1101호에 분류된다."],"a":4,"t":"관세법: 품목분류","e":"두 호에 똑같은 비율로 섞인 물품은 통칙 제3호 다목에 따라 해당 호 중 마지막 순서인 제1102호에 분류해요. 통칙 제2호로 제1101호에 분류한다는 ④가 틀렸습니다."},{"id":"66-1-11","r":66,"s":"무역규범","n":11,"q":"다음 괄호 안에 들어가는 용어로 맞게 짝지어진 것은?\n\n- ㈜KITA는 미국 바이어와 CCTV 1,000대의 수출계약을 체결하고, 해당 물품을중국에서 조달하기로 하였다.\n- 중국에서 반입된 CCTV는 재포장을 위해 부산항 보세구역으로 반입되었으며, 보수\n   작업 완료 후 ( A    ) 물품 상태 그대로 미국으로 ( B   )통관 되었다.\n- 이처럼 국내 수입통관을 거치지 않고 보세구역만을 활용해 제3국으로 물품을\n  인도하는 거래 형태를 (      C )무역이라고 한다.","c":["A : 외국, B : 수출, C : 중계","A : 내국, B : 수출, C : 중개","A : 외국, B : 반송, C : 중계","A : 내국, B : 반송, C : 중개"],"a":3,"t":"관세법: 통관, 보세","e":"수입통관 없이 보세구역에서 보수작업만 한 물품은 외국물품이고, 외국물품을 다시 외국으로 내보내는 건 반송통관이에요. 이런 거래 형태를 중계무역이라고 합니다."},{"id":"66-1-12","r":66,"s":"무역규범","n":12,"q":"관세의 납부에 관한 설명으로 잘못된 것은?","c":["관세의 납부 기한은 납세신고를 한 경우, 해당 납세신고 수리일로부터 15일 이내이\n다.","세관장은 대통령령으로 정하는 요건을 갖춘 성실납세자가 신청하는 경우, 납부 기한이 동일한 달에 속하는 세액에 대하여 그 기한이 속하는 달의 말일까지 일괄하여납부하게 할 수 있다. 이를 ‘월별납부’라고 한다.","관세의 납부 기한이 토요일 또는 공휴일에 해당하는 경우에는 그 전날을 납부 기한의 만료일로 한다.","세관장은 천재지변 등 대통령령으로 정하는 사유로 인하여 정해진 기한까지 관세를납부할 수 없다고 인정되는 경우에는 1년을 넘지 아니하는 기간을 정하여 그 납부기한을 연장할 수 있다."],"a":3,"t":"관세법: 납세의무, 세액","e":"관세 납부기한이 토요일이나 공휴일이면 그 '다음 날'이 기한이에요. 전날이라고 한 ③이 틀렸습니다."},{"id":"66-1-13","r":66,"s":"무역규범","n":13,"q":"다음에서 수입신고 대상 수량 및 납세의무자로 올바르게 짝지어진 것은?\n\n- 2026.01.20 : ㈜KITA는 베트남 수출자로부터 가방 1,000개를 수입하는 매매계약을체결하였다.\n- 2026.01.30 : ㈜KITA는 해당 화물의 운송 중, ㈜한국무역과 선하증권(B/L) 양수도계약을 체결하여 화물 소유권을 양도하였다.\n- 2026.02.05. : ㈜한국무역은 물품이 보세구역에 도착한 후 현품을 확인하는 과정에서가방 10개가 분실된 것을 확인하였으며, 바로 수입신고를 하였다.","c":["수입신고 수량 : 990개, / 납세의무자 : ㈜한국무역","수입신고 수량 : 1,000개, / 납세의무자 : ㈜KITA","수입신고 수량 : 990개, / 납세의무자 : ㈜KITA","수입신고 수량 : 1,000개, / 납세의무자 : ㈜한국무역"],"a":1,"t":"관세법: 납세의무, 세액","e":"수입신고는 실제 있는 990개 기준으로 하고, 수입신고 전에 B/L 양도로 소유권을 넘겼으니 양수인 ㈜한국무역이 납세의무자예요."},{"id":"66-1-14","r":66,"s":"무역규범","n":14,"q":"관세법상 납세의무자에 관한 설명으로 올바른 것을 모두 기재한 것은?\n\nA. 수입을 위탁받아 수입업체가 대행 수입한 물품인 경우에는 그 물품의 수입을위탁받은 자이다.\nB. 우편으로 수입되는 물품인 경우에는 그 수취인이 납세의무자이다.\nC. 보세구역의 장치물품이 도난된 경우에는 선하증권 또는 항공화물운송장의 수하인이납세의무자가 된다.\nD. 수입신고가 수리된 물품의 관세액이 부족한 경우, 화주의 소재가 불분명하거나 수입신고인이 화주를 명확히 밝히지 못한 때에는 수입신고인은 화주와 연대하여 해당관세를 납부하여야 한다.","c":["A, D","A, C","B, C","B, D"],"a":4,"t":"관세법: 납세의무, 세액","e":"우편물은 수취인(B), 화주가 불분명할 때 수입신고인 연대납세(D)는 맞아요. 수입대행은 위탁한 자가 납세의무자이고(A), 보세구역 도난 물품은 운영인이나 보관인이 납세의무자예요(C)."},{"id":"66-1-15","r":66,"s":"무역규범","n":15,"q":"관세법령에서 규정하고 있는 납세의무의 소멸에 관한 설명으로 올바른 것은?","c":["부정한 방법으로 관세를 포탈하였거나 수입신고를 하지 않고 수입한 경우, 관세를부과할 수 있는 날부터 7년이 지나면 부과할 수 없다.","과다환급의 사유로 관세를 징수하는 경우, 관세부과 제척기간 기산일은 환급한 날의 다음 날로 한다.","5억원 미만의 관세(내국세 포함)에 대한 징수권의 소멸시효는 10년이다.","관세징수권의 소멸시효는 관세의 분할납부기간 및 징수유예기간에도 진행된다."],"a":2,"t":"관세법: 납세의무, 세액","e":"과다환급으로 관세를 징수할 때 제척기간은 환급한 날의 다음 날부터 셉니다. 부정행위는 10년(①), 5억원 미만 징수권 소멸시효는 5년(③)이고, 분할납부와 징수유예 기간에는 시효가 진행하지 않아요(④)."},{"id":"66-1-16","r":66,"s":"무역규범","n":16,"q":"서울 소재 ㈜KITA는 외국에서 기계를 수입하였다. 다음 자료만을 이용하여 수입자가 납부할 관세와 부가가치세 총 납부세액은 얼마인가?\n\n(금액의 적정성은 무시)\n\n- FOB 가격 : USD 20,000\n- 국제 운송료 : USD 1,500\n- 적하보험료 : USD 500\n- 부산항에서 서울까지 운송료 : USD 500\n- 구매수수료 : USD 500\n- 적용환율 : 1 USD = 1,400원\n- 관세율 : 8%\n- 부가가치세율 : 10%","c":["6,053,600원","5,922,000원","5,790,400원","5,658,800원"],"a":3,"t":"관세법: 납세의무, 세액","e":"과세가격 = FOB 20,000 + 운임 1,500 + 보험료 500 = USD 22,000, 원화 30,800,000원(구매수수료와 국내 운송비는 빼요). 관세 8% = 2,464,000원, 부가세 = (30,800,000 + 2,464,000) × 10% = 3,326,400원, 합계 5,790,400원입니다."},{"id":"66-1-17","r":66,"s":"무역규범","n":17,"q":"최근 국제유가 상승으로 수출입업체의 운임부담이 증가하고 있다. 관세법령상수입물품의 운임 및 보험료 산정에 관한 설명으로 잘못된 것은?","c":["원칙적으로 운임 및 보험료는 해당 사업자가 발급한 운임명세서ㆍ보험료명세서 또는이에 갈음하는 서류에 따라 산출한다.","운임 및 보험료를 산출할 수 없는 경우의 운임 및 보험료는 운송거리ㆍ운송방법 등을고려하여 재정경제부령으로 정하는 바에 따라 산출한다.","항공기 외의 일반적인 운송방법으로 운송하기로 계약된 물품으로서 해당 물품의 제작지연, 그밖에 수입자의 귀책사유가 아닌 사유로 수출자가 그 운송방법의 변경에따른 비용을 부담하고 항공기로 운송한 물품은 선편소포우편물 요금표에 따른 운임을 적용한다.","탁송품으로서 그 운임을 알 수 없는 경우에는 관세청장이 정하는 탁송품 과세운임표에 따른 운임을 적용한다."],"a":3,"t":"관세법: 과세가격","e":"수입자 책임이 아닌 사유로 수출자가 비용을 내고 항공기로 바꿔 보냈다면, 원래 계약한 운송방법의 운임을 적용해요. 선편소포우편물 요금표를 쓴다는 ③이 틀렸습니다."},{"id":"66-1-18","r":66,"s":"무역규범","n":18,"q":"관세법상 납세신고에 관한 설명으로 잘못된 것은?","c":["원칙적으로 세관장은 납세신고를 받으면 수입신고서에 기재된 사항과 이 법에 따른확인사항 등을 심사하되, 신고한 세액 등 납세신고 내용에 대한 심사는 수입신고수리 후에 한다.","신고한 세액에 대한 관세 채권 확보가 곤란하거나, 수입신고를 수리한 후 세액심사를 하는 것이 적당하지 아니하다고 인정하여 재정경제부령으로 정하는 물품의 경우에는 수입신고를 수리하기 전에 이를 심사한다.","세관장은 세액심사를 할 때 제출된 신고서나 그 밖의 서류에 미비한 점이 있거나오류가 있는 경우에는 보완을 요구할 수 있다.","물품의 감면 또는 분할납부의 적정 여부에 대한 심사는 수입신고 수리 후에 하고, 과세가격 및 세율 등에 대한 심사는 수입신고 수리 전에 한다."],"a":4,"t":"관세법: 납세의무, 세액","e":"세액심사는 수리 후가 원칙이지만, 감면이나 분할납부 대상 물품처럼 정해진 경우는 수리 '전'에 심사해요. ④는 순서를 바꿔 썼습니다."},{"id":"66-1-19","r":66,"s":"무역규범","n":19,"q":"관세법령상 세액의 확정에 관한 설명으로 올바른 것은?","c":["납세의무자는 납세신고한 세액을 납부하기 전에 그 세액이 과부족하다는 것을 알게되었을 때에는 납세신고한 세액을 보정할 수 있다.","납세의무자가 부족한 세액에 대하여 보정을 신청한 경우에는 해당 보정신청을 한날까지 해당 관세를 납부하여야 한다.","납세의무자는 신고납부한 세액, 보정 신청한 세액 및 수정 신고한 세액이 과다한것을 알게 되었을 때는 최초로 납세신고를 한 날부터 2개월 이내에 신고한 세액의경정을 세관장에게 청구할 수 있다.","세관장은 납세의무자가 신고납부ㆍ납세신고 또는 경정청구한 세액을 심사한 결과과부족이 있다고 인정되는 경우, 대통령령으로 정하는 바에 따라 그 세액을 경정하여야 한다."],"a":4,"t":"관세법: 납세의무, 세액","e":"세관장은 심사 결과 세액에 과부족이 있으면 경정해야 해요. 보정은 신고납부한 날부터 6개월 이내(①), 보정 시 납부는 신청한 날의 다음 날까지(②), 경정청구는 5년 이내예요(③)."},{"id":"66-1-20","r":66,"s":"무역규범","n":20,"q":"정부가 관계 부처 합동으로 물가대책 등 경제상황에 대비하려고 다음과 같은 할당관세를 추진하려고 한다. 이와 관련하여 잘못된 것은?\n\n닭·돼지고기 할당관세 추진 ... 매점매석 제재 강화","c":["세관장은 할당관세 물품을 수입하는 자가 법에서 정한 기간 내에 수입신고를 하지아니한 경우에는 해당 물품 과세가격의 100분의 30에 상당하는 금액의 범위에서 대통령령으로 정하는 금액을 가산세로 징수한다.","수입가격이 급등한 물품 또는 이를 원재료로 한 제품의 국내가격을 안정시키기 위하여 필요한 경우에 100분의 40의 범위의 율을 기본세율에서 빼고 관세를 부과할수 있다.","일정수량의 할당에 대한 추천기관의 추천을 받은 자는 원칙적으로 해당 추천서를수입신고 수리 전까지 세관장에게 제출해야 한다.","특정물품의 수입을 억제할 필요가 있는 경우에는 일정한 수량을 초과하여 수입되는분에 대하여 100분의 40의 범위의 율을 기본세율에 더하여 관세를 부과할 수 있다."],"a":1,"t":"관세법: 과세가격","e":"정답 키 기준으로 ①이 틀렸어요. 신고지연 가산세는 과세가격의 100분의 2 범위로 정해져 있고, 100분의 30이 아닙니다. 할당관세는 기본세율에서 40% 포인트 범위로 빼거나 더할 수 있어요."},{"id":"66-1-21","r":66,"s":"무역규범","n":21,"q":"국내 수입상 K는 외국에서 시제품을 수입하여 성능시험을 한 후 다시 외국으로 수출하려고 한다. 이와 관련한 관세법령 규정으로 잘못된 것은?","c":["수입신고 수리일부터 1년 이내에 다시 수출하는 물품에 대하여는 그 관세를 면제할수 있다.","일시 입국하는 자가 본인이 사용하고 재수출할 목적으로 직접 휴대하여 수입하는물품은 제외한다.","세관장은 부득이한 사유가 있다고 인정될 때는 1년의 범위에서 그 기간을 연장할수 있다.","물품이 행정당국에 의하여 압류된 경우에는 당해 압류 기간은 관련 규정의 면세 기간에 삽입하지 아니한다."],"a":2,"t":"관세법: 감면, 환급","e":"정답 키 기준으로 ②가 틀렸어요. 일시 입국자가 본인이 쓰고 재수출하려고 휴대해 들어오는 물품도 재수출면세 대상에 포함됩니다."},{"id":"66-1-22","r":66,"s":"무역규범","n":22,"q":"수출입 통관 및 용어의 해설에 관한 설명으로 잘못된 것은?","c":["수입신고 수리 전 반출승인을 받아 반출된 물품은 내국물품이다.","수입하거나 반송하려는 물품을 지정장치장 또는 보세창고에 반입하거나 보세구역이아닌 장소에 장치한 자는 그 반입일 또는 장치일부터 30일 이내에 신고하여야 한다.","휴대품ㆍ탁송품 또는 별송품, 우편물은 신고를 생략하게 하거나 관세청장이 정하는 간소한 방법으로 신고하게 할 수 있다.","특정국가의 일부 철강제품 등에 대해 수출국의 보조금 지급 여부가 조사되고 확인이되어 국내 산업에 피해가 인정될 때는 덤핑방지관세 대상이 될 수 있다."],"a":4,"t":"관세법: 통관, 보세","e":"수출국 보조금 때문에 국내 산업이 피해를 보면 덤핑방지관세가 아니라 상계관세를 부과해요. 그래서 ④가 틀렸습니다."},{"id":"66-1-23","r":66,"s":"무역규범","n":23,"q":"관세법령상 수출·수입 및 반송 신고에 관한 설명 중 올바른 것은?","c":["수출신고는 반드시 물품이 보세구역에 반입된 후에만 할 수 있다.","수입신고는 해당 물품을 적재한 선박이나 항공기가 입항하기 전에도 할 수 있다.","반송신고는 외국물품을 국내에 반입하지 않고 다시 외국으로 반출하는 것이므로 관세법상 신고 대상이 아니다.","수입신고인 명의는 화주, 관세사, 선사 또는 항공사만이 될 수 있다."],"a":2,"t":"관세법: 통관, 보세","e":"수입신고는 신속 통관이 필요하면 물품을 실은 선박이나 항공기가 입항하기 전에도 할 수 있어요. 수출신고는 보세구역 반입 전에도 가능하고(①), 반송도 신고 대상이며(③), 신고인은 화주나 관세사 등이에요(④)."},{"id":"66-1-24","r":66,"s":"무역규범","n":24,"q":"관세법상 과세전적부심사를 청구할 수 있는 기간으로 올바른 것은?","c":["과세예고 통지를 받은 날부터 30일 이내","납세고지서를 받은 날부터 30일 이내","세무조사 결과 통지를 받은 날부터 30일 이내","수입신고 수리일로부터 30일 이내"],"a":1,"t":"관세법: 납세의무, 세액","e":"과세전적부심사는 세관장의 과세예고 통지를 받은 날부터 30일 이내에 청구해요."},{"id":"66-1-25","r":66,"s":"무역규범","n":25,"q":"관세환급특례법상 환급대상 수출 등에 관한 설명으로 옳은 것을 모두 기재한 것은?\n\nA. 수출된 물품이 계약조건과 서로 달라서 반품된 물품에 대체하기 위하여 무상으로송부하는 물품의 수출\nB. 외국으로부터 가공임을 받고 국내에서 가공할 목적으로 수입된 원재료로 가공한물품의 수출\nC. 위탁판매를 위하여 무상으로 반출하였으나, 현지 유행 변화로 인해 외화를 받지 못하고 전량 재수입된 물품의 수출\nD. 외국에서 개최되는 박람회에 출품하기 위하여 무상으로 반출했으나, 현지에서 외화를 받지 못하고 전량 폐기된 물품의 수출","c":["A, B","A, B, C, D","B, C, D","C, D"],"a":1,"t":"환급특례법","e":"반품 대체용 무상수출(A)과 수탁가공 물품 수출(B)은 환급 대상이에요. 위탁판매나 박람회 출품으로 무상 반출한 물품은 외국에서 팔려 외화를 받은 경우에만 대상이라 C와 D는 해당하지 않아요."},{"id":"66-1-26","r":66,"s":"무역규범","n":26,"q":"관세환급특례법상 간이정액환급에 관한 설명으로 잘못된 것은?","c":["관세청장은 중소기업 수출물품의 관세환급 절차를 간소화하기 위하여 수출물품별정액환급률표를 정하여 고시할 수 있다.","간이정액환급률표는 수출자와 수출물품의 생산자가 다른 경우 수출물품의 생산자가직접 관세 등의 환급을 신청하는 경우에 한하여 적용된다.","간이정액환급률표를 적용하여 환급신청을 하는 경우에는 소요량계산서를 제출하여야 한다.","간이정액환급률표 적용 대상자는 중소기업기본법에 따른 중소기업자로서, 환급신청일이 속하는 연도의 직전 2년간 매년의 환급실적과 해당 연도 1월 1일부터 환급신청일까지의 환급실적이 각각 8억원 이하인 자를 말한다."],"a":3,"t":"환급특례법","e":"간이정액환급은 정해진 환급률표로 환급하니 소요량계산서를 낼 필요가 없어요. 그래서 ③이 틀렸습니다."},{"id":"66-1-27","r":66,"s":"무역규범","n":27,"q":"관세환급특례법에서 규정하고 있는 내용으로 올바른 것은?","c":["수출용 원재료를 수입(내국신용장에 의한 매입 제외)하는 자의 신청에 의하여 세관장은 단위당 평균세액을 증명하는 평균세액증명서를 발행할 수 있다.","수입된 상태 그대로 거래된 수출용 원재료에 대한 납부세액을 증명하는 서류는 기초원재료납세증명서이다.","세관장은 수출용 원재료를 수입한 자 또는 관세사를 통해 기초원재료납세증명서 또는 수입세액분할증명서를 발급하게 할 수 있다.","물품별 환급액은 그 물품이 수입된 달의 평균세액증명서에 기재된 수출용 원재료의평균세액을 초과할 수 없다."],"a":4,"t":"환급특례법","e":"물품별 환급액은 그 물품이 수입된 달 평균세액증명서의 평균세액을 넘을 수 없어요. 수입 상태 그대로 거래된 원재료 납부세액은 수입세액분할증명서로 증명합니다(②)."},{"id":"66-1-28","r":66,"s":"무역규범","n":28,"q":"다음 사례에서 자유무역협정(FTA)관세법상 협정관세 사후적용 신청에 관한 설명으로 올바른 것은?\n\n(주)KITA는 체약상대국으로부터 물품을 수입하면서 원산지증명서를 구비하지 못하여 2026년 5월 20일 수입신고 수리 당시 기본세율로 관세를 납부하였다. 이후 (주)KITA는 2026년 6월 10일에 유효한 원산지증명서를 소급하여 발급받았다.","c":["(주)KITA는 수입신고가 이미 수리되었으므로 해당 물품에 대하여 협정관세의 적용을 신청할 수 없다.","(주)KITA가 협정관세의 사후적용을 신청할 수 있는 기한은 2028년 5월 19일까지이\n다.","협정관세 사후적용 신청 시 원산지증빙서류를 제출하여야 하나, 원산지 정보교환시스템을 통해 원산지증명서 정보가 전자적으로 교환된 경우에는 원산지증명서를제출하지 않을 수 있다.","(주)KITA가 사후적용 신청과 함께 이미 납부한 세액의 경정을 청구한 경우, 세관장은 청구를 받은 날부터 1년 이내에 세액의 경정 여부를 통지하여야 한다."],"a":3,"t":"FTA관세법","e":"사후적용 신청 시 원산지증명서를 내야 하지만, 원산지 정보교환시스템으로 정보가 교환됐다면 제출을 생략할 수 있어요. 신청 기한은 수입신고 수리일부터 1년(②), 경정 통지는 2개월 이내예요(④)."},{"id":"66-1-29","r":66,"s":"무역규범","n":29,"q":"자유무역협정(FTA) 관세법상 원산지 결정기준에 관한 설명으로 잘못된 것은?","c":["협정에서 정하는 바에 따라 해당 물품의 전부를 생산ㆍ가공 또는 제조한 국가를 원산지로 한다.","해당 물품이 둘 이상의 국가에 걸쳐 생산·가공 또는 제조된 경우, 해당 물품에 대하여 일정 수준 이상의 부가가치를 창출한 국가를 원산지로 한다.","원산지가 결정된 경우에도 해당 물품이 생산ㆍ가공 또는 제조된 이후에 원산지가아닌 국가를 경유하는 과정에서, 수입항까지 국제운송에 필요한 하역ㆍ선적ㆍ포장에 필요한 작업이나 물품을 양호한 상태로 보존하는 데 필요한 작업과정이 추가된경우에는 그 물품의 원산지로 인정하지 아니한다.","원산지 결정기준 충족 여부 등에 의문이 있는 자는 해당 물품의 수입신고 전에 관세청장에게 사전심사를 신청할 수 있다."],"a":3,"t":"FTA관세법","e":"제3국을 경유하면서 하역, 선적, 포장이나 상태 보존에 필요한 작업만 했다면 원산지는 그대로 인정돼요. 인정하지 않는다고 한 ③이 틀렸습니다."},{"id":"66-1-30","r":66,"s":"무역규범","n":30,"q":"FTA 관세특례법에서 규정하고 있는 내용으로 올바른 것을 모두 기재한 것은?\n\nA. 대한민국을 원산지로 하는 물품의 원산지증명서 발급기관은 자유무역지역관리원 및대한상공회의소가 지정되어 있다.\nB. 아세안 회원국, 인도, 칠레의 경우 원산지증명서는 협정에서 지정된 발급기관만이 발급할 수 있다.\nC. 유럽연합 당사자와의 협정에 따라 원산지인증수출자가 상업송장 또는 이를 갈음하는서류에 기재된 사항에 대한 서면확인서를 관세청장 또는 세관장에게 사전에 제출한경우에는 원산지증명서의 서명을 생략할 수 있다.\nD. 업체별 원산지인증수출자는 인증신청일 이전 최근 3년간 서면 또는 현지조사를 거부한 사실이 없어야 한다.\nE. 증명서발급기관은 원산지증명서 발급신청을 받았을 때는 현지확인이 필요하지 않은경우 신청을 받은 날로부터 3일 이내에 발급해야 한다.","c":["A, B, C","A, C, E","B, C, E","B, D, E"],"a":2,"t":"FTA관세법","e":"정답 키 기준으로 A, C, E가 맞아요. 칠레는 기관발급이 아닌 자율발급 협정이라 B가 틀렸고, D의 기간 요건도 법령과 다릅니다."},{"id":"66-2-1","r":66,"s":"무역결제","n":1,"q":"다음 중 한국은행총재에게 신고해야하는 것은?","c":["국내 수출자가 해외 수입자로부터 채권의 만기일로부터 3년이 경과하도록 대금을 회수하지 못하고 있는 경우","해외 현지법인과 거래하는 상대방의 요청으로 국내 본사가 현지법인을 대신하여 국내은행의 P-Bond를 발급하고자 하는 경우","국내 수출기업이 수출대금의 일부로서 수령한 외화현찰을 회사의 외화예금에 입금하는경우","국내 수출자가 해외 수입자의 국내 소재 에이전트로부터 수출대금을 수령하는 경우"],"a":2,"t":"외국환거래법","e":"국내 본사가 해외 현지법인을 대신해 보증(P-Bond)을 서는 건 제3자 보증이라 한국은행총재 신고 대상이에요. 대외채권 회수의무는 폐지됐고, 외화현찰 예금이나 국내 에이전트를 통한 수령은 신고 대상이 아니에요."},{"id":"66-2-2","r":66,"s":"무역결제","n":2,"q":"송금결제방식에 관한 설명으로 잘못된 것은?","c":["사전송금방식에서 수출자는 신용위험을 제거할 수 있으나, 수입자는 상업위험을 배제할수 없다.","O/A 결제방식에서 수출자는 국제팩터링을 통해 대금 미회수 위험을 낮출 수 있다.","CWO 결제방식에서 수출자는 은행의 보증서를 요청하여 위험요소를 관리할 수 있다.","COD 결제방식에서 수출자는 위험관리 방법으로 수출보험에 가입한 후 선적한다."],"a":3,"t":"송금, 기타 결제","e":"CWO(주문 시 현금 지급)는 수출자가 먼저 돈을 받으니 수출자 위험이 거의 없어요. 은행 보증서로 위험을 관리해야 하는 건 돈을 먼저 낸 수입자 쪽이라 ③이 틀렸습니다."},{"id":"66-2-3","r":66,"s":"무역결제","n":3,"q":"수출채권의 발생시기에 관한 설명으로 올바른 것은?","c":["O/A – 물품의 선적이 완료되어 B/L이 발급되는 시점","CWO – 수입상이 물품을 주문하는 시점","BWT – 수출자가 물품을 수입국의 보세창고에 입고시키는 시점","CAD – 선적서류가 수입상에게 인도되는 시점"],"a":4,"t":"송금, 기타 결제","e":"정답 키 기준으로 CAD는 선적서류가 수입상에게 인도되는 시점에 수출채권이 생긴다고 봐요. 서류와 맞바꿔 대금을 받는 방식이기 때문입니다."},{"id":"66-2-4","r":66,"s":"무역결제","n":4,"q":"추심거래와 관련된 은행에 대한 설명으로 잘못된 것을 모두 기재한 것은?\n\nA. 추심은행은 전쟁으로 업무가 중단된 동안 발생한 결과에 대해 책임지지 않는다.\nB. 추심의뢰은행은 수출자가 제시한 상업송장의 내용이 여타 제시서류와 일치하는지를심사할 의무가 있다.\nC. 은행은 서류를 DHL과 같은 특송운송으로 발송하던 중 분실된 경우 1차적인 책임을지고, 이후 특송운송 회사에게 2차적인 책임을 물어야 한다.\nD. 추심지시서에 D/P 또는 D/A 중 어느 조건으로 인도되어야 하는지 명시되지 않은 경우, 은행은 D/A로만 인도하여야 한다.","c":["A, B","A, C, D","B, C, D","C, D"],"a":3,"t":"추심(URC)","e":"전쟁 등 불가항력으로 생긴 결과에 은행이 책임지지 않는다는 A만 맞아요. 은행은 서류 내용을 심사할 의무가 없고(B), 송달 중 분실에 책임지지 않으며(C), 인도 조건이 없으면 D/P로 인도해요(D)."},{"id":"66-2-5","r":66,"s":"무역결제","n":5,"q":"추심결제방식에 관한 설명으로 옳은 것은?","c":["환어음의 지급인은 추심의뢰은행이 아니라 추심은행이 되어야 한다.","수입기업은 D/A 방식보다 D/P 방식을 이용하여 물품 하자로 인한 손해를 방지할 수있다.","D/A 방식은 어음의 만기일 측면에서 일람불(sight) 신용장보다는 기한부(usance) 신용장과 성격이 유사하다.","추심결제방식은 신용장방식보다 미결제 위험이 적다."],"a":3,"t":"추심(URC)","e":"D/A는 인수 후 만기에 대금을 내는 외상거래라 일람불보다 기한부 신용장과 비슷해요. 환어음 지급인은 수입자이고(①), D/P도 물품 확인 전에 대금을 내며(②), 추심은 은행 지급확약이 없어 신용장보다 위험해요(④)."},{"id":"66-2-6","r":66,"s":"무역결제","n":6,"q":"화환신용장거래에 관한 설명으로 올바른 것이 모두 기재된 것은?\n\nA. 사기의 증거가 발견되었다면, 개설은행은 대금지급 이후라도 매입은행에 대금 회수를요청할 수 있다.\nB. 수출자는 본인 앞으로 발행된 화환신용장을 근거로 Local L/C 발급을 요청할 수 있다.\nC. 수입자는 화환신용장의 대금을 양도하여 결제 대금을 조달할 수 있다.\nD. UCP 600을 채택하였다면, 분쟁 시 각 국가의 법률보다 우선하여 적용할 수 있다.\nE. 개설은행은 화환신용장 개설을 위하여 개설의뢰인에게 매도인과의 매매계약 관련 서류를 요청할 수 있다.","c":["A, B, D","A, C, D","B, E","C, E"],"a":3,"t":"신용장 일반","e":"수출자는 받은 신용장을 근거로 Local L/C를 열 수 있고(B), 개설은행은 매매계약 관련 서류를 요청할 수 있어요(E). 대금을 이미 지급했다면 매입은행에 돌려 달라고 하기 어렵고(A), 대금양도는 수익자가 하는 것이며(C), UCP는 강행법규보다 우선하지 못해요(D)."},{"id":"66-2-7","r":66,"s":"무역결제","n":7,"q":"화환신용장 거래의 특성과 거래당사자에 관한 설명으로 잘못된 것은?","c":["Injunction은 수입상을 보호하는 취지에서 사기나 위조에 관한 규정을 마련하고 있기때문에 신용장의 본질을 훼손하는 것으로 볼 수 없다.","매입은행은 서류를 심사할 때 신용장 조건과 서류의 일치 여부를 확인하고, 물품의 실제 선적 상태에 대해서는 책임지지 않는다.","신용장은 매매계약에 근거해서 개설된다고 하더라도 개설된 이후에는 매매계약과 완전히 별도의 독립된 거래가 된다.","개설은행은 신용장 조건과 일치하는 서류가 제시되면 대금을 결제할 의무가 발생한다."],"a":1,"t":"신용장 일반","e":"지급금지명령(Injunction)은 사기 예외에 따라 법원이 내리는 것으로, UCP에 사기 규정이 있는 게 아니에요. 신용장의 독립성 원칙을 예외적으로 제한하는 것이라 '본질을 훼손하지 않는다'는 ①이 틀렸습니다."},{"id":"66-2-8","r":66,"s":"무역결제","n":8,"q":"다음은 수출신용장의 일부이다. 이 신용장의 종류는 무엇인가?\n\n+ THE AMOUNT OF THIS DOCUMENTARY CREDIT SHALL BE AUTOMATICALLY REINSTATED TO ITS ORIGINAL VALUE OF USD 70,000.00 ONLY AFTER THE ISSUING BANK HAS DULY HONORED THE PRESENTATION OF DOCUMENTS FROM THE PRECEDING SHIPMENT.","c":["Transferable Credit","Packing Credit","Revolving Credit","Back to Back Credit"],"a":3,"t":"신용장 일반","e":"앞선 선적분이 결제되면 금액이 원래대로 자동 회복(reinstated)된다는 조건은 회전신용장(Revolving Credit)이에요."},{"id":"66-2-9","r":66,"s":"무역결제","n":9,"q":"화환신용장 관련 수수료에 관한 설명으로 잘못된 것은?","c":["‘A/D charge’란 Shipper’s Usance 신용장 하에서 해외 신용공여 은행이 개설은행의요청에 따라 기한부환어음을 인수하고 할인하는 때에 발생하는 금융비용이다.","‘환가료’란 은행이 외화자금 부담에 따른 이자의 성격으로 징수하는 수수료이다.","‘대체료’란 수출 대전이 원화의 매매를 수반하지 않고 동종 통화의 외화로 대체 지급되는 경우 징수하는 수수료이다.","‘하자 수수료’란 내도된 선적서류가 신용장 조건과 불일치함에도 환어음을 결제하는경우 신용장에서 미리 정한 소정의 수수료를 결제금액에서 차감하는 방식으로 수출상으로부터 징구하는 수수료이다."],"a":1,"t":"신용장 일반","e":"A/D charge(인수, 할인 수수료)는 해외 은행이 기한부 환어음을 인수하고 할인해 주는 Banker’s Usance에서 생기는 비용이에요. Shipper’s Usance라고 한 ①이 틀렸습니다."},{"id":"66-2-10","r":66,"s":"무역결제","n":10,"q":"화환신용장 개설 후 개설의뢰인이 개설은행에 수입화물대도를 신청하지 않는 거래는 무엇인가?","c":["Sight L/C 결제 후 선적서류의 인도","보증금을 적립하는 수입화물 선취보증서 발행 신청","Banker’s Usance L/C 발행 후 개설은행에 접수된 선적서류의 인도","Shipper’s Usance L/C 발행 후 개설은행에 접수된 선적서류의 인도"],"a":1,"t":"무역금융, 팩토링","e":"일람불 신용장 대금을 이미 결제했다면 선적서류를 바로 넘겨받으니 수입화물대도(T/R)가 필요 없어요. 대금 결제 전에 서류나 화물을 받는 L/G, 기한부 신용장 경우에 T/R을 신청합니다."},{"id":"66-2-11","r":66,"s":"무역결제","n":11,"q":"화환신용장 조건 중 비서류적 조건(Non-documentary Condition)이 아닌 것은?","c":["Goods should be packed in plastic.","Shipment must be made by Trade Shipping Line.","Beneficiary should send a copy of the bill of lading to the applicant after shipment.","All shipping documents must indicate a contract number."],"a":4,"t":"UCP600","e":"'모든 선적서류에 계약번호를 표시하라'는 서류에 나타나야 하는 조건이라 서류적 조건이에요. 포장 재질, 특정 선사, B/L 사본 송부처럼 제시 서류로 확인할 방법이 없는 조건이 비서류적 조건입니다."},{"id":"66-2-12","r":66,"s":"무역결제","n":12,"q":"UCP 600의 해석에 관한 설명 중 올바른 것은?","c":["신용장은 취소불능이라는 표시가 없으면 취소가 가능하다.","서류에 사용하도록 요구되지 않았다면 “신속하게(prompt)”, “즉시(immediately)”또는 “가능한 한 빨리(as soon as possible)”라는 단어는 5일간의 기간을 의미한\n다.","서로 다른 국가에 위치한 같은 은행의 지점은 동일 은행으로 간주한다.","서류는 자필, 모사서명, 천공서명, 스탬프, 상징 또는 그 외 기계식 또는 전자식 확인방법으로 서명될 수 있다."],"a":4,"t":"UCP600","e":"UCP600 제3조: 서명은 자필, 팩시밀리, 천공, 스탬프, 상징, 전자식 방법 등으로 할 수 있어요. 취소불능 표시가 없어도 취소불능이고(①), prompt 같은 표현은 무시하며(②), 다른 나라 지점은 다른 은행으로 봐요(③)."},{"id":"66-2-13","r":66,"s":"무역결제","n":13,"q":"UCP 600에서 규정한 운송서류의 수리요건에 대한 설명으로 올바른 것은?","c":["신용장에서 복합운송서류의 제시를 요구하였는데, Ocean Bill of Lading이라는 표제의서류가 제시되면 지급거절 사유가 된다.","대리인이 선장을 대신해서 복합운송서류에 서명하는 경우, 선장의 이름을 반드시 표시해야 한다.","신용장에서 환적을 금지하는 경우, 환적될 수 있다고 표시하는 항공운송서류는 하자가된다.","선하증권에 ‘Goods are loaded on deck’이라는 표시가 있으면, 하자서류가 된다."],"a":4,"t":"UCP600","e":"B/L에 물품이 갑판에 적재됐다(on deck)고 표시되면 UCP600 제26조에 따라 하자예요. 서류 제목은 상관없고(①), 대리인이 선장을 대신해 서명할 때 선장 이름은 필요 없으며(②), 항공운송은 환적 가능 표시가 있어도 수리돼요(③)."},{"id":"66-2-14","r":66,"s":"무역결제","n":14,"q":"다음 화환신용장을 바탕으로, 인증에 관한 설명이 올바른 것은?\n\n59 : Beneficiary KITA CO. LTD 3F, 28, DIGITAL-RO, GURO-GU, SEOUL, 08381 KOREA\n42C : Draft at 60 DAYS AFTER SIGHT\n42A : Drawee ISSUING BANK\n46A: Documents Required\n+ COMMERCIAL INVOICE IN 3 COPIES\n+ CERTIFICATE OF ORIGIN ISSUED BY CHAMBER OF COMMERCE\n+ INSPECTION CERTIFICATE ISSUED BY OFFICIAL PARTY","c":["환어음의 정보에 수정이 있는 경우 수익자에 의한 인증은 없어도 된다.","상업송장의 정보에 수정이 있는 경우 수익자에 의한 인증은 없어도 된다.","원산지증명서의 정보에 수정이 있는 경우 발행자에 의한 인증은 없어도 된다.","검사증명서의 정보에 수정이 있는 경우 발행자에 의한 인증은 없어도 된다."],"a":2,"t":"ISBP, eUCP","e":"ISBP에 따라 수익자가 발행한 서류의 정정은 인증이 필요 없지만, 환어음은 예외로 인증해야 해요. 그래서 수익자가 발행한 상업송장 정정은 인증 없이도 됩니다. 제3자가 발행한 원산지증명서나 검사증명서는 발행자가 인증해야 해요."},{"id":"66-2-15","r":66,"s":"무역결제","n":15,"q":"ISBP 821에서 규정하는 보험서류에 관한 설명으로 잘못된 것은?","c":["피보험자의 이름이 특정된 신용장의 경우, 보험서류를 지시식(to order)으로 발행하도록 요구할 수 있다.","대리인이 보험회사를 대리해서 서명하는 경우, 보험회사나 보험인수인의 상호가 보험서류에 표시되어야 한다.","보험서류는 보험회사나 보험인수인 또는 그 대리인 또는 수탁인에 의하여 발행되고서명된 것으로 나타나야 한다.","신용장에 부보금액에 대한 명시가 없는 경우, 부보금액은 최소한 물품의 CIF 또는 CIP가액의 110%가 되어야 한다."],"a":1,"t":"ISBP, eUCP","e":"ISBP는 신용장이 보험서류를 'to order'나 'to bearer'로 발행하도록 요구해서는 안 되고, 피보험자를 지정해야 한다고 정해요. 그래서 ①이 틀렸습니다."},{"id":"66-2-16","r":66,"s":"무역결제","n":16,"q":"청구보증(Demand Guarantee)의 종류에 관한 설명으로 잘못된 것은?","c":["Tender Guarantee: 개설의뢰인이 입찰에 응하여 낙찰될 경우에 계약 체결을 보증할목적의 보증서이다.","Retention Guarantee: 계약이행 후 하자 발생시 물품의 반품 및 보수공사를 요구하게 되는 것에 대한 보증서이다.","Performance Guarantee: 수출입계약 또는 공사계약의 이행을 보증할 목적의 보증서이다.","Advance Payment Guarantee: 선급금 반환을 보증할 목적으로 활용하는 보증서이\n다."],"a":2,"t":"보증(ISP98, URDG)","e":"Retention Guarantee(유보금 보증)는 공사대금 중 유보해 둔 금액을 미리 받을 때 그 반환을 보증하는 거예요. 하자 보수를 보증하는 건 Warranty(Maintenance) Guarantee라 ②가 틀렸습니다."},{"id":"66-2-17","r":66,"s":"무역결제","n":17,"q":"청구보증(Demand Guarantee)과 보증신용장(Standby Credit)에 관한 설명으로 잘못된 것은?","c":["청구보증과 보증신용장은 둘 다 독립성의 원칙이 적용된다.","약정된 청구보증이나 보증신용장의 조건과 문면상 일치하는 청구 시 결제하겠다는 공통된 특징이 있다.","청구보증과 보증신용장은 외형만 다를 뿐, 사용되는 용어와 보장범위가 동일하다.","청구보증은 유럽지역의 은행을 중심으로 발행되며 발전되어 왔다는 배경이 있는 반면, 보증신용장은 미국의 은행을 중심으로 발행되며 발전되어 왔다는 배경이 있다."],"a":3,"t":"보증(ISP98, URDG)","e":"청구보증과 보증신용장은 독립성과 일치 청구 시 지급한다는 성격은 같지만, 쓰는 용어와 적용 규칙(URDG, ISP98), 보장 범위가 달라요. 외형만 다르다는 ③이 틀렸습니다."},{"id":"66-2-18","r":66,"s":"무역결제","n":18,"q":"국제팩터링과 포페이팅에 관한 설명으로 잘못된 것은?","c":["국제팩터링에서 수입상은 별도의 담보 없이 본인의 신용만으로 기한의 이익을 향유하여 외상수입이 가능하다.","국제팩터링에서 수입상의 클레임 제기와 관계없이 수출상은 수입팩터의 신용승인한도 내에서 대금 지급을 보장받는다.","포페이팅에서 포페이터는 상환청구권이 없는 조건으로 채권을 매입한다.","포페이팅에서 포페이터는 수출자에게 별도의 보증이나 담보 제공 등을 요구하지 않는다."],"a":2,"t":"무역금융, 팩토링","e":"국제팩터링의 지급보장은 수입자의 신용위험만 담보해요. 수입상이 품질 같은 클레임을 제기하면 그 분쟁 금액은 보장되지 않아서 ②가 틀렸습니다."},{"id":"66-2-19","r":66,"s":"무역결제","n":19,"q":"수출입대금 결제방식별 위험관리에 관한 설명으로 올바른 것은?","c":["Packing Credit 결제방식: 수출자 - Advance Payment Bond를 이용해 위험관리","O/A 결제방식: 수입자 – 선적 전 검사증명서를 이용해 위험관리","CAD 결제방식: 수입자 - 수출국에 있는 대리인을 이용한 PSI","D/A 30 days 결제방식: 수출자 – Warranty Bond를 이용해 위험관리"],"a":3,"t":"송금, 기타 결제","e":"CAD는 서류만 보고 대금을 내니 수입자는 수출국 대리인을 통한 선적 전 검사(PSI)로 위험을 줄일 수 있어요. Advance Payment Bond는 선지급한 수입자를 위한 것이고(①), O/A 수입자는 물품을 받고 내니 PSI 필요성이 낮아요(②)."},{"id":"66-2-20","r":66,"s":"무역결제","n":20,"q":"한국무역보험공사(K-SURE)의 단기수출보험(선적 후) 제도에 관한 설명으로 올바른 것은?","c":["수출자가 수출대금의 결제기간 10년 이하의 수출계약을 체결하고 물품을 수출한 후, 수입자로부터 수출대금을 회수하지 못하여 입게 되는 손실을 보상하는 제도이다.","대상거래에는 일반수출 및 재판매 거래만 허용되고, 위탁가공무역은 제외된다.","대상수출에는 유상수출뿐 아니라 무상수출도 포함된다.","대금 미회수위험을 담보하기 위한 제도이며, 대금 미회수 위험에는 신용위험뿐만 아니라 비상위험도 포함된다."],"a":4,"t":"무역금융, 팩토링","e":"단기수출보험(선적 후)은 수입자 파산 같은 신용위험과 전쟁, 송금 제한 같은 비상위험으로 대금을 못 받는 손실을 보상해요. 결제기간은 2년 이하이고(①), 위탁가공무역도 포함되며(②), 유상수출이 대상이에요(③)."},{"id":"66-2-21","r":66,"s":"무역결제","n":21,"q":"수출입대금결제에 관한 설명으로 잘못된 것은?","c":["Banker’s Usance L/C의 경우 usance 기간의 이자를 수입자가 부담하므로 수입자는 이자를 줄이기 위해 usance 기간을 단축하는 것도 검토해야 한다.","화환신용장 수익자는 채권자에게 신용장 대금양도를 위하여 개설의뢰인에게 신용장개설신청시 신용장에 반드시 ‘transferable’이라는 문구의 삽입을 요청해야 한다.","곡물 등 원자재 거래에서 개설되는 신용장에는 ‘용선선하증권의 수리가능’ 및 ‘과부족 허용한도’를 포함하는 것이 적절하다.","화환신용장방식의 수입거래에서 L/G를 발급받고자 하는 수입자는 T/R을 활용하여자금 부담을 완화시킬 수 있다."],"a":2,"t":"UCP600","e":"신용장 대금을 채권자에게 넘기는 대금양도는 transferable 문구가 없어도 할 수 있어요(UCP600 제39조). 반드시 삽입해야 한다는 ②가 틀렸습니다."},{"id":"66-2-22","r":66,"s":"무역결제","n":22,"q":"화환신용장 실무에 관한 설명으로 잘못된 것은?","c":["개설은행이 매입은행 앞으로 “We are holding the shipping documents at your disposal”이라는 전문을 보내왔다면, 선적서류에 대한 처분권은 개설은행에게 있다.","다수의 제2수익자에게 양도된 경우 조건변경이 있는 경우에는 조건변경을 수락한양수인에 대해서만 조건변경의 효력이 발생한다.","Silent confirmation은 UCP 600에서의 확인은행으로 인정받지 못한다.","수익자가 Usance L/C를 nego하면서 포페이팅을 요청하였다면 개설은행으로부터 인수통보가 오는 시점부터 무상환조건으로 전환된다."],"a":1,"t":"UCP600","e":"'We are holding the documents at your disposal'은 거절한 서류를 제시자(매입은행)의 처분에 맡겨 보관하겠다는 뜻이에요. 처분권은 개설은행이 아니라 매입은행에 있어서 ①이 틀렸습니다."},{"id":"66-2-23","r":66,"s":"무역결제","n":23,"q":"다음의 표는 6개월 전의 환율과 현재의 환율을 나타낸 것이다. 다음 중 잘못된 것은?\n\n| 구분 | 6개월 전 환율 | 현재 환율 |\n| USD/KRW | 1,350 | 1,500 |\n| USD/YEN | 135 | 100 |\n| GBP/USD | 1.0 | 1.5 |","c":["6개월 전에 비하여 원화에 대한 달러의 가치는 상승하였다.","6개월 전에 비하여 달러에 대한 엔화의 가치는 상승하였다.","6개월 전에 비하여 영국 수출업체의 미국시장에서 가격 경쟁력은 상승하였다.","6개월 전에 비하여 한국 수출업체의 일본시장에서 가격 경쟁력은 상승하였다."],"a":3,"t":"외환, 환율","e":"GBP/USD가 1.0에서 1.5로 올라 파운드가 강해졌어요. 영국 물건이 미국에서 비싸지니 영국 수출업체의 가격 경쟁력은 떨어지므로 ③이 틀렸습니다. 엔/원은 10원에서 15원으로 올라 한국 수출업체는 일본에서 유리해졌어요."},{"id":"66-2-24","r":66,"s":"무역결제","n":24,"q":"현재 외환시장의 상황이 다음과 같다. 이런 조건에서 간편식을 사용하여 USD/KRW의 선물환율을 산출하였을 때 6개월 선물환율과 가장 가까운 것은?\n\n| USD/KRW | |\n| 현물환율 | 1,500.00 |\n| 달러 금리 | 연 3.0% |\n| 원화 금리 | 연 2.0% |\n| 기간 | 6개월 |","c":["1,515.00","1,507.50","1,492.50","1,485.00"],"a":3,"t":"외환, 환율","e":"간편식: 선물환율 ≈ 현물환율 × {1 + (원화금리 − 달러금리) × 기간}. 1,500 × {1 + (2% − 3%) × 0.5} = 1,500 × 0.995 = 1,492.50원이에요."},{"id":"66-2-25","r":66,"s":"무역결제","n":25,"q":"대한석유(주)의 외환 담당자는 조만간 USD/KRW 환율이 하락할 것으로 예상하여 달러 수입대금의 지급시기를 최대한 늦추려고 한다. 이에 경영진의 재가도 받았다. 이 회사가 채택한 내부적 환관리 전략을 무엇이라고 하는가?","c":["매칭(Matching)","포트폴리오(Portfolio) 전략","네팅(Netting)","리딩과 래깅(Leading and Lagging)"],"a":4,"t":"외환, 환율","e":"환율 예상에 따라 결제 시기를 앞당기거나(리딩) 늦추는(래깅) 전략이에요. 환율 하락이 예상되니 달러 지급을 늦추는 래깅을 쓴 경우입니다."},{"id":"66-2-26","r":66,"s":"무역결제","n":26,"q":"(주)한국반도체는 3개월 후 수령할 수출대금의 환리스크를 헤지하기 위하여 아래와 같은 조건으로 달러 풋옵션을 매입하였다. 옵션 만기일에 USD/KRW 현물환율이 1,400원으로 정해졌다면, 옵션 프리미엄을 고려하였을 때 (주)한국반도체는 달러를 어떤 환율로 환전한 결과가 되는가?\n\n| USD/KRW 달러 풋옵션 | |\n| 행사가 | 1,350 |\n| 옵션 프리미엄 | 달러당 20원 |\n| 만기 | 3개월 |","c":["1,420원","1,380원","1,370원","1,330원"],"a":2,"t":"외환, 환율","e":"현물환율 1,400원이 행사가 1,350원보다 높으니 풋옵션을 행사하지 않고 시장에서 1,400원에 팔아요. 이미 낸 프리미엄 20원을 빼면 실질 환율은 1,380원입니다."},{"id":"66-2-27","r":66,"s":"무역결제","n":27,"q":"N은행이 갑기업에게 달러/엔 현물환율을 159.23/27로 고시한 경우, 다음 설명 중 잘못된 것은?","c":["본 환율고시의 스프레드는 4포인트다.","갑기업이 달러를 대가로 1억 엔을 매입하는 경우 159.27을 적용한다.","이때 N은행의 경쟁 은행인 K은행이 갑기업에게 달러/엔 현물환율을 159.21/28로 고시하는 경우 갑기업은 N은행에 비해 K은행과 현물환거래를 하는 것이 불리하다.","N은행이 갑기업에게 달러/엔 현물환율을 159.23/27로 고시한 이후 달러/엔 환율이 160.23/27로 변하면 달러가 강세가 되었다."],"a":2,"t":"외환, 환율","e":"달러를 주고 엔을 사는 건 갑기업이 달러를 '파는' 거래라 은행의 Bid 159.23을 적용해요. 159.27이라고 한 ②가 틀렸습니다. K은행은 Bid가 더 낮고 Offer가 더 높아 어느 방향이든 불리해요."},{"id":"66-2-28","r":66,"s":"무역결제","n":28,"q":"다음과 관련된 설명으로 가장 올바른 것을 고르시오.\n\n국내 수입기업인 ㈜한무통상은 미국기업과 USD 200,000에 수입계약을 체결하였다. 수입계약 체결 당시 환율이 미달러당 1,450원이었다. 그러나 3개월 후 수입대금을 결제할 시점의 환율은 1,470원으로 상승하였다.","c":["환율 변동은 회계상 영향은 주지만 실제 현금흐름에는 영향이 없다.","거래 환리스크가 발생했다.","영업 환리스크가 발생했다.","환산 환리스크와 영업 환리스크가 동시에 발생했다."],"a":2,"t":"외환, 환율","e":"이미 맺은 외화 계약을 결제할 때 환율이 달라져 실제로 원화를 더 내게 된 건 거래 환리스크예요. 실제 현금흐름에도 영향을 줍니다."},{"id":"66-2-29","r":66,"s":"무역결제","n":29,"q":"환변동보험에 관한 설명으로 잘못된 것은?","c":["환변동보험의 기본계약에는 보장환율과 결제환율이 존재한다.","기업은 은행과 선물환계약을 체결하고, 향후 결제 시 환율 변동으로 손실이 발생하는 경우 한국무역보험공사에 보험금을 청구한다.","보장환율은 청약일의 시장 평균 환율에다 기간별로 스왑 포인트를 더하여 구해진\n다.","스왑 포인트란 우리나라의 금리와 외국통화의 금리 차이를 반영한 것이다."],"a":2,"t":"외환, 환율","e":"환변동보험은 기업이 은행이 아니라 한국무역보험공사와 맺는 계약이에요. 보장환율보다 결제환율이 불리하면 공사가 차액을 보상하고, 유리하면 기업이 차액을 납부합니다. 그래서 ②가 틀렸습니다."},{"id":"66-2-30","r":66,"s":"무역결제","n":30,"q":"선물환과 통화선물에 관한 설명으로 잘못된 것은?","c":["선물환거래는 당사자 간의 합의에 따라 다양한 계약조건이 결정된다.","통화선물거래는 선물거래소라는 물리적 장소에서 공개적으로 거래가 이루어진다.","통화선물거래는 대부분의 계약이 만기일 이전에 반대매매에 의하여 종료되고 지극히 일부만 실물 인수도가 이루어진다.","선물환거래는 계약취소를 방지하기 위하여 모든 계약에 대해 증거금을 적립한다."],"a":4,"t":"외환, 환율","e":"선물환은 은행과 기업이 1:1로 맺는 장외거래라 신용도에 따라 증거금 없이도 거래할 수 있어요. 모든 계약에 증거금을 쌓는다는 ④가 틀렸습니다. 일일정산과 증거금은 통화선물의 특징이에요."},{"id":"66-3-1","r":66,"s":"무역계약","n":1,"q":"다음 중 국제무역계약의 준거법이 될 수 있는 것을 모두 기재한 것은?\n\nA. 매도인의 국가와 매수인의 국가가 Vienna Convention 1980의 가입국인 경우 Vienna Convention 1980\nB. 우월적 지위에 있는 매수인이 자신의 국가의 법을 준거법으로 제시하고, 매도인이 이에 동의한 경우 매수인 국가의 법\nC. 재판관할지가 한국으로 되어있는 경우 한국법\nD. Incoterms 2020\nE. 매도인과 매수인이 준거법을 합의하지 않은 경우 매수인 국가의 법","c":["A, B","A, B, D","A, C, D","A, C, E"],"a":1,"t":"무역계약 일반","e":"양국이 가입한 CISG(A)와 당사자가 합의한 국가의 법(B)은 준거법이 돼요. 재판관할지가 곧 준거법이 되는 건 아니고(C), 인코텀즈는 법이 아닌 거래규칙이며(D), 합의가 없다고 매수인 국가 법이 자동 적용되지도 않아요(E)."},{"id":"66-3-2","r":66,"s":"무역계약","n":2,"q":"다음 분쟁에 관한 설명으로 올바른 것은?\n\nㅇ 한국 수출자 A와 일본 수입자 B는 동일 물품에 대해서 동일한 조건으로 반복 거래를 하면서 첫 거래 이후에는 별도의 계약서를 작성하지 않았다.\nㅇ B가 Purchase Order로 주문하면 A는 별도의 승낙 없이 물품을 생산해서 선적하고, B에게 선적통지 후 수출대금을 영수한다.\nㅇ 이번에도 동일한 방법으로 거래가 진행되던 중 갑자기 수입국에서 거래물품의 가격이 폭락하는 상황이 발생했다.\nㅇ 이에 B는 A에게 주문에 대한 승낙이 없었다는 이유로 계약은 성립되지 않았다고 하면서 물품을 선적하지 말 것, 그리고 이미 선적한 경우 물품 수취 거부와 함께 대금지급 거절을 통보하였다.","c":["B의 주장은 Market Claim에 해당하며, Claim 관련 별도의 합의 및 계약서가 없는경우 국제상관습에 따라 A는 수입국 시장 평균 가격으로 제품 가격을 할인해 주어야 한다.","B의 주문 청약에 대해 A의 승낙이 없었으므로 계약은 성립되지 않았고, 따라서 B의주장은 정당하다.","이번 거래에 대한 계약서는 없지만 동일한 조건으로 반복 거래를 한 것은 거래 관습으로 볼 수 있으므로 계약은 성립되었다. 따라서 B의 주장은 부당하다.","당사자 간에 중대한 분쟁이 발생한 상황이므로 이러한 분쟁은 중재로는 해결될 수없고, UNCISG 1980에 의거 국제소송으로만 해결할 수 있다."],"a":3,"t":"CISG","e":"당사자 사이에 확립된 관행이 있으면 그 관행에 따라 물품 발송 같은 행위로도 승낙할 수 있어요(CISG 제9조, 제18조 3항). 반복 거래로 관행이 생겼으니 계약은 성립했고, 가격 폭락을 이유로 한 B의 주장은 부당한 마켓클레임이에요."},{"id":"66-3-3","r":66,"s":"무역계약","n":3,"q":"Incoterms 2020의 규칙 사용이 잘못된 것을 모두 기재한 것은?\n\nA. FOB BUSAN SELLER’S WAREHOUSE\nB. CIF SHANGHAI\nC. FCA INCHEON CFS\nD. FOB GIMHAE AIRPORT\nE. DPU TOKYO PORT","c":["A, B, E","A, D","B, C, D","C, D, E"],"a":2,"t":"인코텀즈","e":"FOB 뒤에는 선적항이 와야 해요. 매도인 창고(A)나 공항(D)을 쓴 건 잘못이에요. CIF 목적항, FCA 인도장소, DPU 목적지 표시는 맞습니다."},{"id":"66-3-4","r":66,"s":"무역계약","n":4,"q":"Incoterms 2020을 기준으로 할 때, FOB 조건에서 물품의 본선 적재 시점에 비용과 위험에 관한 설명으로 올바른 것은?","c":["본선 적재 이후에 비용은 매도인이, 위험은 매수인이 부담한다.","본선 적재 이후에 비용은 매수인이, 위험은 매도인이 부담한다.","본선 적재 이후에 비용과 위험은 매도인이 계속해서 부담한다.","본선 적재 이후에 비용과 위험은 매도인으로부터 매수인에게 이전된다."],"a":4,"t":"인코텀즈","e":"FOB는 선적항에서 본선에 적재될 때 위험과 비용이 함께 매도인에게서 매수인에게 넘어가요. 위험과 비용 분기점이 다른 건 C 조건입니다."},{"id":"66-3-5","r":66,"s":"무역계약","n":5,"q":"Vienna Convention(1980)에서 규정하고 있는 내용으로 잘못된 것은?","c":["CISG 제25조에서 정의하는 ‘본질적 계약위반(Fundamental Breach)’에 따르면 위반 당사자가 그러한 결과를 예견하지 못했고, 동일한 부류의 합리적인 자도 예견할수 없었던 경우에는 본질적 위반이 아니다.","매도인이 특정 장소에서 물품을 교부할 의무가 없는 경우, 위험은 물품이 매수인에게 교부된 때 이전한다.","취소불능 청약이라도, 청약의 철회 통지가 청약이 피청약자에게 도달하기 전 또는동시에 도달하는 경우에는 철회할 수 있다.","CISG가 적용되려면 계약 당사자들의 영업소가 서로 다른 국가에 있어야 하며, 이국가들이 모두 가입국인 경우에 직접 적용된다."],"a":2,"t":"CISG","e":"운송이 포함된 계약에서 매도인이 특정 장소에서 인도할 의무가 없으면, 위험은 첫 운송인에게 물품을 넘길 때 이전돼요(CISG 제67조). 매수인에게 교부된 때라고 한 ②가 틀렸습니다."},{"id":"66-3-6","r":66,"s":"무역계약","n":6,"q":"Vienna Convention(1980)에서 규정하고 있는 청약과 승낙 및 계약성립에 관한 내용으로잘못된 것은?","c":["승낙의 과정을 거치지 않고, 피청약자가 바로 청약의 내용을 실행하는 것은 의사실현에 의한 계약의 성립이다.","사전에 양 당사자가 특별히 정한 것이 없다면 침묵 혹은 부작위 자체만으로는 승낙이인정되지 않는다.","불특정 다수에 대한 청약은 특별한 경우를 제외하고는 모두 청약으로 본다.","승낙을 의도하고 있고, 청약의 조건을 실질적으로 변경하지 아니하는 청약에 대한 응답이 부가적 조건을 포함하고 있더라도 승낙으로 인정된다."],"a":3,"t":"CISG","e":"CISG 제14조 2항: 불특정 다수에 대한 제안은 반대 의사가 명백하지 않으면 청약의 유인이에요. 모두 청약으로 본다는 ③이 틀렸습니다."},{"id":"66-3-7","r":66,"s":"무역계약","n":7,"q":"국제무역계약에서 준거법으로 CISG를 명시하였는데 계약의 해석에 관한 분쟁이 발생하였다. 이에 관한 설명으로 가장 적절한 것은?","c":["계약의 해석은 당사자의 의사, CISG 및 거래관행 등을 고려하여 이루어질 수 있으며, 필요시 UNIDROIT Principles가 해석상 참고자료로 활용될 수 있다.","UNIDROIT Principles는 국제조약이므로 CISG보다 우선 적용된다.","UNIDROIT Principles는 당사자의 명시적인 합의가 없더라도 항상 강제 적용된다.","CISG가 적용되면 계약 해석을 위해 다른 국제규범을 참고할 수 없다."],"a":1,"t":"CISG","e":"계약 해석은 당사자 의사, CISG, 거래관행을 고려하고, UNIDROIT 원칙은 해석의 참고자료로 쓸 수 있어요. UNIDROIT 원칙은 조약이 아니라 연성규범이라 우선 적용되거나 강제되지 않습니다."},{"id":"66-3-8","r":66,"s":"무역계약","n":8,"q":"계약은 일단 체결되면 당사자에게 불리한 사정이 발생하더라도 이행되어야 하는 것이 원칙이다. 다만, 예외적으로 인정되는 사정변경에 관한 설명으로 올바른 것은?","c":["사정변경이 인정되기 위해서는 계약 체결 후 이행이 객관적으로 불가능해져야 한다.","사정변경이 인정되면 계약은 자동으로 무효가 된다.","사정변경이 인정되기 위해서는 계약체결 당시 해당 사정을 합리적으로 예견할 수없었어야 한다.","사정변경이 인정되는 경우, 불리해진 당사자는 곧바로 법원에 계약해제를 청구할수 있다."],"a":3,"t":"무역계약 일반","e":"사정변경이 인정되려면 계약 체결 당시 그 사정을 합리적으로 예견할 수 없었어야 해요. 이행이 불가능할 필요는 없고 현저히 어려우면 되며, 자동 무효나 곧바로 해제가 아니라 재협상이 먼저입니다."},{"id":"66-3-9","r":66,"s":"무역계약","n":9,"q":"다음 중 UNIDROIT Principles에 따른 Hardship 발생 후 불이익을 입은 당사자의 권리 및 법원 등의 조치에 관한 설명으로 옳은 것은?","c":["불이익을 입은 당사자는 Hardship이 발생하면 즉시 계약을 해제할 수 있다.","불이익을 입은 당사자는 Hardship이 발생하면 계약이행을 자동으로 중단할 수 있다.","불이익을 입은 당사자는 Hardship이 발생하면 상대방에게 계약의 재협상을 요청할 수있으며, 그 자체만으로 계약의 이행을 거절할 수는 없다.","Hardship을 긍정하는 법원이나 중재인은 Hardship이 발생하면 반드시 계약을 종료시켜야 한다."],"a":3,"t":"CISG","e":"UNIDROIT 원칙 제6.2.3조: Hardship이 생기면 불이익을 입은 당사자는 재협상을 요청할 수 있지만, 그것만으로 이행을 거절할 수는 없어요. 법원은 계약을 종료하거나 조정할 수 있습니다."},{"id":"66-3-10","r":66,"s":"무역계약","n":10,"q":"국제물품매매계약에 관한 유엔협약(CISG)에서 규정하는 청약과 승낙에 관한 설명 중 올바른 것은?","c":["물품의 품명과 수량이 표시된 광고나 카탈로그는 그 내용이 확정적이므로 별도의의사표시가 없는 한 청약으로 본다.","청약자가 승낙기간을 정한 경우에 청약자는 승낙기간 내 언제든지 자유롭게 청약을철회할 수 있다.","승낙을 의도한 응답이라도 가격, 수량, 품질 등 청약의 중요한 조건을 부가 또는 변경의 경우에는 원칙적으로 청약의 거절이자 반대청약이 된다.","승낙의 효력은 승낙자가 승낙 의사를 청약자에게 발송할 때 발생한다."],"a":3,"t":"CISG","e":"승낙 의도가 있어도 가격, 수량, 품질 같은 중요 조건을 바꾸면 청약 거절이자 반대청약이에요(CISG 제19조). 광고는 청약의 유인이고(①), 승낙기간을 정한 청약은 취소불능이며(②), 승낙은 도달 시 효력이 생겨요(④)."},{"id":"66-3-11","r":66,"s":"무역계약","n":11,"q":"국제물품매매계약에 관한 유엔협약(CISG)에서 규정하고 있는 무역계약의 성립과 이행에 관한 설명으로 올바른 것은?","c":["CISG는 국제물품매매계약에 관한 법률문제를 포괄적으로 규율하므로 계약의 유효성과 관련해서도 규정한다.","무역계약은 국제거래의 특성상 서면으로 작성되어야 하며, 구두 합의나 전자적 의사표시에 의한 계약은 인정되지 않는다.","매수인은 매도인의 선적이 완료된 후에 대금 지급 절차를 개시할 의무가 발생한다.","CISG는 물품 소유권 이전의 효과는 원칙적으로 다루지 않으나, 매도인의 소유권 이전 의무는 규정하고 있다."],"a":4,"t":"CISG","e":"CISG는 계약이 소유권에 미치는 효과는 다루지 않지만(제4조), 매도인에게 소유권을 이전할 의무는 정하고 있어요(제30조). 유효성은 다루지 않고(①), 서면이 필요 없으며(②), 대금 지급 시기는 계약에 따라요(③)."},{"id":"66-3-12","r":66,"s":"무역계약","n":12,"q":"다음 특수거래 형태에 관한 설명으로 올바른 것은?","c":["BWT 거래는 수입자가 대금을 먼저 지급한 후 수출자가 일정 기간이 지나고 물품을 선적하는 방식이므로 수입자의 재고 부담이 크다.","BWT 거래는 수출자가 물품을 해외 보관 장소에 반입한 후 현지 수요나 판매계약성립에 따라 인도하는 방식으로 활용될 수 있다.","O/A 거래는 은행이 개설한 신용장을 근거로 수출자가 대금을 회수하는 방식이므로수출자의 대금 회수 위험이 거의 없다.","O/A 거래는 수출자가 물품을 선적하기 전에 수입자가 대금을 미리 지급하는 결제방식이다."],"a":2,"t":"특수거래 형태","e":"BWT는 수출자가 수입국 보세창고에 물품을 미리 넣어두고 현지에서 판매가 성사되면 인도하는 방식이에요. O/A는 신용장 없이 선적 후 외상으로 받는 방식입니다."},{"id":"66-3-13","r":66,"s":"무역계약","n":13,"q":"국제계약의 형태로서 라이선스와 프랜차이즈계약에 관한 설명으로 올바른 것은?","c":["라이선스와 프랜차이즈계약 모두 지식재산권의 소유권 자체를 이전하는 계약이다.","프랜차이즈는 경영기법, 운영시스템, 교육훈련 등 지속적인 지원을 포함하지만, 라이선스는 주로 특정 지식재산권의 사용 허락에 중점을 둔다.","라이선스는 로열티 지급이 필요하지만, 프랜차이즈는 로열티가 인정되지 않는다.","프랜차이즈는 상표 사용이 허용되지 않으며, 오로지 상품 판매만 가능하다."],"a":2,"t":"특수거래 형태","e":"라이선스는 특정 지식재산권 사용 허락이 중심이고, 프랜차이즈는 상표에 더해 경영기법, 운영 시스템, 교육 같은 지속적 지원까지 포함해요. 둘 다 소유권을 넘기지 않고 로열티를 받습니다."},{"id":"66-3-14","r":66,"s":"무역계약","n":14,"q":"무역계약의 품질조건에 관한 설명으로 잘못된 것은?","c":["견본매매는 매매 당사자가 제시한 견본을 기준으로 품질을 정하는 방식으로 실제인도된 물품은 원칙적으로 견본과 동일하거나 실질적으로 일치해야 한다.","규격매매는 공인된 규격이나 표준에 따라 품질을 정하는 방식으로 공산품이나 기계류 거래에서 활용될 수 있다.","평균중등품질조건은 주로 장래 수확될 농산물 등과 같이 계약 당시 품질을 확정하기 어려운 물품에 활용될 수 있다.","판매적격품질조건은 선적 시점의 판매 적격성을 지닌 것임을 보증하는 조건이므로내부 결함이 외관상 확인이 어려운 목재, 냉동수산물 등에서 사용된다."],"a":4,"t":"거래조건(품질, 수량, 선적)","e":"판매적격품질조건(GMQ)은 물품을 '인도할 때(양륙 시)' 판매에 적합한 품질임을 보증하는 조건이에요. 선적 시점이라고 한 ④가 틀렸습니다. 목재, 냉동수산물에 쓰인다는 설명은 맞아요."},{"id":"66-3-15","r":66,"s":"무역계약","n":15,"q":"한국의 서경상사는 베트남의 하이랜드커피로부터 커피원두를 수입하면서 계약서에 \"FAQ Quality, 100 MT ±5% at Seller's Option, USD 2,000 per MT CIF Busan\"이라고 약정하였다. 다음 설명 중 올바른 것은?","c":["FAQ Quality Terms는 선적 시점의 실제 품질과 관계없이 매수인이 요구하는 품질을의미하며, 매도인은 품질보증책임을 부담하지 않는다.","\"100 MT ±5% at Seller's Option”은 매수인이 수량을 95~105 MT 범위 내에서 선택할 수 있음을 의미한다.","FAQ 조건은 특히 생산물의 선물거래에 많이 쓰여지는 조건이며, 매도인의 입장에서생산 및 출하관리 부담이 감소했다.","CIF 가격조건에서는 선적 후 발생하는 위험도 목적항 도착 시까지 매도인이 부담한다."],"a":3,"t":"거래조건(품질, 수량, 선적)","e":"FAQ(평균중등품질)는 장래 수확물 같은 선물거래에 많이 쓰고, 그 계절 평균 품질이면 되니 매도인 부담이 줄어요. ±5%는 매도인이 선택하고(②), CIF에서 선적 후 위험은 매수인이 져요(④)."},{"id":"66-3-16","r":66,"s":"무역계약","n":16,"q":"포괄계약서(Master Contract)에 관한 설명으로 올바른 것은?","c":["포괄계약서는 거래상대방과 최초 거래하거나 초기 거래에 활용한다.","포괄계약서는 특정품목을 거래할 때마다 매번 구체적인 거래조건에 대해 합의한다.","포괄계약서 표면에는 수량·품질·가격 등 협의 내용을 기재하고, 이면에는 일반거래조건(General Terms and Conditions)을 기재한다.","포괄계약서는 동일한 상대방과 지속적인 거래가 이루어지는 경우 사용하며, 포괄계약조건에 따라 간단한 청약(주문)과 승낙으로 계약조건을 확정한다."],"a":4,"t":"청약과 승낙","e":"포괄계약서는 같은 상대와 계속 거래할 때 기본 조건을 정해 두고, 이후 개별 거래는 간단한 주문과 승낙으로 확정하는 방식이에요. 최초 거래나 매번 합의하는 건 개별계약입니다."},{"id":"66-3-17","r":66,"s":"무역계약","n":17,"q":"다음 계약서 조항에 관한 설명으로 잘못된 것은?\n\nIf the Seller fails to deliver the Goods within the delivery period specified in this Contract for any reason attributable to the Seller, the Seller shall pay the Buyer, as liquidated damages and not as a penalty, an amount equal to zero point five percent (0.5%) of the total Contract Price of the delayed Goods for each completed week of delay or part thereof. The total amount of such liquidated damages shall not exceed five percent (5%) of the total Contract Price of the delayed Goods.","c":["클레임 제기자는 손해액을 입증하지 않아도 된다.","약정한 금액이 과도한 경우, 신청에 의하여 법원은 합리적인 한도까지 감액할 수 있다.","약정된 금액보다 더 큰 손해를 입증하는 경우, 약정된 금액을 초과하여 청구할 수 있\n다.","손해배상액의 예정 조항은 상대방의 계약불이행에 대한 선제적 조치이며, 청구할 손해배상액을 계약서에 미리 명시하는 조항이다."],"a":3,"t":"계약 조항","e":"손해배상액 예정 조항이 있으면 실제 손해가 더 커도 원칙적으로 약정 금액을 넘어 청구할 수 없어요. 그래서 ③이 틀렸습니다. 손해 입증이 필요 없고, 과도하면 법원이 감액할 수 있어요."},{"id":"66-3-18","r":66,"s":"무역계약","n":18,"q":"국제물품매매계약의 조항 해설로 올바른 것은?","c":["계약 내용의 일부가 어떠한 사유로 실효되거나 무효가 되더라도 그 계약 전체가 실효또는 무효로 되는 것은 아니라는 조항을 severability clause라고 한다.","계약 당사자의 어느 일방이 계약상의 어떤 조항에 의한 이행청구를 한번 하였다면 이를 이유로 그 후의 동일 조항에 의한 이행청구권을 포기한 것으로 보거나 박탈할 수없다는 조항을 non-waiver clause라고 한다.","계약체결과정에서 그 계약과 관련되어 이루어졌던 의견교환이나 합의 또는 약속 등과관련된 조항은 secrecy clause이다.","Infringement clause란 특허, 상표 등 산업재산권과 관련하여 제조자가 책임을 지겠다는 내용으로 제조물배상책임조항이라고 한다."],"a":1,"t":"계약 조항","e":"계약 일부가 무효가 돼도 나머지는 유효하다는 조항은 분리가능조항(Severability clause)이에요. ③은 완전합의조항(Entire agreement) 설명이고, Infringement 조항은 지식재산권 침해 책임 조항으로 제조물책임과 달라요."},{"id":"66-3-19","r":66,"s":"무역계약","n":19,"q":"다음은 비엔나협약(1980) 제82조의 내용이다. 다음 문구와 관련한 설명으로 잘못된 것은?\n\nThe buyer loses the right to declare the contract avoided or to require the seller to deliver substitute goods if it is impossible for him to make restitution of the goods substantially in the condition in which he received them.","c":["계약의 해제란 이미 성립된 계약의 효력을 계약 성립한 때로 소급하여 소멸시키는 것이다.","계약해제는 당사자의 어느 일방의 의사표시로 이루어지며, 계약해제의 선언은 그것이상대방에게 통지되었을 경우에만 효력이 있다고 규정하고 있다.","원상회복의무를 이행하지 못하더라도 명백한 물품의 하자가 있음이 입증되면 계약을해제할 수 있다.","인도 불이행의 경우로서 매수인이 설정한 추가 이행기간 내에 매도인이 물품을 인도하지 아니할 것임을 표명한 경우에도 계약은 해제할 수 있다."],"a":3,"t":"CISG","e":"제82조는 받은 상태 그대로 물품을 돌려줄 수 없으면 매수인이 해제권과 대체물 청구권을 잃는다고 정해요. 하자가 입증되면 원상회복 없이도 해제할 수 있다는 ③이 틀렸습니다."},{"id":"66-3-20","r":66,"s":"무역계약","n":20,"q":"분쟁 해결방식에 관한 설명으로 잘못된 것은?","c":["알선은 공정한 제3자가 당사자의 일방 또는 쌍방이 의뢰하면 분쟁 사건에 개입하여 그해결을 위해 조언하는 것이다.","중재는 중재판정에 복종함으로써 분쟁을 해결하는 것이며, 법원의 판결로 분쟁을 확정하는 방법이다.","조정은 절차가 간단하고 공정한 제3자가 조정안을 제시하므로 비교적 소액의 분쟁해결에 이용되는 경우가 많다.","소송은 공개주의 원칙이므로 영업상 비밀이나 사인(회사)의 비밀이 공개되어 대외신용도가 실추될 수 있다."],"a":2,"t":"클레임, 중재","e":"중재는 법원 판결이 아니라 당사자가 선정한 중재인의 판정에 따르기로 해서 분쟁을 해결하는 방법이에요. 중재판정은 확정판결과 같은 효력을 가지지만 법원 판결 자체는 아닙니다."},{"id":"66-3-21","r":66,"s":"무역계약","n":21,"q":"한국의 반도패션은 중국의 왕차오사에게 남성용 의류 5,000장을 장당 USD 30, CIF Busan 조건으로 구매하겠다고 청약하였다. 이에 대해 왕차오사는 \"수량과 가격은 동의하나 선적조건은 FOB Shanghai로 변경한다\"는 내용의 회신을 보냈다. 이후 반도패션은 별다른 이의 없이 신용장을 개설하였다. 다음 설명 중 올바른 것은?","c":["중국의 왕차오사의 회신은 단순 승낙에 해당하므로 CIF조건의 계약이 성립한다.","중국의 왕차오사의 회신은 반대청약(Counter Offer)에 해당하며, 한국의 반도패션의 신용장 개설은 이에 대한 승낙으로 볼 수 있다.","신용장 개설은 계약성립과는 무관한 행위이다.","승낙은 반드시 서면으로 이루어져야 하므로 계약은 성립하지 않는다."],"a":2,"t":"CISG","e":"인도조건을 바꾼 회신은 실질적 변경이라 반대청약이에요. 반도패션이 이의 없이 신용장을 연 행위는 그 반대청약에 대한 행위에 의한 승낙으로 볼 수 있어 FOB Shanghai 조건 계약이 성립합니다."},{"id":"66-3-22","r":66,"s":"무역계약","n":22,"q":"매도인은 DDP 조건으로 중앙아시아의 매수인과 무역계약을 체결하고 물품을 안전하게 운송하였으나, 수입국의 갑작스러운 수입통관 규정 변경으로 인해 수입통관이 이루어지지 않고 있다. 이 상황에 관한 분석으로 잘못된 것은?","c":["수입통관 거부는 매도인이 통제할 수 없는 조치라는 점에서 매도인은 불가항력을주장해야 하고, 이를 통한 이행불능에 대한 손해배상 책임과 상대방의 계약해제권행사에 대하여 영구히 면제받아야 한다.","실무적으로 수입통관 불능 리스크를 줄이기 위해 매도인은 계약 체결 시 매수인에게 수입통관 및 관세를 부담하게 하는 변형 조항을 넣거나, DAP 조건으로 전환하는 것이 리스크 관리에 유리하다.","DDP 조건은 매도인이 수출입 통관 및 승인과 관세 및 관련 세금을 모두 부담하는조건이므로, 수입통관 불능으로 인한 계약 불이행 책임은 일차적으로 매도인에게있다.","수입통관 불능 사태로 인해 발생하는 보세창고 비용을 포함하는 추가적인 관련 비용에 대해서 매도인은 본인의 부담으로 해결해야 한다."],"a":1,"t":"CISG","e":"불가항력(CISG 제79조)이 인정되더라도 장애가 있는 기간 동안 손해배상 책임만 면제되고, 상대방의 계약해제권까지 영구히 막지는 못해요. '영구히 면제'라고 한 ①이 틀렸습니다."},{"id":"66-3-23","r":66,"s":"무역계약","n":23,"q":"정기선 해상운송과 정기선 항로 전반에 관한 내용을 표현한 것 중 잘못된 것은?","c":["정기선은 컨테이너선, 재래화물선, 다목적선 등으로 분류된다.","정기선 해운의 경우 대형 컨테이너선의 경쟁적 등장으로 운송 기간의 단축과 운항 빈도 증가를 가져오고 서비스지역 확대 등 부가가치 서비스가 개발되고 있다.","선주로부터 그 선복의 일부 또는 전부를 용선하는 경우 항해용선계약, 기간용선계약, 나용선계약이 있다.","용선운송은 부정기선이며, 운임은 tariff rate에 따른다."],"a":4,"t":"해상운송","e":"용선운송(부정기선)의 운임은 공표 tariff가 아니라 시장 수급에 따라 당사자가 협상해서 정해요. tariff rate에 따른다는 ④가 틀렸습니다."},{"id":"66-3-24","r":66,"s":"무역계약","n":24,"q":"국제운송서류 관련 용어에 관한 설명으로 올바른 것은?","c":["Bill of Lading for Ocean Shipment or Multimodal Transport는 포워더만 발행하는 복합운송증권의 영문 명칭이다.","Master Air Waybill은 항공사 자체가 직접 발행하여 화주에게 제공하여 주는 항공화물운송장이다.","Original B/L 없이 Delivery Order를 발급받는 방법의 서류로는 Sea Waybill, Surrendered B/L, Letter of Guarantee가 있다.","Switch B/L은 중계무역과 관련한 선하증권으로, 발행에 관한 국제규정이나 상법상 정의가 없다. 또한 포워더의 내부 규정에 따라 발급되며, 포워더만이 발행할 수 있는 해상 운송서류이다."],"a":3,"t":"해상운송","e":"원본 B/L 없이 화물인도지시서(D/O)를 받는 방법은 Sea Waybill, Surrendered B/L, Letter of Guarantee가 있어요. 복합운송증권은 운송인도 발행하고(①), Master AWB는 화주가 아니라 포워더에게 주며(②), Switch B/L은 선사도 발행해요(④)."},{"id":"66-3-25","r":66,"s":"무역계약","n":25,"q":"수입화물이 이미 부산항에 도착하였으나 원본 운송서류가 아직 은행을 통해 전달되지않았는데, 수입업자는 즉시 화물 인도를 원하고 있다. 이 경우에 선박회사가 부담하는법적 위험이 가장 큰 처리방식은?","c":["B/L을 대체하는 운송장(Sea Waybill)에 의한 인도","B/L에서 유가증권성을 제거한 Surrendered B/L에 의한 인도","수입자가 발행한 Letter of Guarantee(L/G)를 받고 원본 B/L 없이 화물을 인도","원본 B/L을 확인한 후 화물을 인도"],"a":3,"t":"해상운송","e":"L/G를 받고 원본 B/L 없이 화물을 내주면, 나중에 진짜 B/L 소지인이 나타났을 때 선사가 책임을 져야 해서 법적 위험이 가장 커요."},{"id":"66-3-26","r":66,"s":"무역계약","n":26,"q":"항공운송 물류비 관련 용어에 관한 설명으로 잘못된 것은?","c":["Chargeable Weight는 모든 항공사가 자체적으로 정한 운임산출 중량으로, 용적 중량의경우 1CBM＝167kg을 기준으로 하여 높은 중량을 기준으로 화주에게 운임을 청구한다.","최저운임은 한 건의 화물운송에 적용할 수 있는 가장 적은 운임을 의미하며, 운임표에 “M”으로 표시한다.","착지불 수수료인 Charge Collect Fee(혹은 Collect Charge Fee)는 운임을 수하인이 납부하게 되어있는 화물에 대하여 동 금액의 일정 비율을 운임에 더하여 항공사가 추가로 징수하는 수수료이다.","보안 할증료인 Security Surcharge는 항공기 안전 운항과 관련된 보안 검색 비용이다."],"a":1,"t":"항공, 복합운송","e":"Chargeable Weight는 항공사가 제각각 정하는 게 아니라 IATA 기준(용적중량 6,000cm³ = 1kg, 1CBM ≈ 167kg)에 따라 실중량과 비교해 큰 쪽을 적용해요. '모든 항공사가 자체적으로 정한'이라는 ①이 틀렸습니다."},{"id":"66-3-27","r":66,"s":"무역계약","n":27,"q":"물적 손해 중 현실전손이 아닌 것은?","c":["물품이 원래의 성질을 상실할 정도로 심한 손상을 입은 경우","손해의 회복 비용이 회복되었을 때, 화물의 가액을 초과할 것으로 예상될 때","보험의 목적이 실제적으로 멸실되었을 때","선박과 화물의 행방이 상당 기간 동안 불명인 경우"],"a":2,"t":"해상보험","e":"수리하거나 회복하는 비용이 회복 후 가액을 넘을 것으로 예상되는 경우는 현실전손이 아니라 추정전손이에요. 성질 상실, 실제 멸실, 상당 기간 행방불명은 현실전손입니다."},{"id":"66-3-28","r":66,"s":"무역계약","n":28,"q":"보험계약의 변경 및 배서에 관한 설명으로 올바른 것은?","c":["보험금액의 증감: Offer sheet 상 수량 및 금액보다 많아지거나 적어진 경우 변경된금액에 맞춰 보험증권의 배서가 필요하다.","선명의 통지 및 확정: To be Noticed 조건으로 보험계약을 체결한 경우 선명과 항차가확정되면 무조건 보험자에게 통지하여야 한다. 그렇지 않으면 보험계약의 효력은 소멸된다.","Assured or Applicant 변경: 별도의 실명 확인 날인이 없이 보험자에게 서면으로 변경통지만 하면 된다.","품목 및 수량의 변경: 보험증권의 배서가 반드시 필요한 것은 아니다."],"a":1,"t":"해상보험","e":"실제 수량이나 금액이 Offer sheet와 달라지면 바뀐 금액에 맞게 보험증권에 배서해야 해요. 선명 미통지가 곧 계약 소멸은 아니고(②), 피보험자 변경이나 품목, 수량 변경도 배서가 필요합니다(③, ④)."},{"id":"66-3-29","r":66,"s":"무역계약","n":29,"q":"소손해 면책(franchise) 및 면책률 약관(memorandum clause)에 관한 설명으로 올바른 것은?","c":["소손해 면책(franchise)은 손해액이 약정한 면책률을 초과하더라도, 면책률에 해당하는 부분은 공제하고 나머지만 보상한다.","소손해 공제(deductible)는 손해액이 면책률을 초과하면 면책률 공제 없이 손해액 전체를 보상한다.","면책률 약관(memorandum clause)은 보험금 정산비용에도 미치지 못하는 일정 비율미만의 소손해를 담보하지 않음으로써 보험경영 측면에서 담보 범위를 감소시키기위해 규정한 조항이다.","ICC(B)나 ICC(C) 조건에서는 소손해 면책률이 기본적으로 포함되어 있어, 일정 비율이하의 손해는 절대 보상되지 않는다."],"a":3,"t":"해상보험","e":"면책률 약관은 정산 비용도 안 되는 일정 비율 미만의 작은 손해를 보상하지 않아 보험 운영 부담을 줄이는 조항이에요. Franchise는 면책률을 넘으면 전액 보상하고(①), Deductible은 항상 공제 후 보상하며(②), ICC 2009 (B), (C)에 기본 면책률이 들어 있지는 않아요(④)."},{"id":"66-3-30","r":66,"s":"무역계약","n":30,"q":"다음 보기와 같은 상황에서 분손 방식으로 보험자가 지급하는 보험금으로 올바른 것은?\n\nㅇ 냉장고 1,000대를 $300,000로 가입했을 경우, 운송 중의 보험사고로 그중의 400대가 해수 침손을 입고 상품 가치가 저하되었다.\nㅇ 이를 공매하여 1대당 정품 시가는 $400이었는데 손상되었기 때문에 $200에 판매되었다. 이 경우의 손해보상금은 얼마인가?","c":["160,000달러","120,000달러","80,000달러","60,000달러"],"a":4,"t":"해상보험","e":"손해율 = (정품가 400 − 손상품 200) ÷ 400 = 50%예요. 손상된 400대의 보험금액은 400 × $300 = $120,000이고, 여기에 50%를 곱하면 $60,000입니다."},{"id":"66-4-1","r":66,"s":"무역영어","n":1,"q":"다음 밑줄 친 빈칸 (A)에 들어갈 용어에 관한 설명으로 잘못된 것은?\n\n· A proposal for concluding a contract addressed to one or more specific persons constitutes an offer if it is sufficiently definite and indicates the intention of the offeror to be bound in case of acceptance. A proposal is sufficiently definite if it indicates the goods and expressly or implicitly fixes or makes provision for determining the quantity and the price.\n· A proposal other than one addressed to one or more specific persons is to be considered merely as an ( A ), unless the contrary is clearly indicated by the person making the proposal.","c":["It is not a definite offer in itself, but merely an expression intended to induce another party to make an offer.","No binding contract arises until a firm offer is made and accepted.","It may include advertisements, catalogues, price lists, and displays of goods.","It is regarded as a conditional offer that becomes binding immediately upon acceptance by the offeree."],"a":4,"t":"인코텀즈, CISG 영문","e":"(A)는 청약의 유인(invitation to make offers)이에요(CISG 제14조 2항). 상대방의 청약을 끌어내려는 표현일 뿐이라 승낙만으로 구속력이 생기는 조건부청약이라고 한 ④가 틀렸습니다."},{"id":"66-4-2","r":66,"s":"무역영어","n":2,"q":"다음은 매도인이 매수인에게 보내는 청약서에서 발췌한 내용이다. 그 내용상 나머지와서로 다른 청약에 해당하는 것은?","c":["The above quotation is made without commitment and is subject to market changes.","We reserve the right to withdraw this offer without notice.","This offer will remain open for your acceptance until July 31, 2025.","This quotation is made without engagement and subject to our confirmation."],"a":3,"t":"서신 내용 파악","e":"7월 31일까지 승낙을 기다린다는 ③은 유효기간을 정한 확정청약이에요. 나머지는 시황 변동, 예고 없는 철회, 최종 확인을 조건으로 한 자유청약 성격입니다."},{"id":"66-4-3","r":66,"s":"무역영어","n":3,"q":"이 서신의 내용상 당사자 간 합의된 무역계약서상의 정형거래조건으로 올바른 것은?\n\nDear Sir/Madam ;\n\nThank you for your Order No. 4567-9 dated September 20, 2025 covering 5,000 pairs of golf shoes. As discussed with your representative and in accordance with the shipment provisions of our contract, products manufactured to your specific requirements normally require at least 60 days for delivery. Nevertheless, we have given your order special priority and expect to complete production of all items by November 29. To arrange prompt shipment, we would appreciate receiving your shipping instructions at your earliest convenience. We are confident that the quality and workmanship of the goods will fully meet your expectations.\n\nVery truly yours,","c":["FCA","CPT","DAP","DDP"],"a":1,"t":"인코텀즈, CISG 영문","e":"매도인이 매수인에게 선적지시(shipping instructions)를 요청하고 있어요. 매수인이 운송을 마련하는 조건이니 보기 중에서는 FCA가 맞습니다. CPT, DAP, DDP는 매도인이 운송을 마련해요."},{"id":"66-4-4","r":66,"s":"무역영어","n":4,"q":"다음 중 위 서신에 대한 설명으로 올바른 것은?","c":["The seller should obtain at its own cost cargo insurance complying with the cover provided by Clauses (C) of the Institute Cargo Clauses.","The risk of loss of or damage to the goods passes from the seller to the buyer when the goods are handed over to the first carrier.","The cost of carriage from Dallas, USA to the final destination will be borne by the seller.","The price of USD 200.00 includes unloading costs at Dallas, USA."],"a":2,"t":"인코텀즈, CISG 영문","e":"CIP에서 위험은 첫 운송인에게 물품을 넘길 때 매수인에게 이전돼요. 보험은 ICC(A) 수준이고(①), 매도인은 Dallas까지만 운임을 내며(③), 양하비는 운송계약에 포함된 경우가 아니면 가격에 들어가지 않아요(④).","p":{"range":"4~5","text":"Commodity : Cellular Phone\nQuantity : 1,000 PCS\nPrice : USD 200.00 per piece CIP Dallas, USA (subject to Incoterms 2020)\nShipment : Within 30 days after receipt of your order\nPacking : Export standard packaging\nPayment : By D/P"}},{"id":"66-4-5","r":66,"s":"무역영어","n":5,"q":"다음 중 위 서신에 대한 답변으로 계약을 성립시키는 승낙에 해당하는 것은?","c":["We are pleased to accept your offer and would appreciate it if the goods are packed with special care.","We are happy to accept your offer on condition that the unit price be reduced by 5%.","We accept your offer provided that payment is made by D/A 60 days.","We would like to accept your offer and are pleased to place an order for the cellular phones, provided that they are delivered within the next two weeks."],"a":1,"t":"서신 내용 파악","e":"①은 청약을 그대로 받아들이면서 포장에 신경 써 달라는 부탁만 덧붙여 계약 조건을 바꾸지 않아요. 가격 인하, 결제조건 변경, 인도기간 단축을 조건으로 단 ②, ③, ④는 반대청약입니다.","p":{"range":"4~5","text":"Commodity : Cellular Phone\nQuantity : 1,000 PCS\nPrice : USD 200.00 per piece CIP Dallas, USA (subject to Incoterms 2020)\nShipment : Within 30 days after receipt of your order\nPacking : Export standard packaging\nPayment : By D/P"}},{"id":"66-4-6","r":66,"s":"무역영어","n":6,"q":"다음 서식에서 거래조건이 잘못 작성된 것을 모두 기재한 것은?\n\nINLINE TRADING COMPANY\n27, Penrose Avenue, Cherrybrook, NSW, 2126, Australia.\nTel: 61-2-9649-9010, Fax: 61-2-9649-9011, Homepage: www.itc.com\n\nPurchase Order\n\nMr. Charlie Park\nPresident of Charlie's Trading Corporation\n511, Yeongdongdae-ro, Gangnam-Gu, Seoul, 06164, Korea\n\n     Description    : Blue jeans(Item no. 0924)\n(A)  Quantity       : 2,000 lbs\n(B)  Unit Price     : USD 22.50/pair, CFR Sydney Port\n(C)  Total amount   : USD 45,000 only\n(D)  Payment        : By an Irrevocable L/C at sight in your favor.\n(E)  POL/POD        : Sydney port / Korean port","c":["A, C","A, E","D, E","B, D"],"a":2,"t":"서신 내용 파악","e":"단가가 켤레(pair) 기준인데 수량을 파운드(lbs)로 적었고(A), 한국에서 시드니로 수입하는 거래인데 선적항과 양륙항을 거꾸로 적었어요(E). 2,000 × 22.50 = 45,000이라 총액은 맞습니다."},{"id":"66-4-7","r":66,"s":"무역영어","n":7,"q":"다음 중 서신의 내용에 대한 설명으로 올바른 것은?\n\nDear Mr. Lee:\n\nThank you for your e-mail of July 4. We are pleased to offer the following products in accordance with the terms and conditions detailed below.\n\nArticle: Sweat Shirts (Model No. 3401-23)\nQuantity: 2,000 pcs\nPrice: USD 35/pc, CIF New York\nShipment: During September 2026\nPayment: Draft at sight under an Irrevocable L/C\nValidity: July 31, 2026\n\nAs demand for this item from European customers has increased significantly, we recommend placing your order at an early date. We look forward to your favorable reply.\n\nYours sincerely,","c":["The seller should draw a usance bill of exchange on an issuing bank.","If the buyer wants to accept this offer, the acceptance should be validly made before 30 September, 2026.","The buyer may accept the offer before July 31, 2026 without the seller’s consent.","The conditions of this offer may be changed before July 31, 2026."],"a":3,"t":"서신 내용 파악","e":"유효기간 7월 31일을 정한 확정청약이라 매수인은 그 전에 매도인 동의 없이 승낙할 수 있어요. 환어음은 일람불이고(①), 승낙 기한은 9월이 아니라 7월 31일이며(②), 확정청약이라 기간 중 조건을 바꿀 수 없어요(④)."},{"id":"66-4-8","r":66,"s":"무역영어","n":8,"q":"다음 중 무역계약조항의 명칭과 그 내용의 연결이 잘못된 것은?","c":["Escalation Clause: The contract price is based on the market price of steel prevailing on the date of this Contract. If the market price of steel increases or decreases by more than 10% prior to shipment, the contract price shall be adjusted proportionately upon mutual confirmation by the parties.","Non-competition clause: During the term of this Agreement, the Distributor shall not manufacture, sell, distribute, or otherwise deal in any products that compete directly with the Products covered by this Agreement without the prior written consent of the Supplier.","Guarantee clause: Neither party may assign its rights or obligations under this Contract without prior written consent of the other party.","Technical assistance clause: The Seller shall provide the Buyer with all necessary technical information, manuals, drawings, and operating instructions required for the installation, operation, and maintenance of the goods supplied under this Contract."],"a":3,"t":"계약, 클레임 영문","e":"③은 상대방 동의 없이 권리나 의무를 넘길 수 없다는 양도금지(Assignment) 조항이에요. Guarantee clause와 잘못 연결됐습니다."},{"id":"66-4-9","r":66,"s":"무역영어","n":9,"q":"다음은 계약서 조항 중의 일부이다. 어떤 조항에 관한 설명인가?\n\nA party is not liable for a failure to perform any of his obligation in so far as he proves\n(a) that the failure was due to an impediment beyond his control,\n(b) that it could not reasonably be expected to have taken the impediment and its effects upon his ability to perform into account at the time of the conclusion of the contract, and\n(c) that it could not reasonably have avoided or overcome the impediment or its effects.","c":["Hardship","Force majeure","Liquidated damage","Modification"],"a":2,"t":"계약, 클레임 영문","e":"통제할 수 없는 장애, 계약 당시 예견 불가, 회피나 극복 불가를 입증하면 책임을 면한다는 건 불가항력(Force majeure) 조항이에요. CISG 제79조와 같은 내용입니다."},{"id":"66-4-10","r":66,"s":"무역영어","n":10,"q":"주어진 계약서의 내용으로 올바른 것은?\n\nGoods: Rice\nPrice: USD 50.00/bag, FOB Busan\nQuantity: 6,000 kg\nPacking: 30 kg in a sound bag\nShipment: During March, 2025\nPayment: Draft at 30 days under D/A\nUnless otherwise specified, this contract is subject to the General Agreement previously exchanged.\n\nGENERAL AGREEMENT\nQuantity: Quantity is subject to a variation of five(5) percent plus or minus at Seller’s option.\nPayment: Draft shall be drawn at sight under an irrevocable Letter of Credit which shall request the shipping documents including Bill of Lading, Insurance Policy, Commercial Invoice, and other documents that each contract requires.\nShipment: All goods sold in accordance with this Agreement shall be shipped within the stipulated time. Unless expressly agreed upon, the port of shipment shall be at the Seller’s option.\nForce Majeure: The Seller shall not be responsible for the delay of shipment in all cases of force majeure, including mobilization, war, riots, hostilities, blockade, fires, floods, earthquakes, tempest, and any other contingencies, which prevent shipment within the stipulated period.\nDelayed Shipment: In all cases of force majeure stated in the above clause, the period of shipment stipulated shall be extended for a period of twenty-one(21) days. In cases where shipment within the extended period should still be prevented by a continuance of the causes stated in the above clause or the consequences of any of them, it shall be at the Buyer’s option either to allow the shipment of late goods or to cancel the order by giving the Sellers the notice of cancellation.","c":["The 30-day usance should be drawn on the issuing bank for acceptance.","The shipment shall be made between March 1 and 31, 2025, and the buyer shall contract for carriage at its own expense.","The seller shall arrange the means of transport and notify the buyer of the vessel.","The seller bears all risks of damage or loss of the rice from the moment they are loaded on board the vessel at Busan port."],"a":2,"t":"계약, 클레임 영문","e":"개별계약이 일반약정보다 우선하니 FOB Busan, 3월 중 선적, D/A가 적용돼요. FOB라 운송계약은 매수인이 자기 비용으로 맺습니다. D/A 환어음 지급인은 매수인이고(①), 선박 수배는 매수인 몫이며(③), 위험은 본선 적재 때 매수인에게 넘어가요(④)."},{"id":"66-4-11","r":66,"s":"무역영어","n":11,"q":"위 신용장에 대한 설명으로 적절한 것은?","c":["A bill of lading bearing a clause declaring a defective condition of the goods or packaging will not be honored under this credit.","All banking charges, including those incurred both inside and outside Indonesia, shall\n\nbe borne by PT PURA BARUTAMA.","KOREA MINTING PRINTING CO., LTD. is obligated to arrange and pay for marine cargo insurance covering 110% of the invoice value.","The credit allows partial shipment but prohibits transshipment, and goods must be shipped by a direct vessel to Tanjung Priok in Jakarta."],"a":1,"t":"신용장, UCP 영문","e":"신용장이 'CLEAN ON BOARD' B/L을 요구하니 물품이나 포장 결함을 표시한 사고 B/L은 수리되지 않아요. 인도네시아 밖 수수료는 수익자 부담이고(②), 보험은 매수인이 들며(③), 환적은 허용돼요(④).","p":{"range":"11~12","text":"59: BENEFICIARY:     KOREA MINTING PRINTING CO., LTD.\n60: APPLICANT: PT PURA BAROTAMA\n31D: DATE AND PLACE OF EXPIRY: 2026-9-31 KOREA\n41A: AVAILABLE WITH..BY..: (A) ANY BANK, INDONESIA BY NEGOTIATION\n43P: PARTIAL SHIPMENT: ALLOWED\n43T: TRANSSHIPMENT: ALLOWED\n44E: PORT OF LOADING: SOUTH KOREA\n44F: PORT OF DISCHARGE: TANJUNG PRIOK\n44C: (B) LATEST DATE OF SHIPMENT: 2026-8-15\n45A: DESCRIPTION OF GOODS AND/OR SERVICES:\n   HIGH QUALITY BANKNOTE PAPER FOR S'00 DENOMINATION\n   QUANTITY: 71,820 REAMS\n   UNIT PRICE: USD 112.04 PER REAM\n   COUNTRY OF ORIGIN: KOREA\n46A: DOCUMENTS REQUIRED\n  1. SIGNED COMMERCIAL INVOICE IN EIGHT(8) FOLDS\n  2. FULL SET OF (C) \"CLEAN ON BOARD\" OCEAN BILL OF LADING\n     MADE OUT \"TO ORDER\", BLANK ENDORSED, DATED NOT LATER\n    THAN SEPTEMBER 15, 2026, FREIGHT PREPAID\n    NOTIFY ADDRESS: BANK INDONESIA JL. M. H. THAMRIN NO. 2 JAKARTA\n    INDONESIA\n  3. PACKING LIST IN EIGHT(8) FOLDS\n  4. CERTIFICATE OF ORIGIN IN ONE(1) ORIGINAL PLUS FIVE(5) COPIES\n  5. (D) INSURANCE POLICY COVERING CIF VALUE PLUS 10 PERCENT WITH\n     ICC(A), MARKED PREMIUM PAID\n47A: ADDITIONAL CONDITIONS\n  1. INSURANCE IS COVERED BY BUYER\n71B: CHARGES: ALL BANKING CHARGES OUTSIDE INDONESIA\n     ARE COVERED BY THE BENEFICIARY'S ACCOUNT"}},{"id":"66-4-12","r":66,"s":"무역영어","n":12,"q":"위 신용장의 밑줄 친 부분(A~D) 중 수익자가 수정을 요청할 필요가 없는 것은?","c":["(A)","(B)","(C)","(D)"],"a":3,"t":"신용장, UCP 영문","e":"(C) 무사고 본선적재 B/L 요구는 정상 조건이에요. 매입 은행을 인도네시아로 제한한 (A), B/L 날짜 조건과 맞지 않는 최종선적일 (B), 매수인이 보험을 든다면서 보험증권을 요구한 (D)는 수익자가 수정을 요청해야 합니다.","p":{"range":"11~12","text":"59: BENEFICIARY:     KOREA MINTING PRINTING CO., LTD.\n60: APPLICANT: PT PURA BAROTAMA\n31D: DATE AND PLACE OF EXPIRY: 2026-9-31 KOREA\n41A: AVAILABLE WITH..BY..: (A) ANY BANK, INDONESIA BY NEGOTIATION\n43P: PARTIAL SHIPMENT: ALLOWED\n43T: TRANSSHIPMENT: ALLOWED\n44E: PORT OF LOADING: SOUTH KOREA\n44F: PORT OF DISCHARGE: TANJUNG PRIOK\n44C: (B) LATEST DATE OF SHIPMENT: 2026-8-15\n45A: DESCRIPTION OF GOODS AND/OR SERVICES:\n   HIGH QUALITY BANKNOTE PAPER FOR S'00 DENOMINATION\n   QUANTITY: 71,820 REAMS\n   UNIT PRICE: USD 112.04 PER REAM\n   COUNTRY OF ORIGIN: KOREA\n46A: DOCUMENTS REQUIRED\n  1. SIGNED COMMERCIAL INVOICE IN EIGHT(8) FOLDS\n  2. FULL SET OF (C) \"CLEAN ON BOARD\" OCEAN BILL OF LADING\n     MADE OUT \"TO ORDER\", BLANK ENDORSED, DATED NOT LATER\n    THAN SEPTEMBER 15, 2026, FREIGHT PREPAID\n    NOTIFY ADDRESS: BANK INDONESIA JL. M. H. THAMRIN NO. 2 JAKARTA\n    INDONESIA\n  3. PACKING LIST IN EIGHT(8) FOLDS\n  4. CERTIFICATE OF ORIGIN IN ONE(1) ORIGINAL PLUS FIVE(5) COPIES\n  5. (D) INSURANCE POLICY COVERING CIF VALUE PLUS 10 PERCENT WITH\n     ICC(A), MARKED PREMIUM PAID\n47A: ADDITIONAL CONDITIONS\n  1. INSURANCE IS COVERED BY BUYER\n71B: CHARGES: ALL BANKING CHARGES OUTSIDE INDONESIA\n     ARE COVERED BY THE BENEFICIARY'S ACCOUNT"}},{"id":"66-4-13","r":66,"s":"무역영어","n":13,"q":"다음 환어음 내용에 관한 설명으로 올바른 것은?\n\nBILL OF EXCHANGE\n\nNO. KM15555                            25 March, 2025, Seoul, Korea\nFOR USD 50,000.00 AT XXXX SIGHT OF THIS ORIGINAL BILL OF EXCHANGE (SECOND OF THE SAME TENOR AND DATE BEING UNPAID) PAY TO KITA BANK OR ORDER THE SUM OF SAY US DOLLARS FIFTY THOUSAND ONLY VALUE RECEIVED AND CHARGE THE SAME TO ACCOUNT OF STAR LIMITED, 70 CALINGFORD RD. AUSTRALIA DRAWN UNDER HSBC BANK L/C NO. SYD20005 DATED DECEMBER 15, 2024\n\nTO HSBC BANK TRADE SERVICE DEPT.","c":["This is a time draft payable on 25 March, 2025.","KITA Bank is a payee that receives USD 50,000.00.","STAR Limited is a seller who draws this draft for payment.","HSBC Bank is a drawer of this draft issued under L/C No SYD20005."],"a":2,"t":"신용장, UCP 영문","e":"'PAY TO KITA BANK OR ORDER'이니 KITA Bank가 대금을 받는 수취인(payee)이에요. 일람출급 어음이고(①), STAR Limited는 대금을 부담하는 개설의뢰인(매수인)이며(③), HSBC는 발행인이 아니라 지급인이에요(④)."},{"id":"66-4-14","r":66,"s":"무역영어","n":14,"q":"대금결제 용어에 관한 설명으로 잘못된 것은?","c":["A confirmation is the confirming bank's irrevocable commitment, in addition to the issuing bank's undertaking, to honour or negotiate documents that comply with the terms and conditions of the credit.","In forfaiting, the collecting bank or another bank provides an aval on the bill of exchange, thereby guaranteeing payment at maturity if the drawee fails to pay.","Open Account is a payment method under which the seller ships the goods and delivers the shipping documents directly to the buyer, and the buyer agrees to pay the purchase price at a later agreed date.","CFS/CFS: This is typically used for LCL shipments. The goods are delivered to the destination CFS, where they are deconsolidated."],"a":2,"t":"신용장, UCP 영문","e":"포페이팅에서 어음에 Aval(지급보증)을 하는 건 보통 수입자 거래은행이에요. 추심은행이 한다고 한 ②가 틀렸습니다."},{"id":"66-4-15","r":66,"s":"무역영어","n":15,"q":"다음 중 주어진 선하증권의 내용으로 잘못된 것은?","c":["Target Customer Brokers, Inc is a buyer.","This is a negotiable bill of lading in which the consignee is not specified.","This is an order bill of lading covering from Uiwang, Korea to Tacoma, USA.","This document is a received and clean bill of lading."],"a":4,"t":"운송 영문","e":"정답 키 기준으로 ④가 틀렸어요. 수취 문구가 있어도 On Board Date가 표기되어 있으니 본선 적재가 확인된 선적 선하증권으로 봅니다. 수하인이 TO ORDER라 유통 가능한 지시식 B/L이고 의왕에서 타코마까지 운송해요.","p":{"range":"15~16","text":"                                   KITA LOGISTICS\n                                           BOOKING NO.\nSHIPPER\n                                             5SZP0526603\nMaple CO., LTD.\n                                             DOCUMENT NO.\n3 Samsung-ro, Seoul, Korea\nCONSIGNEE                                    Received in apparently good condition\nTO ORDER                                     unless otherwise stated herein :\nNOTIFY PARTY                                 VESSEL\nTARGET CUSTOMS BROKERS, INC.\n7000 PARKWAY NORTH, USA                      Arirang\nPLACE OF RECEIPT     PORT OF LOADING         PORT OF DISCHARGE      PLACE OF DELIVERY\nUiwang, Korea        Incheon Port, Korea     Tacoma port, USA        Tacoma port, USA\nNO. OF CONT          DESCRIPTION OF GOODS                     MEASUREMENT (CBM)\n2,500 cartons         ‘Shipper’s load & Count & Sealed’            148 CBM\n6X20’\n                                 Freight Prepaid                   On Board Date:\nCFS/CY                        L/C No. IMP101133                   August 03, 2025"}},{"id":"66-4-16","r":66,"s":"무역영어","n":16,"q":"다음 중 이 선하증권이 발행된 기초가 된 계약에서 사용되기에 가장 적절한 정형거래조건은 무엇인가?","c":["EXW","FCA","FOB","CFR"],"a":4,"t":"인코텀즈, CISG 영문","e":"운임이 선불(Freight Prepaid)이고 인천항에서 타코마항까지 해상운송이니 매도인이 운임을 내는 해상 조건 CFR이 맞아요. EXW, FCA, FOB였다면 운임은 보통 착불입니다.","p":{"range":"15~16","text":"                                   KITA LOGISTICS\n                                           BOOKING NO.\nSHIPPER\n                                             5SZP0526603\nMaple CO., LTD.\n                                             DOCUMENT NO.\n3 Samsung-ro, Seoul, Korea\nCONSIGNEE                                    Received in apparently good condition\nTO ORDER                                     unless otherwise stated herein :\nNOTIFY PARTY                                 VESSEL\nTARGET CUSTOMS BROKERS, INC.\n7000 PARKWAY NORTH, USA                      Arirang\nPLACE OF RECEIPT     PORT OF LOADING         PORT OF DISCHARGE      PLACE OF DELIVERY\nUiwang, Korea        Incheon Port, Korea     Tacoma port, USA        Tacoma port, USA\nNO. OF CONT          DESCRIPTION OF GOODS                     MEASUREMENT (CBM)\n2,500 cartons         ‘Shipper’s load & Count & Sealed’            148 CBM\n6X20’\n                                 Freight Prepaid                   On Board Date:\nCFS/CY                        L/C No. IMP101133                   August 03, 2025"}},{"id":"66-4-17","r":66,"s":"무역영어","n":17,"q":"다음은 선박회사가 발행한 컨테이너 화물의 선하증권에 기재된 내용의 일부이다. 이에 해당하는 조항은?\n\nAny statements in this Bill relating to marks and numbers, the number and kind of packages, description, quantity, quality, weight, measurement, nature, kind, value, or other particulars of the contents of such container(s) are provided by the Merchant, and the Carrier accepts no liability for them.","c":["General Average Clause","Unknown Clause","Paramount Clause","Limitation of Liability Clause"],"a":2,"t":"운송 영문","e":"컨테이너 안 내용물 정보는 화주가 제공한 것이고 운송인은 책임지지 않는다는 문구라 부지약관(Unknown Clause)이에요."},{"id":"66-4-18","r":66,"s":"무역영어","n":18,"q":"다음은 컨테이너 해상운송의 부대비용에 관한 설명이다. 빈칸에 들어가기에 적절한 것은?\n\n (                ) is charged when a container stays inside the port terminal (i.e.\ncontainer yard) beyond the free time. This charge is imposed by the ocean carrier to ensure the efficient turnover of container equipment.","c":["Terminal Handling Charge","CFS Charge","Wharfage","Demurrage"],"a":4,"t":"운송 영문","e":"컨테이너가 무료 장치기간(free time)을 넘겨 터미널(CY) 안에 머물 때 선사가 부과하는 건 Demurrage예요. 터미널 밖으로 가져간 컨테이너를 늦게 반납하면 Detention입니다."},{"id":"66-4-19","r":66,"s":"무역영어","n":19,"q":"다음은 해상보험에서 발생하는 해상손해에 관한 설명이다. 빈칸 (A)와 (B)에 들어가기에 적절한 것은?\n\n( A ) is a situation where a ship or its cargo has been irretrievably lost, destroyed, or so damaged that it ceases to exist in its original form. On the other hand, ( B ) is a situation where a ship, or a cargo, is significantly damaged to the point that the cost of repair or recovery would exceed the insured item’s value.","c":["actual total loss / partial loss","partial loss / constructive total loss","constructive total loss / actual total loss","actual total loss / constructive total loss"],"a":4,"t":"보험 영문","e":"완전히 없어지거나 원래 형태를 잃은 건 현실전손(actual total loss), 수리나 회복 비용이 가액을 넘는 건 추정전손(constructive total loss)이에요."},{"id":"66-4-20","r":66,"s":"무역영어","n":20,"q":"다음 서신의 내용을 논리적 전개 순서에 따라 바르게 나열한 것은?\n\n(A) The shipping documents, including bill of lading, invoice, and insurance policy have been passed to Citibank, Amsterdam.\n\n(B) We are sure that you will be pleased with the goods, and look forward to hearing from you soon.\n\n(C) As agreed, we have drawn on you at 60 days after sight for USD 120,000. Please advise upon your acceptance.\n\n(D) We are pleased to inform you that your order No.1555 has been shipped today on SS Arirang, which is due in Amsterdam from Busan Port in eight weeks.","c":["(A)-(B)-(C)-(D)","(D)-(B)-(C)-(A)","(D)-(A)-(C)-(B)","(D)-(A)-(B)-(C)"],"a":3,"t":"서신 흐름, 문장 배열","e":"선적 안내(D), 선적서류를 은행에 넘김(A), 60일 기한부 어음을 발행했으니 인수해 달라(C), 만족할 것이라는 마무리(B) 순서예요."},{"id":"66-4-21","r":66,"s":"무역영어","n":21,"q":"위 서신의 목적으로 가장 적절한 것은 무엇인가?","c":["To file a complaint about defective audio systems previously delivered","To place a bulk order for 100 units of audio systems","To request product information and samples in order to explore a potential business partnership","To cancel an existing contract due to certification issues with Korean import regulations"],"a":3,"t":"서신 내용 파악","e":"인터넷에서 찾은 공급업체에 카탈로그, 가격표, 인증 여부, 샘플을 요청하는 거래조회(Inquiry) 서신이에요.","p":{"range":"21~22","text":"Dear Mr. Frank\n I came across your company on the Internet while searching for a supplier of\naudio systems, and our company is interested in importing your products. We\nwould appreciate it if you could send us an e-catalogue and price list of your\nproducts.\n Before placing an order, we would also like to know whether your products are\ncompatible with the Korean voltage (220V) and whether you have obtained the\ncertifications needed for export to Korea. In addition, please note that a certificate\nof origin for the FTA should be ready when exporting the items.\n We would also be grateful if you could send us some samples of your products,\nas our engineers will test them and we will decide on purchasing at an internal\nmeeting. I will then call you to discuss an order. I look forward to doing business\nwith you.\nBest regards,"}},{"id":"66-4-22","r":66,"s":"무역영어","n":22,"q":"위 서신 이후에 상대방이 송부한 답신의 내용으로 적절하지 않은 것은?","c":["Thank you for your interest in our audio systems. We have attached our latest e-catalogue and price list for your review.","We are pleased to inform you that we will ship 500 units of our audio systems to\n\nyour warehouse next Monday as per your purchase order.","Regarding the certificate of origin for the FTA, we have been issuing it for our current export partners as well, so there will be no problem in providing the required documents.","As requested, we will send you a set of product samples for testing, and we look forward to hearing your engineers' evaluation."],"a":2,"t":"서신 내용 파악","e":"아직 샘플 검토 전이라 주문이 없는 상태예요. 주문서에 따라 500대를 보내겠다는 ②는 흐름과 맞지 않습니다.","p":{"range":"21~22","text":"Dear Mr. Frank\n I came across your company on the Internet while searching for a supplier of\naudio systems, and our company is interested in importing your products. We\nwould appreciate it if you could send us an e-catalogue and price list of your\nproducts.\n Before placing an order, we would also like to know whether your products are\ncompatible with the Korean voltage (220V) and whether you have obtained the\ncertifications needed for export to Korea. In addition, please note that a certificate\nof origin for the FTA should be ready when exporting the items.\n We would also be grateful if you could send us some samples of your products,\nas our engineers will test them and we will decide on purchasing at an internal\nmeeting. I will then call you to discuss an order. I look forward to doing business\nwith you.\nBest regards,"}},{"id":"66-4-23","r":66,"s":"무역영어","n":23,"q":"위 서신에 대한 설명으로 올바르지 않은 것은?","c":["The sender is the Korean buyer who has received the shipment of printers from the supplier.","The shipment is being held by customs because the actual goods differ from the descriptions provided in the shipping documents.","The sender is requesting the supplier to issue a new certificate of origin in compliance with the FTA regulations.","The sender emphasizes the urgency of the matter and asks for the supplier's immediate cooperation to resolve the issue."],"a":3,"t":"서신 내용 파악","e":"상업송장의 모델명이 실제 물품과 달라 통관이 막혔으니 송장을 고쳐 달라는 내용이에요. FTA 원산지증명서 재발급 요청은 없어서 ③이 틀렸습니다.","p":{"range":"23~24","text":"Dear Mr. Chen:\nI am writing to inform you that the recent shipment of printers (Order No.\nC2610-K02) is currently detained at Korean Customs due to a discrepancy in the\nshipping documents. Upon review, we found that the product description on the\nCommercial Invoice does not match the actual goods — specifically, the printer\nmodel number stated is different from the model we ordered and received.\n                      (A)                               .   Please ensure that the\nproduct description and model number are fully consistent with the actual\nshipment.\n Given the urgency, we kindly ask for your immediate action. Thank you for your\nprompt cooperation.\nBest regards,"}},{"id":"66-4-24","r":66,"s":"무역영어","n":24,"q":"위 서신의 밑줄 친 (A)에 들어가기에 가장 적절한 문장은?","c":["We have been informed that the shipment is subject to a total inspection at the Customs Office, which is causing further delay in the clearance process.","We have already filed the bill of entry prior to the arrival of the goods for faster clearance","We are pleased to inform you that the shipment has been successfully released from Korean Customs without any issues","We would therefore appreciate it if you could send us the corrected Commercial Invoice as soon as possible."],"a":4,"t":"서신 내용 파악","e":"송장 기재가 실제와 다르다고 했으니, 고친 상업송장을 빨리 보내 달라는 ④가 이어져요.","p":{"range":"23~24","text":"Dear Mr. Chen:\nI am writing to inform you that the recent shipment of printers (Order No.\nC2610-K02) is currently detained at Korean Customs due to a discrepancy in the\nshipping documents. Upon review, we found that the product description on the\nCommercial Invoice does not match the actual goods — specifically, the printer\nmodel number stated is different from the model we ordered and received.\n                      (A)                               .   Please ensure that the\nproduct description and model number are fully consistent with the actual\nshipment.\n Given the urgency, we kindly ask for your immediate action. Thank you for your\nprompt cooperation.\nBest regards,"}},{"id":"66-4-25","r":66,"s":"무역영어","n":25,"q":"다음 서신의 내용을 논리 전개에 따라 가장 잘 나열한 것은?\n\nDear Mr. Kwon:\n\nOur order has just been delivered. Thank you for your speedy response. However, I am writing this email regarding the unsatisfactory delivery of the items that we ordered.\n(A) We would therefore appreciate it if you could send us the replacement units as soon as possible, and when we receive the replacement, we will return the damaged items back to you. (B) Upon delivery, we found that some of the items were damaged severely. (C) According to our agreement, if the products are damaged due to the company's fault, the product should be replaced at no extra charge, or a full refund should be made. (D) To be specific, we received 7 cartons of printers from you, but one of the cartons arrived damaged, and the 50 units inside were broken in shipment. Your prompt action is highly appreciated.\n\nBest regards,","c":["(B)-(D)-(C)-(A)","(B)-(D)-(A)-(C)","(C)-(B)-(D)-(A)",
