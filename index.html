의 밑줄 친 (A)에 들어가기에 가장 적절한 문장은?","c":["We will proceed immediately with arranging the Irrevocable Letter of Credit as per the specified terms.","We are eager to establish a long-term partnership with your company and hope you can consider this revised offer requesting a discount.","We, therefore, encourage your prompt reply to secure this very competitive offer.","We're sorry, but we can't fulfill that order by October."],"a":3,"t":"서신 내용 파악","e":"시장이 활발하고 재고가 적다고 했으니 빨리 답해 달라고 재촉하는 ③이 이어져요.","p":{"range":"24~25","text":"Dear Mr. Rood:\nWe hope the samples of our electronic juice-mixer have reached you safely and\nthat they met your expectations. We are writing to formally confirm our firm offer,\nwhich is subject to your acceptance.\nOur quote is as follows:\n  * Article: Electronic Juice-mixer Model A37\n  * Quantity: 200 Units\n  * Price: USD 570.00 per unit, CIF Los Angeles\n  * Shipment: During October\n  * Terms of Payment: A 60-day sight draft under an Irrevocable Letter of Credit\nThe market is currently very active, and our inventory levels are low due to a\nsignificant number of orders from Southeast Asian countries.\n                            (A)                                     .\nSincerely,"}},{"id":"64-4-26","r":64,"s":"무역영어","n":26,"q":"다음 서신의 내용을 논리 전개에 따라 가장 잘 나열한 것은?\n\nDear Mr. Cook: Thank you for your letter of June 16 regarding your recent order. It seems the issue was due to a misunderstanding on our part.\n\n(A) We will contact our logistics partner to arrange for the pickup of the incorrect items at our expense.\n(B) We sincerely apologize for this inconvenience and accept full responsibility for the error.\n(C) We recognize that our catalog can be a bit confusing, as it requires that products be ordered by both name and model number.\n(D) The correct goods were shipped to you today.\n\nPlease let us know when would be most convenient for the collection. We look forward to the opportunity to serve you again.\n\nSincerely,","c":["(C) - (A) - (B) - (D)","(C) - (B) - (D) - (A)","(D) - (A) - (C) - (B)","(D) - (C) - (A) - (B)"],"a":2,"t":"서신 흐름, 문장 배열","e":"카탈로그가 헷갈렸다고 인정하고(C), 사과하며(B), 맞는 물품은 오늘 보냈고(D), 잘못 간 물품은 우리 비용으로 수거하겠다(A) 순서예요."},{"id":"64-4-27","r":64,"s":"무역영어","n":27,"q":"다음 서신에서 밑줄 친 부분(A-D) 중 문맥상 가장 어색한 것은?\n\nDear Sirs, (A) We are pleased to offer you a quotation for the collection and delivery of your motor-car spares to Aberdeen. (B) Our consignment of motor-car spares will be ready for delivery early next month to a company in Aberdeen. The goods will be packed in two wooden crates, each measuring 1 x 1 x 0.75 meters and weighing approximately 80kg.\n(C) We kindly request that you provide us with a quotation for collecting and delivering these crates. (D) Please also confirm your availability to collect the consignment on the 3rd of next month, and advise us of the estimated delivery date to the consignee. Your prompt reply would be greatly appreciated. Yours faithfully,","c":["(A)","(B)","(C)","(D)"],"a":1,"t":"서신 흐름, 문장 배열","e":"운송업체에 견적을 '요청'하는 서신인데, (A)는 견적을 '제시'하는 운송업체 쪽 문장이라 어색해요."},{"id":"64-4-28","r":64,"s":"무역영어","n":28,"q":"다음 중 주어진 문장을 영작한 것 중 적절하지 않은 것은?","c":["본격적인 거래에 앞서 거래조건에 대한 공식적인 합의서를 작성하는 것이 필요하다고믿습니다. ⇒ Before we proceed with any serious business, we believe it's best to draw up a formal agreement outlining our terms and conditions.","물건이 긴급히 필요하므로 정해진 날짜에 배달이 될 수 있도록 확인해 주십시오. ⇒ The goods are urgently needed, so please ensure they can be delivered on the specified date.","귀사의 견본을 검토한 결과, 추가적인 할인을 해준다면 당사는 500벌을 시험 주문하기로 했습니다. ⇒ After reviewing your sample and the discounts you offered, we have decided to place a trial order for 500 garments.","운송료 선불이라는 문구는 운송료 착불로 대체하여 신용장을 수정해 주시기를 바랍니\n다. ⇒ Please have your bank amend the L/C to replace ‘freight prepaid’ with ‘freight collect’."],"a":3,"t":"영작","e":"한글은 '추가 할인을 해준다면' 시험주문을 하겠다는 조건인데, 영작은 이미 제시한 할인을 검토하고 주문하기로 했다고 써서 뜻이 달라요."},{"id":"64-4-29","r":64,"s":"무역영어","n":29,"q":"주어진 이메일의 목적은 무엇인가?","c":["To complain about the delay in the delivery of the goods and payment before receipt of goods","To request settlement of outstanding payment as soon as possible","To cancel the order for the delayed products and request a refund","To explain the product defect and claim a remedy"],"a":1,"t":"서신 내용 파악","e":"주문한 물품이 아직 안 왔는데 카드 대금은 이미 청구됐다고 항의하는 이메일이에요.","p":{"range":"29~30","text":"To:        “Customer Service Center\"<cscenter@celltech.com>\nFrom:      “Eunshil Na\"<ena@yahoo.co.kr>\nData:      Mon, September 22, 2025.\nSubject:   Overdue Delivery\n  Dear Customer Service Center:\n  On September 6, I ordered Model No. 281 ML-1, and it was supposed to be\ndelivered within 10 days.\n  (A) If there's any problem, please send an e-mail and explain the reason for the\ndelay. (B) It's September 22 and I haven't received it yet. (C) If the product has\nnot yet been sent, please deliver it ASAP. (D) My credit card records show that\nyou charged my account on September 16.\n  Sincerely yours,\n  Eunshil Na"}},{"id":"64-4-30","r":64,"s":"무역영어","n":30,"q":"이메일 본문의 밑줄 친 부분(A～D)을 논리 전개에 따라 가장 자연스럽게 나열한 것은?","c":["(B) - (C) - (A) - (D)","(B) - (D) - (C) - (A)","(C) - (D) - (A) - (B)","(C) - (A) - (B) - (D)"],"a":2,"t":"서신 흐름, 문장 배열","e":"아직 못 받았다(B), 그런데 카드는 이미 결제됐다(D), 안 보냈으면 빨리 보내 달라(C), 문제가 있으면 이유를 알려 달라(A) 순서예요.","p":{"range":"29~30","text":"To:        “Customer Service Center\"<cscenter@celltech.com>\nFrom:      “Eunshil Na\"<ena@yahoo.co.kr>\nData:      Mon, September 22, 2025.\nSubject:   Overdue Delivery\n  Dear Customer Service Center:\n  On September 6, I ordered Model No. 281 ML-1, and it was supposed to be\ndelivered within 10 days.\n  (A) If there's any problem, please send an e-mail and explain the reason for the\ndelay. (B) It's September 22 and I haven't received it yet. (C) If the product has\nnot yet been sent, please deliver it ASAP. (D) My credit card records show that\nyou charged my account on September 16.\n  Sincerely yours,\n  Eunshil Na"}},{"id":"65-1-1","r":65,"s":"무역규범","n":1,"q":"대외무역법령에서 규정하고 있는 용어에 관한 설명 중 잘못된 것은?","c":["연계무역이란 물물교환, 구상무역, 대응구매, 제품환매 등의 형태에 의하여 수출ㆍ수입이 연계되어 이루어지는 수출입을 말한다.","외국인도수출이란 수출대금은 국내에서 영수하지만, 국내에서 통관되지 아니한 수출 물품 등을 외국으로 인도하거나 제공하는 수출을 말한다.","무환수출입이란 외국환 거래가 수반되지 아니하는 물품 등의 수출ㆍ수입을 말한다.","임대수출이란 임대계약에 따라 물품 등을 수출하여 일정 기간 후 다시 수입하거나그 기간의 만료 전 또는 만료 후 해당 물품 등의 소유권을 이전하는 수출을 말하며사용대차는 해당하지 않는다."],"a":4,"t":"대외무역법: 정의, 수출입 실적","e":"임대수출의 '임대'에는 사용대차(무상으로 빌려주는 것)도 포함돼요. 사용대차는 해당하지 않는다고 한 ④가 틀렸습니다."},{"id":"65-1-2","r":65,"s":"무역규범","n":2,"q":"대외무역법령에서 규정하고 있는 수출입 관련 정의가 잘못된 것은?","c":["영상물(영화, 게임, 애니메이션, 만화, 캐릭터를 포함한다), 음향ㆍ음성물, 전자서적, 데이터베이스는 전자적 형태의 무체물에 해당한다.","전기통신업, 광고업, 교육 서비스업, 보건업, 연구개발업, 번역 및 통역 서비스업은지식기반 용역 등 수출 유망산업으로서 산업통상부 장관이 정하여 고시하는 업종에해당한다.","저작권ㆍ저작인접권ㆍ프로그램저작권ㆍ 디자인권은 용역에 해당하지 않는다.","전자적 형태의 무체물의 수출입이란 컴퓨터 등 정보처리능력을 가진 장치에 저장한상태로 반출ㆍ반입한 후 인도ㆍ인수하는 것을 말한다."],"a":3,"t":"대외무역법: 정의, 수출입 실적","e":"특허권, 디자인권, 저작권, 저작인접권, 프로그램저작권 같은 지식재산권의 양도나 사용 허락도 대외무역법상 용역에 들어가요. 그래서 ③이 틀렸습니다."},{"id":"65-1-3","r":65,"s":"무역규범","n":3,"q":"대외무역법령에서 규정하고 있는 전문무역상사의 지정 요건에 관한 설명 중 올바른것은?","c":["전년도 수출실적 또는 직전 5개 연도의 연평균 수출실적이 미화 1,000만 달러 이상의 범위에서 산업통상부 장관이 정하여 고시하는 금액 이상일 것","수출실적 중 다른 중소기업이나 중견기업이 생산한 물품 등의 수출실적 비율이 100분의 80 이상의 범위에서 산업통상부 장관이 정하여 고시하는 비율 이상일 것","농업ㆍ어업ㆍ수산업 등 업종별 특성과 조합 등 법인의 조직 형태별 수출 특성을 고려하여 고시하는 기준을 갖춘 무역거래자","전문무역상사가 거짓이나 그밖에 부정한 방법으로 지정받은 경우에는 그 지정을 일시 정지하여야 한다."],"a":3,"t":"대외무역법: 정의, 수출입 실적","e":"업종별, 조직 형태별 특성을 고려해 고시하는 기준을 갖춘 무역거래자도 전문무역상사로 지정될 수 있어요. 실적 기준은 직전 3개 연도 연평균 미화 100만 달러 이상, 다른 중소, 중견기업 물품 비율은 100분의 20 이상이고, 부정 지정은 취소해야 합니다."},{"id":"65-1-4","r":65,"s":"무역규범","n":4,"q":"대외무역법령에서 규정하고 있는 무역에 관한 제한 등 특별조치에 대한 사유로 잘못된 것은?","c":["우리나라 또는 우리나라의 무역 상대국에 전쟁ㆍ사변 또는 천재지변이 있을 경우","교역상대국이 조약과 일반적으로 승인된 국제법규에서 정한 우리나라의 권익을 인정하지 아니할 경우","인간의 생명ㆍ건강 및 안전, 동물과 식물의 생명 및 건강, 환경보전 또는 국내 자원보호를 위하여 필요할 경우","국방상 원활한 물자 수급의 이행을 위해 필요할 경우"],"a":4,"t":"대외무역법: 무역구제, 특별조치","e":"무역에 관한 특별조치 사유는 전쟁, 사변, 천재지변, 교역상대국의 권익 불인정이나 부당한 부담, 국제평화와 안전 의무 이행, 생명, 건강, 환경 보호 등이에요. '국방상 원활한 물자 수급'은 사유에 없습니다."},{"id":"65-1-5","r":65,"s":"무역규범","n":5,"q":"대외무역법령에서 규정하고 있는 거래형태별 수출입 및 수출입 실적 관련 내용으로잘못된 것은?","c":["외국인으로부터 대금을 영수하고 자유무역지역으로 반입 신고한 물품 등을 공급하는 경우는 수출실적 인정 범위에 해당한다.","위탁가공된 물품을 외국에 판매하는 경우는 수출금액(FOB가격)에서 수입금액(CIF가격)을 공제한 가득액이 수출실적 인정금액이다.","전자적 형태의 무체물 수출의 경우는 한국무역협회장 또는 한국소프트웨어산업협회장이 외국환은행을 통해 입금 확인한 금액이다.","수출실적 인정금액은 수출통관액(FOB가격 기준)이며, 수입실적 인정금액은 수입통관액(CIF가격 기준)이다."],"a":2,"t":"대외무역법: 정의, 수출입 실적","e":"수출금액(FOB)에서 수입금액(CIF)을 뺀 가득액을 실적으로 인정하는 건 중계무역이에요. 위탁가공 물품을 외국에 파는 경우는 판매액에서 원자재 수출금액과 가공임을 뺀 금액을 씁니다."},{"id":"65-1-6","r":65,"s":"무역규범","n":6,"q":"대외무역법령에서 규정하고 있는 외화획득용 원료·기재의 수입과 구매 등의 내용으로 잘못된 것은?","c":["용역의 해외 진출에 따라 외화를 획득하는 것은 외화획득의 범위에 포함된다.","외화획득 이행의무자의 반기별 미이행률이 10퍼센트 이하이고, 그 미이행 금액이미화 5만 달러에 상당하는 금액 이하인 경우는 사후관리를 하지 아니할 수 있다.","외화획득용 원료ㆍ기재의 수량은 외화획득을 위한 물품 등의 1단위를 생산하기 위하여 제공되는 외화획득용 원료ㆍ기재의 기준 소요량을 말한다.","산업통상부 장관은 구매확인서를 발급받은 자에 대하여 외화획득용 원료ㆍ기재의구매 여부를 사후 관리하여야 한다."],"a":2,"t":"대외무역법: 외화획득, 구매확인서","e":"정답 키 기준으로 ②가 틀린 설명이에요. 사후관리를 생략할 수 있는 미이행률, 미이행 금액 기준과 기간 단위가 법령과 다릅니다. 교재에서 정확한 기준을 확인해 두세요."},{"id":"65-1-7","r":65,"s":"무역규범","n":7,"q":"우리나라의 대외무역법령에서 규정하고 있는 전략물자의 수출허가 또는 상황허가가면제되는 경우로 올바른 것은?","c":["고시 지역에서의 중개 거래에 따른 수출을 하는 경우","국제수출통제체제에 속하는 수출국으로부터 수출허가를 받은 경우","전략물자 미해당 물품을 우려거래자 목록에 등록된 자에게 환적하는 경우","항공기의 안전 운항을 위하여 긴급 수리용으로 사용될 부분품을 수출하는 경우"],"a":4,"t":"대외무역법: 전략물자","e":"선박이나 항공기 안전 운항을 위한 긴급 수리용 부분품 수출은 전략물자 수출허가, 상황허가 면제 대상이에요."},{"id":"65-1-8","r":65,"s":"무역규범","n":8,"q":"대외무역법령에서 규정하는 수출허가 등의 제한이 필요한 기술과 관련된 내용 중올바른 것을 모두 고른 것은?\n\nA. 국제수출통제체제 등에서 정하는 물품의 보관 등에 관한 기술로서 산업통상부 장관이 관계 행정기관의 장과 협의하여 고시하는 기술의 이전은 수출허가 대상이아니다.\nB. 수출허가를 받은 물품 등의 설치, 운용, 점검, 유지 및 보수에 필요한 최소한의기술은 수출허가 대상이 아니다.\nC. 전략기술을 교육, 훈련, 실연(實演) 등 구두나 행위를 통해 이전하는 경우에도수출허가를 받아야 한다.\nD. 전략기술을 국외에서 대한민국 국민이 외국인에게 이전하는 경우에는 수출허가를받을 필요가 없다.","c":["A, B","A, C","B, C","B, D"],"a":3,"t":"대외무역법: 전략물자","e":"수출허가 받은 물품의 설치, 운용, 유지보수에 필요한 최소 기술은 허가 대상이 아니고(B), 교육이나 실연처럼 구두, 행위로 이전해도 허가가 필요해요(C). 국외에서 우리 국민이 외국인에게 이전하는 것도 허가 대상이라 D는 틀렸습니다."},{"id":"65-1-9","r":65,"s":"무역규범","n":9,"q":"우리나라의 대외무역법령에서 규정하고 있는 수입물품의 원산지표시가 면제되는 경우로 올바른 것은?","c":["실수요자가 수입하는 연구개발용품","표시가 불가능한 벌크화물","수입 후 국내에서 실질적으로 변형 가공된 물품","원산지가 불명확한 물품"],"a":1,"t":"대외무역법: 원산지","e":"실수요자가 직접 수입하는 연구개발용품은 원산지표시를 면제할 수 있어요. 벌크화물은 표시가 어렵더라도 송장 등에 표시해야 하고, 국내에서 실질적 변형이 일어나면 우리나라가 원산지가 됩니다."},{"id":"65-1-10","r":65,"s":"무역규범","n":10,"q":"대외무역법령에서 규정하는 원산지표시 방법에 따라 원산지를 표시한 것으로 볼수 있는 것을 모두 고른 것은?\n\nA. 판매용 접시에 ‘日本製’로 원산지를 한자로 표시한 경우\nB. 영국에서 수입한 판매용 그릇에 ‘MADE IN UK’로 원산지를 표시한 경우.\nC. 미국에서 중고로 수입한 장식품에 ‘Imported from USA’로 표시한 경우\nD. 개별물품의 원산지가 동일하고, 최종 구매자에게 세트로 판매되는 구급함 세트용기에 ‘Made in Germany’로 표시한 경우","c":["A, B, C","A, C, D","B, C, D","A, B, C, D"],"a":4,"t":"대외무역법: 원산지","e":"한자(日本製), 'MADE IN UK' 같은 약칭, 'Imported from', 원산지가 같은 세트 물품의 용기 표시는 모두 인정되는 원산지표시 방법이에요."},{"id":"65-1-11","r":65,"s":"무역규범","n":11,"q":"다음에 제시된 상황에서 산업통상부 장관이 취할 수 있는 조치로 올바른 것을 모두 고른 것은?\n\n정부는 국내 낙농업을 보호하기 위해 모든 국가로부터 수입되는 탈지분유에 대해 수입수량 제한조치를 취하려 한다. 내용은 다음과 같다.\n\nA. 수입수량 제한조치 시행일 이후 수입된 탈지분유에만 적용한다.\nB. 수입수량 제한조치의 적용 기간은 5년으로 한다.\nC. 수입수량 제한조치의 대상 물품, 수량, 적용기간 등을 공고한다.\nD. 기간의 연장이 필요한 경우, 최초 적용 기간이 끝난 시점부터 8년 더 연장한다.","c":["A, B","A, C","B, D","A, C, D"],"a":2,"t":"대외무역법: 정의, 수출입 실적","e":"수입수량 제한조치는 시행일 이후 수입 물품에만 적용하고, 대상 물품과 수량, 기간을 공고해야 해요. 적용기간은 4년 이내, 연장을 포함해도 총 8년을 넘을 수 없어서 B와 D가 틀렸습니다."},{"id":"65-1-12","r":65,"s":"무역규범","n":12,"q":"관세법령상 품목분류사전심사제도에 관한 설명으로 올바른 것은?","c":["물품의 수출자는 수출신고를 하기 전에 관세청장에게 해당 물품에 적용될 품목분류를 미리 심사하여 줄 것을 신청할 수 있으나, 수출할 물품의 제조자는 품목분류사전심사를 신청할 수 없다.","사전심사의 신청을 받은 관세청장은 사전심사의 신청을 받은 날부터 30일(분석에소요되는 시간 포함) 이내에 신청인에게 통지하여야 한다.","관세청장은 품목분류를 심사할 때, 신청인이 호 및 소호까지의 품목분류에 대한 심사를 요청하는 경우에는 해당 번호까지의 품목분류에 대해서만 심사하여 통지할 수있다.","유사한 물품에 대하여 서로 다른 품목분류가 있는 경우에는 품목분류 사전심사를신청한 자가 재심사를 요청한 경우에 한하여 품목분류를 변경할 수 있다."],"a":3,"t":"관세법: 품목분류","e":"신청인이 호나 소호 단위까지만 심사를 요청하면 그 번호까지만 심사해 통지할 수 있어요. 제조자도 신청할 수 있고(①), 30일 기한에 분석 기간은 빠지며(②), 관세청장이 직권으로 분류를 바꿀 수도 있어요(④)."},{"id":"65-1-13","r":65,"s":"무역규범","n":13,"q":"다음 보기 중 외국물품에 해당하는 것으로 짝지어진 것은?\n\nA. 우리나라의 선박이 태평양에서 채집하거나 포획한 수산물\nB. 수출신고가 수리된 물품으로서 선적되지 않고 보세구역에 장치된 물품\nC. 보세공장에서 내국물품과 외국물품을 원재료로 하여 혼합·가공한 제품\nD. 수입신고 수리 전 반출승인을 받아 반출된 물품","c":["A, B","B, C","C, D","A, D"],"a":2,"t":"관세법: 통관, 보세","e":"수출신고가 수리된 물품과 보세공장에서 외국물품을 섞어 만든 제품은 외국물품이에요. 우리 선박이 공해에서 잡은 수산물(A)과 수리 전 반출승인 물품(D)은 내국물품입니다."},{"id":"65-1-14","r":65,"s":"무역규범","n":14,"q":"관세법령에서 규정하고 있는 관세의 납부기한에 관한 설명 중 올바른 것은?","c":["세관장은 천재지변으로 관세법에 따른 납부를 정하여진 기한까지 할 수 없다고 인정되는 경우에는 2년을 넘지 아니하는 기간을 정하여 그 기한을 연장할 수 있다.","세관장은 납부기한 연장을 받은 납세의무자가 재산 상황의 호전 기타 상황의 변화로 인하여 납부기한 연장을 할 필요가 없게 되었다고 인정되는 때에는 납부기한 연장을 취소할 수 있다.","수입신고 전 즉시반출신고를 한 경우의 관세 납부기한은 수입신고 수리일부터 15일이내이다.","관세청장은 납부할 세액의 월별 납부를 승인할 수 있으며, 이 경우 승인의 유효기간은 승인일부터 2년이 되는 날까지로 한다."],"a":2,"t":"관세법: 납세의무, 세액","e":"납부기한 연장을 받은 뒤 사정이 나아지면 세관장은 연장을 취소할 수 있어요. 천재지변 연장은 1년 이내(①), 즉시반출 물품은 수입신고일부터 15일(③), 월별납부 승인은 2년이 되는 날이 속하는 달의 말일까지예요(④)."},{"id":"65-1-15","r":65,"s":"무역규범","n":15,"q":"관세법령에서 규정하고 있는 과세물건의 확정시기 및 적용 법령에 관한 설명 중올바른 것은?","c":["수입신고가 수리되기 전에 소비하거나 사용하는 물품(제239조에 따라 소비 또는 사용을 수입으로 보지 아니하는 물품 제외)은 해당 물품을 소비하거나 사용한 때를과세물건의 확정시기로 한다.","관세법에 따라 매각되는 물품의 과세물건의 확정시기는 해당 물품에 대한 매각의사를 표시한 때이다.","관세는 수입신고(입항전수입신고 제외)를 하는 때의 물품의 성질과 그 수량에 따라부과한다.","관세는 수입신고를 수리하는 시점의 적용 법령에 따라 부과한다."],"a":1,"t":"관세법: 납세의무, 세액","e":"수입신고 수리 전에 소비하거나 사용한 물품은 그 소비, 사용한 때가 과세물건 확정시기예요. 매각 물품은 매각되는 때(②), 관세는 입항전수입신고를 '포함'한 수입신고 때 기준이고(③), 적용 법령도 수입신고 당시 법령입니다(④)."},{"id":"65-1-16","r":65,"s":"무역규범","n":16,"q":"다음은 관세법령상 과세환율에 대한 설명이다. ( )안에 들어갈 용어로 올바르게 짝지어진 것은?\n\n과세가격을 결정하는 경우 외국통화로 표시된 가격을 내국통화로 환산할 때에는제17조(적용법령)에 따른 날(보세건설장에 반입된 물품의 경우에는 수입신고를 한\n날을 말한다)이 속하는 주의 전주(前週)의 (   A   ) 또는 (   B   )을 평균하여\n관세청장이 그 율을 정한다.","c":["A : 기준환율, / B : 재정환율","A : 외국환매도율, / B : 재정환율","A : 기준환율, / B : 외국환매입율","A : 외국환매도율, / B : 외국환매입율"],"a":1,"t":"관세법: 납세의무, 세액","e":"과세환율은 해당 날이 속하는 주의 전주 기준환율 또는 재정환율을 평균해 관세청장이 정해요."},{"id":"65-1-17","r":65,"s":"무역규범","n":17,"q":"다음은 관세법령상 납세의무자에 대한 설명이다. 이 중 올바른 것으로 짝지어진 것은?\n\nA. ㈜KITA는 최근 경영 효율화를 위해 ㈜한국과 ㈜대한으로 분할합병하였다. 이 과정에서 ㈜KITA가 분할 전 수입했던 원자재에 대한 미납 관세 5천만 원이 발견되었다. 해당 관세는 ㈜한국과 ㈜대한이 연대하여 납부할 의무를 진다.\nB. 자가사용 물품을 수입하려는 화주의 위임을 받아 해외 판매자로부터 해당 물품의구매를 대행하는 구매대행업자가 화주로부터 납부할 관세 등을 수령한 경우에는연대하여 납부할 의무를 진다.\nC. 수입신고인은 수입신고를 의뢰받았으나 수입화주의 주소 및 연락처가 불분명하여화주를 특정할 수 없었음에도 신고를 진행하여 관세 1백만 원이 발생하였다. 수입신고인은 화주와 연대하여 관세를 납부하여야 한다.","c":["A","A, B","B, C","A, B, C"],"a":4,"t":"관세법: 납세의무, 세액","e":"분할합병 시 승계 법인들의 연대납세의무, 관세를 받은 구매대행업자의 연대납세의무, 화주를 특정할 수 없을 때 수입신고인의 연대납세의무 모두 맞는 설명이에요."},{"id":"65-1-18","r":65,"s":"무역규범","n":18,"q":"관세법상 부정한 방법으로 관세를 포탈하였거나 환급 또는 감면 받은 경우 관세부과의 제척기간으로 올바른 것은?","c":["5년","7년","10년","12년"],"a":3,"t":"관세법: 감면, 환급","e":"관세부과 제척기간은 원칙 5년이지만, 부정한 방법으로 관세를 포탈하거나 환급, 감면받은 경우는 10년이에요."},{"id":"65-1-19","r":65,"s":"무역규범","n":19,"q":"㈜KITA가 수입하는 물품의 과세가격(CIF 가격)은 1,000,000원이고, 관세율 적용에필요한 요건은 모두 충족되었다고 가정할 때, ㈜KITA가 납부해야 할 관세액은?\n\nA. 덤핑방지관세율 : 10%\nB. 기본관세율 : 8%\nC. FTA협정관세율 : 5%\nD. 조정관세율(관세법 제69조 제1호, 제3호, 제4호) : 7%","c":["100,000원","180,000원","150,000원","120,000원"],"a":3,"t":"관세법: 과세가격","e":"덤핑방지관세는 다른 관세에 더해서 부과해요. 나머지 세율 중에서는 FTA 협정세율(5%)이 가장 낮아 우선 적용되니 10% + 5% = 15%, 관세액은 150,000원입니다."},{"id":"65-1-20","r":65,"s":"무역규범","n":20,"q":"관세법령에서 규정하고 있는 재수입면세제도에 대한 설명 중 잘못된 것은?","c":["수출물품의 용기로서 다시 수입하는 물품은 그 관세를 면제할 수 있다.","우리나라에서 수출된 물품이 2년 내에 다시 수입되는 경우라도, 환급특례법에 따른환급을 받은 경우에는 관세를 면제하지 아니한다.","재수입면세를 적용받은 물품은 사후관리 대상이다.","해외시험을 목적으로 수출된 후 재수입되는 물품은 관세를 면제할 수 있다."],"a":3,"t":"관세법: 감면, 환급","e":"재수입면세는 우리 물품이 다시 들어오는 경우라 사후관리를 하지 않아요. 사후관리를 받는 건 재수출면세, 용도세율 같은 제도입니다."},{"id":"65-1-21","r":65,"s":"무역규범","n":21,"q":"관세법에 따라 신고를 생략하거나 간소한 방법으로 수입 신고하게 할 수 있는 물품으로 잘못된 것은?","c":["우리나라에 수입할 목적으로 최초로 운항하여 반입되는 화물 운송용 항공기","우편물(관세법 제258조 제2항에 해당하는 것은 제외)","국제운송을 위하여 반입되는 기본세율이 무세인 20피트 컨테이너","전자상거래 플랫폼 ‘알리’에서 구매한 것으로 통관목록을 제출하는 물품"],"a":1,"t":"관세법: 통관, 보세","e":"우리나라에 수입할 목적으로 처음 들어오는 화물 운송용 항공기는 신고 생략 대상이 아니라 정식 수입신고 대상이에요."},{"id":"65-1-22","r":65,"s":"무역규범","n":22,"q":"관세법에 따른 세관장이 물품의 통관을 보류할 수 있는 경우에 관한 설명으로 잘못된 것은?","c":["수입 신고서의 기재사항에 보완이 필요한 경우","수출입 관계 법령에 따른 일시적 통관 제한ㆍ금지 또는 이에 따른 중앙행정기관장의 일시적 통관 제한ㆍ금지 요청이 있어 세관장이 그 해당 여부를 확인할 필요가있는 경우","관세 관계 법령을 위반한 혐의로 고발되거나 조사받는 경우","해당 물품에 대한 수입으로 인하여 피해를 받았다고 주장하는 국내 생산자가 보류를 요청한 경우"],"a":4,"t":"관세법: 통관, 보세","e":"통관보류 사유는 신고서 보완 필요, 일시적 통관 제한 확인 필요, 관세법 위반 혐의 조사 등이에요. 국내 생산자가 피해를 주장하며 요청하는 것은 통관보류 사유가 아닙니다."},{"id":"65-1-23","r":65,"s":"무역규범","n":23,"q":"관세법령에서 규정한 수출신고, 보수작업, 납세의무자 및 과세가격에 관한 내용으로 잘못된 것은?","c":["수출신고는 수출화주 또는 관세사, 관세법인, 통관취급법인의 명의로 하여야 하며, 화주에게 해당 수출물품을 제조하여 공급한 자의 명의로 할 수 있다.","보수작업은 보세구역에서 하는 것이 원칙이나, 보세구역에서 보수작업이 곤란하다고 세관장이 인정하는 때에는 기간 및 장소를 지정받아 보세구역 밖에서 할 수 있\n다.","납세의무자는 신고납부한 세액에 부족이 있을 때는 신고납부한 날부터 6개월 이내에 수정신고를 할 수 있다.","구매자가 부담하는 수수료와 중개료는 과세가격에 가산하며 연불조건의 수입인 경우, 해당 수입물품에 대한 연불이자는 공제요소이다."],"a":3,"t":"관세법: 과세가격","e":"수정신고는 보정기간이 지난 뒤 관세부과 제척기간이 끝나기 전까지 할 수 있어요. 신고납부한 날부터 6개월 이내라고 한 ③이 틀렸습니다."},{"id":"65-1-24","r":65,"s":"무역규범","n":24,"q":"다음 중 관세환급특례법상 용어의 정의에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nA. “관세 등”이란 관세, 임시수입부가세, 개별소비세, 주세, 교통·에너지·환경세, 농어촌특별세 및 교육세를 말한다.\nB. “수출물품”이란 「관세법」에 따라 수출신고가 수리된 수출의 용도에 제공되는 물품을 말한다.\nC. “소요량”이란 수출물품을 가공·조립·수리·재생 또는 개조하여 생산하는 데 소요되는원재료의 양 중 실제 사용된 부분만을 말한다.\nD. “환급”이란 제3조에 따른 수출용 원재료를 수입하는 때에 납부하였거나 납부할 관세등을 「관세법」 등의 규정에도 불구하고 이 법에 따라 수입자에게 되돌려 주는것을 말한다.\nE. “정산”이란 수출용원재료에 대하여 일정 기간별로 일괄 납부할 관세 등과 지급이보류된 환급금을 상계하는 것을 말한다.","c":["A, C, D","A, B, E","B, D, E","A, B, D, E"],"a":2,"t":"환급특례법","e":"관세 등의 범위(A), 수출물품(B), 정산(E) 정의는 맞아요. 소요량은 실제 사용량에 손모량도 포함하고(C), 환급은 수입자가 아니라 환급신청자에게 돌려주는 것이에요(D)."},{"id":"65-1-25","r":65,"s":"무역규범","n":25,"q":"관세환급특례법령에서 규정하고 있는 관세환급에 관한 설명으로 잘못된 것은?\n\n중소기업인 ㈜KITA는 자체 생산설비를 보유하고 있지 아니하고, 국내 중소기업인 A사가제조한 전자부품을 구매하여 수출하고 있다. A사는 자체적으로 전자부품을 생산하며, 생산에 필요한 원재료를 수입하거나 국내에서 조달하여 사용한다. ㈜KITA는 A사로부터완성된 전자부품을 매입하여 이를 인수한 후, 일본의 거래처에 대가를 받고 수출하였다.","c":["전자부품 생산 과정에서 기계·설비의 작동 및 유지를 위하여 사용된 윤활유는 수출용 원재료에 해당하지 않는다.","㈜KITA는 수출자이므로, 수출물품의 생산 여부와 관계없이 간이정액환급률표를 적용하여 환급을 받을 수 있다.","A사는 간이정액환급 비적용승인을 받은 경우에는 개별환급을 신청할 수 있다.","간이정액환급률표는 「중소기업기본법」상 중소기업자가 생산한 수출물품 중, 법령에서 정한 환급실적 요건을 충족하는 경우에만 적용될 수 있다."],"a":2,"t":"환급특례법","e":"간이정액환급은 중소기업이 생산한 수출물품에 적용돼요. 수출자라면 생산 여부와 관계없이 적용된다고 한 ②가 틀렸습니다. 윤활유처럼 기계 작동에 쓰인 물품은 원재료가 아니에요."},{"id":"65-1-26","r":65,"s":"무역규범","n":26,"q":"관세환급특례법에서 규정하고 있는 내용으로 올바른 것을 모두 기재한 것은?\n\nA. 수입한 상태 그대로 수출한 경우 해당 수출물품은 환급 대상 원재료이다.\nB. 자유무역지역의 입주기업체에 대한 공급은 환급 대상에서 제외된다.\nC. “관세 등”에는 임시수입부가세를 포함하고 있다.\nD. 평균세액증명서는 수출용 원재료를 국내에서 구매한 수출자의 신청에 의해 세관장이 발행할 수 있다.\nE. 기초원재료납세증명서는 수출용 원재료가 내국신용장 등에 의해 거래된 경우세관장이 발급할 수 있다.","c":["A, B, C","B, D, E","A, C, E","B, C, E"],"a":3,"t":"환급특례법","e":"수입 상태 그대로 수출한 물품, 임시수입부가세 포함, 내국신용장 거래 시 기초원재료납세증명서 발급은 맞아요. 자유무역지역 입주기업체 공급은 환급 대상에 포함되고(B), 평균세액증명서는 수입한 자의 신청으로 발급합니다(D)."},{"id":"65-1-27","r":65,"s":"무역규범","n":27,"q":"다음 중 우리나라가 체결한 자유무역협정(FTA)을 발효일이 빠른 순서부터 바르게나열한 것은?","c":["한-칠레 FTA → 한-싱가포르 FTA → 한-인도 CEPA → 한-필리핀 FTA","한-칠레 FTA → 한-인도 CEPA → RCEP → 한-페루 FTA","한-싱가포르 FTA → 한-칠레 FTA → 한-중국 FTA → 한-페루 FTA","한-싱가포르 FTA → 한-중국 FTA → 한-필리핀 FTA → RCEP"],"a":1,"t":"FTA관세법","e":"발효 순서는 한-칠레(2004) → 한-싱가포르(2006) → 한-인도 CEPA(2010) → 한-필리핀(2024)이에요."},{"id":"65-1-28","r":65,"s":"무역규범","n":28,"q":"자유무역협정(FTA)관세법령상 용어의 정의로 잘못된 것은?","c":["우리나라가 미국과 체결한 한-미 FTA는 관세의 철폐 및 세율의 연차적 인하를 내용으로 하는 국제협정으로서 자유무역협정에 해당한다.","우리나라와 자유무역협정을 체결한 상대방이 유럽연합(EU)과 같은 경제공동체인 경우에도, 해당 공동체는 체약상대국에 포함된다.","체약상대국의 관세당국이란 해당 국가에서 관세 관련 법령이나 협정의 이행을 담당하는 세관 등 행정기관을 의미한다.","원산지란 물품이 실제로 수출된 국가를 의미하므로, 제3국을 경유하여 수입된 물품의 경우 최종 선적국이 원산지가 된다."],"a":4,"t":"FTA관세법","e":"원산지는 물품이 생산, 가공, 제조된 나라예요. 제3국을 경유해도 최종 선적국이 원산지가 되지 않습니다."},{"id":"65-1-29","r":65,"s":"무역규범","n":29,"q":"우리나라의 자유무역협정(FTA)관세법령상 원산지증명서에 관한 설명 중 올바른 것은?","c":["원산지증명서는 협정에서 정하는 방법과 절차에 따라 수출자 또는 생산자만 자율적으로 해당 물품에 대한 원산지를 확인하여 작성ㆍ서명할 수 있다.","유럽연합당사자와의 협정에 따라 총가격이 6천 유로를 초과하지 않을 경우 수출자가 자율적으로 작성ㆍ서명할 수 있다.","싱가포르, 아세안 회원국, 유럽자유무역연합 회원국, 베트남과의 협정에 따라 원산지증명서는 발급기관이 발급한다.","미합중국과의 협정에 따라 수출자 또는 생산자만 자율적으로 서면 또는 전자적 방식으로 작성ㆍ서명할 수 있다."],"a":2,"t":"FTA관세법","e":"한-EU FTA는 총가격 6천 유로 이하 물품이면 수출자 누구나 원산지 신고서를 작성할 수 있어요(초과 시 인증수출자만). 미국과의 협정은 수입자도 작성할 수 있고, EFTA는 자율발급이에요."},{"id":"65-1-30","r":65,"s":"무역규범","n":30,"q":"우리나라의 자유무역협정(FTA)관세법령에서 규정하고 있는 내용으로 잘못된 것은?","c":["자유무역협정(FTA)관세법은 관세법 또는 협정과 어긋나는 경우 우선하여 적용한다.","협정관세의 세율이 관세법 제50조의 적용세율과 같거나 높은 경우 관세법의 적용세율을 우선하여 적용한다.","협정관세를 적용받기 위해서는 수입자가 수입신고의 수리 전까지 세관장에게 협정관세 적용을 신청해야 한다.","수입신고 수리 전까지 협정관세 적용신청을 하지 못한 경우, 수입신고 수리일부터 1년 이내에 협정관세의 적용을 신청할 수 있다."],"a":1,"t":"FTA관세법","e":"FTA관세법은 관세법에는 우선하지만 협정과 어긋나면 협정이 우선해요. 협정보다 우선한다고 한 ①이 틀렸습니다."},{"id":"65-2-1","r":65,"s":"무역결제","n":1,"q":"수출자의 대금회수와 관련하여 외국환거래 신고가 요구되는 경우에 관한 설명으로올바른 것은?","c":["수출자가 수입자로부터 수출대금 미화 1만불을 현금으로 직접 수령하고자 하는 경우","수출자가 수입자가 아닌 해외업체로부터 수출대금을 수령하고자 하는 경우","수출자가 물품의 대금 회수가 어려워 수입자 공장의 기계로 채권을 대신 차감하고자하는 경우","수출자가 연계무역에 의하여 수출대금과 관련 수입대금을 상계하고자 하는 경우"],"a":3,"t":"외국환거래법","e":"수출채권을 수입자의 기계 같은 물품으로 대신 받아 상계하는 건 외국환거래법상 신고 대상이에요. 연계무역에 따른 상계, 일정 금액 이하 제3자 영수, 현금 수령은 신고 예외나 면제 범위에 들어가요."},{"id":"65-2-2","r":65,"s":"무역결제","n":2,"q":"송금방식 거래와 관련된 설명으로 올바른 것은?","c":["귀금속이나 보석처럼 실물 확인이 필수적인 고가품 거래를 하는 수입자는 CAD 방식을 활용하는 것이 제일 유리하다.","CAD 방식으로 거래하는 수출자는 선적 전 대금을 미리 지급받을 수 있다는 장점이있다.","COD 방식으로 거래하는 수입자는 물품을 확인하기 전에는 대금을 지급하지 않을 수있다는 장점이 있다.","BWT 방식으로 거래하는 수출자는 통상 수입자로부터 주문을 받은 이후 물품을 생산하고, 수출국 보세창고에 인도한다."],"a":3,"t":"송금, 기타 결제","e":"COD(Cash on Delivery)는 물품을 받아 확인하고 대금을 내니 수입자에게 유리해요. 귀금속처럼 실물 확인이 중요하면 CAD보다 COD가 낫고(①), CAD는 선적 후 서류와 교환해 받으며(②), BWT는 주문 없이 수입국 보세창고에 먼저 보내요(④)."},{"id":"65-2-3","r":65,"s":"무역결제","n":3,"q":"O/A 방식과 관련된 설명으로 올바른 것은?\n\nA. 수출자는 신규 수입거래처나 신용도가 낮은 업체와의 거래에서 대금회수를 안정적으로 하기 위해 O/A 결제방식을 적극 이용하는 것이 바람직하다.\nB. 수입자 입장에서는 물품을 확인한 후 대금을 결제할 수 있어 O/A방식을 D/P방식보다 선호한다.\nC. O/A에서 수출자는 선하증권과 같은 선적서류를 반드시 외국환은행을 통해서 수입자에게 제시하는 것이 원칙이다.\nD. O/A nego를 통해 수출자는 신용장 없이도 자신의 외상수출채권을 외국환은행에매각하여 수출대금을 조기에 현금화할 수 있다.","c":["A, C","B, D","C, D","A, B, C, D"],"a":2,"t":"송금, 기타 결제","e":"O/A는 수입자가 물품을 확인한 뒤 내니 수입자가 선호하고(B), O/A NEGO로 외상채권을 은행에 팔 수 있어요(D). 신용도 낮은 상대에게는 위험하고(A), 선적서류는 수입자에게 직접 보내는 게 원칙이에요(C)."},{"id":"65-2-4","r":65,"s":"무역결제","n":4,"q":"추심결제방식에 관한 설명으로 잘못된 것은?","c":["지급인의 이름 및 주소는 추심지시서상에 반드시 기재되어야 할 사항이다.","추심지시서에는 지급거절, 인수거절 및/또는 다른 지시의 준수 거절의 경우에 대한 지시가 적절하게 포함되어야 한다.","추심지시서를 송부하는 당사자는 서류의 인도 조건을 분명하고 명확하게 기술되도록할 책임이 있다.","D/A 방식에서는 물품이 수입국 항구나 공항에 도착하는 순간에 수출상은 화물에 대한소유권을 상실한다."],"a":4,"t":"추심(URC)","e":"D/A에서는 수입자가 환어음을 인수하면 서류를 내주고, 그때 수출자는 물품 통제권을 잃어요. 물품이 수입국에 도착하는 순간이라고 한 ④가 틀렸습니다."},{"id":"65-2-5","r":65,"s":"무역결제","n":5,"q":"추심결제방식에 관한 설명으로 잘못된 것은?","c":["D/A 방식에서는 기한부 환어음이 발행되고, 수입자가 서류를 인도받은 후 만기에 결제하는 일종의 ‘외상’거래이다.","추심결제방식 거래에는 별도의 국제규칙이 존재하지 않아 계약서에 분쟁과 관련된 사항을 자세히 명시하는 것이 바람직하다.","추심의뢰인이 추심은행을 지정하지 않은 경우, 추심의뢰은행은 임의로 추심은행을 선정할 수 있다.","추심의뢰은행은 자신이 전달한 지시가 이행되지 않는 경우에도 수출자에게 책임을 지지 않는다."],"a":2,"t":"추심(URC)","e":"추심에는 ICC가 만든 추심통일규칙(URC 522)이 있어요. 국제규칙이 없다고 한 ②가 틀렸습니다."},{"id":"65-2-6","r":65,"s":"무역결제","n":6,"q":"화환신용장거래에 관한 설명으로 올바른 것을 모두 기재한 것은?\n\nA. 개설은행이 서류의 위조 등으로 지급을 거절하고자 할 경우 명백한 증거가 필요하다.\nB. ISBP는 UCP 600을 보충하는 역할을 한다.\nC. 매매계약서의 매수자와 매도자는 신용장의 개설의뢰인과 수익자와 동일하다.\nD. 매입은행은 제시된 모든 서류의 충분성에 대하여 확인하여야 한다.\nE. 개설은행은 개설의뢰인의 신용상태에 관하여 책임을 부담하여야 한다.","c":["A, B","B, E,","A, C, D","C, D, E"],"a":1,"t":"신용장 일반","e":"위조를 이유로 지급을 거절하려면 명백한 증거가 필요하고(A), ISBP는 UCP600을 보충하는 실무기준이에요(B). 중계무역처럼 계약 당사자와 신용장 당사자가 다를 수 있고(C), 은행은 서류의 충분성에 책임지지 않으며(D), 개설의뢰인 신용상태를 수익자에게 책임지지 않아요(E)."},{"id":"65-2-7","r":65,"s":"무역결제","n":7,"q":"화환신용장의 관계당사자에 관한 설명으로 올바른 것을 모두 기재한 것은?\n\nA. 개설의뢰인은 화물의 수하인이자, 대금을 지급하는 환어음상의 지급인이다.\nB. 매입은행은 일치하는 제시에 대하여 해당 서류를 매수할 수 있다.\nC. 인수신용장에서의 지정은행은 인수은행이자 지급은행이 될 수 있다.\nD. 상환은행은 환어음상의 지급인으로 기재될 수 있다.\nE. 통지은행은 신용장의 진정성이 확인되지 못한 경우에는 통지할 수 없다.","c":["A, B, C","A, E","B, C, D","D, E"],"a":3,"t":"신용장 일반","e":"매입은행은 일치하는 제시 서류를 살 수 있고(B), 인수신용장의 지정은행은 인수하고 만기에 지급할 수 있으며(C), 상환은행이 환어음 지급인이 될 수도 있어요(D). 신용장 환어음 지급인은 개설의뢰인이 아니고(A), 진정성을 확인 못 해도 그 사실을 알리며 통지할 수 있어요(E)."},{"id":"65-2-8","r":65,"s":"무역결제","n":8,"q":"중계무역에서 사용되는 신용장으로 신용장 수익자인 중계상의 요청으로 다른 수익자인 최종공급자가 신용장의 전부 또는 일부를 이용할 수 있도록 한 신용장은?","c":["Sight LC","Confirmed LC","Banker’s Usance LC","Transferable LC"],"a":4,"t":"UCP600","e":"제1수익자(중계상)의 요청으로 제2수익자(최종공급자)가 신용장의 전부나 일부를 쓸 수 있게 한 건 양도가능신용장(Transferable L/C)이에요."},{"id":"65-2-9","r":65,"s":"무역결제","n":9,"q":"화환신용장에 관한 설명으로 잘못된 것은?","c":["취소가능신용장은 신용장에 ‘취소가능(revocable)’이란 표시가 있는 신용장이다.","Clean Credit는 선하증권(B/L)과 같은 운송서류 첨부 없이 환어음(또는 지급청구서)과불이행진술서만으로 대금이 지급되는 신용장이다.","선대신용장은 연계무역에서 활용되는데, 장차 대응하는 신용장을 개설하겠다는 보증서의 제출을 조건부로 하는 신용장이다.","회전신용장은 일정 금액 한도 내에서 신용장이 반복사용 될 수 있도록 하는 방식의신용장이다."],"a":3,"t":"신용장 일반","e":"상대방이 나중에 대응 신용장을 열겠다는 보증서를 조건으로 하는 건 연계무역의 토마스(Tomas) 신용장 설명이에요. 선대신용장(Red clause)은 수익자가 선적 전에 대금 일부를 미리 받는 신용장이라 ③이 틀렸습니다."},{"id":"65-2-10","r":65,"s":"무역결제","n":10,"q":"화환신용장에서 요구한 선하증권 서류심사에 관한 설명 중 잘못된 것은?","c":["선하증권에 기재된 물품명세를 신용장의 물품명세와 저촉하지 않는 일반적인 용어로 기재해도 하자가 아니다.","선하증권의 발행일이 신용장 개설일 이전이면 하자가 된다.","선하증권의 발행인이 운송인이 아니어도 하자가 아니다.","선하증권의 화주(shipper)가 신용장 수익자가 아니어도 하자가 아니다."],"a":2,"t":"UCP600","e":"서류 날짜는 신용장 개설일보다 앞서도 돼요(UCP600 제14조 i항). 다만 제시일보다 늦으면 안 됩니다. 그래서 ②가 틀렸습니다."},{"id":"65-2-11","r":65,"s":"무역결제","n":11,"q":"화환신용장의 확인에 관한 올바른 설명만을 기재한 것은?\n\nA. 확인은 일치하는 제시에 대해 결제(honour) 또는 매입하겠다는 개설은행의 확약에추가한 확인은행이 하는 확약이다.\nB. 매입신용장에서 확인은행은 매입 시 상환청구권을 보유한 채 매입한다.\nC. 확인의 권한을 받은 은행은 확인을 거절한 채 확인 없이 통지만 할 수도 있다.\nD. 확인은행이 원신용장에 확인을 추가한 경우 조건변경에 대해서도 반드시 확인하여야 한다.","c":["A, C","B, D","A, B, C","B, C, D"],"a":1,"t":"UCP600","e":"확인은 개설은행 확약에 더해진 확인은행의 확약이고(A), 확인 요청을 받은 은행은 확인 없이 통지만 할 수도 있어요(C). 확인은행은 상환청구권 없이 매입하고(B), 조건변경에 확인을 넓힐지는 선택할 수 있어요(D)."},{"id":"65-2-12","r":65,"s":"무역결제","n":12,"q":"화환신용장의 SWIFT 전문에 관한 설명으로 올바른 것은?\n\n50 : Applicant : ERIC EUROPA S.A. ENMEDIO 2654 CALA DEL MORAL SPAIN\n59 : Beneficiary : KITA CO. LTD 3F, 28, DIGITAL-RO, GURO-GU, SEOUL, 08381 KOREA\n31D: Date and Place of Expiry : XX0501 IN KOREA\n41D: Available With ... By ... : ANY BANK BY NEGOTIATION\n44C: Latest Date of Shipment : XX0410\n46A: Documents Required\n+SIGNED COMMERCIAL INVOICE IN 3 COPIES\n+BILL OF LADING NOTIFY TO APPLICANT MARKED FREIGHT COLLECT","c":["상업송장에 기재된 수익자의 주소는 신용장의 주소와 반드시 일치해야 한다.","선하증권의 통지처에는 개설의뢰인의 주소는 기재되지 않아도 된다.","서류는 유효기일인 ××년 5월 1일까지 개설은행에 도착해야 적시의 제시가 된다.","4월 10일이 공휴일인 일요일이면 최종 선적은 ××년 4월 11일까지 해도 된다."],"a":2,"t":"ISBP, eUCP","e":"신용장이 개설의뢰인 주소를 통지처 요건으로 정하지 않았으면 B/L 통지처에 주소를 쓰지 않아도 돼요. 수익자 주소는 같은 나라면 신용장과 달라도 되고, 유효기일까지 한국의 매입은행에 제시하면 되며, 최종선적일은 휴일이라도 연장되지 않아요."},{"id":"65-2-13","r":65,"s":"무역결제","n":13,"q":"UCP 600에서 규정한 상업송장에 관한 내용 중 올바른 것은?","c":["상업송장의 발행일자가 제시일자 이후의 일자로 표시되어도 하자는 아니다.","상업송장은 개설은행 앞으로 발행되어야 한다.","상업송장의 통화는 매입은행이 원하는 경우 신용장의 통화와 다른 통화로 표시할 수있다.","상업송장은 수기 서명이 없어도 된다."],"a":4,"t":"UCP600","e":"상업송장은 서명이 필요 없으니 수기 서명이 없어도 돼요. 송장 날짜가 제시일보다 늦으면 안 되고(①), 개설의뢰인 앞으로 발행하며(②), 통화는 신용장과 같아야 합니다(③)."},{"id":"65-2-14","r":65,"s":"무역결제","n":14,"q":"중계무역을 하는 JENNY기업은 수출국에 소재한 상공회의소에서 발행한 원산지 증명서의 제출을 요구하는 신용장을 받았다. 다음 중 하자가 되는 원산지 증명서의발행 국가는?\n\nDocumentary Credit 59: Beneficiary : JENNY COMPANY IN KOREA 44E: Port of Loading : ANY CHINESE PORT 44F: Port of DISCHARGE : ANY EUROPEAN PORT\n45A: Goods Description SHIRT, ORIGIN : INDIA\n46A: Required Document\n+ CERTIFICATE OF ORIGIN ISSUED BY CHAMBER OF COMMERCE IN EXPORTING COUNTRY","c":["Korea","China","France","India"],"a":3,"t":"ISBP, eUCP","e":"중계무역이라 수익자는 한국, 선적은 중국, 원산지는 인도라서 이 셋은 수출국으로 볼 여지가 있어요. 프랑스는 유럽 양륙항이 있는 수입국 쪽이라 수출국 상공회의소 발행 요건에 맞지 않습니다."},{"id":"65-2-15","r":65,"s":"무역결제","n":15,"q":"ISBP 745에서 규정하는 서류심사와 관련된 설명 중 잘못된 것은?","c":["물품 명세에 ‘machine’대신 ‘mashine’으로 오타가 있었다면 그 자체로 명백한 하자가 되는 것은 아니다.","신용장에서 ‘Invoice in 4 copies’를 요구한다면, 제시되는 송장은 원본 없이 사본 4부로도 충분하다.","원본 서류 2부가 발행된 경우, ‘Original’이란 표시 대신에 각각‘First Original’, ‘Second Original’로 표시해도 된다.","서류의 사본은 일부(dated) 될 필요가 없다."],"a":2,"t":"ISBP, eUCP","e":"ISBP 745에 따라 'in 4 copies'를 요구하면 최소 원본 1부와 나머지 사본을 내야 해요. 사본 4부만으로 충분하다는 ②가 틀렸습니다."},{"id":"65-2-16","r":65,"s":"무역결제","n":16,"q":"은행보증서와 보증신용장에 관한 내용으로 잘못된 것은?","c":["URDG 758은 은행보증서(demand guarantee)에 적용할 수 있고, ISP 98은 보증신용장(standby L/C)에 적용할 수 있다.","은행보증서와 보증신용장은 서류적 성격을 가진다는 점에서 화환신용장과 동일하지만, 발행자가 2차적 채무를 부담한다는 점에서 개설은행이 1차적 책임을 부담하는화환신용장과 다르다.","물품을 선적하지 않는 수출자로부터 선급금을 반환받지 못하는 상황을 대비하여 수입자는 수출자에게 선급금 반환용 보증서를 요청하는 것이 안전하다.","선적기간 내에 물품을 선적하지 못한 수출자로부터 위약금을 받지 못하는 상황을대비하여 수입자는 수출자에게 계약이행 보증서를 요청하는 것이 적절하다."],"a":2,"t":"보증(ISP98, URDG)","e":"은행보증서와 보증신용장도 화환신용장처럼 발행인이 1차적이고 독립적인 지급의무를 져요. 2차적 채무라고 한 ②가 틀렸습니다."},{"id":"65-2-17","r":65,"s":"무역결제","n":17,"q":"보증신용장에 관한 설명으로 올바른 것은?","c":["보증신용장에서 수익자에게 담보하는 위험으로 비금융적 채무(이행채무)는 가능하나, 담보하는 위험으로 금융적 채무는 절대 불가능하다.","보증신용장에서 양도가 이루어지는 경우 분할양도는 가능하나, 전액양도는 불가능하\n다.","보증신용장은 입찰보증신용장, 이행보증신용장, 하자보증신용장, 구상보증신용장과 같이 유형별로 분류되기도 한다.","보증신용장은 청구보증과 관행이나 용어는 일치하지만, 법률적으로는 독립성 관점에서근본적인 차이가 있다."],"a":3,"t":"보증(ISP98, URDG)","e":"보증신용장은 입찰, 이행, 하자, 구상(Counter) 보증처럼 용도별로 나뉘어요. 금융채무도 담보할 수 있고(①), 법적 독립성은 청구보증과 같아요(④)."},{"id":"65-2-18","r":65,"s":"무역결제","n":18,"q":"포페이팅(forfaiting)에 관한 설명으로 잘못된 것은?","c":["포페이팅거래는 상환청구 가능 조건으로 매도인이 지급청구권을 매각하고 매수인이이를 매입하는 것을 의미한다.","포페이팅 거래의 대상이 되는 ‘지급청구권(payment claim)’에는 원채무자에 대하여금전의 지급이나 반환을 청구할 수 있는 모든 종류의 권리가 포함된다.","포페이팅거래에서 매수인은 지급청구권을 매입하는 자를 의미한다.","포페이팅에 대한 국제규칙은 ‘포페이팅통일규칙(URF 800)’이다."],"a":1,"t":"무역금융, 팩토링","e":"포페이팅은 수출자가 어음이나 지급청구권을 상환청구권 없이(without recourse) 포페이터에게 파는 거래예요. 상환청구 가능 조건이라고 한 ①이 틀렸습니다."},{"id":"65-2-19","r":65,"s":"무역결제","n":19,"q":"무역계약에서 선택된 결제방식과 관련한 위험관리 방법으로 적절하지 못한 것은?","c":["T/T in advance – 수입자 : 수입보험가입, 선수금환급보증서 등을 이용하여 위험을관리한다.","D/A – 수출자 : 수입자와 합의하여 Aval D/A를 활용하여 위험을 관리한다.","Sight L/C – 수출자 : 수출보험 가입, 수입자 : 선적전 검사증명서를 신용장 요구서류에 포함시켜 위험을 관리한다.","COD – 수입자 : 수입보험 가입, 수출국에 있는 대리인을 이용한 선적 전 검사 등을이용하여 위험을 관리한다."],"a":4,"t":"송금, 기타 결제","e":"COD는 물품을 받을 때 대금을 내니 수입자의 대금 위험이 거의 없어요. 수입보험까지 들어 관리한다는 ④는 결제방식과 맞지 않는 방법으로 봅니다."},{"id":"65-2-20","r":65,"s":"무역결제","n":20,"q":"수출입 대금결제 및 위험관리방안 중 잘못된 것으로 기재된 것은?\n\nA. 수출자 : 30% T/T in advance 조건을 회피하는 수입자에게 선수금환급보증서제공을 통한 수입자의 위험 완화를 제안하여 원하는 결제조건으로 계약을 체결하였다.\nB. 수입자 : D/P 조건을 고집하는 수출자에게 D/P at 90 days after B/L date를제시하여 수입자 자신의 자금부담 완화를 시도하였다.\nC. 완제품 국내 공급자 : 수출기업으로부터 구매확인서를 이용한 거래를 제안받고, 내국신용장을 이용하는 조건으로 변경을 요청하였다.","c":["A, B, C","B, C","C","정답 없음"],"a":4,"t":"송금, 기타 결제","e":"선수금환급보증 제공(A), D/P 대신 기한부 조건 제시(B), 구매확인서 대신 은행 지급확약이 있는 내국신용장 요청(C) 모두 실무에서 쓸 수 있는 방법이라 틀린 게 없어요."},{"id":"65-2-21","r":65,"s":"무역결제","n":21,"q":"대금결제 관련 내용으로 잘못된 것은?","c":["수출기업이 무역금융 수혜를 위해 구매확인서가 아닌 내국신용장을 이용하여 원자재를 구매하는 경우, 수출실적은 인정되지만, 부가세는 영세율이 적용되지 않는다.","중계무역의 형태로 수출하는 경우, 무역보험공사의 수출신용보증(선적 후) 상품을이용할 수 없으므로 수출자는 무역보험이 아닌 위험관리 방법도 검토해야 한다.","유럽의 수출자가 Advance Payment L/C를 요구한다면, 국내의 수입자는 선급금 환급 보증서를 요청해야 한다.","Shipper’s usance L/C을 이용하는 수출거래라면, 수출자는 usance기간 동안 발생하는 이자만큼 수출단가를 인상할 필요가 있다."],"a":1,"t":"무역금융, 팩토링","e":"내국신용장으로 원자재를 사면 수출실적도 인정되고 부가가치세 영세율도 적용돼요. 영세율이 안 된다는 ①이 틀렸습니다."},{"id":"65-2-22","r":65,"s":"무역결제","n":22,"q":"대금결제와 관련된 내용으로 올바른 것은?","c":["화환신용장 상에 “transferable”이라는 단어가 없다면 대금양도를 할 수 없다.","Trust Receipt란 개설은행이 수입 화물에 대한 담보권과 소유권을 유지하면서 수입자가 수입대금을 결제하기 전에 수입 화물을 처분할 수 있도록 하는 제도이다.","International Factoring에서 수출 팩터는 수입대금에 대한 신용위험을 인수하는 자이다.","Letter of Shipping Guarantee는 화환신용장의 개설의뢰인이 운송인에게 발행하는보증서이다."],"a":2,"t":"무역금융, 팩토링","e":"수입화물대도(Trust Receipt)는 은행이 담보권을 유지한 채 수입자가 대금 결제 전에 화물을 처분할 수 있게 하는 제도예요. 대금양도는 transferable 없이도 되고(①), 신용위험은 수입팩터가 지며(③), L/G는 은행이 발행해요(④)."},{"id":"65-2-23","r":65,"s":"무역결제","n":23,"q":"다음 중 자국통화와 미달러화의 환율을 미국식(American Term)으로 표시하지 않는 나라는 어느 나라인가?","c":["뉴질랜드(New Zealand)","스페인(Spain)","그리스(Greece)","노르웨이(Norway)"],"a":4,"t":"외환, 환율","e":"노르웨이 크로네는 USD/NOK처럼 달러를 기준으로 표시하는 유럽식이에요. 뉴질랜드 달러와 유로(스페인, 그리스)는 NZD/USD, EUR/USD처럼 미국식으로 표시합니다."},{"id":"65-2-24","r":65,"s":"무역결제","n":24,"q":"K씨는 엔화 약세일 때를 노려 일본에 여행을 가려고 한다. 일본에서는 트래블카드를 사용할 예정이다. 은행이 고시한 JPY/KRW 환율이 다음과 같다면, K씨는 어떤 환율로 원화를 엔화로 환전하는가?\n\n| 매매기준율 | 송금 보내실 때 | 송금 받으실 때 | 현찰 사실 때 | 현찰 파실 때 | USD 환산율 |\n| 931.42 | 940.45 | 922.39 | 947.71 | 915.13 | 0.6320 |","c":["931.42","940.45","947.71","0.6320"],"a":2,"t":"외환, 환율","e":"트래블카드 충전은 현찰이 아니라 외화를 전신으로 사는 거래라 '송금 보내실 때' 환율(전신환매도율) 940.45원을 적용해요."},{"id":"65-2-25","r":65,"s":"무역결제","n":25,"q":"㈜한국무역은 X월 X일 오전에 통화선물시장에서 6월물 미달러 선물을 1,500원에 1계약 매도하였다. 그런데 그날 통화선물 6월물의 마감환율은 1,495원으로 결정되었다. 개시증거금은 거래금액의 4.5%이고, 유지증거금은 거래금액의 3%라고 한다. 이 경우 ㈜한국무역이 개설한 통화선물거래의 증거금 계좌에는 오늘 어떤 자금흐름이 발생하는가? (단, 미달러선물 1계약의 거래단위는 1만 달러)","c":["5만원이 입금된다.","5만원이 출금된다.","증거금이 유지증거금 이하로 감소하였으므로 마진콜이 발동된다.","아직은 자금흐름이 없고, 증거금이 유지증거금 이하로 감소하면 추가증거금이 필요하\n다."],"a":1,"t":"외환, 환율","e":"1,500원에 팔았는데 1,495원으로 마감했으니 달러당 5원 이익이에요. 5원 × 1만 달러 = 5만원이 일일정산으로 증거금 계좌에 입금됩니다."},{"id":"65-2-26","r":65,"s":"무역결제","n":26,"q":"갑기업은 2025년 10월에 5년 만기로 1백만 달러를 차입하였다. 2025년 말 달러/원 환율이 1,440원이었는데 2026년 말 달러/원 환율이 1,400원이 되었을 때, 갑기업과 관련된환리스크의 유형은 무엇인가?","c":["환리스크 없음","영업환리스크","거래환리스크","환산환리스크"],"a":4,"t":"외환, 환율","e":"외화 차입금을 결산 때 원화로 바꿔 장부에 적으면서 환율 변화로 생기는 평가손익은 환산환리스크예요."},{"id":"65-2-27","r":65,"s":"무역결제","n":27,"q":"달러/원 환율이 급격히 떨어지고 있는 상황에서 환율 하락이 가속화될 것으로 전망되자, 미국에 상품을 수출하는 ㈜한국무역은 2주 후 받기로 한 미달러(USD)로 계약한 수출대금을 오늘 받기로 거래처와 합의하였다. 이 사례에 대한 설명으로 잘못된 것은?","c":["㈜한국무역은 외부적 환위험 관리기법을 사용하였다.","㈜한국무역은 파생상품 계약비용 없이 환위험을 관리했다.","㈜한국무역은 리딩(leading) 전략을 사용하였다.","㈜한국무역은 환율하락에 따른 손실을 줄이기 위한 행동을 하였다."],"a":1,"t":"외환, 환율","e":"결제 시기를 앞당기는 리딩(leading)은 파생상품 없이 회사 안에서 쓰는 내부적 환위험 관리기법이에요. 외부적 기법이라고 한 ①이 틀렸습니다."},{"id":"65-2-28","r":65,"s":"무역결제","n":28,"q":"은행 간 달러/원현물환율이 1,470.50/80이고 3개월 달러/원 스왑포인트가 720/680인 경우, 갑기업이 A은행으로부터 3개월 만기로 100만 달러를 매입할 수 있는 선물환율은?","c":["1,463.30","1,463.70","1,463.60","1,464.00"],"a":4,"t":"외환, 환율","e":"기업이 달러를 사니 Offer 쪽을 써요. 스왑포인트 720/680은 Bid > Offer라 디스카운트이므로 현물 Offer 1,470.80에서 6.80을 빼면 1,464.00원이에요."},{"id":"65-2-29","r":65,"s":"무역결제","n":29,"q":"달러/엔 3개월 선물환율이 157엔이고, 행사가격이 158엔인 만기 3개월 달러 풋옵션의 옵션프리미엄이 2.5엔일 때 시간가치는 얼마인가?","c":["0엔","1.0엔","1.5엔","2.5엔"],"a":3,"t":"외환, 환율","e":"풋옵션 내재가치는 행사가격 158엔에서 선물환율 157엔을 뺀 1엔이에요. 프리미엄 2.5엔에서 내재가치 1엔을 빼면 시간가치는 1.5엔입니다."},{"id":"65-2-30","r":65,"s":"무역결제","n":30,"q":"환위험관리에 관한 설명으로 잘못된 것은?","c":["현물환이란 외환거래 계약체결 후 즉시 또는 통상 2영업일 이내에 외화를 인도·결제하는 거래를 말한다.","기업이 선물환 계약을 하였다면 먼 미래의 기대이익을 포기해야 한다.","환변동보험을 가입하는 경우 수출대금이 조기에 입금되더라도 만기일 이전에 조기결제는 받을 수 없다.","선물환 거래는 거래환율에 수수료가 포함되어 있으며 증거금은 신용도에 따라 차등적용한다."],"a":3,"t":"외환, 환율","e":"정답 키는 ③을 틀린 설명으로 봐요. 환변동보험은 수출대금이 일찍 들어오면 만기 전 조기결제를 신청할 수 있는 상품입니다."},{"id":"65-3-1","r":65,"s":"무역계약","n":1,"q":"무역계약의 법적 성격에 관한 설명으로 잘못된 것을 모두 고른 것은?\n\nA. 무역계약은 당사자들의 합의 또는 동의 이외에 추가적인 어떤 행위를 요구하는 계약이다.\nB. 무역계약은 국제계약이므로 계약위반의 입증 편의성과 계약체결의 증거 확보를 위해서 반드시 서면으로 계약을 체결하여야 한다.\nC. 무역계약은 계약당사자가 상대방에 대하여 대가적 관계에 있는 채무를 부담하는 계약이다.\nD. 무역계약은 유상계약이므로 매도인은 약정된 물품을, 매수인은 대금을 제공하여야 한다. 따라서 매수인의 대금 지급이 없는 물물교환은 유상계약으로 인정하지 않는다.\nE. 무역계약은 그 기초가 되는 법률행위, 즉 의사표시 등이 무효 또는 실효되더라도 계약자유의 원칙에 따라 당사자 간에 합의된 사항은 법적 효력이 있다.","c":["A, B, C, D","A, C, D","A, D, E","A, B, D, E"],"a":4,"t":"무역계약 일반","e":"무역계약은 합의만으로 성립하고(A 틀림), 서면이 필요 없으며(B 틀림), 물물교환도 대가를 주고받는 유상계약이고(D 틀림), 기초가 되는 의사표시가 무효면 계약도 효력을 잃어요(E 틀림). 쌍무계약이라는 C만 맞습니다."},{"id":"65-3-2","r":65,"s":"무역계약","n":2,"q":"괄호 안에 들어갈 용어로 올바른 것은?\n\n무역계약은 당사자들이 당해 계약 내용을 스스로 결정할 수 있지만, 장래에 발생할 수 있는 모든 내용에 대해서 합의하여 거래조건으로 모두 명시하는 것은 현실적으로 불가능하다. 따라서 이러한 명시조건을 보완하기 위해서 (   )과 같은 무역거래 관습을 합의하여 적용하고 있다.","c":["불가항력 조항","준거법 조항","중재 조항","정형거래조건"],"a":4,"t":"인코텀즈","e":"계약서에 다 적지 못한 인도, 위험, 비용 부담을 보완하려고 합의해서 쓰는 무역거래 관습은 인코텀즈 같은 정형거래조건이에요."},{"id":"65-3-3","r":65,"s":"무역계약","n":3,"q":"무역계약과 관련된 국제규칙의 설명으로 잘못된 것을 모두 고른 것은?\n\nA. Incoterms 2020은 국제상업회의소가 제정 및 개정한 국제규칙으로, 가입국 간에는 자동 적용되고 비가입국 간에는 합의에 따라서 적용할 수 있다.\nB. New York Convention(1958)은 중재판정의 효력을 국제적으로 인정하기 위해서 제정된 국제법이다. UN 회원국은 동 협약이 자동으로 적용된다.\nC. CISG(1980)는 국제물품매매계약에 사용되는 준거법으로, 가입국 간에는 자동 적용되고 비가입국도 합의에 따라서 적용할 수 있다.\nD. 계약당사자의 소속 국가의 국내법은 당사자 간의 합의에 따라 무역거래의 준거법이 될 수 있다.","c":["A, B","A, C, D","A, D","A, B, C"],"a":1,"t":"무역계약 일반","e":"인코텀즈는 가입국 개념이 없는 민간 규칙이라 당사자가 합의해야 적용되고(A 틀림), 뉴욕협약은 UN 회원국이 아니라 협약 체약국에 적용돼요(B 틀림). C와 D는 맞습니다."},{"id":"65-3-4","r":65,"s":"무역계약","n":4,"q":"Incoterms 2020에서 조건별 인도와 위험에 관한 설명 중 올바른 것은?","c":["EXW 조건은 매도인이 물품을 지정장소에서 매수인이 마련한 운송 수단에 적재한 때인도한다.","FCA 조건은 지정장소가 매도인의 영업장 구내가 아닌 경우에는 물품을 매수인이 마련한 운송 수단에 적재한 후 지정장소로 운반하여 하차한 때 인도된다.","DPU 조건은 물품이 지정목적지에서 도착 운송 수단에 실어둔 채로 매수인의 처분하에 놓인 때 인도된다.","DDP 조건은 물품이 지정목적지에서 수입통관 후 도착 운송 수단에 실어둔 채로 매수인의 처분하에 놓인 때 인도된다."],"a":4,"t":"인코텀즈","e":"DDP는 지정목적지에서 수입통관을 마친 물품을 도착 운송수단에 실은 채(양하 전) 매수인 처분하에 둘 때 인도돼요. EXW는 적재하지 않고(①), FCA는 다른 장소면 매도인 운송수단 위에서 양하 준비 상태로 인도하며(②), DPU는 양하해서 인도합니다(③)."},{"id":"65-3-5","r":65,"s":"무역계약","n":5,"q":"Incoterms 2020의 개별조건 다음에 기재되는 지정장소는 매우 중요한 의미를 지닌다. 이에 관한 설명으로 잘못된 것은?","c":["C 규칙에서 지정장소는 매도인이 운송을 마련하고 비용을 부담해야 하는 목적지로서인도장소나 인도항구이다.","D 규칙에서 지정장소는 인도장소이자 목적지이고, 매도인은 그 지점까지 운송을 마련해야 한다.","E 규칙에서 지정장소는 매도인의 창고 등에서 물품을 매수인에게 인도하는 위험의 분기점이자 목적지를 나타낸다.","F 규칙에서 지정장소는 어디에서 매도인으로부터 물품을 매수인에게 인도하는지를 말하는 위험의 분기점을 의미한다."],"a":1,"t":"인코텀즈","e":"C 규칙의 지정장소는 매도인이 운임을 내는 목적지예요. 인도(위험 이전)는 출발지에서 일어나므로 '인도장소나 인도항구'라고 한 ①이 틀렸습니다."},{"id":"65-3-6","r":65,"s":"무역계약","n":6,"q":"Incoterms 2020에서 수출 또는 수입통관에 관한 설명으로 올바른 것은?","c":["EXW에서 매도인은 수출통관과 운송 중에 물품이 통과할 제3국의 통관을 수행할 의무가 있다.","FOB에서 매수인은 물품이 제3국 통과를 위한 통관과 수입국의 수입통관 절차를 수행하고 수입관세를 납부할 의무가 있다.","CIF에서 매도인은 수출통관과 물품이 제3국 통관 절차를 수행할 의무가 있다.","DAP에서 매도인은 물품이 제3국 통과를 위한 통관과 수입통관 절차를 수행할 의무가있다."],"a":2,"t":"인코텀즈","e":"FOB에서 매도인은 수출통관만 하고, 제3국 통과 통관과 수입통관, 수입관세는 매수인이 해요. EXW는 매수인이 수출통관까지 하고(①), CIF는 통과국 통관이 매수인 몫이며(③), DAP의 수입통관은 매수인 몫이에요(④)."},{"id":"65-3-7","r":65,"s":"무역계약","n":7,"q":"CISG(1980)에서는 물품의 정의를 규정하고 있지 않지만, CISG(1980)를 적용하지 않는 매매계약을 명시함으로써 물품의 정의를 유추할 수 있다. 다음 중 CISG(1980)가 적용되는 국제매매계약은 어느 것인가?","c":["전기의 매매","선박의 용품, 항공기 장비의 매매","주식, 지분, 투자증권, 유통증권 또는 통화의 매매","강제집행 또는 기타 법률의 수권에 의한 매매"],"a":2,"t":"CISG","e":"CISG 제2조는 경매, 강제집행, 주식과 유가증권과 통화, 선박과 항공기 자체, 전기의 매매를 적용 대상에서 빼요. 선박 용품이나 항공기 장비는 제외 대상이 아니라 CISG가 적용됩니다."},{"id":"65-3-8","r":65,"s":"무역계약","n":8,"q":"CISG(1980)에서 유효한 계약 성립을 위한 청약(offer)에 관한 설명으로 거리가 먼 것은?","c":["청약의 대상은 1인 또는 그 이상이더라도 범위를 정할 수 있는 특정인에게 행해져야한다.","피청약자가 승낙하면 구속된다는 의사표시가 있어야 한다.","제의 내용의 충분성은 물품을 표시하고 수량과 대금의 확정성이 있어야 하지만, 묵시적으로 정한 것도 인정될 수 있다.","청약이 유효하려면 승낙을 위한 유효기일이 반드시 정해져 있어야 한다."],"a":4,"t":"CISG","e":"CISG 제14조의 청약 요건은 특정인 대상, 구속 의사, 물품과 수량, 대금의 확정성이에요. 승낙 유효기일은 청약의 필수 요건이 아니어서 ④가 거리가 멉니다."},{"id":"65-3-9","r":65,"s":"무역계약","n":9,"q":"CISG(1980)에 규정된 매도인과 매수인에게 공통으로 존재하는 구제수단이 아닌 것으로만 연결된 것은?","c":["계약해제권 － 특정이행 청구권 － 추가기간 설정권","특정이행 청구권 － 손해배상 청구권 － 계약해제권","하자보완 청구권 － 조기인도 거절권 － 물품명세 지정권","계약대로의 이행청구 － 손해배상 청구권 － 추가기간 설정권"],"a":3,"t":"CISG","e":"하자보완청구권과 조기인도 거절권은 매수인에게만, 물품명세 지정권은 매도인에게만 있는 구제수단이에요. 이행청구, 손해배상, 계약해제, 추가기간 설정은 양쪽 모두에게 있습니다."},{"id":"65-3-10","r":65,"s":"무역계약","n":10,"q":"CISG(1980)에서 규정하고 있는 청약과 승낙에 관한 설명 중 잘못된 것은?","c":["청약은 특정인에게 보내지는 것으로 제안 물품의 종류와 수량, 가격 등이 충분하게확정해야 한다.","청약을 받은 사람이 청약의 내용을 변경하지 않고 그대로 동의하는 것을 승낙이라고 하며, 승낙은 청약자에게 도달한 때에 효력이 발생한다.","청약자가 청약서에서 ‘답신이 없으면 동의한 것으로 알겠다’고 밝혔다면, 청약을받은 사람이 침묵하는 경우는 승낙으로 간주한다.","청약을 받은 사람이 청약의 내용에 대금, 수량, 품질 등 중요한 조건을 추가하여 회신하였으면 반대청약으로 간주한다."],"a":3,"t":"CISG","e":"CISG 제18조 1항: 침묵이나 부작위 자체는 승낙이 아니에요. 청약자가 '답이 없으면 동의로 보겠다'고 해도 침묵이 승낙이 되지는 않습니다."},{"id":"65-3-11","r":65,"s":"무역계약","n":11,"q":"다음 무역거래의 유형으로 올바른 것은?\n\nㅇ 하나의 계약서에 의해 환거래가 발생하고, 대응 수입의무를 제3국에 전가할 수있는 거래ㅇ 통상 Back to Back L/C 등 특수 신용장이 이용됨ㅇ 환거래가 발생하여 상호 간에 합의된 통화로 대금을 결제","c":["Barter Trade","Compensation Trade","Counter Trade","Buy Back"],"a":2,"t":"특수거래 형태","e":"하나의 계약서로 수출과 수입을 함께 약정하고, 대응 수입의무를 제3국에 넘길 수 있으며, Back to Back L/C 같은 특수 신용장을 쓰는 거래는 구상무역(Compensation Trade)이에요."},{"id":"65-3-12","r":65,"s":"무역계약","n":12,"q":"계약이행조건으로서 선적조건에 관한 설명으로 잘못된 것은?","c":["화환신용장에서 “Partial shipment: prohibited/not allowed” 등 취지의 기재가 없다면 분할선적은 허용된다.","신용장에서 일정 기간 내에 할부선적이 기재된 경우, 정해진 기간 내에 할부선적이 없으면 해당 할부한 부분과 향후 할부한 부분은 더 이상 이용될 수 없다.","선적 일자와 함께 사용되는 “on or about”은 지정일 전후 1주일을 포함해서 총 15일 사이에 선적하는 것으로 해석한다.","항공운송에서 선적 기간의 준수 여부는 항공기에 탑재일의 기재가 없는 경우에는 AWB 발행일을 선적일로 간주한다."],"a":3,"t":"거래조건(품질, 수량, 선적)","e":"UCP600 제3조에서 'on or about'은 지정일 전후 5일을 포함한 기간, 즉 총 11일로 해석해요. 전후 1주일이라고 한 ③이 틀렸습니다."},{"id":"65-3-13","r":65,"s":"무역계약","n":13,"q":"무역계약의 조건에 관한 설명 중 잘못된 것은?","c":["포장의 견고성에 대한 의무는 원칙적으로 매도인에게 부과된다.","수량조건에서는 중량, 개수, 단위 등을 약정하며, UCP 600에서 살물(bulk cargo)의과부족을 허용하는 조항이 있다.","화환신용장에서 선적일은 운송서류 발행일만 있는 경우는 발행일을, 선적일이 별도로 표시되었으면 선적일을 기준으로 한다.","보험조건은 매도인이 부보하는 CIF, CIP 조건에서 필요하며 그 외의 조건에서는 별도의 보험계약 체결이 금지된다."],"a":4,"t":"무역계약 일반","e":"CIF, CIP 외의 조건에서는 보험 '의무'가 없을 뿐, 위험을 지는 당사자가 자기를 위해 보험을 드는 건 얼마든지 가능해요. 보험계약이 금지된다는 ④가 틀렸습니다."},{"id":"65-3-14","r":65,"s":"무역계약","n":14,"q":"다음 사례에 관한 설명 중 올바른 것은?\n\nA사(매도인)와 B사(매수인)는 다음과 같은 조건으로 수출계약을 체결하였다.\n\n∙ 품질조건 : 선적품질조건\n∙ 수량조건 : 10,000 MT, Quantity subject to a variation of 3% more or less at seller’s option\n∙ 거래조건 : CIF Busan, Incoterms 2020\n∙ 결제조건 : Irrevocable L/C at sight\n\n선적 후 A사는 9,750 MT만 선적되었음을 확인하였고, 선적 당시 품질은 계약과 일치하였으나 양륙 시 일부 화물이 훼손되어 있었다.","c":["물품의 하자가 발생하였으므로 적하보험증권을 포함한 일치하는 서류의 제시만으로는 대금청구를 할 수 없다.","9,750 MT 선적은 계약상 수량을 벗어나 수량조건 위반에 해당한다.","CIF 조건에서 운송계약과 보험계약 체결 의무는 매수인에게 있으므로, A사는 선적후부터 운송 중에 발생한 위험에 대해 의무를 부담하지 않는다.","선적품질조건이므로 선적 시 품질이 계약과 일치했다면 양륙 시 훼손이 있더라도품질 불일치로 인한 매도인의 계약위반 책임은 면제된다."],"a":4,"t":"거래조건(품질, 수량, 선적)","e":"선적품질조건이면 선적 때 품질이 맞았을 경우 운송 중 훼손은 매도인 책임이 아니에요. 신용장은 일치하는 서류만으로 대금을 받고(①), 3% 허용이라 9,700~10,300MT 안의 9,750MT는 정상이며(②), CIF의 운송, 보험계약 의무는 매도인에게 있어요(③)."},{"id":"65-3-15","r":65,"s":"무역계약","n":15,"q":"국제물품매매계약서의 분리가능조항(Severability Clause)에 관한 설명으로 올바른 것은?","c":["한번 포기 또는 묵인한 이행청구에 대해서 추후 동일한 계약위반이 다시 발생한다면분리하여 책임을 물을 수 있다는 조항이다.","매도인과 매수인의 의무와 책임을 분리하는 조항으로 영미법에서 계약의 성립에 중요한 역할을 한다.","불가항력에 따른 선적지연이 발생하는 경우, 수출업자의 면책과 계약이행 기간 연장을구분하는 조항이다.","“본 계약이 해제되더라도 비밀유지조항은 독립적으로 존속한다”라는 조항이 포함된계약이 해제된 경우에도 약정기간 동안 비밀유지 의무를 상대방에게 강제할 수 있는효과를 기대할 수 있다."],"a":4,"t":"계약 조항","e":"분리가능조항은 계약 일부가 무효가 되어도 나머지 조항은 효력을 유지한다는 조항이에요. 그래서 비밀유지 조항이 독립적으로 존속한다고 정해 두면 계약 해제 뒤에도 비밀유지 의무를 강제할 수 있어요. ①은 권리불포기 조항 설명입니다."},{"id":"65-3-16","r":65,"s":"무역계약","n":16,"q":"다음 계약 조항의 설명으로 잘못된 것은?\n\nIf the issuance of the letter of credit should be delayed due to causes for which the Buyer is liable, the Buyer shall pay the Seller an amount equivalent to three-tenths of one percent of the amount of the relevant letter of credit per each full week as (   ).","c":["위의 괄호 안에 들어갈 수 있는 적절한 용어는 liquidated damages이다.","계약체결 시에 청구할 수 있는 손해배상액을 미리 약정하는 조항이다.","손해액을 입증하는 것이 비교적 용이한 경우에 활용할 수 있는 조항이다.","손해를 입은 당사자는 그 손해액을 입증할 필요가 없다."],"a":3,"t":"계약 조항","e":"손해배상액 예정(liquidated damages) 조항은 손해액을 입증하기 '어려운' 경우를 대비해 미리 금액을 정해 두는 거예요. 입증이 쉬운 경우에 쓴다는 ③이 틀렸습니다."},{"id":"65-3-17","r":65,"s":"무역계약","n":17,"q":"무역 클레임 제기에 관한 설명으로 올바른 것은?","c":["무역 거래 시 손해를 입은 당사자는 손해를 유발한 당사자에게 클레임을 제기하고 손해배상청구와 함께 추가적 이익을 요청할 수 있다.","클레임 제기자는 수량 부족, 품질 불량, 관세 등 탈세 사실에 대해 검사보고서 (Surveyor’s Report)를 직접 작성하고 당사자에게 발송한다.","클레임의 당사자는 일반적으로 계약당사자이지만, 예외적으로 계약당사자의 책임 없이발생한 손해에 대해서는 제3자(창고업자 등)에게도 청구할 수 있다.","물품 하자 발생 시 클레임 제기 기간에 관하여 별도의 합의가 없는 경우, CISG(1980)에의하면 매수인은 물품을 인도받은 날로부터 최대 6개월 내 매도인에게 하자를 통지해야 한다."],"a":3,"t":"클레임, 중재","e":"클레임은 보통 계약 당사자 사이에서 제기하지만, 창고업자나 운송인처럼 손해를 일으킨 제3자에게도 청구할 수 있어요. 검사보고서는 공인 검정인이 작성하고(②), CISG의 통지 기간은 실제 인도일부터 최대 2년이에요(④)."},{"id":"65-3-18","r":65,"s":"무역계약","n":18,"q":"무역계약의 해제에 관한 설명으로 잘못된 것은?","c":["본질적 계약위반이란 그 계약에서 상대방이 기대할 권리가 있는 것을 실질적으로 박탈한 정도로 불이익을 초래하는 위반이다.","매수인이 설정한 추가이행 기간 내에 매도인이 물품을 인도하지 아니할 것을 표명한경우에는 계약을 해제할 수 없다.","계약해제란 계약의 효력을 계약성립 시로 소급하여 소멸시킴으로써 처음부터 그 계약이 없었던 것과 같은 법률 효과를 발생시킨다.","계약의 해제는 정당한 손해배상에 응할 것을 조건으로 하여 양 당사자를 계약상의 의무로부터 면제시킨다."],"a":2,"t":"CISG","e":"매수인이 정한 추가기간 안에 매도인이 인도하지 않겠다고 밝히면 매수인은 계약을 해제할 수 있어요(CISG 제49조 1항 b). 해제할 수 없다는 ②가 틀렸습니다."},{"id":"65-3-19","r":65,"s":"무역계약","n":19,"q":"중재합의에 관한 설명이 잘못된 것은?","c":["중재합의의 실효성을 위해서는 중재지, 중재기관 및 준거법이 중재조항에 포함되어야한다.","중재합의는 서면으로 작성해야 하고 구두, 팩스, e-mail 등의 방식은 중재합의의 내용이 기록되더라도 효력이 발생하지 않는다.","중재합의는 분쟁 전에 합의해 두는 사전 중재합의 방식과 발생한 분쟁을 중재로 해결하는 사후 중재합의 방식으로 나눌 수 있다.","중재합의의 대상인 분쟁에 관하여 소가 제기된 경우, 피고가 중재합의가 있다는 항변을하면 법원은 그 소를 각하해야 한다."],"a":2,"t":"클레임, 중재","e":"중재합의는 서면이어야 하지만, 팩스나 e-mail처럼 내용이 기록으로 남는 방식도 서면으로 인정돼요. 효력이 없다고 한 ②가 틀렸습니다."},{"id":"65-3-20","r":65,"s":"무역계약","n":20,"q":"무역계약 관련 설명으로 잘못된 것은?","c":["중재는 반드시 양 당사자의 합의가 있어야 하며, 중재판정의 효력은 법원의 확정판결과 동일하다.","우리나라는 뉴욕협약에 가입이 되어 있으므로 대한상사중재원의 중재판정도 뉴욕협약 가입국 간에서는 승인 및 집행을 보장받을 수 있다.","클레임 제기 기간에 관한 당사자의 약정이 없는 경우에 비엔나협약 가입국끼리의거래 시 비엔나협약에 따르며 제척기간 내라면 합리적인 기간 내에 통지하면 된다.","청약에 대한 승낙은 불요식계약의 특성으로 인해 특별한 형식이 필요 없는 점에서부작위도 그 자체만으로 승낙이 인정된다."],"a":4,"t":"CISG","e":"승낙은 형식이 자유롭지만, 침묵이나 부작위 그 자체만으로는 승낙이 되지 않아요(CISG 제18조 1항). 그래서 ④가 틀렸습니다."},{"id":"65-3-21","r":65,"s":"무역계약","n":21,"q":"무역계약의 조건으로 잘못된 것은?","c":["UCP 600에서는 선적일을 서류발행일이 아닌 실제 선적일을 기준으로 하므로 운송서류에서 on board date가 중요하다.","More or Less Clause 조항과 관련하여 살물 거래 시 계약서상에 별도의 합의가 없더라도, 화환신용장 거래의 경우에 5%의 범위 안에서 과부족을 허용한다.","보험조건에 대한 특별한 합의가 없다면 CIF 조건에서는 매도인은 최소담보 조건으로 계약을 체결할 수 있다.","Incoterms 2020은 무역계약 조건 중 가격조건, 선적조건. 보험조건, 품질조건과 관련이 있다."],"a":4,"t":"인코텀즈","e":"인코텀즈는 인도(선적), 위험, 비용, 보험, 통관을 다루고 가격 구성에 영향을 주지만, 물품의 품질조건과는 관계가 없어요. 품질조건까지 든 ④가 틀렸습니다."},{"id":"65-3-22","r":65,"s":"무역계약","n":22,"q":"무역계약의 조건에 관한 설명으로 올바른 것은?","c":["“These prices are subject to change without our prior notice.”는 firm offer이다.","인삼, 오징어, 원면, 원목, 목재류 등은 주로 선물거래(future transaction)에서 많이쓰인다.","Hardship clause는 계약 내용을 이행하지 못하는 경우에 사용하는 조항이다.","Conciliation은 조정이라고 하며, 조정안에 당사자가 구속되지 않으므로 조정안을 수락해야 할 의무는 없다."],"a":4,"t":"클레임, 중재","e":"조정(Conciliation)은 조정인이 낸 안을 당사자가 받아들여야만 해결되고, 받아들일 의무는 없어요. ①은 예고 없이 바뀔 수 있는 자유청약이고, ③의 Hardship은 사정변경으로 이행이 몹시 어려울 때의 조항이에요."},{"id":"65-3-23","r":65,"s":"무역계약","n":23,"q":"컨테이너 운송에 관한 내용으로 잘못된 것은?","c":["CY/CY(FCL/FCL) 운송은 컨테이너의 장점을 최대한 이용한 운송방식이다.","국제적으로 유통되고 있는 컨테이너는 국제표준기구의 ISO 표준규격을 사용하도록 권고되고 있다.","여러 화주의 소량 컨테이너 화물을 CFS에서 혼재하여 선적하고 목적지의 CFS에서 컨테이너를 개봉하여 화물을 분류하여 여러 수입업자에게 인도할 때의 가장 기본적인운송방법은 CFS/CFS 혹은 LCL/LCL이다.","Open-top 컨테이너는 Dry Container의 지붕과 벽을 제거한 컨테이너이다."],"a":4,"t":"해상운송","e":"Open-top 컨테이너는 지붕만 없애고 방수포로 덮는 컨테이너예요. 벽까지 없앤 건 Flat rack 컨테이너라서 ④가 틀렸습니다."},{"id":"65-3-24","r":65,"s":"무역계약","n":24,"q":"항공운송장에 관한 설명으로 잘못된 것은?","c":["환적될 것과 환적될 수 있다고 표시하는 항공운송 서류는 비록 신용장에서 환적을 금지해도 수리될 수 있다.","Currency에는 항공화물이 도착하는 국가의 화폐단위의 code를 기입한다.","AWB는 총 3장의 원본이 발급된다.","Chargeable weight에는 화물의 실제 중량과 부피 중량 중 높은 쪽의 중량을 기입한다."],"a":2,"t":"항공, 복합운송","e":"AWB의 Currency 칸에는 출발지 국가의 통화 코드를 적어요. 도착국 통화라고 한 ②가 틀렸습니다. AWB 원본은 3장이고, 운임 중량은 실중량과 부피중량 중 큰 쪽이에요."},{"id":"65-3-25","r":65,"s":"무역계약","n":25,"q":"선하증권과 해상화물 송장에 관한 내용으로 올바른 것은?","c":["선하증권은 실제 해상운송인인 선사만이 발행하는 운송서류이다.","Foul B/L은 화물에 문제가 있어 이러한 내용이 B/L상에 기재되어 그 자체로는 수리가되지 않는 선하증권을 말한다. 수출자가 선사에 상업송장에 기재된 금액만큼 담보를제공하면 무사고 선하증권을 받을 수 있다.","제3자 선하증권은 B/L상에 표기되는 송하인이 수출입 거래의 당사자가 아닌 제3자가송하인이 될 때 발행된다. 주로 중계무역 등에서 이용된다.","해상화물운송장은 FIATA 회원사로 등록된 포워더만이 발행할 수 있다."],"a":3,"t":"해상운송","e":"제3자 선하증권(Third Party B/L)은 계약 당사자가 아닌 제3자를 송하인으로 하며 중계무역에서 많이 써요. 포워더도 B/L을 발행하고(①), 무사고 B/L은 담보 대신 파손화물보상장(L/I)을 주고 받으며(②), 해상화물운송장은 운송인이 발행해요(④)."},{"id":"65-3-26","r":65,"s":"무역계약","n":26,"q":"해상운송 물류비와 관련된 내용 중 잘못된 것은?","c":["정기선 운임의 경우 실제로 선사가 징수하는 해상운임은 일반적으로 tariff보다 높은편이다.","해상운임이란 선박이 사람이나 화물을 운송한 대가로서 지불 또는 수취하는 보수로서운임은 기본적으로 수요와 공급의 원칙에 따라 결정된다.","정기선 해상운임의 구조는 기본운임, 할증료, 부대비용 및 추가요금으로 되어 있다.","부정기선 운임의 부과 기준에 따라 선복운임, 부적운임, 톤당 운임, 일대 용선운임 등이 있다."],"a":1,"t":"해상운송","e":"정기선 운임은 공표 tariff가 있지만 실제로는 할인해서 tariff보다 낮게 받는 경우가 많아요. 일반적으로 높다고 한 ①이 틀렸습니다."},{"id":"65-3-27","r":65,"s":"무역계약","n":27,"q":"고지의무에 관한 내용을 설명한 것 중 잘못된 것은?","c":["부실 고지로 보험자에 의해 보험계약이 취소된 경우, 여하한 경우에도 보험료는 보험계약자에게 환급되지 않는다.","고지의무는 보험계약 체결의 교섭 중이나 보험계약의 성립 전까지 이루어져야 한다.","고지가 필요 없는 사항으로는 위험을 감소시키는 사항, 보험자가 알고 있거나 알고 있는 것으로 추정되는 사항 등이 있다.","고지의무의 법적 근거는 MIA 제17조의 「해상보험계약은 최대선의를 바탕으로 체결되어야 한다」와 MIA 제18조 2항의 「신중한 보험자가 위험의 인수 여부 및 보험료 산정에 영향을 줄 수 있는 중요사항을 보험자에게 고지해야 한다」에서 찾을 수 있다."],"a":1,"t":"해상보험","e":"부실고지로 계약이 취소되더라도 사기나 위법이 없으면 보험료는 반환돼요(MIA 제84조). 어떤 경우에도 환급되지 않는다는 ①이 틀렸습니다."},{"id":"65-3-28","r":65,"s":"무역계약","n":28,"q":"적하보험계약 체결과 보험 클레임 처리에 관한 내용 중 올바른 것은?","c":["보험자가 인수하지 않는 보험조건은 품목에 따라 다를 수 있으나, 보험자는 A/R이나 A조건이면 모두 다 인수한다.","보험증권에 기록되는 사항 중 「survey should be approved by…」에는 반드시 보험금을 지급하는 회사명이 표기된다.","보험계약은 낙성계약의 일종이기 때문에 보험계약자가 보험청약을 하고 보험자가 인수를 승낙했을 때 성립한다.","어떤 보험조건을 이용하든 보험기간 중에 발생한 사고임을 입증할 책임은 보험자에게있다. 이것은 손해통지의무에 속한다."],"a":3,"t":"해상보험","e":"보험계약은 낙성계약이라 청약하고 보험자가 승낙하면 성립해요. 보험자는 품목에 따라 A조건 인수를 거절할 수 있고(①), survey 칸에는 손해조사 기관을 적으며(②), 사고 입증은 피보험자 몫이에요(④)."},{"id":"65-3-29","r":65,"s":"무역계약","n":29,"q":"다음 중 공동해손에 관한 설명으로 올바른 것은?","c":["공동해손의 정산은 영국해상보험법에 따라 이루어진다.","공동해손 희생손해에 대해서는 피보험자가 분담 의무가 있는 다른 당사자에게 분담청구권을 행사하지 않고 보험자로부터 보상받을 수 있다.","공동해손이 성립하려면 항해단체 공동의 위험을 피하기 위한 우연하고 통상적인 희생 또는 비용 지출이 있어야 한다.","공동해손은 이해관계자들이 공동으로 분담하는 손해이므로 보험자는 보상하지 않는다."],"a":2,"t":"해상보험","e":"공동해손 희생손해는 다른 이해관계자에게 분담금을 받지 않고 보험자에게 바로 보상받을 수 있어요. 정산은 요크앤트워프 규칙(YAR)을 따르고(①), 고의적이고 합리적인 비상 희생이어야 하며(③), 보험자도 보상해요(④)."},{"id":"65-3-30","r":65,"s":"무역계약","n":30,"q":"다음 보기와 같은 상황에서 무역거래조건에 따른 계약상의 의무와 적하보험에 관한 설명으로 잘못된 것은?\n\n∙ 한국의 매도인 A는 독일의 매수인 B와 CIP Hamburg warehouse(Incoterms 2020) 조건으로 매매계약을 체결하였다.\n∙ A는 부산항에서 물품을 인도하였고, 운송 중 담보위험으로 물품이 손상되었다.","c":["매도인 A는 피보험이익이 없으므로 보험자에게 보험금을 청구할 수 없다.","매도인 A는 협회적하약관 (A)약관이나 그와 유사한 약관에 따른 광범위한 조건으로부보할 의무가 있다.","매수인 B는 매도인 A로부터 보험증권을 양도받아 담보위험으로 손상된 물품에 대해 보험자에게 보험금을 청구할 수 있다.","매도인 A는 선적항에서 목적항까지 매수인 B의 위험을 담보하는 보험계약을 체결하여야 한다."],"a":4,"t":"해상보험","e":"CIP Hamburg warehouse 조건이면 보험은 인도 지점부터 지정목적지인 함부르크 창고까지 담보해야 해요. 선적항에서 목적항까지만이라고 한 ④가 틀렸습니다."},{"id":"65-4-1","r":65,"s":"무역영어","n":1,"q":"다음 서신의 종류를 설명하는 것으로 가장 적절하게 연결된 것은?\n\nWe received your firm offer for 2,000 doz. of ladies nylon stockings. Taking into consideration the prevailing quotations in this market, your price is rather stiff. Your competitors are making endeavors to get our business by offering lower prices than yours. Please note, however, that it is our intention to entrust you with the bulk of our business, and we would like to ask for an additional 10% reduction off the price you offered. If you accept this offer by Oct. 28, 2025, we would like to place an order with you soon. We look forward to your confirmation.","c":["Firm Offer – Selling Offer","Free Offer – Buying Offer","Firm Offer – Counter Offer","Free Offer – Original Offer"],"a":3,"t":"서신 내용 파악","e":"상대가 보낸 건 확정청약(Firm Offer)이고, 이 서신은 가격을 10% 더 깎아 달라며 조건을 바꿔 제안하는 반대청약(Counter Offer)이에요."},{"id":"65-4-2","r":65,"s":"무역영어","n":2,"q":"위 서신의 종류는 무엇인가?","c":["Offer on Approval","Counter Offer","Offer subject to prior sale","Cross Offer"],"a":3,"t":"서신 내용 파악","e":"'승낙이 도착할 때 재고가 남아 있는 경우'를 조건으로 한 청약이니 선착순판매조건부청약(Offer subject to prior sale)이에요.","p":{"range":"2~3","text":" Dear Daniel,\n We are very happy to inform you that we have received favorable responses\nfrom your references and offer you firm subject to your reply received here by\nDecember 24 as follows:\n    Article: Q-pointerⅡ\n    Quantity: 1,000 pcs\n    Price: USD 30/pc CIF LA\n    Packing: Our standard export packing\n    Shipment: 10 weeks after receipt of order\n Now, large orders are rushing in from many countries and demand for our\nQ-pointerⅡ in Korea is very high. Under these circumstances, this offer is made\nsubject to our available stock at the time your acceptance reaches us.\n Should you have any question or require further clarification about this offer,\nplease feel free to contact us.\nWe look forward to receiving your order soon.\nBest Regards,"}},{"id":"65-4-3","r":65,"s":"무역영어","n":3,"q":"위 서신 이전에 발신자가 제3자로부터 받았을 서신의 내용으로 가장 적절한 것은?","c":["They have maintained their account with adequate funds to cover all checks drawn, and any settlement to us has always been prompt. To the best of our knowledge they have no outstanding financial liabilities.","At this time we are sorry to say that our transactions with this firm have been so small and infrequent that we do not feel justified in making any recommendations regarding their financial standing and creditworthiness one way or the other.","As we have had no previous dealing with the above-named company, we would like to request you to inform us about its reputation as well as its general commercial reliability.","Our particular interest is to know in what line they have been mainly engaged and, if possible, your candid opinion on their activities. Any information you provide will, of course, be treated in the strictest confidence and we would be pleased to perform a service for you should an opportunity arise later on."],"a":1,"t":"서신 내용 파악","e":"서신 첫머리에 '신용조회처로부터 좋은 답을 받았다'고 했으니, 그 전에 받은 서신은 상대 회사의 자금 상태와 결제가 양호하다는 긍정적인 신용조회 답신인 ①이에요.","p":{"range":"2~3","text":" Dear Daniel,\n We are very happy to inform you that we have received favorable responses\nfrom your references and offer you firm subject to your reply received here by\nDecember 24 as follows:\n    Article: Q-pointerⅡ\n    Quantity: 1,000 pcs\n    Price: USD 30/pc CIF LA\n    Packing: Our standard export packing\n    Shipment: 10 weeks after receipt of order\n Now, large orders are rushing in from many countries and demand for our\nQ-pointerⅡ in Korea is very high. Under these circumstances, this offer is made\nsubject to our available stock at the time your acceptance reaches us.\n Should you have any question or require further clarification about this offer,\nplease feel free to contact us.\nWe look forward to receiving your order soon.\nBest Regards,"}},{"id":"65-4-4","r":65,"s":"무역영어","n":4,"q":"다음 사례의 밑줄 친 (A)에 들어갈 CISG(1980)상 개념은 무엇인가?\n\nOn June 1, the Seller mailed to the Buyer a letter offering to sell the Buyer specified goods at a stated price. The offer also stated: “This offer is binding and irrevocable until July 1”. The letter from the Seller to the Buyer takes a week to deliver. On June 6, before the Buyer received the June 1 letter, the Seller called the Buyer and said, “Disregard the letter that I mailed to you on June 1. I have decided to ( A ) the offer contained in the letter.” Upon receiving the Seller’s letter, the Buyer replied “I accept your June 1 offer.”","c":["Reject","Cancel","Revoke","Withdraw"],"a":4,"t":"인코텀즈, CISG 영문","e":"청약이 상대방에게 도달하기 전에 거둬들이는 건 철회(Withdraw)예요. CISG 제15조 2항에 따라 취소불능 청약이라도 도달 전이면 철회할 수 있어요. 도달 후 거둬들이는 건 취소(Revoke)입니다."},{"id":"65-4-5","r":65,"s":"무역영어","n":5,"q":"Incoterms 2020을 설명한 것 중 잘못된 것은?","c":["EXW means that the seller delivers the goods to the buyer when it places the goods at the disposal of the buyer at a named place (like a factory or warehouse), and that named place may or may not be the seller’s premises.","FOB means that the seller delivers the goods to the buyer on board the vessel nominated by the buyer at the named port of shipment or procures the goods already so delivered.","CFR means that the seller delivers the goods to the buyer on board the vessel or procures the goods already so delivered.","DDP means that the seller delivers the goods to the buyer when the goods, once unloaded from the arriving means of transport, are placed at the disposal of the buyer, cleared for import, at the named place of destination or at the agreed point within that place, if any such point is agreed."],"a":4,"t":"인코텀즈, CISG 영문","e":"DDP는 수입통관을 마친 물품을 도착 운송수단에서 '양하하지 않은 채' 매수인 처분하에 둘 때 인도돼요. 양하한 뒤라고 한 ④는 DPU와 섞인 설명입니다."},{"id":"65-4-6","r":65,"s":"무역영어","n":6,"q":"다음 중 위 서신의 내용에 대한 설명으로 잘못된 것은?","c":["To accept this offer, the seller needs to dispatch the goods by June 30, 2025, the date on which the offer remains valid.","The contract amount of USD 200,000 includes the transportation cost to New York, USA.","The payment will be made immediately upon presentation of the documents required in the L/C.","The seller should obtain at its own cost cargo insurance complying with the cover provided by I.C.C.(A)."],"a":1,"t":"서신 내용 파악","e":"유효기간(6월 말)은 매수인이 '승낙'해야 하는 기한이에요. 매도인이 6월 30일까지 물품을 발송해야 한다는 ①이 틀렸습니다. 선적은 신용장 받은 뒤 30일 이내예요.","p":{"range":"6~7","text":"Dear Sirs,\nWe thank you for your inquiry of April 10th, 2025, and we take much pleasure in\nmaking the offer listed below:\n∙ Commodity: Cellular Phone (No. ASX 12-5)\n∙ Quantity: 1,000 pcs\n∙ Price: USD 200.00 per piece – CIP New York, USA (subject to (A)Incoterms\n  2020)\n∙ Shipment: Within 30 days after receipt of your L/C\n∙ Packing: Export standard packaging\n∙ Payment: By an irrevocable L/C at sight in our favor only\n∙ Validity: Until the end of June, 2025\nWe look forward to doing business with you.\nVery truly yours,"}},{"id":"65-4-7","r":65,"s":"무역영어","n":7,"q":"위 서신의 밑줄 친 부분 (A) Incoterms 2020의 내용에 해당하지 않는 것은?","c":["The place where the seller’s obligation of delivery is fulfilled","The point at which the risk of the goods is passed from the seller to the buyer","The party who is responsible for arranging the carriage or insurance of the goods","The remedies that can be exercised in the event of a breach of contract"],"a":4,"t":"인코텀즈, CISG 영문","e":"인코텀즈는 인도 장소, 위험 이전 지점, 운송과 보험 마련 책임 같은 것을 정해요. 계약위반 시 구제수단은 다루지 않아서 ④가 해당하지 않습니다.","p":{"range":"6~7","text":"Dear Sirs,\nWe thank you for your inquiry of April 10th, 2025, and we take much pleasure in\nmaking the offer listed below:\n∙ Commodity: Cellular Phone (No. ASX 12-5)\n∙ Quantity: 1,000 pcs\n∙ Price: USD 200.00 per piece – CIP New York, USA (subject to (A)Incoterms\n  2020)\n∙ Shipment: Within 30 days after receipt of your L/C\n∙ Packing: Export standard packaging\n∙ Payment: By an irrevocable L/C at sight in our favor only\n∙ Validity: Until the end of June, 2025\nWe look forward to doing business with you.\nVery truly yours,"}},{"id":"65-4-8","r":65,"s":"무역영어","n":8,"q":"다음 중 위 계약서의 내용에 대한 설명으로 잘못된 것은?","c":["In the event of a delay in shipment, the buyer may notify the seller of the avoidance of contract regardless of whether the seller has dispatched the goods by the cancellation date.","The seller does not need to submit the insurance documents to the bank for\n\npayment.","The goods must be fit for their intended purpose, either by virtue of their nature or as specified in the sales contract.","The contract stipulates the particulars required for the shipping mark."],"a":1,"t":"계약, 클레임 영문","e":"일반약정은 취소일까지 '선적이 이뤄지지 않은 경우' 매수인이 계약을 해제할 수 있다고 했어요. 매도인이 그 전에 발송했는지와 관계없이 해제할 수 있다는 ①이 틀렸습니다. CFR이라 보험서류는 필요 없어요.","p":{"range":"8~9","text":"∙ Item: 100% Nylon Fabric 22“ length with check pattern (ASC-15)\n∙ Price: USD 5.00/yd\n∙ Delivery: (A) CFR New York, USA (subject to Incoterms 2020)\n∙ Quantity: 500 yards\n∙ Payment: By an irrevocable sight L/C\n∙ Shipment: During September, 2025\n∙ Shipping port: Busan, Korea\n∙ Remarks: If the goods are not delivered for any reason whatsoever (including\n    force majeure) by the end of October, the buyer will be entitled to declare\n    the contract avoided immediately by notification to the Seller.\n                                <General Agreement>\n∙ Characteristics of the goods: The goods shall be suitable for the purpose for\n    which they are intended by their very nature or which is evident from the\n    sales contract.\n∙ Price: Unless otherwise specified, all quotations and offers submitted by either\n    party to this Agreement shall be in USD based on a CIF New York basis.\n∙ Packing: Proper export wooden case packing shall be carried out, with each\n    case bearing the mark IBC, the port mark, running case numbers, and the\n    country of origin.\n∙ Shipment: All goods sold in accordance with this Agreement shall be shipped\n    within the stipulated time. If the parties agreed upon a cancellation date for late\n    shipment in the Specific Conditions, the Buyer may avoid the Sales Contract by\n    notification to the Seller in case the shipment has not occurred by the cancellation\n    date."}},{"id":"65-4-9","r":65,"s":"무역영어","n":9,"q":"다음 중 위 계약서의 밑줄 친 부분(A)에 대한 설명으로 잘못된 것은?","c":["The risk of loss of or damage to the goods transfer when the goods are on board the vessel at Busan port.","If the seller incurs costs under its contract of carriage related to unloading at New York port, the seller is entitled to recover such costs separately from the buyer.","The seller is deemed to have performed its obligation of delivery upon loading the goods onto the vessel, regardless of whether the goods actually arrive at New York port.","The buyer has no obligation to conclude a contract of carriage or to nominate a vessel for the seller’s transportation."],"a":2,"t":"인코텀즈, CISG 영문","e":"CFR에서 매도인이 운송계약에 따라 목적항 양하비를 냈다면, 별도 합의가 없는 한 매수인에게 따로 청구할 수 없어요. 그래서 ②가 틀렸습니다.","p":{"range":"8~9","text":"∙ Item: 100% Nylon Fabric 22“ length with check pattern (ASC-15)\n∙ Price: USD 5.00/yd\n∙ Delivery: (A) CFR New York, USA (subject to Incoterms 2020)\n∙ Quantity: 500 yards\n∙ Payment: By an irrevocable sight L/C\n∙ Shipment: During September, 2025\n∙ Shipping port: Busan, Korea\n∙ Remarks: If the goods are not delivered for any reason whatsoever (including\n    force majeure) by the end of October, the buyer will be entitled to declare\n    the contract avoided immediately by notification to the Seller.\n                                <General Agreement>\n∙ Characteristics of the goods: The goods shall be suitable for the purpose for\n    which they are intended by their very nature or which is evident from the\n    sales contract.\n∙ Price: Unless otherwise specified, all quotations and offers submitted by either\n    party to this Agreement shall be in USD based on a CIF New York basis.\n∙ Packing: Proper export wooden case packing shall be carried out, with each\n    case bearing the mark IBC, the port mark, running case numbers, and the\n    country of origin.\n∙ Shipment: All goods sold in accordance with this Agreement shall be shipped\n    within the stipulated time. If the parties agreed upon a cancellation date for late\n    shipment in the Specific Conditions, the Buyer may avoid the Sales Contract by\n    notification to the Seller in case the shipment has not occurred by the cancellation\n    date."}},{"id":"65-4-10","r":65,"s":"무역영어","n":10,"q":"다음 중 무역계약조항의 명칭과 그 내용의 연결이 잘못된 것은?","c":["Liquidated Damages Clause: If the goods fail to meet the performance specifications set forth in this contract, the seller shall pay USD 1,000 for each percentage point of shortfall in performance, up to a maximum of 10% of the contract price.","Escalation Clause: Where the market price of the primary raw material increases or decreases by more than 5% compared to the price prevailing on the date of this contract, the contract price shall be adjusted proportionally to such change. The adjusted price shall apply to all shipments made after the date on which either party notifies the other party of such change.","Quantity Tolerance Clause: The total quantity delivered under this contract may vary by up to ±3% from the contract quantity, and such variation shall not constitute a breach of this contract.","Delayed Shipment Clause: When the Seller has not delivered the goods by the date on which the Buyer has become entitled to the maximum amount of liquidated damages as both contracting parties agreed, the Buyer may at any time ask for performance or declare the contract avoided in writing."],"a":4,"t":"계약, 클레임 영문","e":"정답 키 기준으로 ④가 잘못 연결됐어요. 지연배상금이 최대 한도에 이르면 매수인이 이행을 청구하거나 계약을 해제할 수 있다는 내용은 단순 선적지연 조항이라기보다 해제(Termination) 조항에 해당합니다."},{"id":"65-4-11","r":65,"s":"무역영어","n":11,"q":"위 신용장에 대한 설명으로 적절하지 않은 것은?","c":["The price includes the cost of freight and insurance to the New York port.","The beneficiary may present shipping documents to any bank for negotiation, including its own bank.","The beneficiary must effect shipment in a single lot and negotiate for the full amount of USD 100,000.00.","All banking charges incurred outside the USA will be paid by the beneficiary."],"a":3,"t":"신용장, UCP 영문","e":"43P에 분할선적이 허용(ALLOWED)되어 있어요. 한 번에 선적하고 전액을 매입해야 한다는 ③이 틀렸습니다.","p":{"range":"11~13","text":"40A: FORM OF DOCUMENTARY CREDIT:              IRREVOCABLE\n31D: DATE AND PLACE OF EXPIRY: 2025-12-31 KOREA\n50: APPLICANT: NEW YORK TRADING INC.\n59: BENEFICIARY:     KOREA EXPORT CO., LTD.\n32B: CURRENCY CODE, AMOUNT: USD 100,000.00\n41A: AVAILABLE WITH...BY...: ANY BANK BY NEGOTIATION\n42C: DRAFT AT: SIGHT\n43P: PARTIAL SHIPMENT:        ALLOWED\n44A: PORT OF LOADING：BUSAN, KOREA\n44B: PORT OF DISCHARGE: NEW YORK, USA\n44C: LATEST DATE OF SHIPMENT: 2025-12-15\n45A: DESCRIPTION OF GOODS AND/OR SERVICES\n    + WOMEN'S JACKETS AT USD 2.95 PER YD CIF NEW YORK, USA\n46A: DOCUMENTS REQUIRED\n    + SIGNED COMMERCIAL INVOICE IN 3 COPIES\n    +    FULL SET OF CLEAN ON BOARD OCEAN BILLS OF LADING\n         MADE OUT TO ORDER OF ISSUING BANK\n    +    INSURANCE POLICY OR CERTIFICATE ENDORSED IN BLANK FOR 110\n         PCT OF INVOICE VALUE\n    + INSPECTION CERTIFICATE ISSUED AND SIGNED BY THE APPLICANT\n71B: CHARGES:      ALL BANKING CHARGES OUTSIDE USA ARE FOR\n        BENEFICIARY'S ACCOUNT"}},{"id":"65-4-12","r":65,"s":"무역영어","n":12,"q":"위 신용장의 종류는 무엇인가?","c":["Irrevocable L/C – Freely Negotiable L/C","Payment L/C – Restricted Negotiation L/C","Irrevocable L/C - Restricted Negotiation L/C","Payment L/C – Freely Negotiable L/C"],"a":1,"t":"신용장, UCP 영문","e":"40A가 IRREVOCABLE이고 41A가 ANY BANK BY NEGOTIATION이니 취소불능, 자유매입신용장이에요.","p":{"range":"11~13","text":"40A: FORM OF DOCUMENTARY CREDIT:              IRREVOCABLE\n31D: DATE AND PLACE OF EXPIRY: 2025-12-31 KOREA\n50: APPLICANT: NEW YORK TRADING INC.\n59: BENEFICIARY:     KOREA EXPORT CO., LTD.\n32B: CURRENCY CODE, AMOUNT: USD 100,000.00\n41A: AVAILABLE WITH...BY...: ANY BANK BY NEGOTIATION\n42C: DRAFT AT: SIGHT\n43P: PARTIAL SHIPMENT:        ALLOWED\n44A: PORT OF LOADING：BUSAN, KOREA\n44B: PORT OF DISCHARGE: NEW YORK, USA\n44C: LATEST DATE OF SHIPMENT: 2025-12-15\n45A: DESCRIPTION OF GOODS AND/OR SERVICES\n    + WOMEN'S JACKETS AT USD 2.95 PER YD CIF NEW YORK, USA\n46A: DOCUMENTS REQUIRED\n    + SIGNED COMMERCIAL INVOICE IN 3 COPIES\n    +    FULL SET OF CLEAN ON BOARD OCEAN BILLS OF LADING\n         MADE OUT TO ORDER OF ISSUING BANK\n    +    INSURANCE POLICY OR CERTIFICATE ENDORSED IN BLANK FOR 110\n         PCT OF INVOICE VALUE\n    + INSPECTION CERTIFICATE ISSUED AND SIGNED BY THE APPLICANT\n71B: CHARGES:      ALL BANKING CHARGES OUTSIDE USA ARE FOR\n        BENEFICIARY'S ACCOUNT"}},{"id":"65-4-13","r":65,"s":"무역영어","n":13,"q":"밑줄 친 (A)～(D) 중 위 신용장에서 요구하는 조건을 충족하지 못하는 것은?\n\n Shipper/Exporter                            B/L NO. WSLI010200300521\n  (A) KOREA EXPORT CO., LTD.                 WS LINE\n  SEOUL, KOREA                               BILL OF LADING\n Consignee                                   WOSUNG LINE CO., LTD\n(B) NEW YORK TRADING INC. USA\n Notify Party                                (C) Received by the Carrier from the\n NEW YORK TRADING INC. USA                   Shipper in apparent good order and\n Ocean Vessel         Place of loading       condition   unless   otherwise   indicated\n WOSUNG 2584W         BUSAN, KOREA           herein, the Goods, or package(s) said to\n Port of discharge    Place of delivery      contain-\nNEW YORK, USA\n(D) LADEN ON BOARD: DEC. 10. 2025","c":["(A)","(B)","(C)","(D)"],"a":2,"t":"신용장, UCP 영문","e":"신용장은 B/L을 개설은행 지시식(TO ORDER OF ISSUING BANK)으로 요구했는데, (B)는 수하인을 개설의뢰인으로 기명했어요. 그래서 조건을 충족하지 못합니다.","p":{"range":"11~13","text":"40A: FORM OF DOCUMENTARY CREDIT:              IRREVOCABLE\n31D: DATE AND PLACE OF EXPIRY: 2025-12-31 KOREA\n50: APPLICANT: NEW YORK TRADING INC.\n59: BENEFICIARY:     KOREA EXPORT CO., LTD.\n32B: CURRENCY CODE, AMOUNT: USD 100,000.00\n41A: AVAILABLE WITH...BY...: ANY BANK BY NEGOTIATION\n42C: DRAFT AT: SIGHT\n43P: PARTIAL SHIPMENT:        ALLOWED\n44A: PORT OF LOADING：BUSAN, KOREA\n44B: PORT OF DISCHARGE: NEW YORK, USA\n44C: LATEST DATE OF SHIPMENT: 2025-12-15\n45A: DESCRIPTION OF GOODS AND/OR SERVICES\n    + WOMEN'S JACKETS AT USD 2.95 PER YD CIF NEW YORK, USA\n46A: DOCUMENTS REQUIRED\n    + SIGNED COMMERCIAL INVOICE IN 3 COPIES\n    +    FULL SET OF CLEAN ON BOARD OCEAN BILLS OF LADING\n         MADE OUT TO ORDER OF ISSUING BANK\n    +    INSURANCE POLICY OR CERTIFICATE ENDORSED IN BLANK FOR 110\n         PCT OF INVOICE VALUE\n    + INSPECTION CERTIFICATE ISSUED AND SIGNED BY THE APPLICANT\n71B: CHARGES:      ALL BANKING CHARGES OUTSIDE USA ARE FOR\n        BENEFICIARY'S ACCOUNT"}},{"id":"65-4-14","r":65,"s":"무역영어","n":14,"q":"위 서신의 밑줄 친 두 은행을 순서대로 올바르게 나열한 것은?","c":["advising bank – confirming bank","advising bank – negotiating bank","issuing bank – confirming bank","confirming bank – accepting bank"],"a":3,"t":"신용장, UCP 영문","e":"매수인이 신용장 개설을 지시한 Woori Bank, Seoul은 개설은행이고, 수출자에게 확인(confirmation)을 줄 Citi Bank는 확인은행이에요.","p":{"range":"14~15","text":" We have instructed our bank, Woori Bank, Seoul, to issue an irrevocable letter of\ncredit for USD 22,000.00 (twenty-two thousand dollars) in your favor to cover the\nconsignment, shipment (CIF Incheon). The credit is valid until August 10, 2025.\nYou will receive confirmation from our bank’s agents, Citi Bank Ltd, Denver, Co,\nand you can draw on them at 60 days for the full amount of the invoice. When\nsubmitting your draft, please enclose the following documents."},"u":["Woori Bank, Seoul","Citi Bank Ltd, Denver, Co"]},{"id":"65-4-15","r":65,"s":"무역영어","n":15,"q":"위 서신의 내용으로 잘못된 것은?","c":["USD 22,000.00 includes an insurance premium up to Incheon port.","The seller will draw a bill of exchange payable by Citi Bank.","The bill of exchange drawn by the seller is a sight draft.","The following documents may include a transport document."],"a":3,"t":"신용장, UCP 영문","e":"'draw on them at 60 days'라고 했으니 환어음은 60일 기한부예요. 일람출급이라고 한 ③이 틀렸습니다.","p":{"range":"14~15","text":" We have instructed our bank, Woori Bank, Seoul, to issue an irrevocable letter of\ncredit for USD 22,000.00 (twenty-two thousand dollars) in your favor to cover the\nconsignment, shipment (CIF Incheon). The credit is valid until August 10, 2025.\nYou will receive confirmation from our bank’s agents, Citi Bank Ltd, Denver, Co,\nand you can draw on them at 60 days for the full amount of the invoice. When\nsubmitting your draft, please enclose the following documents."}},{"id":"65-4-16","r":65,"s":"무역영어","n":16,"q":"위 서류는 어떤 서류인가?","c":["Letter of Indemnity","Bill of Lading","Letter of Guarantee","Shipping Request"],"a":1,"t":"운송 영문","e":"B/L을 재발행해 주는 운송인에게 그로 인한 모든 손해를 보상하겠다고 약속하는 서류는 파손화물보상장, 즉 Letter of Indemnity예요.","p":{"range":"16~17","text":" “Now, in consideration of the above amendment to the (A) bill of lading covering\nthe aforesaid shipment, we, the undersigned, hereby agree as follows, and any\npenalty due to this change shall be absorbed by the shipper:\n⑴ to indemnify and hold you, and each of your employees, and agents, and the\n   said vessel, her charterers and agents, harmless from and against all claims,\n   actions, suits, and fines of every description whatsoever, which may accrue or\n   be made, brought, or assessed, and from all losses, costs, charges, damages,\n   and expenses sustained and/or incurred by you and/or them as a result of\n   such re-issuance of the bill of lading.\n⑵ to settle and/or pay promptly any claim or claims involving this shipment that\n   are made against you or either of you and/or the vessel...”"}},{"id":"65-4-17","r":65,"s":"무역영어","n":17,"q":"위 서류의 밑줄 친 부분 (A) bil of lading의 기능으로 잘못된 것은?","c":["It presents that a contract of carriage has been concluded between the carrier and the shipper.","It indicates that the carrier has received the goods from the shipper.","It presents a document of title to the goods.","It indicates that the goods have been delivered to the consignee."],"a":4,"t":"운송 영문","e":"선하증권은 운송계약 증거, 화물 수령증, 권리증권 기능을 해요. 물품이 수하인에게 인도됐다는 걸 나타내지는 않습니다.","p":{"range":"16~17","text":" “Now, in consideration of the above amendment to the (A) bill of lading covering\nthe aforesaid shipment, we, the undersigned, hereby agree as follows, and any\npenalty due to this change shall be absorbed by the shipper:\n⑴ to indemnify and hold you, and each of your employees, and agents, and the\n   said vessel, her charterers and agents, harmless from and against all claims,\n   actions, suits, and fines of every description whatsoever, which may accrue or\n   be made, brought, or assessed, and from all losses, costs, charges, damages,\n   and expenses sustained and/or incurred by you and/or them as a result of\n   such re-issuance of the bill of lading.\n⑵ to settle and/or pay promptly any claim or claims involving this shipment that\n   are made against you or either of you and/or the vessel...”"}},{"id":"65-4-18","r":65,"s":"무역영어","n":18,"q":"다음은 해상 운임의 부과방식에 대한 설명이다. 빈칸에 들어갈 용어로 가장 적절한 것은?\n\n A (                ) rate is a single, fixed price for transporting cargo covering the\nentire voyage, agreed between the shipper and the carrier, regardless of the exact cargo quantity, weight or measurement.","c":["dead weight freight","lump-sum freight","pro rate freight","ad valorem freight"],"a":2,"t":"운송 영문","e":"화물 수량이나 중량과 관계없이 항해 전체에 대해 한 번에 정한 운임은 선복운임(Lump-sum freight)이에요."},{"id":"65-4-19","r":65,"s":"무역영어","n":19,"q":"빈칸에 들어갈 해상보험의 원칙으로 가장 적절한 것은?\n\n The (                 ) in marine insurance enables an insurer, after settling a claim,\nto “step into the shoes” of the insured and pursue legal action against any third party responsible for the loss or damage. This principle prevents the insured from receiving double compensation and ensures the negligent party bears the financial burden.","c":["principle of subrogation","principle of abandonment","principle of insurable interest","principle of proximate cause"],"a":1,"t":"보험 영문","e":"보험금을 지급한 보험자가 피보험자 자리에 서서 제3자에게 손해배상을 청구하는 건 대위(Subrogation)의 원칙이에요."},{"id":"65-4-20","r":65,"s":"무역영어","n":20,"q":"다음 중 주어진 서신에서 유추할 수 있는 내용으로 잘못된 것은?\n\nDear Mr. Lee, Thank you for your email dated April 21. Enclosed, you will find the details of our sailing from Hong Kong to Tilbury at the end of this month and the beginning of next. Please note that the first available vessel we have for this voyage is the MV Orient, which will accept cargo from May 3 to May 7. She is due in Tilbury on June 3. Our freight rate for crated consignments is USD 90 per ton, and I have attached our shipping instructions to the enclosed itinerary.\n\nYours sincerely,","c":["The cargo must be delivered to the carrier between May 3 and 7, because the MV Orient is the first available vessel for this voyage and will only accept cargo during that period.","The freight rate of USD 90 per ton applies only to crated consignments, which suggests that other types of cargo or packing may be subject to different rates.","The shipper is required to follow the carrier’s shipping instructions, since these instructions are attached to the sailing itinerary and are necessary for proper shipment processing.","The shipment will be carried on a chartered service with a fixed schedule, as the carrier specifies the vessel name, the loading period, and the estimated arrival date."],"a":4,"t":"운송 영문","e":"선박명, 선적 기간, 도착 예정일이 정해진 일정표로 운항하는 건 정기선(liner) 서비스예요. 용선(chartered) 서비스라고 한 ④가 틀렸습니다."},{"id":"65-4-21","r":65,"s":"무역영어","n":21,"q":"다음 중 밑줄 친 부분을 다르게 표현한 것 중 적절하지 않은 것은?\n\nDear Sir / Madam,\n\nThank you very much for your order No. 4567-9 of September 20 for 5,000 pairs of golf shoes. As we explained in the meeting with your representative, shipment for (A) models made to your specifications (B) is not possible in less than 60 days, but (C) we are giving your order priority. We can assure you that all models will be completed by November 29. It would be greatly appreciated if you could share your shipping instructions so that (D) we can arrange the shipment without delay. We believe that you will be more than satisfied with the ordered goods in every aspect.\n\nVery truly yours,","c":["(A) models manufactured in accordance with your specifications","(B) is impossible within a period of less than 60 days","(C) your order will be shipped on first-come, first-served basis.","(D) the shipment may be arranged without undue delay"],"a":3,"t":"빈칸, 표현 바꾸기","e":"(C) '귀사 주문을 우선 처리하겠다'는 뜻인데 ③은 '선착순으로 선적하겠다'는 뜻이라 의미가 달라요."},{"id":"65-4-22","r":65,"s":"무역영어","n":22,"q":"위 서신의 목적으로 가장 적절한 것은?","c":["To complain about the quality of camping goods","To place an order for eco-friendly products","To present the company and propose a business relationship","To request a brochure and a price list"],"a":3,"t":"서신 내용 파악","e":"회사를 소개하며 브로슈어를 동봉하고 거래를 제안하는 서신이에요.","p":{"range":"22~23","text":"Dear Sirs,\nWe are writing to introduce ourselves as one of the leading manufacturers and\nexporters of camping equipment in Korea. Since our establishment in 1993, we\nhave been dedicated to the field of camping goods and have built a strong\nreputation for quality and reliability.\nIn addition, our company has been playing a leading role for many years in\npromoting    eco-friendly   business      practices,   ensuring   that   our   products   are\nenvironmentally sustainable.\nWe have enclosed our company brochure, which introduces our company and\nmajor products in more detail. Please feel free to contact me if you have any\nquestions or require further information.\nWe look forward to hearing from you soon.\nVery truly yours,"}},{"id":"65-4-23","r":65,"s":"무역영어","n":23,"q":"다음 중 위 서신에 대한 회신에 들어갈 내용으로 적절하지 않은 것은?","c":["We have reviewed your brochure with great interest. We would like to know if you are currently looking for a sole agent to distribute your eco-friendly products in our market.","We are pleased to advise you that the goods covered by your Order No. 225 were shipped on board the vessel ‘MV Pearl' yesterday. The shipping documents have been sent to your bank for negotiation.","We acknowledge receipt of your letter introducing your company. However, we regret to inform you that we are currently fully stocked and are not looking for new suppliers at this moment. We will keep your information on file for future reference.","Your products seem to suit our market needs nicely. Could you please let us know your Minimum Order Quantity (MOQ) and the estimated lead time for an initial order?"],"a":2,"t":"빈칸, 표현 바꾸기","e":"회사 소개 서신에 대한 답은 관심 표명, 정중한 거절, 최소주문량 문의 같은 내용이에요. 주문품 선적을 알리는 ②는 이미 거래 중일 때 쓰는 선적통지라 맞지 않습니다.","p":{"range":"22~23","text":"Dear Sirs,\nWe are writing to introduce ourselves as one of the leading manufacturers and\nexporters of camping equipment in Korea. Since our establishment in 1993, we\nhave been dedicated to the field of camping goods and have built a strong\nreputation for quality and reliability.\nIn addition, our company has been playing a leading role for many years in\npromoting    eco-friendly   business      practices,   ensuring   that   our   products   are\nenvironmentally sustainable.\nWe have enclosed our company brochure, which introduces our company and\nmajor products in more detail. Please feel free to contact me if you have any\nquestions or require further information.\nWe look forward to hearing from you soon.\nVery truly yours,"}},{"id":"65-4-24","r":65,"s":"무역영어","n":24,"q":"위 서신의 내용에 대한 설명으로 옳은 것은?","c":["The buyer is satisfied with the price but dissatisfied with the quality of the samples.","The buyer has accepted the seller’s original offer of USD 6.00.","The samples have not yet reached the buyer.","The buyer is proposing a price reduced by 50 cents per piece to proceed with the business."],"a":4,"t":"서신 내용 파악","e":"USD 6.00 청약에 대해 USD 5.50으로 개당 50센트 낮춘 반대청약을 내고 있어요.","p":{"range":"24~25","text":"Dear Mr. Parker,\n  Thank you for your e-mail offer of March 30 for 5,000 pieces of Wet Sheets for\nsensitive skin at USD 6.00 per piece CIF Bangkok. However, we find that your\nprices are not (    A    ) and, therefore, we are unable to place an order with you\nat this time, even though we are favorably impressed with your samples.\n  Your rival firms are making efforts to secure our business by offering much\nlower prices. However, it is our intention to entrust you with the bulk of our\nbusiness, and we have decided to make a (         B    ) at USD 5.50 per piece.\n  We hope you will take advantage of this chance so that you will benefit from\nthe expanding market here. We look forward to your prompt reply.\nVery truly yours."}},{"id":"65-4-25","r":65,"s":"무역영어","n":25,"q":"위 서신의 빈칸 (A), (B)에 들어가기에 가장 적절한 단어로 짝지어진 것은?","c":["(A) competitive — (B) counter offer","(A) cheap — (B) claim","(A) reasonable — (B) order","(A) high — (B) firm offer"],"a":1,"t":"빈칸, 표현 바꾸기","e":"가격이 경쟁력(competitive)이 없어서 주문을 못 하고, 5.50달러로 반대청약(counter offer)을 한다는 흐름이에요.","p":{"range":"24~25","text":"Dear Mr. Parker,\n  Thank you for your e-mail offer of March 30 for 5,000 pieces of Wet Sheets for\nsensitive skin at USD 6.00 per piece CIF Bangkok. However, we find that your\nprices are not (    A    ) and, therefore, we are unable to place an order with you\nat this time, even though we are favorably impressed with your samples.\n  Your rival firms are making efforts to secure our business by offering much\nlower prices. However, it
