ge":"24~25","text":"Dear Andrew,\n We are very pleased to learn from our friend, Mr. Kim Sung-Kon, who recently\nreturned from your city, that you are highly interested in Korean electronic goods.\nAs Mr. Kim may have already informed you, we maintain strong business\nrelationships   with   several   leading    manufacturers       in     Korea    and     enjoy     a\nwell-established reputation for exporting our products to European markets.\n Our   enclosed    catalog   provides      an   overview   of    our       product    lines.    The\naccompanying price list quotes prices on a CIF European port basis for a\nminimum order of 3,000 sets. However,                                (A)                 .\nRegarding payment, our company policy require all transactions to be conducted\nvia an irrevocable Letter of Credit (L/C).\nYours truly,"}},{"id":"63-4-26","r":63,"s":"무역영어","n":26,"q":"다음 밑줄 친 부분(A~D)을 논리 전개에 따라 가장 잘 나열한 것은?\n\nDear Mr. Barnes, Regarding Order No. 1029/36, please note that it was shipped on May 22, 2025, aboard the SS Samanda, which is expected to arrive in Dover on June 3. As per your request, we have already notified your agent, Rod Ericson, to arrange for the consignment's onward delivery to you.\n(A) These documents include the shipped clean bill of lading (No. 482619), invoice (No. EH2811), and insurance certificate (AR 109 1123). (B) In the meantime, we've enclosed a catalog of our new models. (C) We are confident you'll be very pleased with the machines and that they will find a strong market in your country. (D) Once you have accepted our bill, the relevant documents will be released by our bank's agents, Bonanza Bank Ltd. at High Street, Dover. We believe you'll be particularly interested in the machines featured on pages 69-73. We look forward to hearing from you again soon. Yours truly,","c":["(C)-(A)-(B)-(D)","(C)-(D)-(B)-(A)","(D)-(A)-(C)-(B)","(D)-(C)-(A)-(B)"],"a":3,"t":"서신 흐름, 문장 배열","e":"선적 안내 뒤에 어음 인수 시 서류를 내준다(D), 그 서류 목록(A), 기계에 만족할 것(C), 그동안 신제품 카탈로그를 동봉(B) 순서가 자연스러워요."},{"id":"63-4-27","r":63,"s":"무역영어","n":27,"q":"다음 서신에서 밑줄 친 부분(A~D) 중 문맥상 가장 어색한 것은?\n\nDear Mr. Merton, We are writing in response to the bill received today for goods shipped via the S.S. \"Ambassador,\" which we are unable to accept. As per our prior agreement, these goods were sent to us on consignment. (A) The delayed delivery of the consignment has resulted in significant commercial detriment. (B) We did not provide authorization for you to draw on us for this shipment.\n(C) Additionally, we have not yet found buyers for these goods at the invoiced price, and they remain in our inventory. (D) It appears there has been an error in billing given the consignment terms. We will continue our efforts to sell the goods, though we anticipate having to offer them at prices lower than those stated. Please find the unaccepted draft returned with this letter. We request your review and correction of this billing error. Sincerely,","c":["(A)","(B)","(C)","(D)"],"a":1,"t":"서신 흐름, 문장 배열","e":"위탁판매 물품에 환어음을 발행한 청구 오류를 지적하는 서신이에요. 배송 지연으로 손해를 봤다는 (A)는 흐름과 맞지 않습니다."},{"id":"63-4-28","r":63,"s":"무역영어","n":28,"q":"다음 중 주어진 문장을 영작한 것 중 그 내용이 잘못된 것은?","c":["조만간 상품들을 선적할 것이므로 신용장을 빠른 시일 내에 개설해주실 것을 요청합니다. ⇒ We will soon be ready for shipment of the goods and, therefore, ask you to open a letter of credit as soon as possible to enable us to effect the shipment on time.","귀사를 수익자로 미화 18만불 상당의 취소불능신용장을 LA의 Bank of America측에서 개설하였음을 통보합니다. ⇒ We would like to notify you that the Bank of America in LA has opened an irrevocable letter of credit in your favor for the amount of USD 180,000.","귀사의 신용장 No. 7의 유효기간을 5월 15일까지 연장해 주실 것을 요청합니다. ⇒ We request that your L/C No. 7 be amended, extending its validity to May 15.","신용장을 검토한 결과, 운송료가 착불조건인데, FOB 조건이므로 운송료를 선불로수정해 주시기 바랍니다⇒ After reviewing the letter of credit, we noted that the freight is indicated as prepaid. Since the shipment is under FOB terms, we kindly request that you amend it to collect."],"a":4,"t":"영작","e":"한글은 신용장에 운임이 착불로 되어 있으니 선불로 고쳐 달라는 뜻인데, 영작은 선불로 되어 있으니 착불로 고쳐 달라고 반대로 썼어요."},{"id":"63-4-29","r":63,"s":"무역영어","n":29,"q":"이 메일의 밑줄 친 부분을 대체하기에 그 의미가 다른 문장은?","c":["We are sorry that we cannot give you sufficient information regarding the credit standing of the firm.","We would advise you to proceed with caution in your dealing with the firm in question.","We regret our inability to inform you of anything concerning the firm mentioned.","As our relationship with the firm is limited, it would be advisable for you to instruct an inquiry agency to investigate the matter."],"a":2,"t":"빈칸, 표현 바꾸기","e":"밑줄 부분은 '거래가 적어서 신용에 대해 어떤 판단도 하기 어렵다'는 중립적인 내용이에요. ②는 '거래에 주의하라'는 부정적 의견이라 의미가 다릅니다.","p":{"range":"29~30","text":"To:        customors@sm.co.kr\nSubject:   Re: Credit Inquiry\n  Dear Anthony:\n     We are writing in response to your email dated April 10th inquiring about Jason\nCo. which had furnished us as a reference to you.\n     At this time we are sorry to say that our transactions with this firm have been\nso     small     and    infrequent   that   we   do   not   feel   justified   in   making   any\nrecommendations regarding their financial standing and creditworthiness one way\nor the other.\n     Once again, we regret that we could not provide you with any concrete\ninformation that may encourage you to commence doing business with them.\n     If you feel we may be of further assistance, please do not hesitate to ask.\n     Sincerely yours,"},"u":["we do not feel justified in making any recommendations regarding their financial standing and creditworthiness one way or the other"]},{"id":"63-4-30","r":63,"s":"무역영어","n":30,"q":"위 비즈니스에서 활용된 신용조회처는 무엇인가?","c":["Bank Reference","Credit Rating Company","Trade Reference","Consulate Inquiry"],"a":3,"t":"서신 내용 파악","e":"Jason Co.가 자기 거래처를 신용조회처로 알려줬고 그 거래처가 답한 것이니 동업자 조회(Trade Reference)예요.","p":{"range":"29~30","text":"To:        customors@sm.co.kr\nSubject:   Re: Credit Inquiry\n  Dear Anthony:\n     We are writing in response to your email dated April 10th inquiring about Jason\nCo. which had furnished us as a reference to you.\n     At this time we are sorry to say that our transactions with this firm have been\nso     small     and    infrequent   that   we   do   not   feel   justified   in   making   any\nrecommendations regarding their financial standing and creditworthiness one way\nor the other.\n     Once again, we regret that we could not provide you with any concrete\ninformation that may encourage you to commence doing business with them.\n     If you feel we may be of further assistance, please do not hesitate to ask.\n     Sincerely yours,"}},{"id":"64-1-1","r":64,"s":"무역규범","n":1,"q":"대외무역법령에서 규정하는 용어에 관한 설명으로 올바른 것은?","c":["외국인도수출이란 수출대금을 해외에서 영수하고, 국내에서 통관된 수출 물품 등을 외국으로 인도하거나 제공하는 수출을 말한다.","보세판매장에서 외국인에게 국내에서 생산(재생ㆍ개조하는 것 포함)된 물품을 매도하는 것은 수출에 해당한다.","임대수출이란 임대(사용대차를 제외)계약에 의하여 물품 등을 수출하여 일정기간 후다시 수입하거나 그 기간의 만료 전 또는 만료 후 해당 물품 등의 소유권을 이전하는수출을 말한다.","무역에는 대통령령으로 정하는 용역의 수출과 수입이 포함되며, 「부가가치세법 시행령」 제3조에 따른 용역(출판업과 영상ㆍ오디오 기록물 제작 및 배급업 제외)이 해당한다."],"a":2,"t":"대외무역법: 정의, 수출입 실적","e":"보세판매장에서 외국인에게 국내 생산 물품을 파는 것은 수출로 봐요. 외국인도수출은 대금을 국내에서 받고 국내 통관되지 않은 물품을 외국에서 인도하는 수출이고(①), 임대수출의 임대에는 사용대차도 포함됩니다(③)."},{"id":"64-1-2","r":64,"s":"무역규범","n":2,"q":"다음 중 우리나라의 대외무역법령에서 규정하고 있는 무역의 진흥을 위한 조치와전문무역상사의 지정 및 지원에 관한 설명 중에서 올바른 것을 모두 고른 것은?\n\nA. 무역의 진흥을 위한 지원 대상이 되는 시설은 무역전문인력 양성을 위한 연면적이 2천 제곱미터 이상이고 최대수용 인원이 500명 이상인 무역연수원이 해당된다.\nB. 대통령은 무역의 진흥을 위하여 필요하다고 인정되면 대통령령으로 정하는 바에따라 해당하는 자에게 필요한 지원을 할 수 있다.\nC. 전문무역상사의 지정기준 중 하나로서, 전년도 수출실적 또는 직전 4개 연도의 연평균 수출실적이 미화 100만달러 이상의 범위에서 산업통상자원부장관이 정하여고시하는 금액 이상이어야 한다.\nD. 전문무역상사의 지정기준 중 하나로서, 수출실적 중 다른 중소기업이나 중견기업이 생산한 물품 등의 수출실적 비율이 100분의 20 이상의 범위에서 산업통상자원부장관이 정하여 고시하는 비율 이상이어야 한다.","c":["A, C","A, D","B, C","B, D"],"a":2,"t":"대외무역법: 정의, 수출입 실적","e":"무역진흥 지원 주체는 대통령이 아니라 산업통상자원부장관이고(B), 전문무역상사 수출실적 기준은 전년도 또는 직전 3개 연도 연평균이에요(C). A와 D가 맞습니다."},{"id":"64-1-3","r":64,"s":"무역규범","n":3,"q":"우리나라의 대외무역법령에서 규정하고 있는 수출입의 제한 및 수출입승인 물품 등에 관한 설명으로 잘못된 것은?","c":["수출입승인 유효기간은 1년 이내 또는 20년의 범위에서 유효기간을 단축 또는 초과하여 설정할 수 있다.","수출입승인 물품 등이란 수출입공고에서 정한 물품 등으로 중계무역 물품, 외국인수입 물품, 외국인도수출 물품, 선용품을 포함한다.","하나의 수출 또는 수입에 대하여 둘 이상의 승인을 받아야 하는 경우 각각의 승인은 서로 독립적으로 받아야 한다.","산업통상자원부장관은 항공 관련 품목의 안전관리가 필요한 경우, 해당 물품의 수출입을 제한하거나 금지할 수 있다."],"a":2,"t":"대외무역법: 정의, 수출입 실적","e":"중계무역 물품, 외국인수수입 물품, 외국인도수출 물품, 선용품 등은 수출입승인 대상에서 빠지는 물품이에요. 승인 물품에 포함된다고 한 ②가 틀렸습니다."},{"id":"64-1-4","r":64,"s":"무역규범","n":4,"q":"대외무역법령에서 규정하는 수출입실적에 대한 설명 중 잘못된 것은?","c":["북한으로의 유상반출 실적을 포함하여 유상으로 거래되는 수출은 수출실적 인정범위에 해당한다.","전자적 형태의 무체물 수출의 수출실적 인정금액은 한국무역협회장 또는 한국소프트웨어산업협회장이 외국환은행을 통해 확인한 입금금액이다.","수입실적 인정금액은 수입통관액(FOB가격 기준)이다. 다만, 외국인수수입과 용역 또는전자적 형태의 무체물의 수입은 외국환은행의 지급액이다.","외화를 받고 외항 선박에 내국 선박용품을 공급하는 경우, 수출실적 인정시점은 선박용품 등 관리에 관한 고시에 따른 적재허가서에 기재된 허가일자이다."],"a":3,"t":"대외무역법: 정의, 수출입 실적","e":"수입실적 인정금액은 수입통관액 CIF 가격 기준이에요. FOB 가격이라고 한 ③이 틀렸습니다. 수출실적은 FOB 가격 기준이라 둘을 헷갈리지 마세요."},{"id":"64-1-5","r":64,"s":"무역규범","n":5,"q":"우리나라의 대외무역관리규정에서 규정하고 있는 외화획득의 이행기간에 관한 설명중 잘못된 것은?","c":["외화획득 이행의무자는 외화획득용 원료의 수입신고 수리일로부터 2년 이내에 외화획득의 이행을 하여야 한다.","국내 공급(양도 포함)의 경우에는 공급일로부터 1년 이내에 외화획득의 이행을 하여야 한다.","외화획득 물품의 선적기일이 2년 이상인 경우에는 그 기일까지의 기간에 외화획득의 이행을 하여야 한다.","수출이 완료된 기계류(HS 84류부터 90류까지의 품목)의 하자 및 유지보수용 원료등의 외화획득의 이행기간은 5년 이내로 한다."],"a":4,"t":"대외무역법: 외화획득, 구매확인서","e":"수출이 끝난 기계류의 하자, 유지보수용 원료는 외화획득 이행기간을 10년 이내로 넉넉히 줘요. 5년이라고 한 ④가 틀렸습니다."},{"id":"64-1-6","r":64,"s":"무역규범","n":6,"q":"대외무역법령에서 규정하고 있는 전략물자의 수출과 관련된 내용으로 올바른 것은?","c":["수출허가를 받지 아니하고 전략물자를 수출신고한 자에게 5년 이내의 범위에서 일정기간 동안 전략물자 등의 전부 또는 일부의 수출을 제한할 수 있다.","물품 등을 수출하려는 자는 전략물자인지 또는 상황허가 대상 물품 등인지를 스스로판정할 수 없다.","수출허가의 유효기간은 1년이며, 상황허가의 유효기간은 2년이다.","선박 또는 항공기의 안전 운항을 위하여 긴급 수리용으로 사용될 기계, 기구 또는 부분품 등을 수출하는 경우에는 전략물자의 수출허가를 면제할 수 있다."],"a":4,"t":"대외무역법: 전략물자","e":"선박이나 항공기의 안전 운항을 위한 긴급 수리용 부품 수출은 전략물자 수출허가를 면제할 수 있어요. 무허가 수출자의 수출 제한은 3년 이내이고(①), 자가판정도 할 수 있으며(②), 유효기간 설명도 틀렸습니다(③)."},{"id":"64-1-7","r":64,"s":"무역규범","n":7,"q":"다음 중 대외무역법령에서 규정하고 있는 정부 간 수출계약의 절차에 해당하지 않는 것은?","c":["방위산업 물자의 구매 의사에 관한 법에 따른 전담기관의 확인","국내 기업의 정부 간 수출계약 이행 능력에 관한 평가 및 추천","전담기관과 국내 기업의 정부 간 수출계약 이행에 관한 약정 체결","국내 기업이 함께 계약의 당사자가 되어 체결하는 경우를 포함한 전담기관과 외국정부 간 수출계약의 체결"],"a":1,"t":"대외무역법: 무역구제, 특별조치","e":"정부 간 수출계약 절차는 외국 정부의 구매 의사 확인, 국내 기업의 이행능력 평가와 추천, 전담기관과 기업의 이행 약정, 외국 정부와의 계약 체결 순이에요. ①은 법정 절차에 들어가지 않습니다."},{"id":"64-1-8","r":64,"s":"무역규범","n":8,"q":"대외무역법령에서 규정하고 있는 원산지 표시 방법에 관한 설명 중 올바른 것은?","c":["실질적 변형을 일으키는 제조 공정에 투입되는 부품을 수입한 후 실수요자에게 직접 공급하는 경우, 해당 물품에 원산지를 표시하여야 한다.","수입된 물품이 단순 가공 활동을 거쳐 원산지 표시가 손상된 경우, 단순가공이 이루어진 국가를 원산지로 표시하여야 한다.","무역거래자 또는 판매업자는 수입물품 등에 표시된 원산지를 변경할 수 있다.","수출물품에 대한 수입국의 원산지 표시 규정이 우리나라 규정과 다를 경우, 수입국규정에 따라 원산지를 표시할 수 있다."],"a":4,"t":"대외무역법: 원산지","e":"수출물품은 수입국의 원산지 표시 규정이 우리와 다르면 수입국 규정에 따라 표시할 수 있어요. 수입 부품을 실수요자에게 직접 공급하면 표시를 생략할 수 있고(①), 단순가공은 원산지를 바꾸지 않으며(②), 표시된 원산지를 바꾸는 건 금지돼요(③)."},{"id":"64-1-9","r":64,"s":"무역규범","n":9,"q":"다음 중 대외무역법령에서 규정하고 있는 수입수량 제한조치에 대한 설명으로 올바른 것은?","c":["특정 물품의 수입 증가로 인하여 같은 종류의 물품 또는 직접적인 경쟁 관계에 있는물품을 생산하는 국내산업이 실질적 피해 등이 있음이 무역위원회 조사를 통해 확인되면 시행할 수 있다.","산업통상자원부장관은 수입수량 제한조치를 하는 경우, 제한되는 수입수량을 각 국가별로 할당할 수 있다.","수입수량 제한조치는 조치 시행일 이전에 수입된 물품에도 적용할 수 있다.","수입수량을 제한하는 경우 그 제한 수량은 최근의 3년간의 대표적인 수입량을 연평균수입량으로 환산한 수량(기준 수량) 이하로 하여야 한다."],"a":2,"t":"대외무역법: 무역구제, 특별조치","e":"수입수량 제한조치를 할 때 제한 수량을 국가별로 할당할 수 있어요. 요건은 '심각한 피해'이고(①), 시행일 이후 수입 물품에만 적용하며(③), 제한 수량은 최근 3년 연평균 수입량 '이상'이어야 합니다(④)."},{"id":"64-1-10","r":64,"s":"무역규범","n":10,"q":"대외무역법상 조정을 명하는 경우 고려해야 할 사항으로 올바른 것을 모두 고르시오.\n\nA. 물품 등의 수출·수입의 질서 유지를 위한 목적에 필요한 정도를 넘지 아니할 것\nB. 다른 무역거래자의 권익을 부당하게 침해하거나 차별하지 아니할 것\nC. 교역상대국과의 경제협력 증진에 기여할 것\nD. 수출기반의 안정, 새로운 상품의 개발 또는 새로운 해외시장의 개척에 기여할 것","c":["A, B","A, B, D","C, D","A, C, D"],"a":2,"t":"대외무역법: 무역구제, 특별조치","e":"조정명령은 수출입 질서 유지에 필요한 정도를 넘지 않고, 다른 무역거래자를 부당하게 차별하지 않으며, 수출기반 안정이나 신상품, 신시장 개척에 기여해야 해요. 교역상대국과의 경제협력 증진은 고려사항이 아닙니다."},{"id":"64-1-11","r":64,"s":"무역규범","n":11,"q":"다음 중 대외무역법령에서 규정하고 있는 구매확인서에 관한 설명으로 잘못된 것은?","c":["외화획득용 원료·기재의 제조·가공·유통(완제품의 유통은 제외)과정이 여러 단계인경우, 각 단계별로 순차적으로 구매확인서를 발급할 수 있다.","외국환은행의 장 또는 전자무역기반사업자는 발급된 구매확인서를 근거로 2차 구매확인서를 발급할 수 있다.","구매확인서를 발급받으려는 자가 전산 설비를 갖추지 못한 때에는 전자무역기반사업자에게 위탁하여 신청할 수 있다.","산업통상자원부장관은 구매확인서를 발급받은 자에 대하여 외화획득용 원료·기재의구매 여부를 사후 관리하여야 한다."],"a":1,"t":"대외무역법: 외화획득, 구매확인서","e":"구매확인서는 외화획득용 원료, 기재의 제조, 가공, 유통 과정이 여러 단계이면 완제품 유통 단계까지 '포함'해서 단계별로 순차 발급할 수 있어요. '완제품 유통은 제외'라고 한 ①이 틀렸습니다."},{"id":"64-1-12","r":64,"s":"무역규범","n":12,"q":"다음 괄호 안의 용어로 올바르게 짝지어진 것은?\n\nA. ㈜KITA는 유럽에서 국내로 반입한 수입식품에 대해 식약처의 요건을 충족하지 못\n   해 다시 해외로 반출하면서 (         )통관을 하였다.\nB. 우리나라 선박이 태평양에서 잡은 참치는 (               )물품이다.\nC. ㈜KITA는 세관으로부터 관세의 과세표준과 세액을 결정 또는 경정하기 위하여 방\n   문 또는 서면으로 납세자의 장부 등을 조사하는 (               )조사 통지를 받았다.\nD. ㈜KITA는 중국에서 생산한 의류를 인천항으로 반입한 후 보세 상태로 인천공항을\n   통해 항공기로 영국으로 반출하였다. 이를 (              )환적이라고 한다.","c":["A : 수출, / B : 내국, / C : 세관, / D : 복합","A : 수출, / B : 외국, / C : 세관, / D : 이중","A : 반송, / B : 내국, / C : 관세, / D : 복합","A : 반송, / B : 외국, / C : 관세, / D : 이중"],"a":3,"t":"관세법: 통관, 보세","e":"요건 미충족으로 다시 외국으로 내보내는 건 반송통관, 우리 선박이 공해에서 잡은 수산물은 내국물품, 장부를 조사하는 건 관세조사예요. 배로 들어와 다른 세관 관할에서 항공기로 나가면 복합환적입니다."},{"id":"64-1-13","r":64,"s":"무역규범","n":13,"q":"관세법상 기간과 기한에 대한 설명으로 잘못된 것은?","c":["관세청장이 정하는 사유로 국가관세종합정보시스템, 연계정보통신망 또는 전산처리설비의 가동이 정지되어 법에 따른 신고·신청·승인·허가·수리·교부·통지·통고·납부 등을 기한까지 할 수 없게 된 때에는 해당 국가관세종합정보시스템, 연계정보통신망 또는 전산처리설비의 장애가 복구된 날의 다음 날을 기한으로 한다.","세관장은 천재지변으로 기한 내 신고, 납부 또는 징수 등을 할 수 없다고 인정되는 경우, 5년을 넘지 않는 범위에서 그 기한을 연장할 수 있다.","수입신고 전 즉시반출신고를 한 경우 관세의 납부기한은 수입신고일부터 15일 이내이\n다.","월별납부 승인의 유효기간은 승인일부터 2년이 되는 날이 속하는 달의 말일까지로 한\n다."],"a":2,"t":"관세법: 납세의무, 세액","e":"천재지변 등으로 세관장이 기한을 연장할 때는 1년을 넘지 않는 범위에서 해요. 5년이라고 한 ②가 틀렸습니다."},{"id":"64-1-14","r":64,"s":"무역규범","n":14,"q":"다음 관세법상 과세요건 및 과세시점 등에 관한 설명으로 잘못된 것은?","c":["관세법상 과세의 4대 요건은 과세물건, 과세표준, 관세율, 납세의무자이다.","과세물건은 유체물인 수입물품이다. 다만, 특허권이나 상표권 등 무형권리가 물품가격에 포함되어 수입되었을 때에는 과세대상에 포함될 수 있다.","관세는 수입신고를 하는 때의 물품의 성질과 수량에 따라 부과한다. 단, 입항전 신고의 경우에는 물품이 수출국에서 출항할 때의 성질과 수량에 따라 부과한다.","관세율은 수입신고일의 세율을 적용하므로 수입신고일이 관세율 인하일 이후인 경우, 인하된 세율을 적용한다."],"a":3,"t":"관세법: 관세율","e":"과세물건은 원칙적으로 수입신고를 하는 때의 성질과 수량으로 확정돼요. 입항전 수입신고라고 해서 수출국 출항 때 기준을 쓰지는 않으므로 ③이 틀렸습니다. 입항전 신고 물품의 적용 법령은 우리나라에 도착한 날 기준이에요."},{"id":"64-1-15","r":64,"s":"무역규범","n":15,"q":"다음 중 수입신고 시 납세의무자로 올바르게 짝지어진 것은?\n\nA. ㈜KITA는 미국의 A사와 물품 수입 계약을 체결하였다. 그러나 수입절차를 잘 몰라 수입대행업체인 ㈜한국무역에 물품 수입을 위탁하였고 ㈜한국무역은 이를 대행 수입하였다.\nB. ㈜KITA는 유럽에서 수입 계약을 체결한 후 운송 중인 물품을 국내에 도착하기 전에 B/L 양도 계약을 통해서 물품을 ㈜한국무역에 양도하였다.\nC. ㈜KITA는 중국에서 반입한 물품을 ㈜한국무역이 운영하는 보세창고에 보관하던중, 수입신고 전에 모든 물건이 분실된 것을 확인하였다.","c":["A : ㈜KITA / B : ㈜KITA / C : ㈜KITA","A : ㈜KITA / B : ㈜한국무역 / C : ㈜한국무역","A : ㈜한국무역 / B : ㈜한국무역 / C : ㈜한국무역","A : ㈜한국무역 / B : ㈜한국무역 / C : ㈜KITA"],"a":2,"t":"관세법: 납세의무, 세액","e":"수입을 위탁받아 대행하면 위탁자(㈜KITA), 수입신고 전에 양도된 물품은 양수인(㈜한국무역), 보세구역에 보관 중 분실된 물품은 그 보세구역 운영인(㈜한국무역)이 납세의무자예요."},{"id":"64-1-16","r":64,"s":"무역규범","n":16,"q":"다음 중 관세법령상 관세부과의 제척기간에 관한 설명으로 잘못된 것은?","c":["관세부과의 제척기간이 경과되더라도, 관세법에 따른 심사청구에 관한 결정이 있은 경우, 그 결정일로부터 1년 이내에 필요한 처분을 할 수 있다.","과다환급 또는 부정환급 등의 사유로 관세를 징수하는 경우, 제척기간의 기산일은 환급한 날의 다음 날이다.","관련 결정 또는 판결에 따라 명의대여 사실이 확인된 경우, 당초의 부과처분을 취소하고 그 결정 또는 판결이 확정된 날부터 1년 이내에 실제로 사업을 경영한 자에게 경정이나 필요한 처분을 할 수 있다.","수입신고를 하지 아니하고 수입한 경우, 관세를 부과할 수 있는 날부터 10년이 지나면부과할 수 없다."],"a":4,"t":"관세법: 납세의무, 세액","e":"관세부과 제척기간은 원칙 5년, 부정한 방법으로 관세를 포탈하거나 환급, 감면받은 경우 10년이에요. 정답 키는 ④를 틀린 설명으로 봅니다. 10년 기간의 요건을 교재에서 한 번 더 확인해 두세요."},{"id":"64-1-17","r":64,"s":"무역규범","n":17,"q":"다음 중 관세법 제33조의 국내판매가격을 기초로 한 과세가격 결정방법에서 공제요소에 관한 설명으로 잘못된 것은?","c":["수입항까지의 운임․보험료 및 그 밖의 관련 비용은 공제 요소에 해당하며, 실제 발생한 비용을 공제한다.","국내 판매와 관련하여 통상적으로 지급하였거나 지급하기로 합의된 수수료 또는 동종․동류의 수입물품이 국내에서 판매되는 때에 통상적으로 부가되는 이윤 및 일반경비는공제 요소에 해당한다.","해당 물품의 수입 및 국내 판매와 관련하여 납부한 공과금은 공제 요소에 포함된다.","과세가격을 결정함에 있어서 수입 시 납부한 관세는 공제 요소에 해당한다."],"a":1,"t":"관세법: 과세가격","e":"국내판매가격 기준(제4방법)에서 공제하는 건 국내 판매 수수료나 이윤, 일반경비, 수입항 도착 '후' 국내 운송비와 보험료, 납부한 관세와 공과금이에요. 수입항'까지'의 운임과 보험료는 공제 요소가 아니라서 ①이 틀렸습니다."},{"id":"64-1-18","r":64,"s":"무역규범","n":18,"q":"납세의무자가 가격신고를 할 때 신고하여야 할 가격이 확정되지 아니한 경우로서잠정가격으로 가격신고를 할 수 있는 경우로 잘못된 것은?","c":["과세가격 결정방법의 사전심사를 신청한 경우","거래관행상 거래가 성립된 때부터 일정 기간이 지난 후에 가격이 정하여지는 물품(기획재정부령으로 정하는 것으로 한정)으로서 수입신고일 현재 그 가격이 정하여지지 아니한 경우","관세법 제33조(4방법)에 따라 과세가격을 결정하기 위한 이윤 및 일반경비 산출등에 오랜 시간이 소요되는 경우","물품을 수입하려는 자가 수입신고를 하기 전에 관세청장에게 품목분류를 미리 심사하여 줄 것을 신청하는 경우"],"a":4,"t":"관세법: 과세가격","e":"품목분류 사전심사는 세번(HS) 분류를 미리 받는 제도라 가격이 확정되지 않은 잠정가격 신고 사유가 아니에요."},{"id":"64-1-19","r":64,"s":"무역규범","n":19,"q":"다음 중 관세법상 가산세를 부과하는 경우가 아닌 것은?","c":["관세청장이 정하는 물품을 보세구역 반입일로부터 30일 이내에 수입신고하지 않은 경우","납세의무자가 부정한 행위로 과소신고한 후, 보정기간 내에 세액에 대한 보정을 신청하는 경우","재수출면세를 적용받은 물품을 지정기간 내에 재수출하지 않은 경우","수입신고 수리 전 반출물품에 대해 반출승인을 받은 후 10일 이내에 담보를 제공하지아니한 경우"],"a":4,"t":"관세법: 감면, 환급","e":"신고지연, 과소신고(부정행위 포함), 재수출 불이행은 모두 가산세 대상이에요. 수리 전 반출 승인 후 담보 미제공은 가산세 부과 사유로 정해져 있지 않아서 ④가 정답입니다."},{"id":"64-1-20","r":64,"s":"무역규범","n":20,"q":"관세법상 관세율의 종류 및 적용에 관한 설명으로 올바른 것은?","c":["기본세율과 잠정세율은 별표 관세율표에 따르되 기본세율을 잠정세율에 우선하여 적용한다.","수입물품에 적용되는 관세율은 기본세율과 잠정세율 두 가지뿐이다.","덤핑방지관세의 부과와 잠정조치는 각각의 조치일 이후 수입되는 물품에 적용된다. 다만, 잠정조치가 적용된 물품에 대하여 국제협약에서 달리 정하는 경우에는 그 물품에도 덤핑방지관세를 부과할 수 있다.","긴급관세의 부과 여부 및 그 내용은 무역위원회의 건의가 접수된 날부터 1년 이내에결정하여야 한다. 다만, 주요 이해당사국과 긴급관세의 협의기간은 이에 포함되지 아니한다."],"a":3,"t":"관세법: 관세율","e":"덤핑방지관세와 잠정조치는 조치일 이후 수입 물품에 적용하는 게 원칙이에요. 잠정세율이 기본세율보다 우선하고(①), 세율 종류는 훨씬 다양하며(②), 긴급관세는 무역위원회 건의 접수 후 1개월 안에 결정해야 해요(④)."},{"id":"64-1-21","r":64,"s":"무역규범","n":21,"q":"다음 중 관세법상 기획재정부령으로 정하는 관세가 면제되는 재수입 물품을 모두 고른것은?\n\nA. 박람회, 전시회, 품평회 등 이에 준하는 행사에 사용된 물품\nB. 해외에서 수리된 물품\nC. 수출 후 결함이 발견되어 다시 수입하는 물품\nD. 수출물품을 해외에서 설치하기 위해 사용하는 장비","c":["A, B","A, B, D","A, C, D","A, B, C, D"],"a":3,"t":"관세법: 감면, 환급","e":"박람회 등에 쓰고 다시 들여오는 물품, 결함 때문에 다시 수입하는 물품, 해외 설치용 장비는 재수입면세 대상이에요. 해외에서 수리한 물품은 재수입면세가 아니라 해외임가공물품 감세 대상입니다."},{"id":"64-1-22","r":64,"s":"무역규범","n":22,"q":"다음 중 관세법상 경정청구에 대한 설명이 올바른 것은?","c":["납세의무자는 신고납부한 세액이 과다한 경우, 최초로 납세신고일부터 1년 이내에 세액의 경정을 세관장에게 청구할 수 있다.","세관장은 경정청구를 받은 날부터 1개월 이내에 세액을 경정하거나, 경정하여야 할 이유가 없다는 뜻을 통지하여야 한다.","경정청구 후 1개월 이내에 통지를 받지 못한 경우에는 그 1개월이 되는 날의 다음 날부터 이의신청, 심사청구, 심판청구 또는 감사원법에 따른 심사청구를 할 수 있다.","청구기한이 이미 경과하였더라도, 해당 신고 건에 대한 판결이나 결정 등으로 세액이다르다는 것을 안 날부터 2개월 이내에는 경정청구를 할 수 있다."],"a":4,"t":"관세법: 납세의무, 세액","e":"판결이나 결정으로 세액이 다르다는 걸 안 날부터 2개월 안에는 기한이 지나도 경정청구를 할 수 있어요. 일반 청구기한은 5년이고(①), 세관장 통지와 불복 기준 기간은 2개월입니다(②, ③)."},{"id":"64-1-23","r":64,"s":"무역규범","n":23,"q":"다음 중 관세법상 보세공장에서의 보세작업을 위하여 반입되는 원재료에 해당하지않는 것은?","c":["해당 보세공장에서 생산하는 제품에 물리적 또는 화학적으로 결합되는 물품","해당 보세공장에서 생산하는 제품의 제조ㆍ가공 과정에서 소모되는 물품","해당 보세공장에서 수리ㆍ조립ㆍ검사ㆍ포장 등의 작업에 직접 투입되는 물품","보세공장에서 사용할 생산공정에 필수적인 기계"],"a":4,"t":"관세법: 통관, 보세","e":"보세작업 원재료는 제품에 결합되거나 공정에서 소모되거나 작업에 직접 투입되는 물품이에요. 생산 공정에 쓰는 기계는 원재료가 아닙니다."},{"id":"64-1-24","r":64,"s":"무역규범","n":24,"q":"다음 중 관세법령상 물품의 수출입신고 및 검사절차에 대한 설명으로 잘못된 것은?","c":["국민보건, 사회안전 또는 국제무역질서 준수 등을 위해 수출관리가 필요한 물품은 관세청장이 정하는 장소에 반입한 후 수출신고를 하게 할 수 있다.","세관공무원의 적법한 물품검사로 인하여 발생한 손실에 대하여는 화물관리운영인이손실을 입은 자에게 보상하여야 한다.","세관장은 관세청장이 정하는 바에 따라 검사를 받을 물품의 전부 또는 일부를 세관검사장에 반입하여 검사할 수 있다.","입항전수입신고는 당해 물품을 적재한 선박 또는 항공기가 그 물품을 적재한 항구 또는 공항에서 출항하여 우리나라에 입항하기 5일전(항공기의 경우 1일전)부터 할 수 있\n다."],"a":2,"t":"관세법: 통관, 보세","e":"세관공무원의 적법한 물품검사로 손실이 생기면 관세청장이나 세관장이 보상해요. 화물관리운영인이 보상한다는 ②가 틀렸습니다."},{"id":"64-1-25","r":64,"s":"무역규범","n":25,"q":"관세법상 납세자의 권리 및 불복절차에 관한 설명으로 잘못된 것은?","c":["세관공무원은 특정한 분야만을 조사할 필요가 있는 등 대통령령으로 정하는 경우를제외하고는 통합조사를 원칙으로 한다.","세관공무원은 적정하고 공평한 과세를 실현하고 통관의 적법성을 보장하기 위하여 필요한 최소한의 범위에서 관세조사를 하여야 하며 다른 목적을 위하여 조사권을 남용하여서는 안 된다.","세관공무원은 이미 조사받은 자의 거래상대방을 조사할 필요가 있는 경우라도, 해당사안에 대하여는 다시 조사할 수 없다.","수입물품에 부과되는 내국세 등의 부과, 징수, 감면, 환급 등에 관한 세관장의 처분에불복하는 자는 이의신청·심사청구 또는 심판청구를 할 수 있다."],"a":3,"t":"관세법: 통관, 보세","e":"원칙적으로 같은 사안은 다시 조사할 수 없지만, 거래상대방을 조사할 필요가 있는 경우 등은 재조사가 허용되는 예외예요. 그래서 ③이 틀렸습니다."},{"id":"64-1-26","r":64,"s":"무역규범","n":26,"q":"다음 중 관세환급특례법상 관세환급 대상 수출에 해당하는 것을 모두 고른 것은?\n\nA. 우리나라 안에 주류하는 주한미군에 대한 물품을 판매하여 외화를 획득하는 행위\nB. 주한미군이 시행하는 공사를 수행하여 외화를 획득하는 행위\nC. 우리나라와 외국 간을 왕래하는 선박 또는 항공기에 선용품ㆍ기용품으로 사용되는 물품을 공급하는 행위\nD. 관세법에 따라 수출신고가 수리된 유상수출\nE. 계약조건 불일치로 반품된 물품을 대체하기 위한 무상수출","c":["A, B, D","A, B, D, E","A, B, C, D","A, B, C, D, E"],"a":4,"t":"환급특례법","e":"주한미군 납품과 공사, 국제 선박이나 항공기의 선용품, 기용품 공급, 수출신고 수리된 유상수출, 반품 대체용 무상수출 모두 환급 대상 수출에 해당해요."},{"id":"64-1-27","r":64,"s":"무역규범","n":27,"q":"다음 중 수출용 원재료에 대한 관세 등 환급에 관한 특례법(관세환급특례법)의 내용으로 올바른 것은?","c":["환급 대상은 내수 및 수출용 원재료에 대한 관세, 임시수입부가세, 개별소비세, 주세, 교통ㆍ에너지ㆍ환경세, 농어촌특별세 및 교육세이다.","수입한 상태 그대로 수출한 경우는 환급 대상에 해당하지 않는다.","관세 등의 환급신청은 수출자 또는 생산자 중에서 수출신고필증에 환급신청인으로 기재된 자가 하여야 한다.","수출용원재료에 대한 관세 등을 환급받을 수 있는 수출에는 무상수출은 해당되지 않는다."],"a":3,"t":"환급특례법","e":"환급신청은 수출신고필증에 환급신청인으로 적힌 수출자나 생산자가 해요. 환급 대상은 수출용 원재료의 관세 등이고(①), 수입 상태 그대로 수출해도 환급되며(②), 일정한 무상수출도 포함돼요(④)."},{"id":"64-1-28","r":64,"s":"무역규범","n":28,"q":"다음 중 자유무역협정(FTA)관세법령상 협정관세의 적용신청 등에 관한 설명으로 잘못된 것은?","c":["협정관세를 적용받으려는 수입자는 원칙적으로 수입신고 수리 전까지 세관장에게협정관세 적용을 신청하여야 한다.","협정관세의 적용을 신청할 때 수입자는 원산지증빙서류를 갖추고 있어야 하며, 세관장이 요구하면 제출하여야 한다. 다만, 세관장은 대통령령으로 정하는 물품에 대해서는 관세 탈루의 우려가 있는 경우를 제외하고는 원산지증빙서류 제출을 요구할수 없다.","세관장은 수입자가 요구받은 원산지증빙서류를 제출하지 아니하거나 수입자가 제출한 원산지증빙서류만으로 해당 물품의 원산지를 인정하기가 곤란한 경우에는 수입신고 수리일로부터 2년 이내에 사후적용 신청을 하게 할 수 있다.","세관장은 협정관세의 적용신청을 받은 경우 원칙적으로 수입신고를 수리한 후에 심사하지만, 필요시 수리하기 전에 심사할 수 있다."],"a":3,"t":"FTA관세법","e":"원산지증빙서류를 내지 않거나 그것만으로 원산지를 인정하기 어려우면 세관장은 협정관세 적용을 제한할 수 있어요. 사후적용 신청을 하게 한다는 ③은 제도와 맞지 않습니다."},{"id":"64-1-29","r":64,"s":"무역규범","n":29,"q":"다음 중 자유무역협정(FTA)관세법령상 원산지결정기준에 관한 설명으로 올바른 것을 모두 고른 것은?\n\nA. 해당 물품의 전부를 생산ㆍ가공 또는 제조한 국가는 그 물품의 원산지로 한다.\nB. 둘 이상의 국가에서 생산·가공·제조된 경우, 해당 물품에 일정 수준 이상의 부가가치를 창출한 국가는 원산지로 인정된다.\nC. 원산지 물품이 제3국을 경유하여 운송된 경우에는 어떠한 사유로도 원산지로 인정되지 않는다.\nD. 협정에서 직접운송요건을 별도로 정한 경우에는 그 협정에서 정하는 바에 따른다.","c":["A, B","A, B, D","A, C, D","A, B, C, D"],"a":2,"t":"FTA관세법","e":"완전생산기준, 부가가치기준, 협정별 직접운송요건은 맞아요. 제3국을 경유해도 환적, 일시보관 같은 예외가 있어서 '어떠한 사유로도'라고 한 C가 틀렸습니다."},{"id":"64-1-30","r":64,"s":"무역규범","n":30,"q":"다음 중 우리나라의 자유무역협정의 이행을 위한 관세법의 특례에 관한 법률(FTA관세법) 내용에 대한 설명 중 틀린 것은?","c":["FTA관세법은 관세법 및 자유무역협정에 우선하여 적용한다. 다만 FTA관세법에서 정하지 아니한 사항은 관세법에 따른다.","FTA관세법은 우리나라가 체결한 자유무역협정의 이행을 위하여 관세법의 특례에 관한 사항과 체약상대국과의 관세행정 협조에 필요한 사항을 규정하고 있다.","한도수량 내 협정관세율이 적용되도록 양허된 물품 중 기획재정부령으로 정하는 물품에 대해서는 그 수량을 선착순으로 배정한다.","미합중국의 경우 긴급관세조치 대상은 섬유 관련 물품과 자동차로 한정하고 있다."],"a":1,"t":"FTA관세법","e":"FTA관세법은 관세법에는 우선하지만 자유무역협정 자체보다 우선하지는 않아요. 협정과 충돌하면 협정이 우선이라서 ①이 틀렸습니다."},{"id":"64-2-1","r":64,"s":"무역결제","n":1,"q":"다음 중 수출입대금 결제방법과 외국환거래법에 대한 설명으로 잘못된 것은?","c":["외국환거래법은 결제방법에 대하여 별도의 허가가 요구되는 경우만을 정하고, 나머지는 자유롭게 거래할 수 있도록 Negative List System 방식으로 관리한다.","수출입자는 외국환거래법의 ‘통화 지정제도’에 따라서 외국환은행에서 대고객 전신환 매매율이 고시되는 40개 통화만 결제통화로 선택해야 한다.","수출입대금은 외국환거래법상 원칙적으로 송장금액 전액을 지급 또는 영수해야 한다.","거주자는 건당 미화 50만 달러 이상에 대한 대외채권 회수 의무가 폐지되어 강제성은없어졌지만, 자신의 이익을 위해 회수해야 한다."],"a":2,"t":"외국환거래법","e":"외국환거래법에는 결제통화를 정해 두는 '통화 지정제도'가 없어요. 당사자가 결제통화를 자유롭게 정할 수 있어서 ②가 틀렸습니다."},{"id":"64-2-2","r":64,"s":"무역결제","n":2,"q":"다음 중 송금결제방식에 대한 설명으로 올바른 것을 모두 고른 것은?\n\nA. 송금결제방식은 추심결제방식과 혼합하여 활용될 수 있다.\nB. BWT 거래는 사전송금방식으로 진행된다.\nC. O/A 거래는 선적완료 사실을 수입자에게 통보하는 시점에 매출채권이 발생한다.\nD. O/A NEGO 시 은행에 제시하는 모든 선적서류는 사본으로 제시할 수 있다.\nE. CAD 거래는 수출자에게 신용위험만 존재하고, 비상위험은 발생하지 않는다.","c":["A, B, C","A, C, D","B, D, E","C, D, E"],"a":2,"t":"송금, 기타 결제","e":"송금은 추심과 섞어 쓸 수 있고, O/A는 선적 사실을 통보할 때 채권이 생기며, O/A NEGO 때는 서류 사본을 제시할 수 있어요. BWT는 현지에서 팔린 뒤 대금을 보내는 사후송금이고(B), CAD도 수입국 외환사정 같은 비상위험이 있어요(E)."},{"id":"64-2-3","r":64,"s":"무역결제","n":3,"q":"다음은 특정 결제방식의 특징을 설명한 것이다. 이에 해당하는 결제방식은 무엇인가?\n\nA. 수출상이 환어음을 발행하는 어음거래로서 어음법의 적용을 받는다.\nB. 수출상은 은행을 통해 금융서류와 상업서류를 송부한다.\nC. 수입상은 은행을 통해 수입대금을 지급한다.\nD. 본 결제방식은 ICC에서 제정한 통일규칙이 존재한다.\nE. 수입자의 신용에 바탕을 둔 거래로서, 수출상이 결제위험을 감수한다.","c":["Letter of Credit","Remittance","Export Factoring","Collection"],"a":4,"t":"추심(URC)","e":"수출상이 환어음과 서류를 은행을 통해 보내고, ICC 통일규칙(URC 522)이 있으며, 은행 지급확약 없이 수입자 신용에 기대는 방식은 추심(Collection)이에요."},{"id":"64-2-4","r":64,"s":"무역결제","n":4,"q":"다음 중 추심결제방식에서의 환어음에 대한 내용으로 잘못된 것은?","c":["제시은행은 환어음의 인수 형식이 명확하게 기재되어 있는지 확인하여야 한다.","환어음의 지급인이 자금을 결제하면, 추심은행은 추심의뢰은행으로 지체 없이 지급하여야 한다.","추심에는 금융서류로서 환어음이 반드시 제시되어야 하는 것은 아니다.","환어음에는 추심은행의 명칭이 반드시 기재되어야 한다."],"a":4,"t":"추심(URC)","e":"추심 환어음에 추심은행 이름을 반드시 적어야 하는 규정은 없어요. 지급인(수입자)과 금액, 만기 같은 사항이 필요합니다."},{"id":"64-2-5","r":64,"s":"무역결제","n":5,"q":"다음 중 URC 522가 적용되는 추심결제방식에서 추심은행이 검토해야 할 사항으로 올바른 것을 모두 고른 것은?\n\nA. 추심지시서에 기재된 서류의 부수대로 제시되었는가?\nB. 계약서에서 요구된 선적서류가 모두 제시되었는가?\nC. 환어음, 상업송장, 추심지시서의 금액이 서로 일치하는가?\nD. 환어음의 인수 방법이 계약서와 동일하게 작성되었는가?","c":["A","A, B, C","A, B, C, D","없음"],"a":1,"t":"추심(URC)","e":"URC 522에서 은행은 받은 서류가 추심지시서에 적힌 서류와 외관상 맞는지, 부수가 맞는지만 확인해요. 계약서와 대조하거나 서류끼리 금액을 비교할 의무는 없습니다."},{"id":"64-2-6","r":64,"s":"무역결제","n":6,"q":"신용장 거래와 관련된 설명 중 올바른 것은?","c":["개설은행은 서류 및 물품에 대한 심사 의무가 있다.","매입은행은 자신이 매입한 서류의 형식, 충분성, 정확성에 대한 책임을 부담한다.","수입자는 물품의 품질을 완전히 보장받지 못한다.","수출자는 신용장 조건과 일치하는 물품의 제시에 의해 대금의 회수를 보장받는다."],"a":3,"t":"신용장 일반","e":"신용장은 서류만으로 거래하니 수입자는 물품 품질을 완전히 보장받지 못해요. 은행은 물품을 심사하지 않고(①), 서류의 형식이나 정확성에 책임지지 않으며(②), 수출자는 '서류' 일치로 대금을 받습니다(④)."},{"id":"64-2-7","r":64,"s":"무역결제","n":7,"q":"다음이 설명하는 신용장거래의 기본원칙은 무엇인가?\n\nA. 개설은행의 지급 의무는 신용장 조건 및 서류심사에 국한된다.\nB. 은행은 서류가 일치하면 지급해야 한다는 원칙의 예외로서 사기적 제시(fraud presentation)에 대하여 법원에 지급 금지명령을 청구할 수 있다.\nC. 물품이 계약과 다르더라도 은행은 이를 심사하거나 거절할 권한이 없고, 매수인이 별도의 클레임을 제기하여 대응해야 한다.\nD. 매수인은 은행에 지급거절을 직접 요구하기 어려울 수 있다.\nE. UCP 600에 직접 명시한 조항은 없지만, 해석상 일반적으로 인정된다.","c":["독립성의 원칙","한계성의 원칙","추상성의 원칙","엄격일치의 원칙"],"a":2,"t":"신용장 일반","e":"은행 의무가 신용장 조건과 서류 심사에 한정되고, 물품 문제는 매수인이 따로 다퉈야 하며, 그 한계로 사기적 제시에는 지급금지명령이라는 예외가 있다는 건 한계성의 원칙이에요."},{"id":"64-2-8","r":64,"s":"무역결제","n":8,"q":"신용장의 종류와 관련된 설명으로 잘못된 것은?","c":["수익자가 선적 전에 ‘beneficiary’s certificate’를 제시하여 대금의 일정 금액을 미리 받을 수 있는 신용장은 ‘installment shipment credit’이다.","‘Red clause credit’은 수출자가 신용장방식으로 원자재 구입에 필요한 대금의 사전제공을 수입자에게 요구하는 경우에 사용될 수 있다.","‘Clean credit’에서는 운송서류의 제시가 요구되지 않는다.","‘Deferred payment credit’은 일람출급신용장이 아닌 기한부신용장이다."],"a":1,"t":"신용장 일반","e":"선적 전에 증명서를 내고 대금 일부를 미리 받는 건 선대신용장(Red clause credit)이에요. Installment shipment credit은 정해진 일정대로 나눠 선적하는 할부선적 신용장입니다."},{"id":"64-2-9","r":64,"s":"무역결제","n":9,"q":"다음 중 신용장 실무와 관련된 설명으로 올바른 것을 모두 고른 것은?\n\nA. 개설은행은 수익자가 부담하기로 한 통지수수료가 지급되지 않았으면, 통지은행에 이를 지급할 의무가 있다.\nB. 개설은행은 개설의뢰인의 동의 없이 신용장 조건과 불일치한 화환어음에 대해지급을 거절할 수 없다.\nC. UCP 600이 적용되는 신용장에 irrevocable이라는 문구가 없다면, 그 신용장은취소 가능 신용장이 된다.","c":["A","B","B, C","A. B. C"],"a":1,"t":"UCP600","e":"수익자가 내기로 한 통지수수료를 받지 못해도 개설은행은 통지은행에 그 수수료를 낼 책임이 남아요(A). 개설은행은 개설의뢰인 동의 없이도 불일치 서류를 거절할 수 있고(B), UCP600 신용장은 irrevocable 문구가 없어도 취소불능입니다(C)."},{"id":"64-2-10","r":64,"s":"무역결제","n":10,"q":"다음 중 신용장 개설 실무에 관한 설명으로 잘못된 것은?","c":["수입신용장 개설은 은행이 제3자에 대한 지급을 확약하는 여신 행위이므로, 은행은 수입자의 여신한도 내 또는 신용장 금액만큼의 담보를 요구한다.","수입상은 필요한 경우에 수출입공고, 통합공고상 수입승인, 요건확인 등을 사전에 받고, 신용장을 개설하기 전에 은행과 외국환거래약정을 체결해야 한다.","수출자가 네고 서류로 보험서류를 제시하기 때문에, 개설은행은 신용장 개설 시 수입자에게 어떠한 경우라도 보험증권이나 보험증명서를 요구하지 않는다.","개설은행은 수입상이 제출한 화환신용장개설신청서를 근거로 작성한 확인용(checking) 신용장에 대하여 수입상의 확인을 받고 신용장을 개설한다."],"a":3,"t":"신용장 일반","e":"FOB처럼 수입자가 보험을 드는 조건이면 개설은행은 신용장 개설 때 수입자에게 보험증권을 요구할 수 있어요. '어떠한 경우라도 요구하지 않는다'는 ③이 틀렸습니다."},{"id":"64-2-11","r":64,"s":"무역결제","n":11,"q":"국내에서 개설되어 베트남에서 통지되는 다음 수입신용장 조건에 대한 설명으로 잘못된 것은?\n\n41D (AVAILABLE WITH...BY) : ANY BANK BY NEGOTIATION\n43P (PARTIAL SHIPMENTS) : ALLOWED\n43T (TRANSSHIPMENT) : NOT ALLOWED\n46A (DOCUMENTS REQUIRED) : + AIRWAY BILLS CONSIGNED TO KITA BANK SEOUL MARKED FREIGHT PREPAID AND NOTIFY APPLICANT\n71B (CHARGES) : ALL BANKING CHARGES OUTSIDE OF KOREA AND REIMBURSEMENT CHARGES ARE FOR ACCOUNT OF BENEFICIARY","c":["신용장 조건상 베트남에 소재하는 모든 은행에서 매입이 가능한 매입신용장이다.","신용장 조건상 분할선적이 허용된다.","신용장 조건상 항공운송 운임은 수입자가 아닌 수출자가 부담한다.","신용장 조건상 환가료와 통지수수료는 수익자가 아닌 개설의뢰인이 부담한다."],"a":4,"t":"신용장 일반","e":"71B에 한국 밖에서 생기는 은행 수수료와 상환수수료는 수익자 부담이라고 적혀 있어요. 베트남 통지은행의 통지수수료와 매입은행 환가료는 수익자가 내므로 ④가 틀렸습니다."},{"id":"64-2-12","r":64,"s":"무역결제","n":12,"q":"다음은 은행이 지급거절 사유로 삼을 수 있는 SWIFT 신용장의 독소조항 예시이다. 실무적인 관점에서 수익자에게 불리하지 않은 조항은 어느 것인가?","c":["Inspection Certificate must be issued by Buyer’s nominated agency only.","B/L must state that goods are in brand new, first class quality.","Draft to be drawn on Issuing Bank, not on applicant.","Invoice must state:“We certify that goods are of 100% prime quality and manufactured in 2025.”"],"a":3,"t":"신용장 일반","e":"환어음 지급인을 개설은행으로 하라는 건 UCP600 제6조와 맞는 정상 조건이에요. 매수인 지정 기관 검사증명서, B/L에 품질 문구, 송장에 주관적 품질 보증 문구 요구는 수익자에게 불리한 독소조항입니다."},{"id":"64-2-13","r":64,"s":"무역결제","n":13,"q":"다음은 신용장통일규칙(UCP 600)에 관한 설명이다. 이 중 잘못된 내용은?","c":["신용장은 이용 가능한 은행을 명시하여야 하며, 그렇지 않으면 어떤 은행에서도 이용할 수 있다. 지정은행에서 이용할 수 있는 신용장은 또한 개설은행에서 이용할수 있다.","신용장은 제시를 위한 유효기일을 명시하여야 한다. 결제 및 매입을 위하여 명시된유효기일은 제시를 위한 유효기일로 간주된다.","은행과 수익자를 포함한 신용장의 모든 당사자는 서류만으로 거래한다.","신용장은 그 본질적으로 그 기초가 되는 매매계약 또는 기타 계약과는 별개의 거래이다."],"a":3,"t":"UCP600","e":"UCP600 제5조는 '은행'이 서류로 거래한다고 정해요. 수익자를 포함한 모든 당사자라고 한 ③이 틀렸습니다."},{"id":"64-2-14","r":64,"s":"무역결제","n":14,"q":"UCP 600을 근거하여 신용장 관련 은행의 의무에 대한 설명으로 옳지 않은 것은?","c":["개설은행(issuing bank)은 신용장을 개설한 후에는 단독으로 취소할 수 없으며, 서류가신용장 조건에 일치하면 대금을 지급할 최종적 의무가 있다.","통지은행(advising bank)은 확인은행을 겸하지 않는 한 신용장의 진정성을 확인하여 통지하지만, 대금 지급에 대한 의무는 없다.","확인은행(confirming bank)은 서류가 일치하면 수익자에게 직접 지급할 의무가 있으며, 수익자는 개설은행 또는 확인은행을 상대로 지급을 요청할 수 있다.","지정된 매입은행(negotiating/nominated bank)은 신용장 조건에 일치하는 서류를 매입할 의무가 있다."],"a":4,"t":"UCP600","e":"지정은행은 확인은행이 아닌 한 매입할 의무가 없어요(UCP600 제12조). 매입을 명시적으로 동의한 경우에만 의무를 집니다."},{"id":"64-2-15","r":64,"s":"무역결제","n":15,"q":"신용장에서 요구한 서류의 언어에 관한 설명 중 잘못된 것은?","c":["영어로 발행한 신용장이 서류의 언어를 명시하지 않은 경우, 포장명세서는 영어 이외의 언어로 작성되어도 무방하다.","신용장에서 2개 이상의 언어를 허용하면 확인은행은 허용된 언어의 수를 제한할 수없으며, 서류 내 모든 언어에 대하여 일치 여부를 심사해야 한다.","신용장에서 영어로 서류의 작성을 요구하여도 은행은 영어 이외의 다른 언어로 삽입된 정보는 검토하지 않는다.","신용장에서 제출 서류의 언어를 지정하는 경우 신용장 또는 UCP 600에서 요구하는정보는 같은 언어로 되어 있어야 한다."],"a":2,"t":"ISBP, eUCP","e":"신용장이 둘 이상의 언어를 허용해도 확인은행은 자기 확인의 조건으로 허용 언어 수를 제한할 수 있어요(ISBP). 그래서 ②가 틀렸습니다."},{"id":"64-2-16","r":64,"s":"무역결제","n":16,"q":"다음 중 신용장에서 요구하는 상업송장에 관한 서류심사 기준으로 올바른 것은?","c":["수익자가 발행한 송장은 서명 없이도 유효하다. 단, 신용장에서 서명을 요구하였으면반드시 서명해야 한다.","송장의 요구가 있으면 반드시 \"Commercial Invoice”라는 제목이어야 하며, 특히 Proforma Invoice(견적송장)는 인정되지 않는다.","상업송장의 물품 명세는 신용장의 명세보다 간략하게 기재하거나 일반화하여 기재해도 된다.","상업송장에서 기재된 단가의 통화는 신용장의 통화와 달라도 된다."],"a":1,"t":"UCP600","e":"수익자가 발행한 상업송장은 서명이 없어도 되지만 신용장이 서명을 요구하면 서명해야 해요. 제목은 Invoice 같은 표현도 되고(②), 물품 명세는 신용장과 일치해야 하며(③), 통화도 같아야 합니다(④)."},{"id":"64-2-17","r":64,"s":"무역결제","n":17,"q":"다음은 신용장에서 요구한 통지처 기재에 대한 지시이다. 다음 중 올바른 설명은?\n\n40A : Form of Documentary Credit: IRREVOCABLE\n50 : Applicant: ERIC EUROPA S.A. CL DE ENMEDIO 20 265440 CALA DEL MORAL (LA) SPAIN\n46A : Documents Required: + OCEAN BILL OF LADING NOTIFY TO APPLICANT","c":["선하증권의 통지처에 개설의뢰인의 이름만 기재해도 된다.","선하증권의 통지처에 반드시 개설의뢰인의 주소를 기재해야 한다.","선하증권의 통지처에는 신용장에서 요구한 통지처 이외의 추가적인 통지처를 기재해서는 안 된다.","선하증권의 통지처에 기재된 개설의뢰인의 주소는 신용장에 있는 개설의뢰인의 주소와 달라도 된다."],"a":1,"t":"ISBP, eUCP","e":"신용장이 통지처를 개설의뢰인으로만 정했다면 B/L 통지처에 개설의뢰인 이름만 적어도 돼요. 주소를 적는다면 신용장에 적힌 주소와 맞아야 하므로 ④는 틀렸습니다."},{"id":"64-2-18","r":64,"s":"무역결제","n":18,"q":"URDG 758이 적용되는 은행보증서에 만기일이나 만료사건에 대한 지시가 없다. 은행보증서는 언제 만료되는가?","c":["은행보증서 발행일로부터 1년 경과 후","은행보증서 발행일로부터 3년 경과 후","은행보증서 발행일로부터 5년 경과 후","은행보증서는 만료되지 않는다."],"a":2,"t":"보증(ISP98, URDG)","e":"URDG 758 제25조에 따라 만기일이나 만료사건이 없는 보증서는 발행일부터 3년이 지나면 만료돼요."},{"id":"64-2-19","r":64,"s":"무역결제","n":19,"q":"보증신용장(Standby L/C) 또는 청구보증서(Demand Guarantee)를 사용하는 유형 중에서계약체결 전 단계에서 활용되는 것은?","c":["선수금환급보증(Advance Payment Guarantee)","유지보수보증(Maintenance Guarantee)","이행보증(Performance Guarantee)","입찰보증(Bid Bond)"],"a":4,"t":"보증(ISP98, URDG)","e":"입찰보증(Bid Bond)은 입찰에 참여할 때, 낙찰 후 계약을 맺지 않는 위험에 대비해 내는 보증이라 계약 체결 전 단계에서 써요."},{"id":"64-2-20","r":64,"s":"무역결제","n":20,"q":"다음 중 대금결제에 관한 설명으로 가장 적절한 것은?","c":["O.A 30 days 조건의 수출계약을 체결한 수출자는 선적 직후 거래은행에 O.A. nego를 신청해서 수출대금을 조기 회수했다.","D/P 조건의 수출계약을 체결한 수출자는 선적 직후 수입자로부터 Aval을 입수하여포페이팅을 통해 수출대금을 조기 회수했다.","연지급신용장을 받은 수출자는 선적 후 usance 환어음을 발행하여 지정은행에 매입을 의뢰함으로써 수출대금을 조기 회수했다.","Shipper’s Usance 신용장 개설을 신청한 수입자는 이자를 먼저 지급하고, 원금을만기에 결제하기로 했다."],"a":1,"t":"송금, 기타 결제","e":"O/A 수출자는 선적 후 O/A NEGO로 채권을 은행에 팔아 대금을 일찍 받을 수 있어요. Aval은 포페이팅용 어음 보증이라 D/P와 맞지 않고(②), 연지급신용장은 환어음을 쓰지 않으며(③), Shipper’s Usance 이자는 만기에 함께 정산돼요(④)."},{"id":"64-2-21","r":64,"s":"무역결제","n":21,"q":"다음은 기한부 신용장 중에서 Banker’s Usance에 대한 설명이다. 잘못된 것은?","c":["기한부 신용장에서 만기까지의 이자를 수입자가 부담하는 방식으로 수출자에게 유리하다.","SWIFT L/C에서 사용되는 문구는 다음과 같다. “Drafts at 30 days after B/L date, drawn on Issuing Bank.”/“Interest for the usance period is for account of Beneficiary.”","수출자는 은행에 어음을 매입/인수를 의뢰하면, 은행은 수출대금을 바로 지급하는 일람불 신용장처럼 사용된다.","기한부 신용장 중에서 Banker’s Usance가 Seller’s Usance보다 많이 사용된다."],"a":2,"t":"신용장 일반","e":"Banker’s Usance는 외상기간 이자를 수입자(개설의뢰인)가 부담해요. 그래서 문구도 'Interest for the usance period is for account of Applicant'가 되어야 하는데, Beneficiary라고 한 ②가 틀렸습니다."},{"id":"64-2-22","r":64,"s":"무역결제","n":22,"q":"다음 각 상황에서 결제리스크를 줄이기 위한 장치로서 연결이 가장 적절한 것은?","c":["COD 조건의 수입거래 ⇨ 선적 전 검사","신용장결제, D/P조건, CAD조건의 수입거래 ⇨ 선급금 환수용 보증서","외환사정이 악화된 국가로의 수출거래 ⇨ 무역보험","계약금액 일부에 대한 선지급을 거절하는 수입자와의 수출거래 ⇨ 회전신용장"],"a":3,"t":"무역금융, 팩토링","e":"수입국 외환사정이 나빠 대금을 못 받는 비상위험은 무역보험으로 대비해요. 선급금 환수 보증은 선지급한 쪽을 위한 장치이고, 회전신용장은 선지급 문제와 관계없습니다."},{"id":"64-2-23","r":64,"s":"무역결제","n":23,"q":"다음 상황에 대한 해설로 가장 부적절한 것은?\n\nA. ㈜삼연상사는 조명기용 파워 서플라이를 국내기업(갑)으로부터 구매하였다.\nB. ㈜삼연상사는 조명기용 파워 서플라이를 중국기업에 원상태로 공급하여현지에서 조명기를 생산했다.\nC. ㈜삼연상사는 독일기업과 조명기 수출계약을 체결하고, 물품은 중국에서 독일로직접 공급하기로 했다.","c":["삼연상사는 조명기용 파워 서플라이 구매대금 결제를 위해 내국신용장을 이용할 수있다.","삼연상사가 임가공용 부품(조명기용 파워 서플라이)을 원상태로 수출한 경우에도 관세환급특례법상 관세환급을 받을 수 있다.","삼연상사가 독일기업으로부터 양도가능신용장을 받았다면, 신용장 자체를 양도할수도 있다.","삼연상사가 국내기업(갑)에게 신용장 대금채권을 양도하기 위해서는 신용장에 반드시 ‘transferable’이라는 표기가 있어야 한다."],"a":4,"t":"UCP600","e":"신용장 대금을 다른 사람에게 넘기는 대금양도(assignment of proceeds)는 신용장이 양도가능하지 않아도 할 수 있어요(UCP600 제39조). 'transferable' 표기가 필요한 건 신용장 자체를 양도할 때입니다."},{"id":"64-2-24","r":64,"s":"무역결제","n":24,"q":"내국신용장(Local L/C)과 구매확인서에 관한 설명으로 올바르지 않은 것은?","c":["내국신용장은 은행이 지급을 확약하므로, 국내 공급업체가 안정적으로 대금을 회수할수 있다.","내국신용장은 수출용 원자재 거래임을 증명하므로, 공급업체는 부가세 영세율(0%)의혜택을 받을 수 있다.","구매확인서는 내국신용장과 마찬가지로 수출용 거래 증빙서류로 인정되지만, 은행의지급확약이 없다는 한계가 있다.","내국신용장은 절차가 간단하고 은행수수료가 거의 없어, 구매확인서보다 더 많이 사용되고 있다."],"a":4,"t":"무역금융, 팩토링","e":"내국신용장은 은행 여신이 필요해 절차가 까다롭고, 실무에서는 은행 지급확약이 없는 대신 발급이 쉬운 구매확인서가 훨씬 많이 쓰여요."},{"id":"64-2-25","r":64,"s":"무역결제","n":25,"q":"다음의 표는 현재의 환율과 A은행 및 B은행이 예측하는 6개월 후의 환율을 나타낸 것이다. 이를 토대로 판단할 때 다음 중 가장 잘못된 설명은? (환율 표시에서 앞의 것이 기준통화)\n\n| 구분 | 현재 환율 | A은행 6개월 후 예측 | B은행 6개월 후 예측 |\n| USD/KRW | 1,400 | 1,500 | 1,300 |\n| USD/YEN | 150 | 150 | 150 |\n| EUR/USD | 1.2 | 1.0 | 2.0 |","c":["A은행은 6개월 후 USD의 가치가 전반적으로 상승할 것으로 예측한다.","A은행은 6개월 후 YEN/KRW 환율이 지금보다 상승할 것으로 예측한다.","B은행은 6개월 후 일본에 대한 우리나라의 수출경쟁력이 상승할 것으로 예측한다.","B은행은 6개월 후 EUR/KRW 환율이 2,600원으로 상승할 것으로 예측한다."],"a":3,"t":"외환, 환율","e":"B은행 예측대로면 YEN/KRW는 1,300 ÷ 150 ≈ 8.67원으로 지금(1,400 ÷ 150 ≈ 9.33원)보다 떨어져요. 원화가 엔화보다 강해지니 일본에 대한 수출경쟁력은 오히려 떨어지므로 ③이 틀렸습니다."},{"id":"64-2-26","r":64,"s":"무역결제","n":26,"q":"(주)한국무역은 미 달러화의 환리스크를 관리하기 위하여 선물환을 검토하고 있다. 거래은행에 문의하니 아래와 같은 선물환율을 제시받았다. 다음 중 가장 잘못된 설명은? (환율 표시에서 앞의 것이 기준통화, 은행의 수수료는 없다.)\n\n| USD/KRW | X은행 Bid | X은행 Offer | Y은행 Bid | Y은행 Offer |\n| 현물환율 | 1380.00 | 1382.00 | 1379.00 | 1385.00 |\n| 스왑포인트 | 200 | 190 | 180 | 170 |\n| 3개월 선물환율 | 1378.00 | 1380.10 | 1377.20 | 1383.30 |","c":["현재 외환시장과 자금시장에서 달러의 금리가 원화의 금리보다 높다.","X은행의 스프레드가 Y은행의 스프레드에 비하여 적다.","3개월 후 수령할 달러 수출대금의 선물환거래는 X은행과 거래하는 것이 환율에서 유리하다.","3개월 후 지급할 달러 수입대금의 선물환거래는 Y은행과 거래하는 것이 환율에서 유리하다."],"a":4,"t":"외환, 환율","e":"수입대금 달러를 살 때는 Offer 환율이 낮을수록 유리해요. X은행 1,380.10이 Y은행 1,383.30보다 낮으니 X은행이 유리하고, ④가 틀렸습니다. 스왑포인트가 Bid > Offer라 디스카운트, 즉 달러 금리가 더 높다는 뜻이에요."},{"id":"64-2-27","r":64,"s":"무역결제","n":27,"q":"영국의 런던은행과 미국의 뉴욕은행이 USD/KRW 역외선물환(NDF) 시장에서 다음과같은 거래를 하였다. 다음 중 가장 잘못된 설명은?\n\n(환율 표시에서 앞의 것이 기준통화)\n\n∙ 6개월 전 런던은행은 NDF 시장에서 뉴욕은행으로부터 1백만 달러를 1,260원에 매입하였다.\n∙ 6개월 후 결제일에 정산환율은 1,400원으로 결정되었다.","c":["계약환율에 비하여 정산환율이 상승하였으므로 달러를 매입한 런던은행은 이익을 얻는다.","뉴욕은행은 달러 환율이 하락할 것으로 예측하였으나 오히려 환율이 상승하여 손해를보게 되었다.","결제일에 뉴욕은행은 정산환율 1,400원보다 낮은 계약환율 1,260원으로 1백만 달러를런던은행에게 송금하여야 한다.","NDF 시장에서는 투기 목적의 거래가 대부분을 차지한다."],"a":3,"t":"외환, 환율","e":"NDF는 원금을 주고받지 않고 계약환율과 정산환율의 차액만 달러로 정산해요. 뉴욕은행은 (1,400 − 1,260) × 100만 ÷ 1,400 = 10만 달러만 런던은행에 보내면 되므로 ③이 틀렸습니다."},{"id":"64-2-28","r":64,"s":"무역결제","n":28,"q":"향후 달러/원 환율이 상승할 때 이익이 발생하는 포지션의 형태는?","c":["포워드 포지션","스퀘어 포지션","숏 포지션","롱 포지션"],"a":4,"t":"외환, 환율","e":"롱 포지션은 외화 자산이 부채보다 많은 상태라 달러/원 환율이 오르면 원화 환산 가치가 늘어 이익이 나요."},{"id":"64-2-29","r":64,"s":"무역결제","n":29,"q":"수출입거래가 있는 기업이 통화별 및 만기별로 수입과 수출을 일치시켜 환리스크를 줄이려는 내부적 관리기법은 무엇인가?","c":["리딩","래깅","매칭","네팅"],"a":3,"t":"외환, 환율","e":"같은 통화, 같은 만기의 수입과 수출을 맞춰 환위험을 상쇄하는 건 매칭(Matching)이에요. 네팅은 채권 채무를 서로 상계하는 것, 리딩과 래깅은 결제 시기를 앞당기거나 늦추는 거예요."},{"id":"64-2-30","r":64,"s":"무역결제","n":30,"q":"다음 중 외환스왑에 대한 설명으로 옳지 않은 것은?","c":["외환스왑은 자금거래의 일종이다.","외환스왑에서 두 통화 간 이자율 차이를 주기적으로 정산한다.","매우 짧은 만기의 외환스왑의 환리스크는 거의 없다.","외환스왑은 가까운 만기(Near Date)의 매매와 동시에, 이에 대응하여 반대 방향으로동액의 먼 만기(Far Date)의 매매를 하는 것을 말한다."],"a":2,"t":"외환, 환율","e":"외환스왑은 가까운 날짜와 먼 날짜에 반대 방향 거래를 동시에 하는 것이고, 금리 차이는 스왑포인트에 이미 반영돼요. 이자를 주기적으로 주고받는 건 통화스왑이라서 ②가 틀렸습니다."},{"id":"64-3-1","r":64,"s":"무역계약","n":1,"q":"다음 중 국제물품매매계약의 법적 성격으로 올바른 것을 모두 고른 것은?\n\nA. 매도인과 매수인은 거래 합의 이외에도 반드시 계약 목적물과 대금을 교환하여야 계약의 효력이 발생한다.\nB. 일방의 청약에 대해서 상대방은 승낙 의사의 통지 방식으로만 계약이 성립된다.\nC. 매도인은 Offer Sheet 또는 Proforma Invoice라는 서류로 청약하고, 매수인은 매도인의 서면 청약에 대해서 서면으로 승낙하여야 한다.\nD. 매도인의 계약물품 제공에 대해서 매수인은 반드시 외국환은행을 통해서 국제적으로 널리 사용되는 외화(USD, EUR, JPY 등)로만 결제하여야 한다.","c":["A, C","C","B, D","없음"],"a":4,"t":"청약과 승낙","e":"무역계약은 합의만으로 성립하는 낙성계약이라 목적물 교환이 필요 없고(A), 행위로도 승낙할 수 있으며(B), 형식이 자유로운 불요식계약이고(C), 결제통화도 당사자가 정해요(D). 네 개 모두 틀렸습니다."},{"id":"64-3-2","r":64,"s":"무역계약","n":2,"q":"무역계약의 정의 및 대상 등과 관련된 설명으로 잘못된 것은?","c":["무역계약은 매도인이 대금을 받고 매수인에게 물품의 소유권을 이전하기로 약정하는매매계약이다.","무역계약은 거래대상을 물품에 한정해야 하므로 기술, 용역 및 플랜트의 국제거래 등은 넓은 의미로도 무역계약이 아니다.","무역계약은 매도인인 수출자와 매수인인 수입자 사이에 체결되는 국제계약이다.","무역계약의 국제성이란 당사자의 영업소가 서로 다른 국가에 소재한다는 것을 의미한\n다."],"a":2,"t":"무역계약 일반","e":"좁은 의미의 무역계약은 물품매매계약이지만, 넓은 의미로는 기술, 용역, 플랜트 같은 국제거래도 포함해요. '넓은 의미로도 아니다'라고 한 ②가 틀렸습니다."},{"id":"64-3-3","r":64,"s":"무역계약","n":3,"q":"무역계약 관련 법규범에 대한 설명으로 잘못된 것을 모두 고른 것은?\n\nA. 우리나라는 ‘Vienna Convention 1980’의 체약국이므로 계약 상대방의 국가가 체약국인 경우에는 동 협약이 직접 적용된다.\nB. 정형거래조건에는 국제상업회의소에서 제정한 ‘Incoterms 규칙’과 미국의 ‘개정미국외국무역정의(RAFTD)’가 있다. 계약 당사자의 국적 또는 영업소재지가 미국인 경우에는 ‘RAFTD’를, 이외의 국가 간에는 ‘Incoterms 규칙’을 사용하여야 한다.\nC. ‘Vienna Convention 1980’은 협약의 적용 요건과 범위, 계약의 성립, 매도인과 매수인의 의무, 위험과 비용의 이전, 대금결제방식에 따른 소유권 이전 시기 등의 내용으로 구성되어 있다.\nD. ‘New York Convention 1958’은 UN 회원국 중 하나의 국가에서 내려진 중재판정에 대해서 다른 국가에서도 강제집행을 보장하는 국제협약이다.\nE. ‘Incoterms 규칙’은 당사자들의 합의로 적용할 수 있기 때문에 ‘Incoterms 2000’도 사용이 가능하다.","c":["B, C, D","A, B, D","A, B, E","B, D, E"],"a":1,"t":"무역계약 일반","e":"미국 기업이라고 RAFTD를 꼭 써야 하는 건 아니고(B), CISG는 소유권 이전을 다루지 않으며(C), 뉴욕협약은 UN 회원국이 아니라 협약 체약국 사이에서 집행을 보장해요(D). A와 E는 맞습니다."},{"id":"64-3-4","r":64,"s":"무역계약","n":4,"q":"무역계약의 법적 성질에 대한 설명으로 잘못된 것은?","c":["무역계약은 계약 당사자의 합의만으로 성립하고, 실제 이행은 뒤에 이루어지는 이행미필 상태에서 계약이 성립된다.","무역계약이 성립되면 양 당사자는 물품 인도와 대금 지급의 대가적 채무를 부담한다.","민법상 전형계약의 하나인 증여에 의한 국제간 물품의 이동도 일반적인 무역계약이다.","계약체결에 아무런 방식도 요구되지 않는다. 따라서 일부는 구두로, 일부는 당사자의묵시적 행위로도 계약이 체결된다."],"a":3,"t":"무역계약 일반","e":"무역계약은 대가를 주고받는 유상계약이에요. 대가 없이 주는 증여는 일반적인 무역계약으로 보지 않아서 ③이 틀렸습니다."},{"id":"64-3-5","r":64,"s":"무역계약","n":5,"q":"인코텀즈 2020의 11가지 거래조건에 관한 설명으로 잘못된 것은?","c":["DDP 조건에서 매도인은 목적지에서 물품의 양하와 수입통관을 포함한 의무를 부담한\n다.","CIF 조건에서 매도인은 목적항까지 선적을 위하여 인도된 물품을 조달하여 인도할 수도 있다.","CIP 조건에서 정기선운송의 경우 목적지에서의 양하비가 운임에 포함되어 매도인이부담한다.","무역실무에서 인코텀즈 2020의 11가지 조건 외에 당사자의 합의에 따라 별도의 조건을 사용할 수 있다."],"a":1,"t":"인코텀즈","e":"DDP에서 매도인은 수입통관과 관세까지 부담하지만 목적지 양하 의무는 없어요. 양하까지 하는 조건은 DPU뿐이라 ①이 틀렸습니다."},{"id":"64-3-6","r":64,"s":"무역계약","n":6,"q":"인코텀즈 2020 조건들의 수출 및 수입통관에 대한 설명으로 잘못된 것은?","c":["EXW 조건에서 매수인은 수출국, 통과국 및 수입국에 의해서 부과되는 통관절차를 수행하고 그 비용을 부담하여야 한다.","FCA 조건에서 매도인은 수출국 및 통과국에 의해서 부과되는 통관절차를 수행하고 그비용을 부담하여야 한다.","CIP 조건에서 매수인은 통과국 및 수입국에 의해서 부과되는 통관절차를 수행하고 그비용을 부담하여야 한다.","DDP 조건에서 매도인은 수출국, 통과국 및 수입국에 의해서 부과되는 통관절차를 수행하고 그 비용을 부담하여야 한다."],"a":2,"t":"인코텀즈","e":"FCA에서 매도인은 수출통관만 하고, 통과국과 수입국 통관은 매수인 몫이에요. 통과국 통관까지 매도인이 한다는 ②가 틀렸습니다. 통과국 통관까지 매도인이 하는 건 D 조건이에요."},{"id":"64-3-7","r":64,"s":"무역계약","n":7,"q":"인코텀즈 2020과 CISG의 규정 내용에 관한 설명으로 올바른 것은?","c":["인코텀즈 2020과 CISG는 물품의 인도에 관하여 규정하고 있다.","두 규범 모두 운송계약 및 보험계약에 관하여 규정하고 있다.","두 규범 모두 계약의 성립에 관하여 규정하고 있다.","두 규범 모두 계약위반에 대한 구제에 관하여 규정하고 있다."],"a":1,"t":"인코텀즈","e":"물품 인도는 인코텀즈와 CISG가 모두 다뤄요. 운송, 보험계약은 인코텀즈만, 계약 성립과 위반 구제는 CISG만 다룹니다."},{"id":"64-3-8","r":64,"s":"무역계약","n":8,"q":"CISG를 기준으로 무역계약의 일방 당사자가 계약이행기 전에 계약을 해제할 수 있는경우는?","c":["일방 당사자가 계약위반을 한 경우","일방 당사자가 본질적인 계약위반을 한 경우","일방 당사자가 본질적인 계약위반을 할 것이 예견되는 경우","일방 당사자가 본질적인 계약위반을 할 것이 명백한 경우"],"a":4,"t":"CISG","e":"CISG 제72조: 이행기 전이라도 상대방이 본질적 계약위반을 할 것이 '명백한' 경우 계약을 해제할 수 있어요. 단순히 예견되는 정도라면 제71조의 이행정지만 가능합니다."},{"id":"64-3-9","r":64,"s":"무역계약","n":9,"q":"일방 당사자의 불이행에 대한 권리구제로서 CISG와 UNIDROIT에서 공통적으로 규정하고 있는 권리구제 수단이 아닌 것은?","c":["이행청구권","계약해제권","손해배상청구권","추가기간지정권"],"a":0,"t":"CISG","e":"출제 오류로 모든 선택지를 정답으로 처리한 문항이에요(2025.11.18 공지). 이행청구, 계약해제, 손해배상은 CISG와 UNIDROIT 원칙에 모두 있는 기본 구제수단이에요. 정답 키는 추가기간지정권을 공통 구제수단이 아닌 것으로 봅니다."},{"id":"64-3-10","r":64,"s":"무역계약","n":10,"q":"UNIDROIT 국제상사계약원칙에 따른 계약의 성립에 관한 설명으로 올바른 것은?","c":["계약은 청약에 대한 승낙에 의해서만 성립되며, 어떠한 형태의 당사자 행위로도 체결될 수 없다.","청약은 제안내용이 충분히 확정적이기만 하면 상대방의 승낙에 구속된다는 의사가 없어도 청약이 된다.","청약은 피청약자에 도달한 때에 효력이 발생하고, 계약이 체결되기까지는 절대로 철회될 수 없다.","청약에 대한 피청약자의 침묵 또는 부작위는 그 자체만으로는 승낙이 되지 아니한다."],"a":4,"t":"CISG","e":"UNIDROIT 원칙 제2.1.6조: 침묵이나 부작위 자체는 승낙이 아니에요. 계약은 당사자 행위로도 성립하고(①), 청약에는 구속 의사가 필요하며(②), 청약은 계약 체결 전까지 취소할 수 있는 경우가 있어요(③)."},{"id":"64-3-11","r":64,"s":"무역계약","n":11,"q":"Vienna Convention(1980)의 청약에 관한 설명으로 올바른 것을 모두 고른 것은?\n\nA. 다수의 특정인에 대한 확정적인 계약 체결의 제안은 청약이 아니다.\nB. 제안이 충분히 확정적이고, 승낙 시 그에 구속된다는 청약자의 의사표시가 되어 있는 경우에는 청약이 된다.\nC. 명시적 또는 묵시적으로 수량과 대금을 지정하거나 그 결정을 위한 조항을 두고 있는 경우에는 충분히 확정적인 것으로 본다.\nD. 불특정 다수인에 대한 제안은 제안자가 청약의 유인이 아님을 밝히는 반대의사를 표시하더라도 청약의 유인으로 본다.","c":["A, B","A, D","B, C","C, D"],"a":3,"t":"CISG","e":"CISG 제14조: 한 명 이상의 특정인에 대한 확정적 제안은 청약이고(A 틀림), 불특정 다수에 대한 제안은 반대 의사가 명백하지 않으면 청약의 유인이에요(D 틀림). B와 C가 맞습니다."},{"id":"64-3-12","r":64,"s":"무역계약","n":12,"q":"Vienna Convention(1980)의 청약과 승낙에 관한 설명으로 잘못된 것은?","c":["청약에 대한 상대방의 침묵 또는 부작위는 승낙이 되지 않는다.","구두의 청약은 특별 사정이 없는 한 즉시 승낙되어야 한다.","청약은 철회될 수 없는 것이라면 거절의 의사표시가 청약자에게 도달하더라도 효력이 상실되지 않는다.","상대방이 청약자에 대한 통지 없이 물품의 발송이나 대금을 지급함으로써 동의를표시하는 경우 승낙은 그 행위가 이루어진 때에 효력이 발생한다."],"a":3,"t":"CISG","e":"CISG 제17조: 취소불능 청약이라도 거절 통지가 청약자에게 도달하면 효력을 잃어요. ③이 틀렸습니다."},{"id":"64-3-13","r":64,"s":"무역계약","n":13,"q":"다음은 무역계약 체결과정을 순서대로 나열한 것이다. 괄호 안에 들어갈 무역실무에서 일반적으로 사용되는 용어로 적합한 것은?\n\n| 순서 | 단계 | 내용 |\n| 1 | 해외시장조사 | 시장, 이익, 판매 가능성 등 조사 |\n| 2 | ( A ) | 주로 Buyer가 Seller에게 거래 희망 품목 등 관심 내용 문의 |\n| 3 | 신용조사 | Bank, Trade partner, 해외지사 등을 활용하여 조사 |\n| 4 | 거래제의서 | 거래제의 Letter + Catalog, Price list, Sample 등 제공 |\n| 5 | ( B ) | 상대방의 청약 또는 주문을 유도 |\n| 6 | 청약과 주문 | 상대방이 승낙 또는 주문 수락으로 계약성립 |\n| 7 | 계약서 작성 | 개별계약서, 포괄계약서 |","c":["A: Circular letter / B: Firm Offer","A: Buyer/Seller List / B: Free Order","A: Inquiry / B: Invitation to Offer","A: Business Proposal / B: Firm Order"],"a":3,"t":"청약과 승낙","e":"매수인이 관심 품목을 묻는 단계는 거래조회(Inquiry), 상대방의 청약이나 주문을 끌어내는 단계는 청약의 유인(Invitation to Offer)이에요."},{"id":"64-3-14","r":64,"s":"무역계약","n":14,"q":"다음 ( )안에 들어갈 특수거래 형태로 올바르게 짝지어진 것은?\n\n- ( A )은 물품 등을 무환으로 수출하여 해당 물품이 판매된 범위 안에서 대금을 결제하는 계약에 의한 수출이다.\n- ( B )은 계약에 의하여 물품 등을 수출하여 일정기간 후 다시 수입하거나 그 기간의 만료 전 또는 만료 후 해당 물품 등의 소유권을 이전하는 수출이다.\n- ( C )은 수출자가 자신의 책임하에 수입국 내 관리인을 지정하고 물품을 무환으로 반출하여 수입국 현지 창고에 반입 후 판매하는 수출이다.","c":["A : BWT수출 / B : 임대수출 / C : 위탁판매수출","A : BWT수출 / B : 위탁판매수출 / C : 임대수출","A : 위탁판매수출 / B : BWT수출 / C : 임대수출","A : 위탁판매수출 / B : 임대수출 / C : BWT수출"],"a":4,"t":"특수거래 형태","e":"팔린 만큼 대금을 받는 건 위탁판매수출, 일정 기간 뒤 다시 들여오거나 소유권을 넘기는 건 임대수출, 수입국 보세창고에 넣어두고 현지에서 파는 건 BWT수출이에요."},{"id":"64-3-15","r":64,"s":"무역계약","n":15,"q":"다음의 조항의 내용과 가장 관련이 깊은 품질 결정방법은?\n\nThe Specification of the Goods shall be prescribed and specified in specification attached hereto","c":["명세서 매매","규격 매매","상표 매매","표준품 매매"],"a":1,"t":"거래조건(품질, 수량, 선적)","e":"첨부한 명세서(specification)로 물품을 정한다는 조항이니 명세서 매매예요."},{"id":"64-3-16","r":64,"s":"무역계약","n":16,"q":"무역계약에서 가격조건(Terms of Price)에 관한 설명으로 잘못된 것은?","c":["가격은 통화, 단가, 수량 단위, 정형거래조건, 비용 분기점, Incoterms version 순으로표시된다. 예를 들어「Price: USD 125.20/set FCA Seoul Coex, Incoterms 2020」식이다.","가격을 산출하는 일반적인 공식은 「Price＝원가＋이윤＋요소비용」이다.","가격 계산식의 요소비용 중에서 일반적이라면 물류비가 가장 많이 차지한다.","표시통화를 Seller 국가 통화로 결정했다면 Seller가 환리스크를 부담하는 것이다."],"a":4,"t":"거래조건(품질, 수량, 선적)","e":"가격을 매도인 국가 통화로 정하면 매도인은 자국 통화로 받으니 환위험이 없고, 매수인이 환위험을 져요. ④가 틀렸습니다."},{"id":"64-3-17","r":64,"s":"무역계약","n":17,"q":"무역계약의 보험조건(Terms of Insurance)에 관한 설명으로 잘못된 것은?","c":["보험조건에 포함될 내용은 보험계약 체결자, 보험료 부담자, 피보험자, 담보조건, 부보비율, 담보위험 및 기간, 손해배상범위 등이다.","보험계약자와 피보험자가 다른 경우는 CIF와 CIP 조건인데, CIF는 최저 담보조건, CIP는 최대 담보조건으로 매도인이 매수인을 위해서 대신해서 보험에 가입한다.","Incoterms에 따라 보험금액은 당사자가 별도로 정한 바가 없으면 보험가액의 전액을담보하는 100%의 비율로 보험에 가입해야 한다.","ICC(A/R) 조건이더라도 전쟁과 파업 등을 대비하기 위해서는 ICC(WAR), ICC(SRCC) 등부가 조건에 가입해야 한다."],"a":3,"t":"해상보험","e":"인코텀즈 2020의 CIF와 CIP에서 별도 합의가 없으면 보험금액은 계약금액의 최소 110%예요. 100%라고 한 ③이 틀렸습니다."},{"id":"64-3-18","r":64,"s":"무역계약","n":18,"q":"무역계약을 정식으로 체결하는 방식으로서 개별계약방식과 포괄계약방식에 대한 설명으로 올바른 것은?","c":["포괄계약방식은 당사자 사이에서 기본계약을 먼저 체결하고, 뒤따르는 개별 거래는 청약서나 주문서로 처리하는 방식이다.","포괄계약방식은 주로 단기적이고 일회성 거래에 사용되는 계약 형태이다.","개별계약방식은 일반거래약정서(Agreement on General Terms and Conditions of Business) 형태로 체결된다.","개별계약방식은 거래 효율성이 높고 장기거래에 적합한 방식이다."],"a":1,"t":"청약과 승낙","e":"포괄계약방식은 일반거래조건 협정서 같은 기본계약을 먼저 맺고, 이후 개별 거래는 청약서나 주문서로 처리하는 방식이에요. 장기, 반복 거래에 맞고, 개별계약은 일회성 거래에 씁니다."},{"id":"64-3-19","r":64,"s":"무역계약","n":19,"q":"무역거래에서 발생하는 각종 무역클레임에 대한 설명 중에서 잘못된 것은?","c":["품질클레임을 제기하려면 객관적 증거자료로서 시험성적서나 검사증명서를 제시하는것이 좋다.","마켓클레임은 주로 상업적 손실을 이유로 제기되며, 매도인의 의무 불이행과는 직접관련이 없으므로 예방을 위해서 수출보험을 활용해야 한다.","서류클레임은 선적서류의 기재 불일치, 서명 누락, 원본 서류 통수 부족, 발행일자 오류 등이 주요 원인이다.","수량클레임은 처음부터 적재 수량의 과부족이 있거나, 운송 중 멸실이나 손상이 원인이 된다."],"a":2,"t":"클레임, 중재","e":"마켓클레임은 시세가 떨어졌을 때 매수인이 사소한 흠을 잡아 제기하는 클레임이에요. 수출보험으로 막는 게 아니라 계약서 조건을 명확히 하고 증거를 갖춰 예방해야 해서 ②가 틀렸습니다."},{"id":"64-3-20","r":64,"s":"무역계약","n":20,"q":"다음 중 제3자의 개입으로 분쟁을 해결하는 방법과 그 설명이 잘못된 것은?","c":["클레임 포기는 피해자가 상대방에게 청구권을 행사하지 않는 것으로, 대체로 상대방이사전 또는 즉각적인 손해배상을 제의하고 해결된 경우 이루어진다.","화해는 당사자 간 자주적인 교섭과 제3자의 의견을 수렴하여 합의점을 발견함으로써분쟁을 원만하게 해결하는 방법이다.","조정은 쌍방의 조정 합의에 따라 별도의 조정인을 선임하고, 클레임 제기자가 제시하는조정안에 상대방이 동의함으로써 클레임을 해결하는 방법이다.","알선은 공정한 제3자가 당사자의 일방 또는 쌍방의 의뢰로 분쟁 사건에 개입하여 조언하며 형식적인 절차를 요구하지 않는다."],"a":3,"t":"클레임, 중재","e":"조정은 당사자가 선임한 조정인이 제시한 조정안에 양쪽이 동의해서 해결하는 방법이에요. 클레임 제기자가 조정안을 낸다고 한 ③이 틀렸습니다."},{"id":"64-3-21","r":64,"s":"무역계약","n":21,"q":"다음 중 무역계약에 관한 내용 중 틀린 것은?","c":["개별계약방법은 통상 거래상대방과 최초 거래나 건별 거래에 활용하는 방법이다.","일반약정에는 개별약정사항을 해석하는 기준이나 계약불이행과 관련한 조항 등 수출입거래 시 일반적으로 적용되는 공통사항이 포함된다.","‘Offer subject to confirmation’은 청약자에 대한 구속력이 없다고 하더라도 상대방이 승낙하면 계약은 성립된다.","Proforma Invoice도 당사자가 이를 확정적 청약으로 표시한 경우, 상대방의 승낙으로 계약이 성립될 수 있다."],"a":3,"t":"청약과 승낙","e":"Offer subject to confirmation(최종확인조건부청약)은 상대방이 승낙해도 청약자가 최종 확인해야 계약이 성립해요. 승낙만으로 성립한다는 ③이 틀렸습니다."},{"id":"64-3-22","r":64,"s":"무역계약","n":22,"q":"다음 중 무역계약과 관련된 내용 중 올바른 것은?","c":["무역계약의 이행을 위해서는 제3자가 개입되기 때문에 운송계약, 지급계약, 보험계약 등과 같은 종속계약이 수반되어야 한다.","무역계약 시 컨테이너를 통한 해상운송을 사용한다면, Incoterms 2020의 해상운송방식인 FOB, CFR, CIP 중 하나를 사용하는 것이 가장 합리적이다.","계약조건으로 FCA Busan CY, Incoterms 2020과 결제조건으로 L/C를 사용하기로 했다면, 개설은행은 수익자에게 상업송장, 선하증권, 보험증권을 요구할 수 있다.","경험이 많지 않은 수입업자의 경우 자신의 업무량과 리스크를 줄이기 위해서 EXW조건을 사용하는 것이 합리적이다."],"a":1,"t":"인코텀즈","e":"무역계약을 이행하려면 운송, 보험, 결제 같은 종속계약이 따라와요. CIP는 해상 전용 조건이 아니고(②), FCA에서 매도인은 보험 의무가 없어 보험증권을 요구하기 어렵고(③), EXW는 매수인 부담이 가장 큰 조건입니다(④)."},{"id":"64-3-23","r":64,"s":"무역계약","n":23,"q":"다음 중 운송서류의 부지약관(unknown clause)에 관한 설명으로 올바른 것은?","c":["송하인이 적입하여 운송인에게 인도하는 FCL 화물에서 컨테이너에 적입된 화물의수량이나 상태에 대해 운송인이 책임을 면하기 위해 명시하는 조항이다.","선하증권상 선적화물의 이상 유무를 기재한 조항이다.","수취 선하증권이 발행된 경우 화물의 본선 적재 후 선적일을 명기한 것이다.","운송인이 특정한 상황에서 화물을 갑판 상에 적재하여 운송할 수 있도록 허용하는조항이다."],"a":1,"t":"해상운송","e":"부지약관(Said to contain, Shipper’s load and count)은 송하인이 직접 적입한 FCL 컨테이너 안의 수량, 상태를 운송인이 확인할 수 없어 책임을 지지 않는다는 문구예요."},{"id":"64-3-24","r":64,"s":"무역계약","n":24,"q":"국제해상운송에서 사용되는 정기선(liner service)과 부정기선(tramp service)의 특성에 대한 설명으로 올바른 것은?","c":["정기선 운항은 일정한 항로와 운항 일정에 따라 규칙적으로 운항하며, 주로 벌크화물의 대량 수송에 적합하다.","부정기선 운항은 선적 일정과 항로가 고정되어 있어 화주의 화물을 안정적으로 운송할 수 있다.","정기선 운항은 운임이 공표되어 비교적 안정적이고, 부정기선 운항은 화물의 종류·수량·항로에 따라 운임을 개별적으로 협상한다.","부정기선 운항은 주로 컨테이너 화물에 적합하며, 정기선 운항은 석탄, 곡물, 철광석과같은 대량의 살물(bulk cargo)에 적합하다."],"a":3,"t":"해상운송","e":"정기선은 정해진 항로와 일정으로 다니며 공표운임을 써서 운임이 안정적이고, 부정기선은 벌크 화물을 화물, 항로별로 운임을 협상해요. ①, ②, ④는 정기선과 부정기선을 바꿔 썼습니다."},{"id":"64-3-25","r":64,"s":"무역계약","n":25,"q":"선하증권의 종류를 설명한 내용 중 잘못된 것은?","c":["On board B/L은 화주로부터 수령한 화물을 선적한 후에 발행하는 선적선하증권이다.","Foul B/L은 화물의 손상이나 불량 포장 사실이 기재된 선하증권으로, 신용장 거래에서 clean B/L 조건을 충족하지 못하여 은행이 매입을 거절하는 사고 선하증권이다.","Master B/L 혹은 Marine B/L은 선사가 발행하는 선하증권을 말하며, 선사 외에 다른운송인이 발행하는 서류는 선사 B/L에 해당되지 않는다.","Ocean B/L은 해상운송, 복합운송, 육상운송 상관없이 선사와 포워더가 함께 발행하는광범위한 형태의 선하증권을 의미한다."],"a":4,"t":"해상운송","e":"Ocean B/L은 해상운송에 쓰는 선하증권이에요. 육상, 복합운송까지 포괄하는 넓은 서류라고 한 ④가 틀렸습니다."},{"id":"64-3-26","r":64,"s":"무역계약","n":26,"q":"다음 중 항공운송 물류비에 관한 내용으로 올바른 것은?","c":["항공화물 운임은 각국의 개별 항공사가 결정하여 화주는 그에 따른다.","항공화물 운임은 Chargeable Weight 계산에 따라 「1 CBM ＝ 1 TON」공식으로 높은쪽으로 적용되며, Min, -45kg, +45kg, 100kg, 300kg, 500kg, 1000kg 등으로 구분된다.","단위탑재용기 운임은 항공사가 송하인 또는 대리점에 컨테이너 또는 팔레트 단위로판매 시 적용되는 운임을 말한다.","품목분류 요율은 일반화물 요율이나 특정품목 할인요율보다 우선하여 적용한다."],"a":3,"t":"항공, 복합운송","e":"단위탑재용기(ULD) 운임은 컨테이너나 팔레트 단위로 파는 운임이에요. 항공운임은 IATA 요율 기준이고(①), 용적중량은 6,000cm³ = 1kg(1CBM = 약 167kg) 기준이며(②), 특정품목 할인요율이 품목분류요율보다 우선합니다(④)."},{"id":"64-3-27","r":64,"s":"무역계약","n":27,"q":"해상보험의 개요 관련 내용 중 잘못된 것은?","c":["“해상보험계약이란 보험자가 피보험자에 대하여 그 계약에 의하여 합의한 방법과 범위 내에서 해상손해 즉, 해상사업에 수반되는 손해를 보상할 것을 인수하는 계약이다”라고 영국해상보험법에 정의하고 있다.","우리나라의 적하보험은 협회보험약관의 수송약관 규정에 따라 기간보험과 항해보험을혼합한 혼합보험으로 이용된다.","Insured Amount는 보험금을 말하는 것으로, 보험사고로 피보험자가 입은 재산상의 손해에 대해 보험자가 지급하는 보상금을 말한다.","피보험자의 고지의무 중에 위험을 감소시키는 사항은 고지가 필요 없는 사항이다."],"a":3,"t":"해상보험","e":"Insured Amount는 보험금액, 즉 보험에 가입한 금액이에요. 사고 때 실제로 지급되는 보험금(Claim amount)과 다른 개념이라 ③이 틀렸습니다."},{"id":"64-3-28","r":64,"s":"무역계약","n":28,"q":"피보험자 등의 의무와 관련한 내용 중 올바른 것은?","c":["보험계약자는 보험계약 체결의 교섭 중이나 보험계약의 성립 전까지 고지의무를 해야한다.","고지의무는 보험인수 여부에 관한 내용만을 대상으로 한다.","보험자의 책임은 당사자 간에 따른 다른 약정이 없으면 보험증권을 발급한 시점부터개시한다.","피보험자는 손해방지와 경감을 위하여 노력해야 한다. 다만 이에 따른 발생 비용은 보험금액 한도 내에서만 정산된다."],"a":1,"t":"해상보험","e":"고지의무는 보험계약 교섭 중부터 계약 성립 전까지 이행해요. 고지 대상은 보험료 결정에 영향을 주는 사항도 포함하고(②), 책임 개시는 운송약관에 따르며(③), 손해방지비용은 보험금액을 넘어도 보상돼요(④)."},{"id":"64-3-29","r":64,"s":"무역계약","n":29,"q":"다음 보기와 같은 조건에서 해상보험계약에 관한 설명으로 올바른 것은?\n\n∙ FOB조건의 계약으로 매수인이 매도인의 선적통지를 받고 해상보험계약을 체결하였\n다.\n∙ 매도인이 매수인에게 물품을 인도하기 전 즉, 선적 전에 손해가 발생한 것으로 확인되었다.\n∙ 매수인이 체결한 해상보험계약은 구증권 ICC(A)(1982) 조건으로 소급약관이 포함되어있다.","c":["선적 전에 발생한 손해에 대해서는 매수인은 피보험이익을 가지지 않기 때문에 보험자에게 손해 보상을 청구할 수 없다.","소급약관은 2009년 신증권 협회적하약관(ICC)에서 피보험이익 약관으로 대체되었다.","매수인이 체결한 해상보험계약상 위험은 선적한 때로부터 개시한다.","매수인은 보험계약 체결 시 손해 발생 사실을 알았더라도 소급약관에 의해 보험자로부터 손해를 보상받을 수 있다."],"a":2,"t":"해상보험","e":"1982년 약관의 소급약관(Lost or not lost)은 ICC 2009에서 피보험이익 약관(Insurable Interest Clause)에 흡수됐어요."},{"id":"64-3-30","r":64,"s":"무역계약","n":30,"q":"해상보험에서 위험의 변동(change of risk)에 관한 설명으로 잘못된 것은?","c":["이로(Deviation)는 위험률이 변경되는 위험사정의 변동으로, 적법한 사유 없이 이로가 발생한 때로부터 보험자의 보상책임이 해제된다.","항해의 변경은 보험계약 체결 시의 위험사정이 소멸하고 새로운 위험사정으로 대체되는 위험의 변종으로, 항해변경 의사가 명백하였을 때로부터 보험자의 보상책임이해제된다.","이로가 이루어지고 손해가 발생하기 전에 보험계약에 정해진 항로로 복귀하면 보험의 효력이 계속된다.","신증권 항해변경약관에 따라 항해를 변경한 경우, 피보험자가 그 사실을 보험자에게 지체 없이 통지하고, 추후 협정되는 보험료와 보험조건에 따라 계속담보가 가능하다."],"a":3,"t":"해상보험","e":"정당한 이유 없는 이로(Deviation)가 생기면 그때부터 보험자 책임이 해제되고, 손해 전에 원래 항로로 돌아와도 되살아나지 않아요(MIA 제46조). 그래서 ③이 틀렸습니다."},{"id":"64-4-1","r":64,"s":"무역영어","n":1,"q":"주어진 서신에 대한 설명으로 옳지 않은 것은?","c":["A usance bill will be drawn on the issuing bank for payment under the L/C.","This proposal is a firm offer which will bind the offeror.","An order of McDonald’s Co. dated on October 3, 2025 may be regarded as a constitution of contract to Hankook Company.","The seller has no obligation to obtain insurance cover for the buyer."],"a":3,"t":"서신 내용 파악","e":"청약 유효기간이 2025년 9월 말이라 10월 3일자 주문은 기간이 지난 뒤라 계약 성립으로 보기 어려워요. 그래서 ③이 옳지 않습니다. 60일 기한부 환어음은 개설은행 앞으로 발행하고, CFR이라 매도인 보험 의무는 없어요.","p":{"range":"1~2","text":"                                 HANKOOK COMPANY\n               Room 925, Seoul B/D, Samsung-Dong, Gangnam-gu, Seoul, Korea\n                           Phone: 82-2-123-4567, Fax: 82-2-123-4568\n                                       Offer Sheet\nMessrs: McDonald’s Co.\n We are pleased to offer the under-mentioned article(s) as per the conditions and\ndetails described as follows:\n Commodity           : OLED TV(Model no. XYZ-10056)\n Quantity            : 1,000set\n Unit Price          : USD 5,000 CFR           (A)\n Shipment            : Within 30 days after receipt of Letter of Credit\n Shipping Port       : Any Korean port\n Destination         : LA port, USA\n Packing             : Export standard packing\n                     : By an Irrevocable L/C in favor of          (B)        and draft\n Payment\n                      at 60 days after sight\n Validity            : End of September, 2025.\n Looking forward to your valued order for the above offer.\n Yours faithfully,"}},{"id":"64-4-2","r":64,"s":"무역영어","n":2,"q":"서신의 빈칸에 들어갈 단어의 연결이 올바른 것은?\n\n(A)                                     (B)","c":["Incheon Port, Korea / HANKOOK COMPANY","LA Port, USA / HANKOOK COMPANY","Incheon Port, Korea / McDonald’s CO.","LA Port, USA / McDonald’s CO."],"a":2,"t":"빈칸, 표현 바꾸기","e":"CFR 뒤에는 목적항인 LA Port, USA가 오고, 신용장 수익자(in favor of)는 매도인 HANKOOK COMPANY예요.","p":{"range":"1~2","text":"                                 HANKOOK COMPANY\n               Room 925, Seoul B/D, Samsung-Dong, Gangnam-gu, Seoul, Korea\n                           Phone: 82-2-123-4567, Fax: 82-2-123-4568\n                                       Offer Sheet\nMessrs: McDonald’s Co.\n We are pleased to offer the under-mentioned article(s) as per the conditions and\ndetails described as follows:\n Commodity           : OLED TV(Model no. XYZ-10056)\n Quantity            : 1,000set\n Unit Price          : USD 5,000 CFR           (A)\n Shipment            : Within 30 days after receipt of Letter of Credit\n Shipping Port       : Any Korean port\n Destination         : LA port, USA\n Packing             : Export standard packing\n                     : By an Irrevocable L/C in favor of          (B)        and draft\n Payment\n                      at 60 days after sight\n Validity            : End of September, 2025.\n Looking forward to your valued order for the above offer.\n Yours faithfully,"}},{"id":"64-4-3","r":64,"s":"무역영어","n":3,"q":"다음 중 확정청약(firm offer)에 대한 답신에 들어갈 내용 중 그 성격이 다른 것은?","c":["After considering the terms and conditions you suggested, we are glad to accept your offer except payment terms.","We will instruct our bank to issue an L/C in favor of you.","We would like to request a 10% discount.","As we still have some stock left, we would like to place an order for 60 boxes rather than 100."],"a":2,"t":"빈칸, 표현 바꾸기","e":"신용장 개설을 지시하겠다는 ②는 조건 없이 받아들이는 승낙이에요. 나머지는 결제조건 제외, 할인 요청, 수량 변경처럼 조건을 바꾸는 반대청약입니다."},{"id":"64-4-4","r":64,"s":"무역영어","n":4,"q":"다음 중 밑줄 친 (A)에 들어갈 내용으로 그 성격이 다른 하나는?","c":["We are pleased to offer you subject to your reply being received here by May 30, 2025.","We are pleased to offer you subject to market fluctuation.","We are pleased to offer you subject to change without further notice.","We are pleased to offer you subject to our final confirmation."],"a":1,"t":"빈칸, 표현 바꾸기","e":"회신 기한을 정한 ①은 확정청약(Firm offer)이에요. 시황 변동 조건부, 예고 없는 변경 조건부, 최종확인 조건부인 ②, ③, ④는 청약자를 구속하지 않는 조건부청약입니다.","p":{"range":"4~6","text":"Dear Sirs:\n                            (A)                             .\nDescription of Goods: Blueberry Powder\nQuantity : 10,000kg\n(B) Unit Price: USD 24.00/KG\nPrice term: DPU New York, USA\nShipment: Within 15 days after the receipt of L/C or (C) T/T\nPayment condition: T/T in advance or L/C at sight\nPacking: Export Standard Packing\nWe look forward to your favorable reply by e-mail.\nYours very truly,"}},{"id":"64-4-5","r":64,"s":"무역영어","n":5,"q":"주어진 계약서의 밑줄 친 부분 (B) Unit Price에 포함되는 비용을 모두 고르면?\n\nⓐ custom clearance for export\nⓑ custom clearance for import\nⓒ international transport\nⓓ unloading at New York\nⓔ inland transport up to the loading place\nⓕ inland transport from New York to the final destination","c":["ⓐ, ⓒ, ⓓ, ⓔ","ⓑ, ⓓ, ⓕ","ⓑ, ⓒ, ⓓ","ⓒ, ⓓ, ⓔ, ⓕ"],"a":1,"t":"인코텀즈, CISG 영문","e":"DPU 뉴욕 가격에는 수출통관, 선적지까지 내륙운송, 국제운송, 뉴욕 양하 비용이 들어가요. 수입통관과 뉴욕 이후 내륙운송은 매수인 부담입니다.","p":{"range":"4~6","text":"Dear Sirs:\n                            (A)                             .\nDescription of Goods: Blueberry Powder\nQuantity : 10,000kg\n(B) Unit Price: USD 24.00/KG\nPrice term: DPU New York, USA\nShipment: Within 15 days after the receipt of L/C or (C) T/T\nPayment condition: T/T in advance or L/C at sight\nPacking: Export Standard Packing\nWe look forward to your favorable reply by e-mail.\nYours very truly,"}},{"id":"64-4-6","r":64,"s":"무역영어","n":6,"q":"주어진 서신의 밑줄 친 부분 (C) T/T에 대한 설명으로 올바른 것은?","c":["The bill of exchange should be drawn on the seller.","The seller should present shipping documents to the remitting bank for payment.","This payment is used when there is a high level of trust between the seller and the buyer.","The collecting bank will refuse to pay if there is any discrepancy in the documents."],"a":3,"t":"서신 내용 파악","e":"T/T는 은행이 서류를 심사하지 않고 돈만 보내는 방식이라 당사자 사이 신뢰가 높을 때 써요. 환어음, 서류 제시, 추심은행 거절은 신용장이나 추심 이야기입니다.","p":{"range":"4~6","text":"Dear Sirs:\n                            (A)                             .\nDescription of Goods: Blueberry Powder\nQuantity : 10,000kg\n(B) Unit Price: USD 24.00/KG\nPrice term: DPU New York, USA\nShipment: Within 15 days after the receipt of L/C or (C) T/T\nPayment condition: T/T in advance or L/C at sight\nPacking: Export Standard Packing\nWe look forward to your favorable reply by e-mail.\nYours very truly,"}},{"id":"64-4-7","r":64,"s":"무역영어","n":7,"q":"다음 중 국제물품매매계약에 관한 UN 협약(1980)(CISG)의 규정에 따를 때, 유효한 승낙에 관한 설명으로 적절하지 못한 것은?","c":["The acceptance becomes effective at the time it is sent to the offeror.","The acceptance must be an unconditional assent to the offer.","The acceptance must not be withdrawn before it reaches the offeror.","The acceptance must be made with the intent to conclude a contract in response to the offer."],"a":1,"t":"인코텀즈, CISG 영문","e":"CISG 제18조 2항: 승낙은 청약자에게 도달한 때 효력이 생겨요(도달주의). 발송한 때라고 한 ①이 틀렸습니다."},{"id":"64-4-8","r":64,"s":"무역영어","n":8,"q":"다음 밑줄 친 정형거래조건을 대체하여 사용될 수 있는 조건에 대한 설명으로 옳지 않은 것은?\n\n∙ Price: USD 65.00/BOX CIP Auckland (Trade terms are subject to Incoterms 2020)","c":["As under DAP terms, the seller must conclude a contract of carriage to Auckland.","As under CPT terms, the risk will be transferred from the seller to the buyer at Auckland.","As under CIF terms, the seller should make a contract for insurance to Auckland.","As under CPT terms, the seller fulfills delivery obligation by handing over the goods to the first carrier."],"a":2,"t":"인코텀즈, CISG 영문","e":"CPT에서 위험은 첫 운송인에게 넘길 때 매수인에게 이전돼요. 목적지 Auckland에서 이전된다고 한 ②가 틀렸습니다."},{"id":"64-4-9","r":64,"s":"무역영어","n":9,"q":"아래 사례에서 최종 합의된 Incoterms 2020 조건으로 적절한 것은?\n\nSeller 'A' in Korea and Buyer 'B' in Canada enter into a sales contract for 2,000 smartphones. The trade terms stipulated that the seller should bear all risks, costs, up to Incheon Airport Terminal, and including air freight charges to the destination terminal. The buyer additionally requested that the seller cover the premium cargo insurance. Ultimately, ‘A’ accepted this condition and concluded the export contract.","c":["FCA","CIP","CPT","DAP"],"a":2,"t":"인코텀즈, CISG 영문","e":"인천공항 터미널에서 운송인에게 넘길 때까지 위험을 지고, 목적지까지 항공운임과 보험료까지 내기로 했으니 CIP예요."},{"id":"64-4-10","r":64,"s":"무역영어","n":10,"q":"다음은 무역계약서의 일부이다. 계약서의 내용으로 옳지 않은 것은?\n\nArticle 7. Should any specific inspector be designated by the buyer, all additional charges incurred thereby shall be borne by the buyer and shall be added to the invoiced amount.\n\nArticle 8. All amounts payable by the buyer to the seller, including the purchase price, shall be settled on open account, with payment to be made within 30 days from the date of the invoice.\n\nArticle 9. If the seller fails to deliver any or all of the products within the time period specified in the Agreement, the buyer shall deduct from the Contract Price, a sum equivalent to [one(1)%] of the price of the delayed products for each week of delay to a maximum deduction of [five(5)%] of the price of the delayed products.\n\nArticle 10. The buyer shall place an order for not less than the amount of USD 10,000 for each four month period in accordance with the terms and conditions provided.","c":["If the buyer nominates a specific inspector, the cost for the inspection should be paid by the buyer.","Payment should be made within 30 days after the order is placed.","The buyer shall receive a 4% reduction in the contract price if the delivery of the goods are delayed by four weeks.","The buyer is required to order a minimum of USD 10,000 every four months."],"a":2,"t":"계약, 클레임 영문","e":"제8조는 송장일(date of the invoice)부터 30일 안에 지급한다고 했어요. 주문일 기준이라고 한 ②가 틀렸습니다. 지연 4주면 주당 1%씩 4% 감액이라 ③은 맞아요."},{"id":"64-4-11","r":64,"s":"무역영어","n":11,"q":"다음 중 무역계약서상의 조항과 그 내용이 잘못 연결된 것은?","c":["Non-waiver clause : No failure or delay by either party in exercising any right, power, or remedy under this Agreement shall operate as a waiver thereof, nor shall any single or partial exercise of any such right, power, or remedy preclude any other or further exercise thereof or the exercise of any other right, power, or remedy.","Assignment clause : Neither party may assign or transfer any of its rights or obligations under this Agreement without the prior written consent of the other party, and any assignment made without such consent shall be null and void.","Infringement : This agreement shall supersede any and all prior agreements, understandings, arrangements, promises, representations, warranties, and/or any contract of any form or nature whatsoever, whether oral or in writing and whether explicit or implicit, their officers, directors, or employees, as to the subject matter hereof.","Non-competition clause : During the Terms of Agreement, the Franchisee shall not engage, directly or indirectly, either independently or as an employee, on its behalf or in the name for any other person in a similar business in a Territory where it would compete with a member of the franchised network, including the Franchisor."],"a":3,"t":"계약, 클레임 영문","e":"③의 내용은 이 계약이 이전의 모든 합의를 대체한다는 완전합의조항(Entire Agreement Clause)이에요. Infringement(권리침해) 조항과 잘못 연결됐습니다."},{"id":"64-4-12","r":64,"s":"무역영어","n":12,"q":"주어진 서신의 내용상 밑줄 친 부분(A～D)의 당사자가 잘못 연결된 것은?","c":["(A) - applicant","(B) - seller","(C) - negotiating bank","(D) - advising bank"],"a":3,"t":"신용장, UCP 영문","e":"(C) '우리 은행 KB Bank'는 매수인이 신용장을 개설한 개설은행(issuing bank)이에요. 매입은행이 아닙니다.","p":{"range":"12~13","text":"Dear Sirs,\n   (A) We are pleased to let you know that we have instructed our Gangnam\nBranch in Seoul to open an irrevocable Letter of Credit for USD 300,000 in (B)\nyour favor. This credit will remain valid until August 31 at (C) our bank, KB Bank.\nA notification will be sent through (D) Citibank via registered mail in the coming\ndays.\n   To ensure smooth processing of the payment, please attach the following\ndocuments to your sight draft when presented through your bank:          (E)      ,\nand certificates along with the list of weight and/or measurement.\n   Since you quoted us a CIF Busan price, the credit amount will cover your\ninvoice, freight, and insurance costs.\n   We trust that you will fulfill our order(No.2406) for six hundred units of\nDB400S7B i3-7 computer model, maintaining the excellent service we have come\nto expect.\nYours truly,"}},{"id":"64-4-13","r":64,"s":"무역영어","n":13,"q":"다음 중 밑줄 친 부분(E)에 포함될 서류로 부적절한 것은?","c":["Letter of Guarantee","Insurance Policy","Commercial Invoice","Ocean Bill of Lading"],"a":1,"t":"신용장, UCP 영문","e":"CIF 조건 신용장에서 환어음에 첨부할 서류는 상업송장, 선하증권, 보험증권 등이에요. Letter of Guarantee는 수입화물선취보증서라 수출자 제시 서류가 아닙니다.","p":{"range":"12~13","text":"Dear Sirs,\n   (A) We are pleased to let you know that we have instructed our Gangnam\nBranch in Seoul to open an irrevocable Letter of Credit for USD 300,000 in (B)\nyour favor. This credit will remain valid until August 31 at (C) our bank, KB Bank.\nA notification will be sent through (D) Citibank via registered mail in the coming\ndays.\n   To ensure smooth processing of the payment, please attach the following\ndocuments to your sight draft when presented through your bank:          (E)      ,\nand certificates along with the list of weight and/or measurement.\n   Since you quoted us a CIF Busan price, the credit amount will cover your\ninvoice, freight, and insurance costs.\n   We trust that you will fulfill our order(No.2406) for six hundred units of\nDB400S7B i3-7 computer model, maintaining the excellent service we have come\nto expect.\nYours truly,"}},{"id":"64-4-14","r":64,"s":"무역영어","n":14,"q":"주어진 신용장의 종류로 올바르게 연결된 것은?","c":["Restricted Negotiation L/C – Sight L/C","General L/C – Usance L/C","Restricted Negotiation L/C - Usance L/C","General L/C – Sight L/C"],"a":1,"t":"신용장, UCP 영문","e":"WOORI BANK, SINGAPORE에서만 매입하도록 정했으니 매입제한신용장(Restricted), 환어음이 AT SIGHT이니 일람출급신용장이에요.","p":{"range":"14~16","text":"Date and place of expiry          : 2025/05/07 SINGAPORE\n                                  : KOREA TOYS CO., LTD.\nApplicant                           159-1 SAMSUNGDONG GANGNAMGU,\n                                    SEOUL, KOREA\n                                  : CHINA TOYS CO., LTD.\nBeneficiary\n                                    PHASE 1, 60 WING TAIRO, SINGAPORE\nAvailable with by name, address   : WOORI BANK, SINGAPORE BY NEGOTIATION\nDrafts at                         : AT SIGHT\n                                  : WOORI BANK, SAMSUNG BRANCH,\nDrawee\n                                    SEOUL, KOREA\nLatest date of shipment           : 2025/04/28\nDescription of goods and/or services\n - 700PAIRS OF GIANT BEAR TOY F.O.B. SINGAPORE\nDocuments required\n - SIGNED COMMERCIAL INVOICE IN QUINTUPLICATE\n - FULL SET OF CLEAN ON BOARD OCEAN BILL OF LANDING MADE OUT TO THE\n   ORDER OF WOORI BANK MARKED FREIGHT COLLECT AND NOTIFY APPLICANT\n - CERTIFICATE OF ORIGIN\nAdditional conditions\nALL DOCUMENTS SHOULD BE PRESENTED WITHIN 5 DAYS AFTER SHIPMENT\nBUT BEFORE THE EXPIRY DATE OF L/C"}},{"id":"64-4-15","r":64,"s":"무역영어","n":15,"q":"주어진 신용장의 내용을 올바르게 설명하고 있는 것은?","c":["The seller may present the shipping documents to any bank for payment.","If the seller presents the B/L of April 28, 2025 to the bank on May 6, 2025, he/she will be paid.","The seller should draw a draft on the buyer.","The seller should present three original copies of order B/L."],"a":4,"t":"신용장, UCP 영문","e":"FULL SET 지시식 B/L은 보통 원본 3통이 한 세트예요. 매입은 지정된 은행에서만 되고(①), 선적 후 5일 안에 제시해야 해서 4월 28일 B/L을 5월 6일에 내면 늦으며(②), 환어음 지급인은 은행입니다(③).","p":{"range":"14~16","text":"Date and place of expiry          : 2025/05/07 SINGAPORE\n                                  : KOREA TOYS CO., LTD.\nApplicant                           159-1 SAMSUNGDONG GANGNAMGU,\n                                    SEOUL, KOREA\n                                  : CHINA TOYS CO., LTD.\nBeneficiary\n                                    PHASE 1, 60 WING TAIRO, SINGAPORE\nAvailable with by name, address   : WOORI BANK, SINGAPORE BY NEGOTIATION\nDrafts at                         : AT SIGHT\n                                  : WOORI BANK, SAMSUNG BRANCH,\nDrawee\n                                    SEOUL, KOREA\nLatest date of shipment           : 2025/04/28\nDescription of goods and/or services\n - 700PAIRS OF GIANT BEAR TOY F.O.B. SINGAPORE\nDocuments required\n - SIGNED COMMERCIAL INVOICE IN QUINTUPLICATE\n - FULL SET OF CLEAN ON BOARD OCEAN BILL OF LANDING MADE OUT TO THE\n   ORDER OF WOORI BANK MARKED FREIGHT COLLECT AND NOTIFY APPLICANT\n - CERTIFICATE OF ORIGIN\nAdditional conditions\nALL DOCUMENTS SHOULD BE PRESENTED WITHIN 5 DAYS AFTER SHIPMENT\nBUT BEFORE THE EXPIRY DATE OF L/C"}},{"id":"64-4-16","r":64,"s":"무역영어","n":16,"q":"다음은 주어진 신용장의 내용에 따라 발행된 환어음의 일부이다. 밑줄 친 부분(A～D) 이 잘못 기재된 것은?\n\nBILL OF EXCHANGE\n\nVALUE RECEIVED AND CHARGE THE SAME TO ACCOUNT OF (A)KOREA TOYS DRAWN UNDER (B)WOORI BANK, SINGAPORE\n L/C NO. LC-7201865-100     DATED 2025.03.20\nTO (C)WOORI BANK, SAMSUNG BRANCH, KOREA\n\n(D)CHINA TOYS Co., Ltd.\nH.S. Park, President","c":["(A) KOREA TOYS","(B) WOORI BANK, SINGAPORE","(C) WOORI BANK, SAMSUNG BRANCH, KOREA","(D) CHINA TOYS Co., Ltd."],"a":2,"t":"신용장, UCP 영문","e":"DRAWN UNDER 뒤에는 신용장을 개설한 은행이 와야 해요. WOORI BANK, SINGAPORE는 매입은행이고 개설은행은 서울의 WOORI BANK, SAMSUNG BRANCH라서 (B)가 잘못 기재됐습니다.","p":{"range":"14~16","text":"Date and place of expiry          : 2025/05/07 SINGAPORE\n                                  : KOREA TOYS CO., LTD.\nApplicant                           159-1 SAMSUNGDONG GANGNAMGU,\n                                    SEOUL, KOREA\n                                  : CHINA TOYS CO., LTD.\nBeneficiary\n                                    PHASE 1, 60 WING TAIRO, SINGAPORE\nAvailable with by name, address   : WOORI BANK, SINGAPORE BY NEGOTIATION\nDrafts at                         : AT SIGHT\n                                  : WOORI BANK, SAMSUNG BRANCH,\nDrawee\n                                    SEOUL, KOREA\nLatest date of shipment           : 2025/04/28\nDescription of goods and/or services\n - 700PAIRS OF GIANT BEAR TOY F.O.B. SINGAPORE\nDocuments required\n - SIGNED COMMERCIAL INVOICE IN QUINTUPLICATE\n - FULL SET OF CLEAN ON BOARD OCEAN BILL OF LANDING MADE OUT TO THE\n   ORDER OF WOORI BANK MARKED FREIGHT COLLECT AND NOTIFY APPLICANT\n - CERTIFICATE OF ORIGIN\nAdditional conditions\nALL DOCUMENTS SHOULD BE PRESENTED WITHIN 5 DAYS AFTER SHIPMENT\nBUT BEFORE THE EXPIRY DATE OF L/C"}},{"id":"64-4-17","r":64,"s":"무역영어","n":17,"q":"이 서류에 대한 설명으로 옳지 않은 것은?","c":["This document acknowledges that the cargo was shipped on board on April 20, 2025.","The buyer is not required to present the original copy of this document to the carrier to receive the goods.","The ownership of the goods may be transferred by merely handing over this document to the buyer.","This document indicates that the freight has been already paid and may serve as evidence of the contract of carriage."],"a":3,"t":"운송 영문","e":"Sea Waybill은 유통되지 않는 서류(NON-NEGOTIABLE)라 넘겨준다고 소유권이 이전되지 않아요. 수하인은 원본 없이 신분만 확인되면 물품을 받습니다.","p":{"range":"17~18","text":"                        NON-NEGOTIABLE SEA WAYBILL\n                         KITA ELECTRONICS CO., LTD.\n      SHIPPER             1-1 Samsung-dong, Gangnam-gu, Seoul, Korea\n                          Tel. 82-0-6000-1111\n                          BAOBA INTERNATIONAL CO.\n    CONSIGNEE             11 Crestridge Rd, Gardena, GA 30024\n                          Tel. 657-541-1111\n  NOTIFY PARTY            THE SAME AS CONSIGNEE\n ONE FORTY FOOT\nCONTAINER IN TOTAL                   (A) SHIPPER’S LOAD AND COUNT\n      (1 X 40′)                  40 BOXES OF COMPUTER LCD MONITORS\n  Freight & Charges              LOADED ON BOARD DATE: APR 20, 2025\n FREIGHT PREPAID\nRECEIVED BY THE CARRIER FROM THE SHIPPER IN APPARENT GOOD\nORDER AND CONDITION UNLESS OTHERWISE INDICATED HEREIN."}},{"id":"64-4-18","r":64,"s":"무역영어","n":18,"q":"주어진 서류의 밑줄 친 부분(A)의 의미를 올바르게 설명한 것은?","c":["This means that any reference on the face of B/L to numbers, description, quantity and any other particulars of the goods is as furnished by the shipper and the carrier shall not be responsible for any accuracy thereof.","This means that once freight is fixed by the carrier in advance, there will be no additional cost.","This means that the goods have been loaded on the deck of the vessel rather than in the hold.","This clause means that any delay or failure by either party in the performance of contract shall be excused if and to the extent caused by occurrences beyond such parties’control."],"a":1,"t":"운송 영문","e":"SHIPPER’S LOAD AND COUNT는 송하인이 직접 싣고 세었으니 수량과 내용은 송하인이 알린 대로이고 운송인은 정확성에 책임지지 않는다는 부지약관이에요.","p":{"range":"17~18","text":"                        NON-NEGOTIABLE SEA WAYBILL\n                         KITA ELECTRONICS CO., LTD.\n      SHIPPER             1-1 Samsung-dong, Gangnam-gu, Seoul, Korea\n                          Tel. 82-0-6000-1111\n                          BAOBA INTERNATIONAL CO.\n    CONSIGNEE             11 Crestridge Rd, Gardena, GA 30024\n                          Tel. 657-541-1111\n  NOTIFY PARTY            THE SAME AS CONSIGNEE\n ONE FORTY FOOT\nCONTAINER IN TOTAL                   (A) SHIPPER’S LOAD AND COUNT\n      (1 X 40′)                  40 BOXES OF COMPUTER LCD MONITORS\n  Freight & Charges              LOADED ON BOARD DATE: APR 20, 2025\n FREIGHT PREPAID\nRECEIVED BY THE CARRIER FROM THE SHIPPER IN APPARENT GOOD\nORDER AND CONDITION UNLESS OTHERWISE INDICATED HEREIN."}},{"id":"64-4-19","r":64,"s":"무역영어","n":19,"q":"다음은 해상적하보험증권의 일부이다. 증권 내용의 설명으로 옳지 않은 것은?\n\nAssured(s) HIGHCOURT TRADING Certificate No. Ref. No.\n  002A9965SD                                  Invoice No. DS-17220\nL/C No. IOMP207\n Claim, if any, payable at:                  Amount Insured\n  MAPLE MARINE SERVICE                        USD 137,500.00-\n  845 Seventh Avenue New York 10018           (USD 125,000.00×110%)\n\nSurvey should be approved by:               Conditions\n THE SAME AS ABOVE                           INSTITUTE CARGO CLAUSE (A) 1982","c":["If the loss to the subject-matter insured exceeds its value and it is treated as a total loss with abandonment, the insurer shall receive USD 137,500.00-.","This insurance contract is concluded with the maximum coverage of the Institute Cargo Clause.","If this insurance policy is issued on the basis of a contract concluded under CPT terms, the HIGHCOURT TRADING is the policy holder.","If a partial loss occurs, the HIGHCOURT TRADING will be indemnified based on the principle of indemnity."],"a":1,"t":"보험 영문","e":"전손으로 위부하면 보험자는 보험금 USD 137,500을 '지급'하는 쪽이에요. 보험자가 받는다고 한 ①이 틀렸습니다. ICC(A)는 가장 넓은 담보조건이에요."},{"id":"64-4-20","r":64,"s":"무역영어","n":20,"q":"다음 중 밑줄 친 부분(A～D)을 논리 전개에 따라 가장 자연스럽게 연결한 것은?","c":["(C) - (A) - (B) - (D)","(C) - (B) - (A) - (D)","(B) - (A) - (D) - (C)","(A) - (B) - (C) - (D)"],"a":1,"t":"서신 흐름, 문장 배열","e":"품질은 만족하지만 가격이 비싸다(C), 아시아산이 10~15% 싸다(A), 더 나은 조건이면 첫 주문 가능(B), 반대청약을 받아 달라(D) 순서예요.","p":{"range":"20~21","text":"Dear Mrs. Karl,\n We have received your offer of July 20 and the product samples we requested.\n (A) We would like to emphasize that cosmetics of similar quality are being\n     imported from Asian countries at prices 10% to 15% lower than yours. As a\n     result, the prices you have quoted would make it extremely challenging for us\n     to remain competitive in the market.\n (B) If you are open to considering a more favorable offer, we may be able to\n     place an initial order.\n (C) While we are satisfied with the quality of your products, we find that your\n     prices are not competitive enough for the market we currently serve.\n (D) We hope that you will accept our counter offer in order to establish a\n     long-term business relationship and we look forward to receiving your reply as\n     soon as possible.\nSincerely yours,"}},{"id":"64-4-21","r":64,"s":"무역영어","n":21,"q":"주어진 서신의 목적을 가장 잘 나타낸 것은?","c":["To decline the prospect of a long-term partnership and restrict dealings to a short-term transaction","To express concerns regarding the quality of the products and terminate the supply arrangement","To request a price adjustment by referencing more competitive market alternatives","To affirm acceptance of the initial quotation and proceed with a preliminary order"],"a":3,"t":"서신 내용 파악","e":"더 싼 경쟁 상품을 근거로 가격 조정을 요청하는 서신이에요.","p":{"range":"20~21","text":"Dear Mrs. Karl,\n We have received your offer of July 20 and the product samples we requested.\n (A) We would like to emphasize that cosmetics of similar quality are being\n     imported from Asian countries at prices 10% to 15% lower than yours. As a\n     result, the prices you have quoted would make it extremely challenging for us\n     to remain competitive in the market.\n (B) If you are open to considering a more favorable offer, we may be able to\n     place an initial order.\n (C) While we are satisfied with the quality of your products, we find that your\n     prices are not competitive enough for the market we currently serve.\n (D) We hope that you will accept our counter offer in order to establish a\n     long-term business relationship and we look forward to receiving your reply as\n     soon as possible.\nSincerely yours,"}},{"id":"64-4-22","r":64,"s":"무역영어","n":22,"q":"주어진 서신의 목적으로 가장 적절한 것은?","c":["To complain about a previous business transaction","To build relationships and export products to foreign markets","To place an immediate order for orange juice","To open a business account and explore a potential business partnership"],"a":4,"t":"서신 내용 파악","e":"추천을 받아 처음 연락하면서 장기 거래 가능성을 타진하는 거래 제의 서신이에요.","p":{"range":"22~23","text":"Dear Mr. Truman:\n The Deryke Trading Co., Ltd. in Iowa has recommended you to us regarding a\npotential orange juice supply. We are aware of your excellent reputation as a food\nexporter. We believe there is a large and growing demand for high-quality\nAmerican food products in the Korean market.\n As one of Korea's largest food trading companies, we have extensive experience\nin import and distribution. We operate a broad network across the country and\ncurrently import a wide range of products from the U.S. and Europe.\n We are interested in discussing a long-term partnership with your company. If\nyou would like to explore this opportunity, please reply to us at your convenience.\nSincerely,"}},{"id":"64-4-23","r":64,"s":"무역영어","n":23,"q":"다음 중 주어진 서신에 대한 답신내용으로 적절하지 않은 것은?","c":["We are confident that our high-quality orange juice would be a great fit for the Korean market.","Could you please provide us with a quote for the specified volume, including different pricing options based on the certifications?","Please provide details on your desired volume, delivery schedule, and any specific product requirements or certifications.","We are always interested in expanding our export market and we appreciate your interest in our company."],"a":2,"t":"서신 내용 파악","e":"답신은 오렌지주스를 파는 수출자가 쓰는 거예요. '정해진 물량에 대한 견적을 보내 달라'는 ②는 사는 쪽이 할 말이라 답신으로 맞지 않습니다.","p":{"range":"22~23","text":"Dear Mr. Truman:\n The Deryke Trading Co., Ltd. in Iowa has recommended you to us regarding a\npotential orange juice supply. We are aware of your excellent reputation as a food\nexporter. We believe there is a large and growing demand for high-quality\nAmerican food products in the Korean market.\n As one of Korea's largest food trading companies, we have extensive experience\nin import and distribution. We operate a broad network across the country and\ncurrently import a wide range of products from the U.S. and Europe.\n We are interested in discussing a long-term partnership with your company. If\nyou would like to explore this opportunity, please reply to us at your convenience.\nSincerely,"}},{"id":"64-4-24","r":64,"s":"무역영어","n":24,"q":"주어진 서신에 대한 설명으로 옳지 않은 것은?","c":["The sender is a buyer seeking to purchase goods from the seller.","The seller is responsible for paying for the cost of insurance and freight to Los Angeles.","The letter provides a sufficiently definite quote for Electronic Juice-mixers under the CISG.","The samples were sent to the buyer for assessment of the product's quality."],"a":1,"t":"서신 내용 파악","e":"견본을 보내고 확정청약을 내는 쪽이니 발신인은 매도인이에요. 매수인이라고 한 ①이 틀렸습니다.","p":{"range":"24~25","text":"Dear Mr. Rood:\nWe hope the samples of our electronic juice-mixer have reached you safely and\nthat they met your expectations. We are writing to formally confirm our firm offer,\nwhich is subject to your acceptance.\nOur quote is as follows:\n  * Article: Electronic Juice-mixer Model A37\n  * Quantity: 200 Units\n  * Price: USD 570.00 per unit, CIF Los Angeles\n  * Shipment: During October\n  * Terms of Payment: A 60-day sight draft under an Irrevocable Letter of Credit\nThe market is currently very active, and our inventory levels are low due to a\nsignificant number of orders from Southeast Asian countries.\n                            (A)                                     .\nSincerely,"}},{"id":"64-4-25","r":64,"s":"무역영어","n":25,"q":"주어진 서신
