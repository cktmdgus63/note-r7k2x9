"(D)-(B)-(A)-(C)"],"a":1,"t":"서신 흐름, 문장 배열","e":"일부가 심하게 파손됐다(B), 구체적으로 7상자 중 1상자 50대가 깨졌다(D), 계약상 무상 교체나 환불 대상이다(C), 교체품을 보내 주면 파손품은 돌려보내겠다(A) 순서예요."},{"id":"66-4-26","r":66,"s":"무역영어","n":26,"q":"다음 서신에서 밑줄 친 (A) ~ (D) 중 문맥상 가장 어색한 것은?\n\nDear Julia,\n\nWe thank you for the irrevocable letter of credit No. 2130 of August 1 covering the contract of steel plates.\n(A) However, we have found that the L/C requires a document which was not stipulated in our original contract — namely, \"Inspection certificate approved and signed by buyer's agent required.\" (B) Under this clause, payment can be made only when your agent approves and signs the inspection certificate, which means our payment is entirely subject to the buyer's discretion. We are unable to accept such a condition. (C) We regret to inform you that the L/C has not yet been received from the issuing bank, and we are still waiting for its arrival to begin the shipping process. (D) Therefore, we kindly ask you to amend the L/C by cable and delete the said clause. The shipment can be arranged only after this amendment is made. Your prompt attention to this matter will ensure satisfactory delivery.\n\nYours faithfully,","c":["(A)","(B)","(C)","(D)"],"a":3,"t":"서신 흐름, 문장 배열","e":"서신 첫머리에서 이미 신용장을 받았다고 감사했는데, (C)는 신용장을 아직 못 받았다는 내용이라 앞뒤가 맞지 않아요."},{"id":"66-4-27","r":66,"s":"무역영어","n":27,"q":"다음 서신에서 추론할 수 있는 내용으로 올바른 것은?\n\nThank you for your e-mail dated on March 24 and we are pleased to inform you that we accept your request to extend the delivery date. Please send us your Sales Contract so that we can sign them before we instruct our bankers to issue a letter of credit. As we contracted with our local distributors according to your previous delivery schedule, we had a hard time persuading them to accept your revised delivery date. Further delay in delivery, therefore, will cause a serious problem as they will refuse to accept the products. We want this initial order to be the first step to a long and pleasant business relationship between us, and we hope you will arrange for shipment as soon as possible.","c":["The importer has already conducted several similar transactions in the past.","The delivery date can be extended further if necessary.","The importer intends to sign the sales contract before opening a letter of credit.","The exporter decided to maintain the original delivery date."],"a":3,"t":"서신 내용 파악","e":"신용장 개설을 지시하기 전에 매매계약서에 서명하겠다고 했어요. 첫 주문이고(①), 더 이상의 지연은 안 되며(②), 인도일 연장 요청은 받아들였어요(④)."},{"id":"66-4-28","r":66,"s":"무역영어","n":28,"q":"다음 중 주어진 문장을 영작한 것 중 적절하지 않은 것은?","c":["귀사의 반대청약을 신중하게 고려하였습니다만, 최근 달러 대비 원화의 평가절상 때문에 이번에 할인해 드릴 수 없음을 유감스럽게 생각합니다. ⇒ Your counter-offer has been carefully considered, but we regret that it is not possible to allow a discount at this time due to the recent appreciation of the Korean won against the US dollar.","귀사가 요청한 15%의 할인은 200개 이상의 주문에만 가능합니다. 주문량을 이 수준까지 늘려주시면 귀사가 원하는 할인을 해드리겠습니다. ⇒ The 15% discount you requested is available for orders of 200 units or more. If you increase your order to this volume, we will be happy to offer you the discount.","최종선적일과 신용장 유효기일을 각각 5월 10일과 5월 15일로 수정할 것을 은행에 지시하였습니다. ⇒ We have instructed our bankers today to amend the latest shipping date and\n\nvalidity of the Credit to May 10 and May 15, respectively.","1.12% 비율로 30만불에 대하여 전쟁위험을 포함한 분손담보 조건의 보험이 가입되었음을 통보합니다. ⇒ We are pleased to inform you that we have effected insurance against All Risks, including War Risks at a rate of 1.12% to the value of USD 300,000."],"a":4,"t":"영작","e":"한글은 '분손담보 조건(With Average)'인데 영작은 All Risks(전위험담보)라고 써서 담보 조건이 달라요."},{"id":"66-4-29","r":66,"s":"무역영어","n":29,"q":"대화의 순서가 가장 자연스럽게 연결된 것은?","c":["(A) - (B) - (C) - (D)","(C) - (A) - (D) - (B)","(D) - (C) - (A) - (B)","(C) - (B) - (D) - (A)"],"a":2,"t":"서신 흐름, 문장 배열","e":"공장도 가격을 묻고(C), 110~130달러라고 답하고(A), 돌아가서 검토해 이달 말까지 알려주겠다(D), 좋은 소식 기다린다(B) 순서예요.","p":{"range":"29~30","text":"Mr. Kim: Speaking of prices, the prices applicable to you would have to be\n   worked out – I mean    FOB and CIF prices.\n  (A) : The products you are looking at now range from about $110 to $130 an\n        ex-works basis.\n  (B) : Thank you very much. I’d be pleased if you would. we’ll be looking\n        forward to happy news.\n  (C) : What are your ex-works prices for these items?\n  (D) : Thank you. Let me look into it when I get back home, and I will let you\n        know by the end of this month."}},{"id":"66-4-30","r":66,"s":"무역영어","n":30,"q":"위 대화의 주제로 가장 적절한 것은?","c":["Unit Price Reduction","Inquiry of the Latest Model","Inquiry about Price","Change in Delivery Term"],"a":3,"t":"서신 내용 파악","e":"FOB, CIF 가격을 정하기 위해 공장도 가격을 묻고 답하는 대화라 가격 문의가 주제예요.","p":{"range":"29~30","text":"Mr. Kim: Speaking of prices, the prices applicable to you would have to be\n   worked out – I mean    FOB and CIF prices.\n  (A) : The products you are looking at now range from about $110 to $130 an\n        ex-works basis.\n  (B) : Thank you very much. I’d be pleased if you would. we’ll be looking\n        forward to happy news.\n  (C) : What are your ex-works prices for these items?\n  (D) : Thank you. Let me look into it when I get back home, and I will let you\n        know by the end of this month."}}]</script>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const Q=JSON.parse($("#data").textContent);
const BY={};Q.forEach(q=>BY[q.id]=q);
const SUBJ=["무역규범","무역결제","무역계약","무역영어"];
const ROUNDS=[...new Set(Q.map(q=>q.r))].sort((a,b)=>b-a);
const DATES={63:"2025년 8월",64:"2025년 11월",65:"2026년 3월",66:"2026년 7월"};
const LIMIT=60; // 문항당 기준 초
const TIPS={
"대외무역법: 정의, 수출입 실적":"수출입 정의(외국인도수출, 중계무역, 임대수출 등)와 수출실적 인정 범위, 인정 금액(수출 FOB, 수입 CIF)을 표로 정리해 외우세요. 비슷한 거래형태를 짝지어 비교하면 헷갈림이 줄어요.",
"대외무역법: 전략물자":"수출허가와 상황허가의 차이, 허가 면제 사례, 자가판정, 제재 기간 같은 숫자가 자주 나와요. 숫자는 카드로 만들어 반복하세요.",
"대외무역법: 원산지":"원산지 판정기준(완전생산, 실질적 변형, 단순가공 불인정)과 표시 방법, 표시 면제 대상을 구분하세요. '단순가공은 원산지를 바꾸지 않는다'가 핵심입니다.",
"대외무역법: 외화획득, 구매확인서":"외화획득 이행기간(2년, 국내공급 1년 등), 구매확인서 발급 주체와 순차 발급, 내국신용장과의 차이를 정리하세요.",
"대외무역법: 무역구제, 특별조치":"수입수량 제한조치의 요건(심각한 피해), 기간(4년, 연장 포함 8년), 조정명령과 특별조치 사유를 구분해서 외우세요.",
"관세법: 납세의무, 세액":"납세의무자(대행, 양도, 보세구역 멸실), 제척기간(5년, 부정 10년), 소멸시효, 납부기한, 보정, 수정신고, 경정청구 기간을 한 장 표로 만들어 두세요. 기간 숫자 문제가 가장 많이 나옵니다.",
"관세법: 과세가격":"과세가격은 CIF 기준이에요. 가산요소(구매자 부담 수수료, 운임, 보험료)와 공제요소(국내 운송비, 구매수수료)를 구분하고 계산 문제를 직접 풀어보세요.",
"관세법: 관세율":"세율 적용 순위(덤핑방지 등 1순위 가산, FTA는 낮을 때 우선)와 할당, 조정, 긴급관세의 목적 차이를 정리하세요.",
"관세법: 감면, 환급":"재수입면세와 재수출면세의 차이(사후관리 여부), 위약물품 환급 요건을 비교하세요.",
"관세법: 통관, 보세":"내국물품과 외국물품 구분, 반송, 환적과 복합환적, 수입신고 시기(입항 전, 30일 이내), 통관보류 사유를 정리하세요.",
"관세법: 품목분류":"HS 구조(류, 호, 소호)와 해석 통칙, 특히 같은 비율일 때 마지막 호에 분류하는 통칙 3(다)를 기억하세요.",
"환급특례법":"환급 대상 수출의 범위, 간이정액환급 요건(중소기업, 소요량계산서 불필요), 평균세액증명서와 기초원재료납세증명서, 수입세액분할증명서를 구분하세요.",
"FTA관세법":"협정관세 적용신청(수리 전), 사후적용(수리일부터 1년), 원산지증명서 자율발급과 기관발급 국가, FTA관세법과 협정의 우선순위를 정리하세요.",
"외국환거래법":"거주자 판단 기준과 신고 대상(상계, 제3자 지급, 보증)을 사례로 익히세요.",
"송금, 기타 결제":"사전송금, CWO, CAD, COD, O/A, BWT를 '돈이 언제 오가는지' 시간선으로 그려보세요. 누구에게 유리한지가 자동으로 정리됩니다.",
"추심(URC)":"URC 522 기준으로 은행은 서류를 심사하지 않고, 지시가 없으면 D/P라는 점, D/P와 D/A 차이를 기억하세요.",
"신용장 일반":"신용장 종류(양도, 회전, 선대, Back to Back, 보증)와 SWIFT 필드(41A, 43P, 44C, 71B 등)를 실제 전문과 함께 보세요.",
"UCP600":"UCP600 조항 번호별로 자주 나오는 내용(제3조 해석, 제14조 서류심사, 제18조 송장, 제38조 양도, 제39조 대금양도)을 카드로 만드세요.",
"ISBP, eUCP":"ISBP는 실무 심사 기준이에요. 서명, 정정 인증, 사본과 원본, 원산지증명서와 보험서류 요건을 사례 위주로 익히세요.",
"보증(ISP98, URDG)":"입찰, 이행, 선수금환급, 하자, 유보금 보증의 용도를 구분하고, URDG 만기 없을 때 3년 같은 숫자를 외우세요.",
"무역금융, 팩토링":"팩토링(상환청구권, 수입팩터 신용위험 인수)과 포페이팅(무상환, Aval), 내국신용장, T/R, 무역보험을 비교표로 정리하세요.",
"외환, 환율":"계산 문제가 많아요. 매도율과 매입율 적용 방향, 스왑포인트(디스카운트, 프리미엄), 옵션 내재가치와 시간가치, NDF 차액정산을 직접 계산해 보세요.",
"무역계약 일반":"무역계약의 법적 성질(낙성, 쌍무, 유상, 불요식)과 준거법, 계약 해석 원칙을 정리하세요.",
"거래조건(품질, 수량, 선적)":"품질조건(FAQ, GMQ, USQ), 과부족 허용(살물 5%), 선적일 해석(on or about 전후 5일)을 표로 외우세요.",
"청약과 승낙":"확정청약, 자유청약, 조건부청약의 종류와 반대청약, 승낙 효력 시점을 사례로 연습하세요.",
"계약 조항":"Hardship, Force majeure, Entire agreement, Severability, Non-waiver, Liquidated damages 조항을 영문 예문과 짝지어 외우세요.",
"특수거래 형태":"BWT, 위탁판매, 임대수출, 구상무역, 대응구매, 라이선스와 프랜차이즈의 차이를 정리하세요.",
"인코텀즈":"11개 조건의 위험 이전 지점, 운임, 보험, 통관 부담을 빈칸 표로 반복하세요. C 조건은 위험과 비용 분기점이 다르다는 점이 단골입니다.",
"CISG":"청약 도달주의, 철회와 취소, 승낙 성립, 본질적 위반과 해제, 구제수단, 위험 이전 조문을 번호와 함께 외우세요.",
"클레임, 중재":"알선, 조정, 중재, 소송의 차이와 중재합의 요건, 뉴욕협약 적용 범위를 비교하세요.",
"해상운송":"정기선과 부정기선, 운임 종류, 부대비용(THC, Demurrage, Detention), 선하증권 종류를 정리하세요.",
"항공, 복합운송":"항공운임 산정(용적중량 6,000cm³=1kg), AWB 특징, 복합운송 경로(MLB, IPI, RIPI)를 외우세요.",
"해상보험":"ICC(A), (B), (C) 담보 범위, 고지의무, 워런티, 전손과 분손, 공동해손, 손해방지비용을 정리하세요. 분손 계산 문제도 연습하세요.",
"서신 내용 파악":"무역서신은 첫 문장과 마지막 문장에 목적이 있어요. 누가 누구에게 보내는지(매도인, 매수인, 은행)를 먼저 표시하며 읽으세요.",
"서신 흐름, 문장 배열":"감사, 상황 설명, 요청, 마무리 순서가 기본이에요. However, Therefore 같은 연결어를 단서로 순서를 잡으세요.",
"빈칸, 표현 바꾸기":"앞뒤 문장의 논리(역접, 결과)를 보고 고르고, 같은 뜻 다른 표현(firm offer, subject to 등)을 정리해 두세요.",
"영작":"한글의 조건, 부정, 방향(선불과 착불, drawn on과 in favor of)이 영어에서 뒤집히지 않았는지 확인하는 습관을 들이세요.",
"신용장, UCP 영문":"SWIFT 신용장 필드 읽기와 환어음 문구(PAY TO, DRAWN UNDER, TO)를 실제 양식으로 반복하세요.",
"인코텀즈, CISG 영문":"인코텀즈 규칙의 영문 정의와 CISG 조문 영문을 한글과 대조해 읽어 두세요.",
"운송 영문":"B/L 문구(Shipper's load and count, On board, Freight prepaid)와 운송 비용 용어를 영문으로 익히세요.",
"보험 영문":"MIA 조문 영문과 손해 용어(actual total loss, constructive total loss, subrogation)를 정리하세요.",
"계약, 클레임 영문":"계약서 조항 영문을 읽고 날짜, 비율, 기간 계산을 직접 해보는 연습을 하세요."
};

/* ---------- 홈 ---------- */
let mode=store.get("tc_mode","exam"),view=store.get("tc_view","one");
function syncPills(){document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("on",b.dataset.mode===mode));
  document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("on",b.dataset.view===view));
  $("#modeHint").textContent=mode==="exam"?"시험 모드: 실제 시험처럼 끝까지 푼 뒤 제출하면 채점과 과락 판정, 취약 유형 분석이 나옵니다. 전체 120문항 120분.":"공부 모드: 답을 고르면 바로 정답과 해설이 나옵니다. 시간 제한 없이 풀어요."}
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;store.set("tc_mode",mode);syncPills()});
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{view=b.dataset.view;store.set("tc_view",view);syncPills()});
function renderHome(){
  const d=Math.ceil((new Date(2026,10,28)-new Date(new Date().toDateString()))/864e5);
  $("#dday").innerHTML=d>=0?`제67회 시험(11월 28일)까지 <span class="dday">D-${d}</span>`:"";
  $("#rounds").innerHTML=ROUNDS.map(r=>`<div class="card"><div class="row" style="justify-content:space-between"><span class="big">제${r}회</span><span class="hint">${DATES[r]||""}</span></div>
    <button class="btn primary" data-start="${r}|all">전체 120문항</button>
    <div class="row">${SUBJ.map((s,i)=>`<button class="btn sm" data-start="${r}|${i}">${s}</button>`).join("")}</div></div>`).join("");
  // 랜덤
  $("#rSubj").innerHTML=SUBJ.map(s=>`<button class="pill on" data-rs="${s}">${s}</button>`).join("");
  renderTags();renderHist();syncPills();
}
let rSel=new Set(SUBJ),tSel=new Set();
function renderTags(){
  const tags=[...new Set(Q.filter(q=>rSel.has(q.s)).map(q=>q.t))];
  [...tSel].forEach(t=>{if(!tags.includes(t))tSel.delete(t)});
  $("#rTags").innerHTML=`<button class="pill ${tSel.size?"":"on"}" data-rt="">전체 유형</button>`+tags.map(t=>`<button class="pill ${tSel.has(t)?"on":""}" data-rt="${esc(t)}">${esc(t)}</button>`).join("");
  const pool=randPool();$("#rInfo").textContent=`해당 문항 ${pool.length}개`;
}
function lastResults(){const h=store.get("tc_hist",[]);const last={};h.forEach(s=>s.qids.forEach(id=>{if(s.ans[id]!=null)last[id]=ok(id,s.ans[id])}));return last}
function randPool(){const last=$("#rWrong").checked?lastResults():null;return Q.filter(q=>rSel.has(q.s)&&(!tSel.size||tSel.has(q.t))&&(!last||last[q.id]===false))}
$("#rSubj").addEventListener("click",e=>{const b=e.target.closest("[data-rs]");if(!b)return;const s=b.dataset.rs;rSel.has(s)?rSel.delete(s):rSel.add(s);if(!rSel.size)rSel.add(s);b.classList.toggle("on",rSel.has(s));renderTags()});
$("#rTags").addEventListener("click",e=>{const b=e.target.closest("[data-rt]");if(!b)return;const t=b.dataset.rt;if(!t)tSel.clear();else tSel.has(t)?tSel.delete(t):tSel.add(t);renderTags()});
$("#rWrong").onchange=renderTags;
$("#rStart").onclick=()=>{const pool=randPool();if(!pool.length){$("#rInfo").textContent="조건에 맞는 문항이 없어요.";return}
  const n=Math.min(+$("#rCount").value,pool.length);const pick=pool.slice().sort(()=>Math.random()-.5).slice(0,n)
    .sort((a,b)=>SUBJ.indexOf(a.s)-SUBJ.indexOf(b.s));
  start({title:`유형별 랜덤 ${n}문항`,qids:pick.map(q=>q.id),limit:mode==="exam"?n*LIMIT:0})};
$("#rounds").addEventListener("click",e=>{const b=e.target.closest("[data-start]");if(!b)return;const [r,s]=b.dataset.start.split("|");
  const qs=Q.filter(q=>q.r==r&&(s==="all"||q.s===SUBJ[+s]));
  start({title:`제${r}회 ${s==="all"?"전 과목":SUBJ[+s]}`,qids:qs.map(q=>q.id),limit:mode==="exam"?qs.length*LIMIT:0})});

/* ---------- 시험 진행 ---------- */
let S=null,tick=null;
function ok(id,k){const a=BY[id].a;return a===0?true:k===a}
function start(o){
  S={id:Date.now(),title:o.title,mode,view,qids:o.qids,ans:{},t:{},flag:{},cur:0,limit:o.limit*1000,startAt:Date.now(),runQ:null,runAt:0,lastEvt:Date.now()};
  $("#home").hidden=true;$("#result").hidden=true;$("#exam").hidden=false;$("#omr").classList.remove("open");
  $("#eTitle").textContent=`${o.title} · ${mode==="exam"?"시험":"공부"}`;
  renderExam();clearInterval(tick);tick=setInterval(onTick,500);onTick();
}
function stopRun(){if(S.runQ){S.t[S.runQ]=(S.t[S.runQ]||0)+Date.now()-S.runAt;S.runQ=null}}
function startRun(){stopRun();const id=S.qids[S.cur];if(S.ans[id]==null){S.runQ=id;S.runAt=Date.now()}}
function onTick(){if(!S)return;
  const el=$("#timer"),now=Date.now();
  if(S.limit){const left=S.limit-(now-S.startAt),over=left<0,s=Math.floor(Math.abs(left)/1000);el.textContent=(over?"+":"")+mm(s);el.classList.toggle("over",over)}
  else{el.textContent=mm(Math.floor((now-S.startAt)/1000));el.classList.remove("over")}
  const w=$("#qwatch");
  if(S.view==="one"){const id=S.qids[S.cur],sec=Math.round(((S.t[id]||0)+(S.runQ===id?now-S.runAt:0))/1000);w.textContent=`이 문제 ${sec}초`;w.classList.toggle("over",sec>LIMIT)}else w.textContent="";
}
const mm=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function fmt(text,u){
  let h=esc(text);
  (u||[]).forEach(p=>{const e=esc(p);if(e)h=h.split(e).join(`<u>${e}</u>`)});
  // 표: | a | b | 줄
  h=h.replace(/(?:^\|.*\|\s*$\n?)+/gm,blk=>"<table>"+blk.trim().split("\n").map(r=>"<tr>"+r.trim().replace(/^\||\|$/g,"").split("|").map(c=>`<td>${c.trim()}</td>`).join("")+"</tr>").join("")+"</table>");
  return h;
}
function qHTML(id,i){
  const q=BY[id],a=S.ans[id],study=S.mode==="study"&&a!=null,showAns=study;
  const pass=q.p?`<div class="passage"><div class="pl">[${q.p.range}] 다음을 읽고 질문에 답하시오.</div>${fmt(q.p.text,q.u)}</div>`:"";
  const ch=q.c.map((c,k)=>{k++;let cls="";
    if(showAns){if(q.a===0||k===q.a)cls="right";else if(k===a)cls="wrong"}else if(a===k)cls="sel";
    return`<button class="ch ${cls}" data-q="${id}" data-k="${k}"><span class="k">${k}</span><span>${fmt(c,q.u)}</span></button>`}).join("");
  const ex=showAns?`<div class="expl"><div class="v" style="color:var(${ok(id,a)?"--ok":"--bad"})">${ok(id,a)?"정답입니다":"틀렸어요"} · 정답 ${q.a===0?"모두 정답":"①②③④"[q.a-1]}</div>${esc(q.e)}<div class="hint" style="margin-top:6px">해설은 기출 정답을 바탕으로 정리한 것으로 공식 해설이 아니에요.</div></div>`:"";
  return`<div class="qbox" id="qb-${i}"><div class="qhead"><span class="qno">${i+1}.</span><span class="chip">${q.s} ${q.n}번</span><span class="chip">${esc(q.t)}</span>
    <button class="btn sm ${S.flag[id]?"on":""}" data-flag="${id}" style="margin-left:auto">★ 다시 보기</button></div>
    ${pass}<div class="qtext">${fmt(q.q,q.u)}</div><div class="choices">${ch}</div>${ex}</div>`;
}
function renderExam(){
  $("#viewBtn").textContent=S.view==="one"?"전체 보기":"한 문제씩";
  if(S.view==="one"){
    const id=S.qids[S.cur];
    $("#paper").innerHTML=qHTML(id,S.cur)+`<div class="nav"><button class="btn" id="prevBtn" ${S.cur?"":"disabled"}>◀ 이전</button><span class="hint num" style="align-self:center">${S.cur+1} / ${S.qids.length}</span><button class="btn primary" id="nextBtn">${S.cur<S.qids.length-1?"다음 문제 ▶":"제출하기"}</button></div>`;
    $("#prevBtn").onclick=()=>go(S.cur-1);$("#nextBtn").onclick=()=>S.cur<S.qids.length-1?go(S.cur+1):askSubmit();
    $("#paper").scrollTop=0;startRun();
  }else{
    stopRun();
    $("#paper").innerHTML=S.qids.map((id,i)=>qHTML(id,i)).join("")+`<div class="nav"><span></span><button class="btn primary" id="endBtn">제출하기</button></div>`;
    $("#endBtn").onclick=askSubmit;
  }
  renderOMR();
}
function go(i){if(i<0||i>=S.qids.length)return;stopRun();S.cur=i;renderExam()}
function renderOMR(){
  let h="",last="";
  S.qids.forEach((id,i)=>{const q=BY[id],a=S.ans[id];
    if(q.s!==last){h+=`<div class="omr-s">${q.s}</div>`;last=q.s}
    const st=S.mode==="study"&&a!=null;
    h+=`<div class="orow ${S.view==="one"&&i===S.cur?"cur":""}"><button class="n" data-go="${i}">${i+1}</button>${[1,2,3,4].map(k=>{let c="";if(a===k)c=st?(ok(id,k)?"r":"x"):"sel";return`<button class="ob ${c}" data-q="${id}" data-k="${k}" data-i="${i}">${k}</button>`}).join("")}<button class="fl ${S.flag[id]?"on":""}" data-flag="${id}">★</button></div>`});
  $("#omrB").innerHTML=h;
  const n=S.qids.filter(id=>S.ans[id]!=null).length;$("#omrCnt").textContent=`${n} / ${S.qids.length}`;
  const c=$("#omrB .orow.cur");if(c)c.scrollIntoView({block:"nearest"});
}
function answer(id,k){
  const q=BY[id];if(S.mode==="study"&&S.ans[id]!=null)return;
  const now=Date.now();
  if(S.view==="all"){S.t[id]=(S.t[id]||0)+now-S.lastEvt;S.lastEvt=now}
  else if(S.runQ===id)stopRun();
  S.ans[id]=S.ans[id]===k&&S.mode==="exam"?null:k;
  if(S.view==="one"&&S.qids[S.cur]!==id){S.cur=S.qids.indexOf(id)}
  if(S.view==="one"){const y=$("#paper").scrollTop;renderExam();if(S.mode==="study")$("#paper").scrollTop=y}
  else{const i=S.qids.indexOf(id);$(`#qb-${i}`).outerHTML=qHTML(id,i);renderOMR()}
  if(S.view==="one"&&S.ans[id]==null)startRun();
}
document.addEventListener("click",e=>{
  if(!S||$("#exam").hidden)return;
  const c=e.target.closest("[data-q][data-k]");if(c){const id=c.dataset.q,k=+c.dataset.k;
    if(c.classList.contains("ob")&&S.view==="one"&&S.qids[S.cur]!==id){stopRun();S.cur=+c.dataset.i}
    answer(id,k);return}
  const f=e.target.closest("[data-flag]");if(f){const id=f.dataset.flag;S.flag[id]=!S.flag[id];if(S.view==="one")renderExam();else{const i=S.qids.indexOf(id);$(`#qb-${i}`).outerHTML=qHTML(id,i);renderOMR()}return}
  const g=e.target.closest("[data-go]");if(g){const i=+g.dataset.go;if(S.view==="one")go(i);else $(`#qb-${i}`).scrollIntoView({behavior:"smooth"});$("#omr").classList.remove("open")}
});
$("#viewBtn").onclick=()=>{S.view=S.view==="one"?"all":"one";S.lastEvt=Date.now();renderExam()};
$("#omrToggle").onclick=()=>$("#omr").classList.toggle("open");
$("#submitBtn").onclick=()=>{$("#omr").classList.remove("open");askSubmit()};
$("#paper").addEventListener("click",()=>$("#omr").classList.remove("open"),true);
$("#exitBtn").onclick=()=>modal(`<h2>그만 풀까요?</h2><p class="sub">지금까지 푼 기록은 저장되지 않아요. 채점을 원하면 '답안 제출'을 누르세요.</p><div class="row" style="justify-content:flex-end"><button class="btn" id="mN">계속 풀기</button><button class="btn" id="mY">나가기</button></div>`,()=>{$("#mY").onclick=()=>{closeModal();clearInterval(tick);S=null;$("#exam").hidden=true;$("#home").hidden=false;renderHome()};$("#mN").onclick=closeModal});
function askSubmit(){const left=S.qids.filter(id=>S.ans[id]==null).length;
  modal(`<h2>답안을 제출할까요?</h2><p class="sub">${left?`아직 고르지 않은 문항이 ${left}개 있어요. `:""}제출하면 바로 채점합니다.</p><div class="row" style="justify-content:flex-end"><button class="btn" id="mN">계속 풀기</button><button class="btn primary" id="mY">제출</button></div>`,()=>{$("#mN").onclick=closeModal;$("#mY").onclick=()=>{closeModal();finish()}})}
document.addEventListener("keydown",e=>{if(!S||$("#exam").hidden||!$("#modal").hidden)return;
  if(S.view==="one"){const id=S.qids[S.cur];if(/^[1-4]$/.test(e.key))answer(id,+e.key);else if(e.key==="ArrowRight")go(S.cur+1);else if(e.key==="ArrowLeft")go(S.cur-1)}});
function finish(){stopRun();clearInterval(tick);
  const rec={id:S.id,title:S.title,mode:S.mode,date:new Date().toISOString().slice(0,10),qids:S.qids,ans:S.ans,t:Object.fromEntries(Object.entries(S.t).map(([k,v])=>[k,Math.round(v/1000)])),flag:S.flag,used:Math.round((Date.now()-S.startAt)/1000),limit:S.limit/1000};
  const h=store.get("tc_hist",[]);h.push(rec);store.set("tc_hist",h.slice(-200));
  S=null;$("#exam").hidden=true;showResult([rec],rec);
}

/* ---------- 결과와 분석 ---------- */
function analyze(recs){
  const sub={},tag={};
  recs.forEach(r=>r.qids.forEach(id=>{const q=BY[id],a=r.ans[id],good=a!=null&&ok(id,a);
    const s=sub[q.s]=sub[q.s]||{n:0,o:0};s.n++;if(good)s.o++;
    const t=tag[q.t]=tag[q.t]||{s:q.s,n:0,o:0,time:0,tn:0};t.n++;if(good)t.o++;if(r.t[id]){t.time+=r.t[id];t.tn++}}));
  return{sub,tag};
}
function showResult(recs,one){
  $("#home").hidden=true;$("#result").hidden=false;window.scrollTo(0,0);
  const {sub,tag}=analyze(recs);
  const full=one&&SUBJ.every(s=>sub[s]&&sub[s].n===30);
  const scores=SUBJ.filter(s=>sub[s]).map(s=>({s,sc:Math.round(sub[s].o/sub[s].n*100),...sub[s]}));
  const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b.sc,0)/scores.length):0;
  const fails=scores.filter(x=>x.sc<40);
  let banner="";
  if(full){const pass=avg>=60&&!fails.length;banner=`<div class="banner ${pass?"c-ok":"c-bad"}">${pass?"합격":"불합격"} · 평균 ${avg}점${fails.length?` · 과락 ${fails.map(f=>f.s).join(", ")}`:""}</div>`}
  else if(scores.length) banner=`<div class="banner" style="background:var(--accent-soft);color:var(--accent)">평균 ${avg}점${fails.length?` · 40점 미만 ${fails.map(f=>f.s).join(", ")}`:""}<div class="hint" style="font-weight:400">합격 판정은 4과목 120문항을 모두 풀었을 때 나와요. 합격 기준은 평균 60점 이상, 과목별 40점 이상입니다.</div></div>`;
  const tl=Object.entries(tag).map(([t,v])=>({t,...v,acc:v.o/v.n,avg:v.tn?v.time/v.tn:null})).sort((a,b)=>SUBJ.indexOf(a.s)-SUBJ.indexOf(b.s)||a.acc-b.acc);
  const weak=tl.filter(x=>x.n>=2&&x.acc<.6).sort((a,b)=>a.acc-b.acc).slice(0,5);
  const slow=tl.filter(x=>x.avg&&x.avg>LIMIT*1.2).sort((a,b)=>b.avg-a.avg).slice(0,3);
  let rv="";
  if(one){rv=`<section class="card"><div class="row" style="justify-content:space-between"><h2>문항별 확인</h2><div class="row"><button class="pill on" data-rf="all">전체</button><button class="pill" data-rf="x">틀린 문제</button><button class="pill" data-rf="f">★ 표시</button></div></div><div id="rvList" style="display:flex;flex-direction:column;gap:8px"></div></section>`}
  $("#result").innerHTML=`
  <header class="row" style="justify-content:space-between"><div><h1>${one?esc(one.title):"누적 분석"}</h1><p class="sub">${one?`${one.date} · ${one.mode==="exam"?"시험 모드":"공부 모드"} · 걸린 시간 ${mm(one.used)}${one.limit?` (제한 ${mm(one.limit)})`:""}`:`지금까지 푼 ${recs.length}회 기록을 합친 결과`}</p></div><button class="btn" id="homeBtn">처음으로</button></header>
  ${banner}
  <section class="card"><h2>과목별 점수</h2><div class="score">${scores.map(x=>`<div><span class="label">${x.s}</span><b>${x.sc}점</b><span class="hint">${x.o} / ${x.n} 정답 ${x.sc<40?'<span class="chip c-bad">과락</span>':""}</span></div>`).join("")}</div></section>
  <section class="card"><h2>취약 유형</h2>
    ${weak.length?weak.map(w=>`<div class="weak"><div class="row"><b>${esc(w.t)}</b><span class="chip">${w.s}</span><span class="chip c-bad">정답률 ${Math.round(w.acc*100)}% (${w.o}/${w.n})</span></div><p>${esc(TIPS[w.t]||"")}</p></div>`).join(""):'<p class="hint" style="margin:0">정답률 60% 미만인 유형이 없어요. 문항이 2개 이상인 유형만 판단합니다.</p>'}
    ${slow.length?`<div class="weak" style="border-color:var(--warn)"><b>시간이 오래 걸리는 유형</b><p>${slow.map(s=>`${esc(s.t)} 평균 ${Math.round(s.avg)}초`).join(", ")}. 문항당 기준 ${LIMIT}초(120분 ÷ 120문항)보다 오래 걸리니, 시험에서는 이런 유형을 뒤로 미루고 확실한 문제부터 푸는 게 좋아요.</p></div>`:""}
  </section>
  <section class="card"><h2>유형별 분석</h2><div class="tw"><table><thead><tr><th class="l">과목</th><th class="l">유형</th><th>문항</th><th>정답</th><th>정답률</th><th>평균 시간</th><th>판정</th></tr></thead><tbody>
    ${tl.map(x=>{const a=Math.round(x.acc*100),j=x.n<2?['참고','']:a>=80?['강점','c-ok']:a>=60?['보통','']:a>=40?['보강 필요','c-warn']:['취약','c-bad'];
      return`<tr><td class="l">${x.s}</td><td class="l">${esc(x.t)}</td><td class="num">${x.n}</td><td class="num">${x.o}</td><td class="num"><span class="bar-mini" style="width:${a*.5}px"></span> ${a}%</td><td class="num">${x.avg?Math.round(x.avg)+"초":"-"}</td><td><span class="chip ${j[1]}">${j[0]}</span></td></tr>`}).join("")}
  </tbody></table></div></section>
  ${rv}
  <div class="row">${one&&one.qids.some(id=>!ok(id,one.ans[id]??-1))?'<button class="btn primary" id="retryX">틀린 문제 공부 모드로 다시 풀기</button>':""}<button class="btn" id="homeBtn2">처음으로</button></div>`;
  $("#homeBtn").onclick=$("#homeBtn2").onclick=()=>{$("#result").hidden=true;$("#home").hidden=false;renderHome()};
  if($("#retryX"))$("#retryX").onclick=()=>{mode="study";syncPills();start({title:"틀린 문제 다시 풀기",qids:one.qids.filter(id=>!ok(id,one.ans[id]??-1)),limit:0})};
  if(one){const draw=f=>{$("#rvList").innerHTML=one.qids.map((id,i)=>{const q=BY[id],a=one.ans[id],g=a!=null&&ok(id,a);
      if(f==="x"&&g)return"";if(f==="f"&&!one.flag[id])return"";
      return`<details class="rv"><summary><span class="num" style="font-weight:800">${i+1}</span><span class="chip ${g?"c-ok":"c-bad"}">${g?"정답":a==null?"미응답":"오답"}</span><span class="chip">${q.s} ${q.n}번</span><span class="hint">${esc(q.t)}</span><span class="hint num" style="margin-left:auto">${one.t[id]?one.t[id]+"초":""}</span></summary>
      <div class="in">${q.p?`<div class="passage">${fmt(q.p.text,q.u)}</div>`:""}<div class="qtext">${fmt(q.q,q.u)}</div>
      <div class="choices">${q.c.map((c,k)=>{k++;const cls=(q.a===0||k===q.a)?"right":k===a?"wrong":"";return`<div class="ch ${cls}"><span class="k">${k}</span><span>${fmt(c,q.u)}</span></div>`}).join("")}</div>
      <div class="expl"><div class="v">정답 ${q.a===0?"모두 정답":"①②③④"[q.a-1]}${a!=null?` · 내 답 ${"①②③④"[a-1]}`:""}</div>${esc(q.e)}</div></div></details>`}).join("")||'<p class="hint">해당하는 문항이 없어요.</p>'};
    draw("all");document.querySelectorAll("[data-rf]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-rf]").forEach(x=>x.classList.toggle("on",x===b));draw(b.dataset.rf)})}
}
function renderHist(){const h=store.get("tc_hist",[]);
  $("#histAll").disabled=!h.length;
  $("#histList").innerHTML=h.length?`<div class="tw"><table><thead><tr><th class="l">날짜</th><th class="l">시험</th><th>방식</th><th>정답</th><th></th></tr></thead><tbody>${h.slice().reverse().slice(0,15).map(r=>{const o=r.qids.filter(id=>r.ans[id]!=null&&ok(id,r.ans[id])).length;return`<tr><td class="l num">${r.date}</td><td class="l">${esc(r.title)}</td><td>${r.mode==="exam"?"시험":"공부"}</td><td class="num">${o}/${r.qids.length}</td><td><button class="btn sm" data-hv="${r.id}">보기</button></td></tr>`}).join("")}</tbody></table></div>`:'<p class="hint" style="margin:0">아직 기록이 없어요. 문제를 풀고 제출하면 여기에 쌓여요.</p>'}
$("#histList").addEventListener("click",e=>{const b=e.target.closest("[data-hv]");if(!b)return;const r=store.get("tc_hist",[]).find(x=>x.id==b.dataset.hv);if(r)showResult([r],r)});
$("#histAll").onclick=()=>{const h=store.get("tc_hist",[]);if(h.length)showResult(h,null)};

function modal(h,after){$("#mBody").innerHTML=h;$("#modal").hidden=false;after&&after()}
function closeModal(){$("#modal").hidden=true}
renderHome();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
